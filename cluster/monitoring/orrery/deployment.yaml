---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: orrery
    app.kubernetes.io/version: edb0a04
  name: orrery
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orrery
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orrery
        app.kubernetes.io/version: edb0a04
    spec:
      imagePullSecrets:
      - name: forgejo-registry-secret
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
      - image: code.netbird.nathalie-stiefsohn.eu/my-homelab/orrery:edb0a04@sha256:d4625d323c71874836fdb6ee534f1ee7ab438b611b23f2f217202b1e1da4bdae
        name: orrery
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - mountPath: /data
          name: layout-volume
        env:
        - name: ORRERY_VM_URL
          value: http://vmsingle-victoria-metrics-vmks.victoria-metrics.svc.cluster.local:8428
        - name: ORRERY_VL_URL
          value: http://victoria-logs.victoria-logs.svc.cluster.local:9428
        - name: WEB_ADDR
          value: :8080
        - name: ORRERY_STATIC_ROOT
          value: /app/ui/dist
        - name: ORRERY_STATE_DIR
          value: /data
        - name: ORRERY_SENTRY_DSN
          value: https://cd8bc55442a644769d472ebfa3fb7ade@glitchtip.netbird.nathalie-stiefsohn.eu/1
        - name: ORRERY_OIDC_AUTHORITY
          value: https://auth.netbird.nathalie-stiefsohn.eu
        - name: ORRERY_OIDC_CLIENT_ID
          value: orrery
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        securityContext:
          capabilities:
            drop:
            - ALL
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
      volumes:
      - name: layout-volume
        persistentVolumeClaim:
          claimName: orrery-layout-pvc
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

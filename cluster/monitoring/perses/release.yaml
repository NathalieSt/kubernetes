---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: perses
spec:
  interval: 24h
  chartRef:
    kind: HelmChart
    name: perses-chart
  timeout: 10m
  releaseName: perses
  install:
    remediation:
      retries: 3
  values:
    config:
      provisioning:
        folders:
        - /etc/perses/provisioning
        - /etc/perses/datasources
    datasources:
    - kind: GlobalDatasource
      metadata:
        name: victoria-metrics
      spec:
        default: true
        plugin:
          kind: PrometheusDatasource
          spec:
            proxy:
              kind: HTTPProxy
              spec:
                url: http://vmsingle-victoria-metrics-vmks.victoria-metrics.svc.cluster.local:8428
    - kind: GlobalDatasource
      metadata:
        name: victoria-logs
      spec:
        default: false
        plugin:
          kind: VictoriaLogsDatasource
          spec:
            proxy:
              kind: HTTPProxy
              spec:
                url: http://victoria-logs.victoria-logs.svc.cluster.local:9428
    image:
      digest: sha256:69526cb91a48477a4b2a1f3cc9a475ba9c59c8cee13a50ce2ab9741b969f3c39
      version: main-latest
    persistence:
      enabled: true
      storageClass: nfs-remote
    provisioningPersistence:
      enabled: true
      storageClass: nfs-remote
    sidecar:
      enabled: true

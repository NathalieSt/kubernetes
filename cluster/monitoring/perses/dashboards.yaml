      panels:
        errorRateByPod:
          kind: Panel
          spec:
            display:
              name: Error / Warn Rate by Pod
              description: Entries containing 'error' or 'warn' per step interval.
            plugin:
              kind: TimeSeriesChart
              spec:
                legend:
                  position: bottom
                  mode: table
                  size: small
                yAxis:
                  format:
                    unit: decimal
                  min: 0.0
                visual:
                  display: line
                  areaOpacity: 0.3
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: VictoriaLogsTimeSeriesQuery
                  spec:
                    datasource:
                      kind: VictoriaLogsDatasource
                      name: victoria-logs
                    query: "{namespace=\"$namespace\", pod=~\"$pod\"} (error OR warn) | stats by (pod) count() as cnt"
        podErrorLogs:
          kind: Panel
          spec:
            display:
              name: Errors & Warnings
              description: Log entries containing 'error' or 'warn'.
            plugin:
              kind: LogsTable
              spec:
                showTime: true
                enableDetails: true
                allowWrap: true
            queries:
            - kind: LogQuery
              spec:
                plugin:
                  kind: VictoriaLogsLogQuery
                  spec:
                    datasource:
                      kind: VictoriaLogsDatasource
                      name: victoria-logs
                    query: "{namespace=\"$namespace\", pod=~\"$pod\"} (error OR warn)"
        podLogs:
          kind: Panel
          spec:
            display:
              name: Logs
            plugin:
              kind: LogsTable
              spec:
                showTime: true
                enableDetails: true
                allowWrap: false
            queries:
            - kind: LogQuery
              spec:
                plugin:
                  kind: VictoriaLogsLogQuery
                  spec:
                    datasource:
                      kind: VictoriaLogsDatasource
                      name: victoria-logs
                    query: "{namespace=\"$namespace\", pod=~\"$pod\"}"
        rateByPod:
          kind: Panel
          spec:
            display:
              name: Log Rate by Pod
              description: Log entries per step interval for the selected namespace and pod(s).
            plugin:
              kind: TimeSeriesChart
              spec:
                legend:
                  position: bottom
                  mode: table
                  size: small
                yAxis:
                  format:
                    unit: decimal
                  min: 0.0
                visual:
                  display: line
                  areaOpacity: 0.1
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: VictoriaLogsTimeSeriesQuery
                  spec:
                    datasource:
                      kind: VictoriaLogsDatasource
                      name: victoria-logs
                    query: "{namespace=\"$namespace\", pod=~\"$pod\"} | stats by (pod) count() as cnt"
      layouts:
      - kind: Grid
        spec:
          display:
            title: Log Rate
          items:
          - x: 0
            "y": 0
            width: 12
            height: 9
            content:
              $ref: "#/spec/panels/rateByPod"
          - x: 12
            "y": 0
            width: 12
            height: 9
            content:
              $ref: "#/spec/panels/errorRateByPod"
      - kind: Grid
        spec:
          display:
            title: All Logs
          items:
          - x: 0
            "y": 0
            width: 24
            height: 14
            content:
              $ref: "#/spec/panels/podLogs"
      - kind: Grid
        spec:
          display:
            title: Errors & Warnings
          items:
          - x: 0
            "y": 0
            width: 24
            height: 14
            content:
              $ref: "#/spec/panels/podErrorLogs"

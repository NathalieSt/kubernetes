---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    perses.dev/resource: "true"
  name: perses-dashboards
data:
  00-project-homelab.yaml: |
    kind: Project
    metadata:
      name: homelab
    spec:
      display:
        name: Homelab
        description: Dashboards generated from the kubernetes-generator repo.
  10-dashboard-cluster-pressure.yaml: |
    kind: Dashboard
    metadata:
      name: cluster-pressure
      project: homelab
    spec:
      display:
        name: Cluster Pressure
      duration: 12h
      refreshInterval: 1m
      panels:
        cpuThrottling:
          kind: Panel
          spec:
            display:
              name: Share of CPU periods throttled, by container
            plugin:
              kind: TimeSeriesChart
              spec:
                legend:
                  position: bottom
                  mode: table
                  size: small
                yAxis:
                  format:
                    unit: percent-decimal
                  min: 0.0
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: sum by (namespace, container) (rate(container_cpu_cfs_throttled_periods_total[5m])) / clamp_min(sum by (namespace, container) (rate(container_cpu_cfs_periods_total[5m])), 0.001)
        fullestVolume:
          kind: Panel
          spec:
            display:
              name: Fullest volume
            plugin:
              kind: GaugeChart
              spec:
                calculation: last
                format:
                  unit: percent-decimal
                  decimalPlaces: 1
                thresholds:
                  defaultColor: "#2A9D6E"
                  steps:
                  - value: 0.8
                    color: "#E8A33D"
                    name: warning
                  - value: 0.9
                    color: "#D1495B"
                    name: critical
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: max(kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes)
        memoryRanking:
          kind: Panel
          spec:
            display:
              name: Closest to their memory limit
            plugin:
              kind: BarChart
              spec:
                calculation: last
                format:
                  unit: percent-decimal
                  decimalPlaces: 1
                sort: desc
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: sum by (namespace, container) (container_memory_working_set_bytes) / clamp_min(sum by (namespace, container) (container_spec_memory_limit_bytes), 1)
        nfsLatency:
          kind: Panel
          spec:
            display:
              name: NFS round-trip time, by mount
            plugin:
              kind: TimeSeriesChart
              spec:
                legend:
                  position: bottom
                  mode: list
                  size: small
                yAxis:
                  format:
                    unit: seconds
                  min: 0.0
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: rate(node_mountstats_nfs_total_response_time_seconds_total[5m]) / clamp_min(rate(node_mountstats_nfs_operations_requests_total[5m]), 1)
        nfsStat:
          kind: Panel
          spec:
            display:
              name: Slowest NFS mount
            plugin:
              kind: StatChart
              spec:
                calculation: last
                format:
                  unit: seconds
                  decimalPlaces: 3
                thresholds:
                  defaultColor: "#2A9D6E"
                  steps:
                  - value: 0.05
                    color: "#E8A33D"
                    name: warning
                  - value: 0.2
                    color: "#D1495B"
                    name: critical
                sparkline: {}
                colorMode: background_solid
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: max(rate(node_mountstats_nfs_total_response_time_seconds_total[5m]) / clamp_min(rate(node_mountstats_nfs_operations_requests_total[5m]), 1))
        oomKills:
          kind: Panel
          spec:
            display:
              name: OOM kills, by container
            plugin:
              kind: TimeSeriesChart
              spec:
                legend:
                  position: bottom
                  mode: list
                  size: small
                yAxis:
                  format:
                    unit: decimal
                  min: 0.0
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: sum by (namespace, container) (increase(container_oom_events_total[1h]))
        oomStat:
          kind: Panel
          spec:
            display:
              name: OOM kills in 24h
            plugin:
              kind: StatChart
              spec:
                calculation: last
                format:
                  unit: decimal
                  decimalPlaces: 0
                thresholds:
                  defaultColor: "#2A9D6E"
                  steps:
                  - value: 1.0
                    color: "#E8A33D"
                    name: warning
                  - value: 5.0
                    color: "#D1495B"
                    name: critical
                sparkline: {}
                colorMode: background_solid
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: sum(increase(container_oom_events_total[24h]))
        throttleRanking:
          kind: Panel
          spec:
            display:
              name: Most throttled containers
            plugin:
              kind: BarChart
              spec:
                calculation: last
                format:
                  unit: percent-decimal
                  decimalPlaces: 1
                sort: desc
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: sum by (namespace, container) (rate(container_cpu_cfs_throttled_periods_total[5m])) / clamp_min(sum by (namespace, container) (rate(container_cpu_cfs_periods_total[5m])), 0.001)
        throttledStat:
          kind: Panel
          spec:
            display:
              name: Worst CPU throttling
            plugin:
              kind: StatChart
              spec:
                calculation: last
                format:
                  unit: percent-decimal
                  decimalPlaces: 1
                thresholds:
                  defaultColor: "#2A9D6E"
                  steps:
                  - value: 0.25
                    color: "#E8A33D"
                    name: warning
                  - value: 0.5
                    color: "#D1495B"
                    name: critical
                sparkline: {}
                colorMode: background_solid
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: max(sum by (namespace, container) (rate(container_cpu_cfs_throttled_periods_total[5m])) / clamp_min(sum by (namespace, container) (rate(container_cpu_cfs_periods_total[5m])), 0.001))
        volumeRanking:
          kind: Panel
          spec:
            display:
              name: Fullest volumes, by claim
            plugin:
              kind: BarChart
              spec:
                calculation: last
                format:
                  unit: percent-decimal
                  decimalPlaces: 1
                sort: desc
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes
        volumeUsage:
          kind: Panel
          spec:
            display:
              name: Volume used, by claim
            plugin:
              kind: TimeSeriesChart
              spec:
                legend:
                  position: bottom
                  mode: table
                  size: small
                yAxis:
                  format:
                    unit: percent-decimal
                  min: 0.0
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes
      layouts:
      - kind: Grid
        spec:
          display:
            title: Where the cluster is running out of something
          items:
          - x: 0
            "y": 0
            width: 6
            height: 4
            content:
              $ref: "#/spec/panels/fullestVolume"
          - x: 6
            "y": 0
            width: 6
            height: 4
            content:
              $ref: "#/spec/panels/oomStat"
          - x: 12
            "y": 0
            width: 6
            height: 4
            content:
              $ref: "#/spec/panels/throttledStat"
          - x: 18
            "y": 0
            width: 6
            height: 4
            content:
              $ref: "#/spec/panels/nfsStat"
          - x: 0
            "y": 4
            width: 8
            height: 8
            content:
              $ref: "#/spec/panels/volumeRanking"
          - x: 8
            "y": 4
            width: 8
            height: 8
            content:
              $ref: "#/spec/panels/throttleRanking"
          - x: 16
            "y": 4
            width: 8
            height: 8
            content:
              $ref: "#/spec/panels/memoryRanking"
          - x: 0
            "y": 12
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/volumeUsage"
          - x: 12
            "y": 12
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/nfsLatency"
          - x: 0
            "y": 20
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/oomKills"
          - x: 12
            "y": 20
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/cpuThrottling"
  10-dashboard-flux.yaml: |
    kind: Dashboard
    metadata:
      name: flux
      project: homelab
    spec:
      display:
        name: GitOps Delivery
      duration: 24h
      refreshInterval: 1m
      panels:
        errorStat:
          kind: Panel
          spec:
            display:
              name: Reconcile errors/sec
            plugin:
              kind: StatChart
              spec:
                calculation: last
                format:
                  unit: decimal
                  decimalPlaces: 3
                thresholds:
                  defaultColor: "#2A9D6E"
                  steps:
                  - value: 0.01
                    color: "#E8A33D"
                    name: warning
                  - value: 0.1
                    color: "#D1495B"
                    name: critical
                sparkline: {}
                colorMode: background_solid
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: sum(rate(controller_runtime_reconcile_errors_total[5m]))
        notReady:
          kind: Panel
          spec:
            display:
              name: Resources not Ready, by kind
            plugin:
              kind: TimeSeriesChart
              spec:
                legend:
                  position: bottom
                  mode: table
                  size: small
                yAxis:
                  format:
                    unit: decimal
                  min: 0.0
                visual:
                  areaOpacity: 0.35
                  stack: all
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: sum by (kind) (gotk_reconcile_condition{type="Ready",status="False"})
        notReadyByKind:
          kind: Panel
          spec:
            display:
              name: Not Ready, by kind
            plugin:
              kind: BarChart
              spec:
                calculation: last
                format:
                  unit: decimal
                  decimalPlaces: 0
                sort: desc
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: sum by (kind) (gotk_reconcile_condition{type="Ready",status="False"})
        notReadyStat:
          kind: Panel
          spec:
            display:
              name: Resources not Ready
            plugin:
              kind: StatChart
              spec:
                calculation: last
                format:
                  unit: decimal
                  decimalPlaces: 0
                thresholds:
                  defaultColor: "#2A9D6E"
                  steps:
                  - value: 1.0
                    color: "#E8A33D"
                    name: warning
                  - value: 3.0
                    color: "#D1495B"
                    name: critical
                sparkline: {}
                colorMode: background_solid
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: sum(gotk_reconcile_condition{type="Ready",status="False"})
        readinessHistory:
          kind: Panel
          spec:
            display:
              name: Readiness over time, by kind
            plugin:
              kind: StatusHistoryChart
              spec:
                legend:
                  position: bottom
                  mode: list
                  size: small
                mappings:
                - kind: Value
                  spec:
                    value: "1"
                    result:
                      value: Ready
                      color: "#2A9D6E"
                - kind: Value
                  spec:
                    value: "0"
                    result:
                      value: Not Ready
                      color: "#D1495B"
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: min by (kind) (gotk_reconcile_condition{type="Ready",status="True"})
        readyMix:
          kind: Panel
          spec:
            display:
              name: Ready versus not, across all resources
            plugin:
              kind: PieChart
              spec:
                calculation: last
                format:
                  unit: decimal
                  decimalPlaces: 0
                radius: 50.0
                sort: desc
                showLabels: true
                legend:
                  position: right
                  mode: list
                  size: small
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: sum by (status) (gotk_reconcile_condition{type="Ready"})
        reconcileByController:
          kind: Panel
          spec:
            display:
              name: Reconciles/sec, by controller
            plugin:
              kind: BarChart
              spec:
                calculation: last
                format:
                  unit: decimal
                  decimalPlaces: 2
                sort: desc
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: sum by (controller) (rate(controller_runtime_reconcile_total[5m]))
        reconcileDuration:
          kind: Panel
          spec:
            display:
              name: p95 reconcile duration, by controller
            plugin:
              kind: TimeSeriesChart
              spec:
                legend:
                  position: bottom
                  mode: list
                  size: small
                yAxis:
                  format:
                    unit: seconds
                  min: 0.0
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: histogram_quantile(0.95, sum by (controller, le) (rate(controller_runtime_reconcile_time_seconds_bucket[5m])))
        reconcileErrors:
          kind: Panel
          spec:
            display:
              name: Reconcile errors per second, by controller
            plugin:
              kind: TimeSeriesChart
              spec:
                legend:
                  position: bottom
                  mode: list
                  size: small
                yAxis:
                  format:
                    unit: decimal
                  min: 0.0
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: sum by (controller) (rate(controller_runtime_reconcile_errors_total[5m]))
        suspendedStat:
          kind: Panel
          spec:
            display:
              name: Suspended resources
            plugin:
              kind: StatChart
              spec:
                calculation: last
                format:
                  unit: decimal
                  decimalPlaces: 0
                thresholds:
                  defaultColor: "#2A9D6E"
                  steps:
                  - value: 1.0
                    color: "#E8A33D"
                    name: warning
                  - value: 3.0
                    color: "#D1495B"
                    name: critical
                sparkline: {}
                colorMode: background_solid
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: sum(gotk_suspend_status)
      layouts:
      - kind: Grid
        spec:
          display:
            title: Flux controllers
          items:
          - x: 0
            "y": 0
            width: 8
            height: 4
            content:
              $ref: "#/spec/panels/notReadyStat"
          - x: 8
            "y": 0
            width: 8
            height: 4
            content:
              $ref: "#/spec/panels/suspendedStat"
          - x: 16
            "y": 0
            width: 8
            height: 4
            content:
              $ref: "#/spec/panels/errorStat"
          - x: 0
            "y": 4
            width: 8
            height: 8
            content:
              $ref: "#/spec/panels/notReadyByKind"
          - x: 8
            "y": 4
            width: 8
            height: 8
            content:
              $ref: "#/spec/panels/reconcileByController"
          - x: 16
            "y": 4
            width: 8
            height: 8
            content:
              $ref: "#/spec/panels/readyMix"
          - x: 0
            "y": 12
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/notReady"
          - x: 12
            "y": 12
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/reconcileErrors"
          - x: 0
            "y": 20
            width: 24
            height: 8
            content:
              $ref: "#/spec/panels/readinessHistory"
          - x: 0
            "y": 28
            width: 24
            height: 7
            content:
              $ref: "#/spec/panels/reconcileDuration"

---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    perses.dev/resource: "true"
  name: perses-dashboards
data:
  00-project-homelab.yaml: |
    kind: Project
    metadata:
      name: homelab
    spec:
      display:
        name: Homelab
        description: Dashboards generated from the kubernetes-generator repo.
  10-dashboard-cluster-pressure.yaml: |
    kind: Dashboard
    metadata:
      name: cluster-pressure
      project: homelab
    spec:
      display:
        name: Cluster Pressure
      duration: 12h
      refreshInterval: 1m
      panels:
        cpuThrottling:
          kind: Panel
          spec:
            display:
              name: Share of CPU periods throttled, by container
            plugin:
              kind: TimeSeriesChart
              spec:
                yAxis:
                  format:
                    unit: percent-decimal
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: sum by (namespace, container) (rate(container_cpu_cfs_throttled_periods_total[5m])) / clamp_min(sum by (namespace, container) (rate(container_cpu_cfs_periods_total[5m])), 1)
        nfsLatency:
          kind: Panel
          spec:
            display:
              name: NFS round-trip time, by mount
            plugin:
              kind: TimeSeriesChart
              spec:
                yAxis:
                  format:
                    unit: seconds
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: rate(node_mountstats_nfs_total_response_time_seconds_total[5m]) / clamp_min(rate(node_mountstats_nfs_operations_requests_total[5m]), 1)
        oomKills:
          kind: Panel
          spec:
            display:
              name: OOM kills, by container
            plugin:
              kind: TimeSeriesChart
              spec:
                yAxis:
                  format:
                    unit: decimal
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: sum by (namespace, container) (increase(container_oom_events_total[1h]))
        volumeUsage:
          kind: Panel
          spec:
            display:
              name: Volume used, by claim
            plugin:
              kind: TimeSeriesChart
              spec:
                yAxis:
                  format:
                    unit: percent-decimal
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes
      layouts:
      - kind: Grid
        spec:
          display:
            title: Where the cluster is running out of something
          items:
          - x: 0
            "y": 0
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/volumeUsage"
          - x: 12
            "y": 0
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/nfsLatency"
          - x: 0
            "y": 8
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/oomKills"
          - x: 12
            "y": 8
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/cpuThrottling"
  10-dashboard-flux.yaml: |
    kind: Dashboard
    metadata:
      name: flux
      project: homelab
    spec:
      display:
        name: GitOps Delivery
      duration: 24h
      refreshInterval: 1m
      panels:
        notReady:
          kind: Panel
          spec:
            display:
              name: Resources not Ready, by kind
            plugin:
              kind: TimeSeriesChart
              spec:
                yAxis:
                  format:
                    unit: decimal
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: sum by (kind) (gotk_reconcile_condition{type="Ready",status="False"})
        reconcileErrors:
          kind: Panel
          spec:
            display:
              name: Reconcile errors per second, by controller
            plugin:
              kind: TimeSeriesChart
              spec:
                yAxis:
                  format:
                    unit: decimal
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: sum by (controller) (rate(controller_runtime_reconcile_errors_total[5m]))
        reconcileRate:
          kind: Panel
          spec:
            display:
              name: Reconciles per second, by controller
            plugin:
              kind: TimeSeriesChart
              spec:
                yAxis:
                  format:
                    unit: decimal
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: sum by (controller) (rate(controller_runtime_reconcile_total[5m]))
        suspended:
          kind: Panel
          spec:
            display:
              name: Suspended resources, by kind
            plugin:
              kind: TimeSeriesChart
              spec:
                yAxis:
                  format:
                    unit: decimal
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: sum by (kind) (gotk_suspend_status)
      layouts:
      - kind: Grid
        spec:
          display:
            title: Flux controllers
          items:
          - x: 0
            "y": 0
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/notReady"
          - x: 12
            "y": 0
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/suspended"
          - x: 0
            "y": 8
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/reconcileErrors"
          - x: 12
            "y": 8
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/reconcileRate"

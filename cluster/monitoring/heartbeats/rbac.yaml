---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: heartbeats
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: heartbeats
rules:
- apiGroups:
  - batch
  resources:
  - cronjobs
  - jobs
  verbs:
  - get
  - list
- apiGroups:
  - k8up.io
  resources:
  - schedules
  - backups
  verbs:
  - get
  - list
- apiGroups:
  - source.toolkit.fluxcd.io
  resources:
  - gitrepositories
  resourceNames:
  - manifests
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: heartbeats
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: heartbeats
subjects:
- kind: ServiceAccount
  name: heartbeats
  namespace: healthchecks

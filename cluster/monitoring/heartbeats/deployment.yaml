---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: heartbeats
    app.kubernetes.io/version: python-3.13
  name: heartbeats
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: heartbeats
  template:
    metadata:
      annotations:
        homelab/heartbeats-config-hash: 00a2800ba1ceb400
      labels:
        app.kubernetes.io/name: heartbeats
        app.kubernetes.io/version: python-3.13
    spec:
      serviceAccountName: heartbeats
      enableServiceLinks: false
      containers:
      - command:
        - python
        - /config/heartbeats.py
        image: python:3.14-alpine@sha256:016508ba505da24f7139765bc4bb669df4e88eb2f12eeadd571bf2f88d7533df
        name: heartbeats
        volumeMounts:
        - mountPath: /config
          name: config-volume
          readOnly: true
        - mountPath: /secrets
          name: secrets-volume
          readOnly: true
        env:
        - name: HEARTBEATS_CONFIG
          value: /config/checks.json
        - name: HEARTBEATS_SECRETS
          value: /secrets
        - name: HEARTBEATS_INTERVAL
          value: "300"
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        securityContext:
          capabilities:
            drop:
            - ALL
          runAsUser: 65534
          runAsGroup: 65534
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
      volumes:
      - name: config-volume
        configMap:
          name: heartbeats-config
      - name: secrets-volume
        secret:
          secretName: heartbeats-secret
          optional: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault

  heartbeats.py: |
    """Report scheduled work to Healthchecks.

    Every pass, for each check in the generated config:

      1. upsert the check through the Healthchecks API, so its schedule, grace and
         ntfy integration always match what the generators declare;
      2. look up what actually happened in the cluster;
      3. ping the check if that is news to it.

    "News" is decided by Healthchecks' own state, never by anything kept here: a
    run is reported when it finished after the check's `last_ping`. That keeps the
    reporter stateless — a restart, a second replica during a rollout or a missed
    pass neither loses a result nor reports one twice.

    A check that is still "new" and has nothing to report yet gets one success ping
    saying so. Healthchecks never alerts on a check that has never been pinged, so
    without it a CronJob that never runs would stay grey for ever — which is the
    exact failure this exists to catch. With it, the check expects a run at the
    next scheduled time and goes down when none arrives.

    Nothing is logged that could be a credential: checks are named by slug, never
    by ping URL, because a ping URL is the only secret a ping carries.
    """

    import json
    import os
    import ssl
    import sys
    import time
    import urllib.error
    import urllib.parse
    import urllib.request
    from dataclasses import dataclass
    from datetime import datetime, timedelta, timezone

    CONFIG_PATH = os.environ["HEARTBEATS_CONFIG"]
    SECRETS_DIR = os.environ["HEARTBEATS_SECRETS"]
    INTERVAL = int(os.environ.get("HEARTBEATS_INTERVAL", "300"))
    VICTORIA_LOGS = os.environ["HEARTBEATS_VICTORIA_LOGS"].rstrip("/")

    # vault-apply fills every declared key with a sentence starting with this, so
    # a key that has not been written yet is present and must still read as unset.
    PLACEHOLDER_PREFIX = "REPLACE ME"

    SERVICE_ACCOUNT = "/var/run/secrets/kubernetes.io/serviceaccount"
    TIMEOUT = 20


    def log(message):
        print(message, flush=True)


    def now():
        return datetime.now(timezone.utc)


    def parse_time(value):
        if not value:
            return None
        return datetime.fromisoformat(value.replace("Z", "+00:00"))


    def span(seconds):
        seconds = int(seconds)
        if seconds < 60:
            return f"{seconds}s"
        if seconds < 3600:
            return f"{seconds // 60}m"
        return f"{seconds // 3600}h{(seconds % 3600) // 60:02d}m"


    def ago(moment):
        return f"{span((now() - moment).total_seconds())} ago"


    def secret(key):
        """A key from the mounted Secret, or None while it is missing or a
        placeholder. Read on every call: the volume follows Vault within a minute,
        and this process should not need a restart to notice."""
        try:
            with open(os.path.join(SECRETS_DIR, key)) as handle:
                value = handle.read().strip()
        except FileNotFoundError:
            return None
        if not value or value.startswith(PLACEHOLDER_PREFIX):
            return None
        return value


    class HttpError(Exception):
        pass


    def request(method, url, *, headers=None, body=None, context=None, not_found_ok=False):
        """One HTTP call. Failures carry the status and the start of the body —
        an init script that hid both is how this homelab once lost a week of backup
        credentials without a word in any log."""
        data = None
        headers = dict(headers or {})
        if body is not None:
            if isinstance(body, (dict, list)):
                data = json.dumps(body).encode()
                headers["Content-Type"] = "application/json"
            else:
                data = body.encode()
        headers.setdefault("User-Agent", "heartbeats")
        req = urllib.request.Request(url, data=data, method=method, headers=headers)
        try:
            with urllib.request.urlopen(req, timeout=TIMEOUT, context=context) as response:
                raw = response.read()
                content_type = response.headers.get_content_type()
                is_json = content_type == "application/json" or content_type.endswith("+json")
        except urllib.error.HTTPError as error:
            if error.code == 404 and not_found_ok:
                return None
            detail = error.read()[:300].decode(errors="replace")
            raise HttpError(f"{method} {urllib.parse.urlsplit(url).path}: HTTP {error.code} {detail}")
        except (urllib.error.URLError, TimeoutError) as error:
            raise HttpError(f"{method} {urllib.parse.urlsplit(url).netloc}: {error}")
        # A ping answers with a bare "OK"; only the APIs answer in JSON. VictoriaLogs
        # streams one object per line, and a `stats` query has exactly one.
        if not (raw and is_json):
            return None
        text = raw.decode()
        return json.loads(text if content_type == "application/json" else text.splitlines()[0])


    class Kube:
        def __init__(self):
            self.context = ssl.create_default_context(cafile=f"{SERVICE_ACCOUNT}/ca.crt")
            self.cache = {}

        def get(self, path):
            if path not in self.cache:
                # Re-read per request: projected tokens are rotated underneath us.
                with open(f"{SERVICE_ACCOUNT}/token") as handle:
                    token = handle.read().strip()
                self.cache[path] = request(
                    "GET",
                    f"https://kubernetes.default.svc{path}",
                    headers={"Authorization": f"Bearer {token}"},
                    context=self.context,
                    not_found_ok=True,
                )
            return self.cache[path]


    @dataclass
    class Outcome:
        """A finished run, or a state observed now."""

        at: datetime
        ok: bool
        message: str
        # Observed now rather than a run that finished at a moment of its own, so
        # "newer than last_ping" is always true and pings need throttling instead.
        live: bool = False
        # Backups only: which one, and when it was created, for the log check.
        backup: str = ""
        started: datetime | None = None


    @dataclass
    class Missing:
        """The thing being watched is not there to watch."""

        message: str


    def job_outcome(job):
        name = job["metadata"]["name"]
        namespace = job["metadata"]["namespace"]
        started = parse_time(job.get("status", {}).get("startTime"))
        for condition in job.get("status", {}).get("conditions", []):
            if condition.get("status") != "True":
                continue
            finished = parse_time(condition.get("lastTransitionTime"))
            took = f" in {span((finished - started).total_seconds())}" if started and finished else ""
            if condition["type"] == "Complete":
                return Outcome(finished, True, f"Job {name} succeeded{took}.")
            if condition["type"] == "Failed":
                # The condition only says the Job gave up; the reason is in the pod
                # log, which outlives the pod in VictoriaLogs.
                return Outcome(
                    finished,
                    False,
                    f"Job {name} failed{took}: {condition.get('reason', '')}. "
                    f"Logs: kubectl -n {namespace} logs job/{name}, or VictoriaLogs "
                    f"kubernetes.pod_name:{name}-*",
                )
        return None


    def observe_cron_job(kube, namespace, name):
        cron_job = kube.get(f"/apis/batch/v1/namespaces/{namespace}/cronjobs/{name}")
        if cron_job is None:
            return Missing(f"CronJob {namespace}/{name} does not exist, so it cannot run.")
        if cron_job["spec"].get("suspend"):
            return Missing(f"CronJob {namespace}/{name} is suspended, so it will not run.")

        jobs = kube.get(f"/apis/batch/v1/namespaces/{namespace}/jobs")["items"]
        latest = None
        for job in jobs:
            owners = job["metadata"].get("ownerReferences", [])
            if not any(o.get("kind") == "CronJob" and o.get("name") == name for o in owners):
                continue
            outcome = job_outcome(job)
            if outcome and (latest is None or outcome.at > latest.at):
                latest = outcome
        if latest:
            return latest

        # Finished Jobs are deleted after a day; the CronJob remembers the last
        # success for longer, which is enough to start a new check off correctly.
        last_success = parse_time(cron_job.get("status", {}).get("lastSuccessfulTime"))
        if last_success:
            return Outcome(last_success, True, f"CronJob {namespace}/{name} last succeeded {ago(last_success)}.")
        return None


    def skipped_files(namespace, backup, since):
        """How many files restic could not read in this Backup, from its pod's log.

        K8up marks a Backup Succeeded when restic exits with an incomplete snapshot,
        so a file the backup pod may not read is skipped with only an ERROR line to
        show for it. Vault lost ~600 files a night that way, every night, while its
        check stayed green. The pod is gone by morning; VictoriaLogs still has it."""
        query = (
            f'kubernetes.pod_namespace:"{namespace}" AND kubernetes.pod_name:"backup-{backup}-"* '
            'AND "during archival" | stats count() skipped'
        )
        start = (since or now() - timedelta(days=2)).strftime("%Y-%m-%dT%H:%M:%SZ")
        body = urllib.parse.urlencode({"query": query, "start": start})
        answer = request(
            "POST",
            f"{VICTORIA_LOGS}/select/logsql/query",
            headers={"Content-Type": "application/x-www-form-urlencoded"},
            body=body,
        )
        # An answer that is not the expected object is an error, never zero: a zero
        # read out of a response nobody parsed is how this check would go blind.
        if not isinstance(answer, dict) or "skipped" not in answer:
            raise ValueError(f"unexpected answer from VictoriaLogs: {answer!r:.200}")
        return int(answer["skipped"])


    def observe_backup(kube, namespace, schedule):
        if kube.get(f"/apis/k8up.io/v1/namespaces/{namespace}/schedules/{schedule}") is None:
            return Missing(f"K8up Schedule {namespace}/{schedule} does not exist, so nothing backs this namespace up.")

        selector = urllib.parse.quote(f"k8up.io/schedule-name={schedule}")
        backups = kube.get(f"/apis/k8up.io/v1/namespaces/{namespace}/backups?labelSelector={selector}")["items"]
        latest = None
        for backup in backups:
            name = backup["metadata"]["name"]
            for condition in backup.get("status", {}).get("conditions", []):
                if condition.get("type") != "Completed" or condition.get("status") != "True":
                    continue
                finished = parse_time(condition.get("lastTransitionTime"))
                ok = condition.get("reason") == "Succeeded"
                verdict = "succeeded" if ok else "failed"
                outcome = Outcome(finished, ok, f"Backup {name} {verdict}: {condition.get('message', '')}")
                outcome.backup = name
                outcome.started = parse_time(backup["metadata"].get("creationTimestamp"))
                if latest is None or outcome.at > latest.at:
                    latest = outcome
        if latest is None or not latest.ok:
            return latest

        # Only the newest, and only a success: a failure already says so.
        try:
            skipped = skipped_files(namespace, latest.backup, latest.started)
        except (HttpError, ValueError) as error:
            # Not knowing is reported as not knowing, never as fine: an unreachable
            # VictoriaLogs must not quietly switch this check off again.
            return Outcome(
                latest.at,
                False,
                f"Backup {latest.backup} finished, but whether restic skipped files could not "
                f"be checked: {error}",
            )
        if skipped:
            return Outcome(
                latest.at,
                False,
                f"Backup {latest.backup} is incomplete: restic could not read {skipped} file(s) and "
                "K8up still called it Succeeded. The backup pod's user cannot read them. "
                f'VictoriaLogs: kubernetes.pod_namespace:"{namespace}" AND '
                f'kubernetes.pod_name:"backup-{latest.backup}-"* AND "during archival"',
            )
        return latest


    def observe_mirror(kube, source):
        repository = kube.get(
            f"/apis/source.toolkit.fluxcd.io/v1/namespaces/{source['fluxNamespace']}"
            f"/gitrepositories/{source['gitRepository']}"
        )
        if repository is None:
            return Missing(f"GitRepository {source['fluxNamespace']}/{source['gitRepository']} does not exist.")
        revision = repository.get("status", {}).get("artifact", {}).get("revision", "")
        flux_sha = revision.rsplit(":", 1)[-1]

        token = secret("forgejo-token")
        if token is None:
            return Missing(
                "No Forgejo token, so the mirror cannot be compared: "
                "vault kv patch kvv2/heartbeats forgejo-token=<token with read:repository>"
            )
        branch = request(
            "GET",
            f"{source['forgejoUrl']}/api/v1/repos/{source['repository']}/branches/{source['branch']}",
            headers={"Authorization": f"token {token}"},
        )
        head = branch["commit"]["id"]
        committed = parse_time(branch["commit"]["timestamp"])

        if head == flux_sha:
            return Outcome(now(), True, f"Flux is reconciling Forgejo's {source['branch']} ({head[:10]}).", live=True)
        if now() - committed > timedelta(minutes=source["lagMinutes"]):
            return Outcome(
                now(),
                False,
                f"Flux has {flux_sha[:10] or 'no revision'} from Codeberg, but Forgejo's {source['branch']} "
                f"is {head[:10]}, committed {ago(committed)}. Check the push mirror in Forgejo's repository "
                "settings, and the GitRepository's Ready condition.",
                live=True,
            )
        # Newer than the lag allows for: the mirror may simply not have run yet.
        return None


    class Healthchecks:
        def __init__(self, url, api_key):
            self.url = url
            self.api_key = api_key

        def upsert(self, check):
            spec = {
                "name": check["name"],
                "slug": check["slug"],
                "tags": check["tags"],
                "desc": check["desc"],
                "grace": check["graceSeconds"],
                # Every integration of the project: that is how a check reaches ntfy.
                "channels": "*",
                "unique": ["slug"],
            }
            if "schedule" in check:
                spec["schedule"] = check["schedule"]
                spec["tz"] = check["timeZone"]
            else:
                spec["timeout"] = check["timeoutSeconds"]
            return request(
                "POST",
                f"{self.url}/api/v3/checks/",
                headers={"X-Api-Key": self.api_key},
                body=spec,
            )

        @staticmethod
        def ping(state, ok, message):
            url = state["ping_url"] if ok else state["ping_url"] + "/fail"
            request("POST", url, body=message)


    def decide(state, observed, throttle):
        """What to send, as (ok, message), or None for nothing."""
        status = state.get("status")
        last_ping = parse_time(state.get("last_ping"))

        if isinstance(observed, Missing):
            # Down already says it; repeating the fail every pass says nothing new.
            return None if status == "down" else (False, observed.message)

        if isinstance(observed, Outcome):
            if observed.live:
                if not observed.ok:
                    return None if status == "down" else (False, observed.message)
                recent = last_ping and now() - last_ping < throttle
                return None if recent and status not in ("down", "new") else (True, observed.message)
            if last_ping is None or observed.at > last_ping:
                return (observed.ok, observed.message)
            return None

        if status == "new":
            return (True, "Watching from now: no finished run was found yet, so the next scheduled one is expected.")
        return None


    def observe(kube, source):
        kind = source["kind"]
        if kind == "cronJob":
            return observe_cron_job(kube, source["namespace"], source["name"])
        if kind == "backup":
            return observe_backup(kube, source["namespace"], source["schedule"])
        if kind == "mirror":
            return observe_mirror(kube, source)
        raise ValueError(f"unknown source kind {kind!r}")


    def run_once(config):
        api_key = secret("healthchecks-api-key")
        if api_key is None:
            raise RuntimeError(
                "No Healthchecks API key, so nothing can be reported: create a read-write key in the "
                "project that holds the ntfy integration, then "
                "vault kv patch kvv2/heartbeats healthchecks-api-key=<key>"
            )

        healthchecks = Healthchecks(config["healthchecksUrl"], api_key)
        kube = Kube()
        problems = []

        for check in config["checks"]:
            slug = check["slug"]
            try:
                state = healthchecks.upsert(check)
                observed = observe(kube, check["source"])
                decision = decide(state, observed, timedelta(minutes=config["livePingMinutes"]))
                if decision:
                    ok, message = decision
                    healthchecks.ping(state, ok, message)
                    log(f"{slug}: {'success' if ok else 'FAIL'} — {message}")
            except Exception as error:  # one broken check must not silence the rest
                problems.append(f"{slug}: {error}")
                log(f"{slug}: could not be reported: {error}")

        own = config["self"]
        state = healthchecks.upsert(own)
        if problems:
            Healthchecks.ping(state, False, "Some checks could not be reported:\n" + "\n".join(problems))
        else:
            Healthchecks.ping(state, True, f"Reported {len(config['checks'])} checks.")
        return problems


    def ping_external(ok, message):
        """The one ping that leaves the cluster, for whatever is watching it from
        outside. Optional: unset, or anything that is not an http(s) URL — someone
        writing "no" to say there is none — is skipped. It never raises: a problem
        with the watcher of last resort must not stop the reporting it watches."""
        url = secret("external-ping-url")
        if url is None:
            return
        if not url.startswith(("https://", "http://")):
            log("external-ping-url is not an http(s) URL, so it is skipped")
            return
        try:
            request("POST", url if ok else url + "/fail", body=message)
        except Exception as error:
            log(f"external ping failed: {error}")


    def main():
        with open(CONFIG_PATH) as handle:
            config = json.load(handle)
        log(f"watching {len(config['checks'])} checks every {INTERVAL}s")

        while True:
            started = time.monotonic()
            try:
                problems = run_once(config)
                outcome = (not problems, f"{len(problems)} checks could not be reported.")
            except Exception as error:
                log(f"pass failed: {error}")
                outcome = (False, str(error))
            ping_external(*outcome)
            time.sleep(max(0, INTERVAL - (time.monotonic() - started)))


    if __name__ == "__main__":
        sys.exit(main())

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opnsense-exporter-networkpolicy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opnsense-exporter
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: victoria-metrics
    ports:
    - port: 8080
      protocol: TCP
  egress:
  - to:
    - ipBlock:
        cidr: 192.168.1.1/32
    ports:
    - port: 443
      protocol: TCP

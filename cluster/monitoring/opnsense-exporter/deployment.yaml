---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: opnsense-exporter
    app.kubernetes.io/version: 0.0.19
  name: opnsense-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opnsense-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opnsense-exporter
        app.kubernetes.io/version: 0.0.19
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
      - image: ghcr.io/athennamind/opnsense-exporter:0.0.19@sha256:e1f79c770dba7d3165e12836e4b6f849be93a8b2a25116b7ea11c5da8c3ad2db
        name: opnsense-exporter
        ports:
        - containerPort: 8080
          name: metrics
        volumeMounts:
        - mountPath: /etc/opnsense-api
          name: api
          readOnly: true
        - mountPath: /etc/opnsense
          name: certificate
          readOnly: true
        env:
        - name: OPNSENSE_EXPORTER_OPS_PROTOCOL
          value: https
        - name: OPNSENSE_EXPORTER_OPS_API
          value: OPNsense.internal
        - name: OPNSENSE_EXPORTER_INSTANCE_LABEL
          value: opnsense
        - name: OPS_API_KEY_FILE
          value: /etc/opnsense-api/key
        - name: OPS_API_SECRET_FILE
          value: /etc/opnsense-api/secret
        - name: SSL_CERT_FILE
          value: /etc/opnsense/opnsense.crt
        - name: OPNSENSE_EXPORTER_DISABLE_ARP_TABLE
          value: "true"
        - name: OPNSENSE_EXPORTER_DISABLE_CRON_TABLE
          value: "true"
        - name: OPNSENSE_EXPORTER_DISABLE_WIREGUARD
          value: "true"
        - name: OPNSENSE_EXPORTER_DISABLE_IPSEC
          value: "true"
        - name: OPNSENSE_EXPORTER_DISABLE_OPENVPN
          value: "true"
        - name: OPNSENSE_EXPORTER_DISABLE_UNBOUND
          value: "true"
        - name: OPNSENSE_EXPORTER_DISABLE_FIRMWARE
          value: "true"
        - name: OPNSENSE_EXPORTER_DISABLE_KEADHCPV4
          value: "true"
        - name: OPNSENSE_EXPORTER_DISABLE_KEADHCPV6
          value: "true"
        - name: OPNSENSE_EXPORTER_DISABLE_CARP
          value: "true"
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        securityContext:
          capabilities:
            drop:
            - ALL
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
      volumes:
      - name: api
        secret:
          secretName: opnsense-exporter-api
      - name: certificate
        configMap:
          name: opnsense-exporter-certificate
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      hostAliases:
      - ip: 192.168.1.1
        hostnames:
        - OPNsense.internal

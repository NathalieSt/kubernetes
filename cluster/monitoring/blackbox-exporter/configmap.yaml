---
apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-exporter-config
data:
  blackbox.yml: |
    # One module: is anything answering HTTP at the backend the gateway routes to.
    #
    # Any status below 500 that an app commonly gives an anonymous GET of / counts as alive —
    # a login redirect, a 401 from an API, a 404 from a server with nothing at the root are all
    # a process that is up. Redirects are not followed: the answer wanted is the backend's own.
    modules:
      http_up:
        prober: http
        timeout: 10s
        http:
          method: GET
          preferred_ip_protocol: ip4
          ip_protocol_fallback: false
          no_follow_redirects: true
          valid_status_codes: [200, 204, 301, 302, 303, 307, 308, 400, 401, 403, 404, 405]

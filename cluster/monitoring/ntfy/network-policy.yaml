---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ntfy-networkpolicy
spec:
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: internal-gateway
      podSelector:
        matchExpressions:
        - key: app.kubernetes.io/name
          operator: In
          values:
          - internal-gateway
          - internal-gateway-secondary
          - blackbox-exporter
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: victoria-metrics
    ports:
    - port: 9090
      protocol: TCP
  - from:
    - namespaceSelector:
        matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
          - healthchecks
          - glitchtip
          - changedetection
          - victoria-metrics
          - forgejo
          - jellyfin
          - zyme
          - limes
    ports:
    - port: 8080
      protocol: TCP

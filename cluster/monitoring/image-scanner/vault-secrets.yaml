---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: image-scanner-vault-serviceaccount
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: image-scanner-vault-token-reviewer
rules:
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - authorization.k8s.io
  resources:
  - subjectaccessreviews
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: image-scanner-vault-token-reviewer-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: image-scanner-vault-token-reviewer
subjects:
- kind: ServiceAccount
  name: image-scanner-vault-serviceaccount
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: image-scanner-vault-auth
spec:
  kubernetes:
    role: image-scanner
    serviceAccount: image-scanner-vault-serviceaccount
  vaultAuthGlobalRef:
    allowDefault: true
    namespace: vault-secrets-operator
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: image-scanner-image-scanner-static-secret
spec:
  vaultAuthRef: image-scanner-vault-auth
  mount: kvv2
  type: kv-v2
  path: image-scanner
  refreshAfter: 10s
  destination:
    create: true
    name: image-scanner-secret
  rolloutRestartTargets:
  - kind: Deployment
    name: image-scanner
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: image-scanner-image-scanner-db-static-secret
spec:
  vaultAuthRef: image-scanner-vault-auth
  mount: kvv2
  type: kv-v2
  path: image-scanner/db
  refreshAfter: 10s
  destination:
    create: true
    name: image-scanner-db-secret
  rolloutRestartTargets:
  - kind: Deployment
    name: image-scanner

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: image-scanner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: image-scanner-cluster-role
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
- apiGroups:
  - ""
  resources:
  - pods/log
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: image-scanner-cluster-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: image-scanner-cluster-role
subjects:
- kind: ServiceAccount
  name: image-scanner
  namespace: image-scanner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: image-scanner-role
rules:
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - configmaps
  resourceNames:
  - image-scanner-updates-announced
  verbs:
  - get
  - update
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: image-scanner-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: image-scanner-role
subjects:
- kind: ServiceAccount
  name: image-scanner
  namespace: image-scanner

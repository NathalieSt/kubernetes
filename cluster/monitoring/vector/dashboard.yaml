---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    perses.dev/resource: "true"
  name: vector-dashboard
data:
  10-dashboard-vector.yaml: |
    kind: Dashboard
    metadata:
      name: vector
      project: homelab
    spec:
      display:
        name: Log Pipeline
      duration: 6h
      refreshInterval: 1m
      panels:
        discarded:
          kind: Panel
          spec:
            display:
              name: Events discarded per second
            plugin:
              kind: TimeSeriesChart
              spec:
                yAxis:
                  format:
                    unit: decimal
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: sum by (component_id) (rate(vector_component_discarded_events_total[5m]))
        errors:
          kind: Panel
          spec:
            display:
              name: Component errors per second
            plugin:
              kind: TimeSeriesChart
              spec:
                yAxis:
                  format:
                    unit: decimal
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: sum by (component_id, error_type) (rate(vector_component_errors_total[5m]))
        eventsIn:
          kind: Panel
          spec:
            display:
              name: Events received per second, by component
            plugin:
              kind: TimeSeriesChart
              spec:
                yAxis:
                  format:
                    unit: decimal
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: sum by (component_id) (rate(vector_component_received_events_total[5m]))
        eventsOut:
          kind: Panel
          spec:
            display:
              name: Events sent per second, by component
            plugin:
              kind: TimeSeriesChart
              spec:
                yAxis:
                  format:
                    unit: decimal
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: sum by (component_id) (rate(vector_component_sent_events_total[5m]))
      layouts:
      - kind: Grid
        spec:
          display:
            title: Vector agents
          items:
          - x: 0
            "y": 0
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/eventsIn"
          - x: 12
            "y": 0
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/eventsOut"
          - x: 0
            "y": 8
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/errors"
          - x: 12
            "y": 8
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/discarded"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector
data:
  agent.yaml: |
    api:
      enabled: false
    data_dir: /vector-data-dir
    # -------------------------------------------------
    # SOURCE - Kubernetes pod/container logs
    # -------------------------------------------------
    sources:
      # Vector's own health: events in and out per component, errors, and the
      # buffer/backpressure figures. Without this the log pipeline is the one part
      # of the monitoring stack that nothing watches, and a sink failing quietly
      # looks exactly like a cluster that stopped logging.
      vector_metrics:
        type: internal_metrics

      k8s_in:
        auto_partial_merge: true
        delay_deletion_ms: 60000
        fingerprint_lines: 1
        glob_minimum_cooldown_ms: 60000
        ignore_older_secs: 600
        insert_namespace_fields: true
        # self_node_name is deliberately absent: its built-in default reads the
        # VECTOR_SELF_NODE_NAME environment variable, which the DaemonSet sets from
        # spec.nodeName. Writing it as ${VECTOR_SELF_NODE_NAME} works too — the
        # source resolves that field itself, so it survived 0.57.0 disabling
        # general config interpolation — but relying on the default keeps the one
        # ${...} out of this file entirely. Verified against 0.58.0 both ways.
        timezone: local
        type: kubernetes_logs
    # -------------------------------------------------
    # TRANSFORMS - filter / sample / prune
    # -------------------------------------------------
    transforms:
      parse_message:
        type: remap
        inputs:
          - k8s_in
        source: |
          # Try parsing message as JSON
          parsed, err = parse_json(.message)

          if err == null && is_object(parsed) {
            # Merge parsed fields into root. Every field of the document survives
            # the merge, so the raw JSON is not kept beside it as well — an
            # `original_message` copy stored every JSON line twice.
            . = merge!(., parsed)

            # Replace message with a readable string if present
            if exists(parsed.message) {
              .message = parsed.message
            }
          }

          # Plain-text lines are NOT split into fields. This used to fall back to
          # parse_syslog ?? parse_key_value, and parse_key_value accepts any text at
          # all: every space-separated word became a field name. VictoriaLogs saw
          # 7,212 distinct field names in one hour, 6,557 of them words out of log
          # messages ("feature discovery completed", "nfd-worker.go:550]", "200"),
          # and each is a column it has to keep in memory. It sat at 1.9 of its
          # 2 GiB limit and had been OOM-killed.
          #
          # Only a line that is actually logfmt (starts with key=) is parsed, and
          # only its level is lifted out — that is what normalize_level and the
          # debug filter below need. The rest stays in the message, where
          # VictoriaLogs' `| unpack_logfmt` recovers it at query time.
          if err != null {
            line = string(.message) ?? ""
            if match(line, r'^[A-Za-z_][\w.]*=') {
              kv, kv_err = parse_logfmt(line)
              if kv_err == null {
                if exists(kv.level) {
                  .level = kv.level
                } else if exists(kv.lvl) {
                  .level = kv.lvl
                }
              }
            }
          }

      drop_noisy_logs:
        type: filter
        inputs:
          - parse_message
        condition: |
          !(.kubernetes.container_name == "kube-proxy" || .kubernetes.container_name == "kube-apiserver" || .kubernetes.container_name == "coredns" && contains!(.message, "health"))

      normalize_level:
        type: remap
        inputs:
          - drop_noisy_logs
        source: |
          # Normalize log level from severity or level
          if exists(.severity) {
            .lvl = downcase!(.severity)
            del(.severity)
          }
          if exists(.level){
            .lvl = downcase!(.level)
            del(.level)
          }
          if !exists(.lvl) { .lvl = "" }

          # Optional: map common variants
          if .lvl == "warn" { .lvl = "warning" }
          if .lvl == "err"  { .lvl = "error" }

      drop_debug_logs:
        type: filter
        inputs:
          - normalize_level
        condition: |
          !includes(["debug", "trace"], .lvl)

      remove_k8s_noise:
        type: remap
        inputs:
          - drop_debug_logs
        # Metadata carried on every line that nothing queries. `annotations` was
        # listed here for a long time and matched nothing: the source calls the
        # field pod_annotations. pod_labels stay — selecting logs by app label is a
        # real query.
        source: |
          del(.kubernetes.node_labels)
          del(.kubernetes.pod_annotations)
          del(.kubernetes.namespace_labels)
          del(.kubernetes.pod_ips)
          del(.kubernetes.pod_uid)
          del(.kubernetes.container_id)
          del(.file)

      normalize_logs:
        type: remap
        inputs:
          - remove_k8s_noise
        source: |
          # Promote k8s metadata to flat top-level fields used as VictoriaLogs stream labels
          .namespace = string(.kubernetes.pod_namespace) ?? ""
          .pod       = string(.kubernetes.pod_name) ?? ""
          .container = string(.kubernetes.container_name) ?? ""
          .node      = string(.kubernetes.pod_node_name) ?? ""

          # Rename message to short key
          .msg = .message
          del(.message)

          # Remove empty fields
          if is_null(.msg) { del(.msg) }

      truncate_messages:
        type: remap
        inputs:
          - normalize_logs
        source: |
          max_len = 2048

          msg = to_string(.msg) ?? null
          if msg != null && length!(msg) > max_len {
            .msg = truncate!(msg, max_len, "...Truncated")
          }

    # -------------------------------------------------
    # SINK - VictoriaLogs (via Elasticsearch-compatible insert API)
    # -------------------------------------------------
    sinks:
      # Serves the internal metrics above on the prom-exporter container port the
      # DaemonSet already declares. vmagent scrapes it via the generator's
      # Metrics declaration.
      prom_exporter:
        type: prometheus_exporter
        inputs:
          - vector_metrics
        address: 0.0.0.0:9090

      vlogs:
        type: elasticsearch
        inputs:
          - truncate_messages
        endpoints:
          - http://victoria-logs.victoria-logs.svc.cluster.local:9428/insert/elasticsearch/
        api_version: v8
        compression: gzip
        healthcheck:
          enabled: false
        query:
          _msg_field: msg
          _time_field: timestamp
          _stream_fields: namespace,pod,container,node

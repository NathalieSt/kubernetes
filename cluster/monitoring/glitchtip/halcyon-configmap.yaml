---
apiVersion: v1
kind: ConfigMap
metadata:
  name: glitchtip-halcyon
  namespace: glitchtip
data:
  append-stylesheet.sh: |
    #!/bin/sh
    # Appends Halcyon to an application's own stylesheet, in a copy of the
    # directory that holds it. Run as an init container from the application's own
    # image, so the file it copies is the one that version actually serves. See
    # StylesheetAppend.res for why this exists at all.
    #
    #   $1   the directory in the image
    #   $2   the emptyDir mounted over that directory in the application container
    #   $3   the stylesheet to append
    #   $4…  globs, relative to the directory, naming the files to append to
    #
    # A theme must never be the reason an application does not start. So a layout
    # this does not recognise -- the application moved its assets in an upgrade --
    # is reported on stderr and the pod starts unthemed, from a faithful copy.
    # Everything else (a failed copy, a full disk) still fails, because then the
    # copy the application would be served from is incomplete.
    set -eu

    source_dir=$1
    target_dir=$2
    css=$3
    shift 3

    warn() {
      echo "WARNING: Halcyon not applied: $*" >&2
    }

    if [ ! -d "$source_dir" ]; then
      # Nothing to copy, and nothing is hidden by mounting over a path that does
      # not exist in this image.
      warn "$source_dir does not exist in this image -- the asset layout has changed"
      exit 0
    fi

    cp -R "$source_dir/." "$target_dir/"
    # An image may ship its assets read-only, and cp keeps the mode. The contents
    # only: the emptyDir's own root belongs to root, and a chmod of it fails. Not
    # through symlinks, whose targets are in the image's read-only root.
    find "$target_dir" -mindepth 1 ! -type l -exec chmod u+w {} +

    for pattern in "$@"; do
      matched=0
      # Unquoted on purpose: this is the glob.
      for file in "$target_dir"/$pattern; do
        [ -f "$file" ] || continue
        matched=$((matched + 1))
        # A symlink stays one in the copy (Paperless' collectstatic links every
        # file back into its source tree), and appending through it would write
        # into the image. So the file being themed becomes a real one; links
        # elsewhere are left, since the image they point into is the same.
        if [ -L "$file" ]; then
          cp "$file" "$file.real" && rm "$file" && mv "$file.real" "$file"
          chmod u+w "$file"
        fi
        printf '\n' >>"$file"
        cat "$css" >>"$file"
        # A pre-compressed sibling is served in preference to the file itself, so
        # one left as it was would quietly serve the unthemed stylesheet to every
        # browser that accepts the encoding -- which is all of them. gzip is in
        # every image this runs from; brotli is in none, so that copy is dropped
        # and the server falls back to the gzip one.
        rm -f "$file.br"
        # -L too: a compressed sibling may be a link, even one shared with other
        # directories' identical files, and must not be written through.
        if [ -e "$file.gz" ] || [ -L "$file.gz" ]; then
          rm -f "$file.gz"
          gzip -9 -c "$file" >"$file.gz"
        fi
        echo "appended Halcyon to ${file#"$target_dir"/}"
      done
      if [ "$matched" -eq 0 ]; then
        warn "no file under $source_dir matches '$pattern' -- the asset layout has changed"
      fi
    done
  halcyon.css: |
    /* Halcyon for GlitchTip, appended by kubernetes-generator (src/generators/theme). */

    :root {
      --mat-sys-primary: light-dark(#005a66, #86d4e2);
      --mat-sys-on-primary: light-dark(#f4fcff, #020d12);
      --mat-sys-primary-container: light-dark(#d5f3f9, #00282e);
      --mat-sys-on-primary-container: light-dark(#004049, #b3e7f1);
      --mat-sys-inverse-primary: light-dark(#86d4e2, #005a66);
      --mat-sys-primary-fixed: #d5f3f9;
      --mat-sys-primary-fixed-dim: #b3e7f1;
      --mat-sys-on-primary-fixed: #00282e;
      --mat-sys-on-primary-fixed-variant: #005a66;
      --mat-sys-surface-tint: light-dark(#005a66, #86d4e2);
      --mat-sys-secondary: light-dark(#2c517f, #a0c9fd);
      --mat-sys-on-secondary: light-dark(#f4fcff, #020d12);
      --mat-sys-secondary-container: light-dark(#e1eeff, #10233c);
      --mat-sys-on-secondary-container: light-dark(#1d395b, #c6dfff);
      --mat-sys-secondary-fixed: #e1eeff;
      --mat-sys-secondary-fixed-dim: #c6dfff;
      --mat-sys-on-secondary-fixed: #10233c;
      --mat-sys-on-secondary-fixed-variant: #2c517f;
      --mat-sys-tertiary: light-dark(#005a66, #86d4e2);
      --mat-sys-on-tertiary: light-dark(#f4fcff, #020d12);
      --mat-sys-tertiary-container: light-dark(#d5f3f9, #00282e);
      --mat-sys-on-tertiary-container: light-dark(#004049, #b3e7f1);
      --mat-sys-tertiary-fixed: #e1eeff;
      --mat-sys-tertiary-fixed-dim: #c6dfff;
      --mat-sys-on-tertiary-fixed: #10233c;
      --mat-sys-on-tertiary-fixed-variant: #2c517f;
      --mat-sys-error: light-dark(#783d28, #f7b39b);
      --mat-sys-on-error: light-dark(#f4fcff, #020d12);
      --mat-sys-error-container: light-dark(#ffe7df, #38190e);
      --mat-sys-on-error-container: light-dark(#562a1a, #ffd0c0);
      --mat-sys-background: light-dark(#eaf6fb, #071a21);
      --mat-sys-surface: light-dark(#eaf6fb, #071a21);
      --mat-sys-surface-dim: light-dark(#c0d9e4, #071a21);
      --mat-sys-surface-bright: light-dark(#f4fcff, #305360);
      --mat-sys-surface-container-lowest: light-dark(#e8f8fb, #020d12);
      --mat-sys-surface-container-low: light-dark(color-mix(in oklab, #f4fcff, #eaf6fb), #071a21);
      --mat-sys-surface-container: light-dark(#eaf6fb, #0e262f);
      --mat-sys-surface-container-high: light-dark(color-mix(in oklab, #eaf6fb, #d8eaf1), color-mix(in oklab, #0e262f, #1a3742));
      --mat-sys-surface-container-highest: light-dark(#d8eaf1, #1a3742);
      --mat-sys-surface-variant: light-dark(#d8eaf1, #305360);
      --mat-sys-on-background: light-dark(#1a3742, #eaf6fb);
      --mat-sys-on-surface: light-dark(#1a3742, #eaf6fb);
      --mat-sys-on-surface-variant: light-dark(#305360, #c0d9e4);
      --mat-sys-outline: light-dark(#4c7281, #6890a0);
      --mat-sys-outline-variant: light-dark(#d8eaf1, #305360);
      --mat-sys-inverse-surface: light-dark(#1a3742, #d8eaf1);
      --mat-sys-inverse-on-surface: light-dark(#eaf6fb, #1a3742);
    }

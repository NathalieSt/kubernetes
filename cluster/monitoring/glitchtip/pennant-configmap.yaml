---
apiVersion: v1
kind: ConfigMap
metadata:
  name: glitchtip-pennant
  namespace: glitchtip
data:
  append-stylesheet.sh: |
    #!/bin/sh
    # Appends Pennant to an application's own stylesheet, in a copy of the
    # directory that holds it. Run as an init container from the application's own
    # image, so the file it copies is the one that version actually serves. See
    # StylesheetAppend.res for why this exists at all.
    #
    #   $1   the directory in the image
    #   $2   the emptyDir mounted over that directory in the application container
    #   $3   the stylesheet to append
    #   $4…  globs, relative to the directory, naming the files to append to
    #
    # A theme must never be the reason an application does not start. So a layout
    # this does not recognise -- the application moved its assets in an upgrade --
    # is reported on stderr and the pod starts unthemed, from a faithful copy.
    # Everything else (a failed copy, a full disk) still fails, because then the
    # copy the application would be served from is incomplete.
    set -eu

    source_dir=$1
    target_dir=$2
    css=$3
    shift 3

    warn() {
      echo "WARNING: Pennant not applied: $*" >&2
    }

    if [ ! -d "$source_dir" ]; then
      # Nothing to copy, and nothing is hidden by mounting over a path that does
      # not exist in this image.
      warn "$source_dir does not exist in this image -- the asset layout has changed"
      exit 0
    fi

    cp -R "$source_dir/." "$target_dir/"
    # An image may ship its assets read-only, and cp keeps the mode. The contents
    # only: the emptyDir's own root belongs to root, and a chmod of it fails. Not
    # through symlinks, whose targets are in the image's read-only root.
    find "$target_dir" -mindepth 1 ! -type l -exec chmod u+w {} +

    for pattern in "$@"; do
      matched=0
      # Unquoted on purpose: this is the glob.
      for file in "$target_dir"/$pattern; do
        [ -f "$file" ] || continue
        matched=$((matched + 1))
        # A symlink stays one in the copy (Paperless' collectstatic links every
        # file back into its source tree), and appending through it would write
        # into the image. So the file being themed becomes a real one; links
        # elsewhere are left, since the image they point into is the same.
        if [ -L "$file" ]; then
          cp "$file" "$file.real" && rm "$file" && mv "$file.real" "$file"
          chmod u+w "$file"
        fi
        printf '\n' >>"$file"
        cat "$css" >>"$file"
        # A pre-compressed sibling is served in preference to the file itself, so
        # one left as it was would quietly serve the unthemed stylesheet to every
        # browser that accepts the encoding -- which is all of them. gzip is in
        # every image this runs from; brotli is in none, so that copy is dropped
        # and the server falls back to the gzip one.
        rm -f "$file.br"
        # -L too: a compressed sibling may be a link, even one shared with other
        # directories' identical files, and must not be written through.
        if [ -e "$file.gz" ] || [ -L "$file.gz" ]; then
          rm -f "$file.gz"
          gzip -9 -c "$file" >"$file.gz"
        fi
        echo "appended Pennant to ${file#"$target_dir"/}"
      done
      if [ "$matched" -eq 0 ]; then
        warn "no file under $source_dir matches '$pattern' -- the asset layout has changed"
      fi
    done
  pennant.css: |
    /* Pennant for GlitchTip, appended by kubernetes-generator (src/generators/theme). */

    :root {
      --mat-sys-primary: light-dark(#984a72, #f5adce);
      --mat-sys-on-primary: light-dark(#f9fafb, #090c0d);
      --mat-sys-primary-container: light-dark(#ffe4f0, #371627);
      --mat-sys-on-primary-container: light-dark(#763757, #ffcbe2);
      --mat-sys-inverse-primary: light-dark(#f5adce, #984a72);
      --mat-sys-primary-fixed: #ffe4f0;
      --mat-sys-primary-fixed-dim: #ffcbe2;
      --mat-sys-on-primary-fixed: #371627;
      --mat-sys-on-primary-fixed-variant: #763757;
      --mat-sys-surface-tint: light-dark(#984a72, #f5adce);
      --mat-sys-secondary: light-dark(#007495, #6bd5ff);
      --mat-sys-on-secondary: light-dark(#f9fafb, #090c0d);
      --mat-sys-secondary-container: light-dark(#d6f2ff, #002735);
      --mat-sys-on-secondary-container: light-dark(#005873, #aee6ff);
      --mat-sys-secondary-fixed: #d6f2ff;
      --mat-sys-secondary-fixed-dim: #aee6ff;
      --mat-sys-on-secondary-fixed: #002735;
      --mat-sys-on-secondary-fixed-variant: #005873;
      --mat-sys-tertiary: light-dark(#984a72, #f5adce);
      --mat-sys-on-tertiary: light-dark(#f9fafb, #090c0d);
      --mat-sys-tertiary-container: light-dark(#ffe4f0, #371627);
      --mat-sys-on-tertiary-container: light-dark(#763757, #ffcbe2);
      --mat-sys-tertiary-fixed: #ffe4f0;
      --mat-sys-tertiary-fixed-dim: #ffcbe2;
      --mat-sys-on-tertiary-fixed: #371627;
      --mat-sys-on-tertiary-fixed-variant: #763757;
      --mat-sys-error: light-dark(#af3d34, #ffaea2);
      --mat-sys-on-error: light-dark(#f9fafb, #090c0d);
      --mat-sys-error-container: light-dark(#ffe6e3, #40100d);
      --mat-sys-on-error-container: light-dark(#872c25, #ffcfc8);
      --mat-sys-background: light-dark(#f9fafb, #090c0d);
      --mat-sys-surface: light-dark(#f9fafb, #090c0d);
      --mat-sys-surface-dim: light-dark(#d0d5d8, #141819);
      --mat-sys-surface-bright: light-dark(#f9fafb, #484e51);
      --mat-sys-surface-container-lowest: light-dark(#ffffff, #090c0d);
      --mat-sys-surface-container-low: light-dark(color-mix(in oklab, #f9fafb, #f1f4f5), #141819);
      --mat-sys-surface-container: light-dark(#f1f4f5, #1f2426);
      --mat-sys-surface-container-high: light-dark(color-mix(in oklab, #f1f4f5, #e3e7e9), color-mix(in oklab, #1f2426, #2e3436));
      --mat-sys-surface-container-highest: light-dark(#e3e7e9, #2e3436);
      --mat-sys-surface-variant: light-dark(#e3e7e9, #2e3436);
      --mat-sys-on-background: light-dark(#2e3436, #f1f4f5);
      --mat-sys-on-surface: light-dark(#2e3436, #f1f4f5);
      --mat-sys-on-surface-variant: light-dark(#666d71, #b8bfc2);
      --mat-sys-outline: light-dark(#838b8e, #666d71);
      --mat-sys-outline-variant: light-dark(#e3e7e9, #2e3436);
      --mat-sys-inverse-surface: light-dark(#2e3436, #e3e7e9);
      --mat-sys-inverse-on-surface: light-dark(#f1f4f5, #2e3436);
    }

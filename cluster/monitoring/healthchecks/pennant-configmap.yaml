      --alert-no-data-color: #666d71;
      --alert-success-bg: #d9f6df;
      --alert-success-border: #e3e7e9;
      --alert-success-color: #135f32;
      --body-bg: #f9fafb;
      --border-color: #e3e7e9;
      --border-muted: #e3e7e9;
      --breadcrumb-active-color: #666d71;
      --breadcrumb-bg: #f1f4f5;
      --btn-active-bg: #e3e7e9;
      --btn-active-border: #838b8e;

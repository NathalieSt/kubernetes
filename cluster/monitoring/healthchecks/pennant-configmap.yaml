      --close-color: #2e3436;
      --dropdown-bg: #ffffff;
      --dropdown-link-hover-bg: #f1f4f5;
      --get-started-bg: #f1f4f5;
      --input-bg-disabled: #f1f4f5;
      --input-color: #2e3436;
      --input-group-addon-bg: #f1f4f5;
      --jumbotron-bg: #f1f4f5;
      --label-ign-bg: #e3e7e9;
      --label-ign-color: #2e3436;
      --label-start-color: #1e7c44;
      --link-color: #984a72;
      --link-hover-color: #763757;
      --log-flip-bg: #f1f4f5;
      --modal-content-bg: #ffffff;
      --nav-link-hover-bg: #f1f4f5;
      --panel-bg: #ffffff;
      --panel-default-heading-bg: #f1f4f5;
      --panel-success-bg: #d9f6df;
      --pre-bg: #f1f4f5;
      --ts-tag-bg: #e3e7e9;
      --small-text-color: #2e3436;
      --state-info-bg: #eaebff;
      --state-info-border: #e3e7e9;
      --state-info-color: #4b4489;
      --status-new-color: #838b8e;
      --table-bg-hover: #f1f4f5;
      --tag-bg: #f1f4f5;
      --tag-checked-bg: #2e3436;
      --tag-checked-border: #2e3436;
      --tag-checked-color: #ffffff;
      --tag-color: #666d71;
      --tag-up-bg: #ffffff;
      --tag-up-border: #e3e7e9;
      --tag-up-color: #2e3436;
      --text-color: #2e3436;
      --text-muted: #666d71;
      --text-success: #1e7c44;
      --text-warning: #8e5e00;
      --text-danger: #af3d34;
      --log-new-row-bg: #eaebff;
      --log-new-row-border: #e3e7e9;
      --btn-default-border: #d0d5d8;
      --btn-remove-bg: #ffffff;
      --input-border: #d0d5d8;
    }

    body.dark {
      --alert-no-data-bg: #1f2426;
      --alert-no-data-border: #2e3436;
      --alert-no-data-color: #b8bfc2;
      --alert-success-bg: #042b13;
      --alert-success-border: #2e3436;
      --alert-success-color: #bbeac6;
      --body-bg: #090c0d;
      --border-color: #2e3436;
      --border-muted: #2e3436;

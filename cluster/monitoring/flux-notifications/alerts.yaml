---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: flux-errors
spec:
  providerRef:
    name: alertmanager
  eventSeverity: error
  eventSources:
  - kind: Kustomization
    name: "*"
  - kind: HelmRelease
    name: "*"
  - kind: GitRepository
    name: "*"
  - kind: OCIRepository
    name: "*"
  - kind: HelmRepository
    name: "*"
  - kind: HelmChart
    name: "*"
  summary: flux reconciliation failed
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: flux-commit-status
spec:
  providerRef:
    name: forgejo
  eventSeverity: info
  eventSources:
  - kind: Kustomization
    name: "*"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: monitoring-dashboard
    app.kubernetes.io/version: 5b7f5cf
  name: monitoring-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: monitoring-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monitoring-dashboard
        app.kubernetes.io/version: 5b7f5cf
    spec:
      imagePullSecrets:
      - name: forgejo-registry-secret
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
      - image: code.netbird.nathalie-stiefsohn.eu/my-homelab/monitoring-dashboard:5b7f5cf@sha256:1e13b9be0b33ccb4d8a02875cb74202794d67afc46b9661c029f03f90f133a49
        name: monitoring-dashboard
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - mountPath: /data
          name: layout-volume
        env:
        - name: MONITORING_DASHBOARD_VM_URL
          value: http://vmsingle-victoria-metrics-vmks.victoria-metrics.svc.cluster.local:8428
        - name: MONITORING_DASHBOARD_VL_URL
          value: http://victoria-logs.victoria-logs.svc.cluster.local:9428
        - name: WEB_ADDR
          value: :8080
        - name: MONITORING_DASHBOARD_STATIC_ROOT
          value: /app/ui/dist
        - name: MONITORING_DASHBOARD_STATE_DIR
          value: /data
        - name: MONITORING_DASHBOARD_SENTRY_DSN
          value: https://cd8bc55442a644769d472ebfa3fb7ade@glitchtip.netbird.nathalie-stiefsohn.eu/1
        - name: MONITORING_DASHBOARD_OIDC_AUTHORITY
          value: https://auth.netbird.nathalie-stiefsohn.eu
        - name: MONITORING_DASHBOARD_OIDC_CLIENT_ID
          value: monitoring-dashboard
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        securityContext:
          capabilities:
            drop:
            - ALL
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
      volumes:
      - name: layout-volume
        persistentVolumeClaim:
          claimName: monitoring-dashboard-layout-pvc
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: victoria-metrics-networkpolicy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vmsingle
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cluster-console
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: code-server
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: healthchecks
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: homepage
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: keda
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: limes
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring-dashboard
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: start-page
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: victoria-metrics
    ports:
    - port: 8428
      protocol: TCP

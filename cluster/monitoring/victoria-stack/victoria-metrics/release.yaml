---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics
spec:
  interval: 24h
  chartRef:
    kind: OCIRepository
    name: victoria-metrics-repo
  timeout: 10m
  releaseName: victoria-metrics
  install:
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
  values:
    alertmanager:
      config:
        receivers:
        - name: blackhole
        - name: ntfy-alerts-vpn-critical
          webhook_configs:
          - http_config:
              authorization:
                credentials_file: /etc/alertmanager-ntfy/token
            send_resolved: true
            url: http://ntfy.ntfy.svc.cluster.local:8080/alerts-vpn?tpl=yes&priority=%7B%7Bif%20eq%20.status%20%22firing%22%7D%7D4%7B%7Belse%7D%7D2%7B%7Bend%7D%7D&title=%7B%7Bif%20eq%20.status%20%22firing%22%7D%7D%F0%9F%9A%A8%7B%7Belse%7D%7D%E2%9C%85%20Resolved%3A%7B%7Bend%7D%7D%20%7B%7B.commonLabels.alertname%7D%7D%7B%7Bif%20.commonLabels.namespace%7D%7D%20%C2%B7%20%7B%7B.commonLabels.namespace%7D%7D%7B%7Bend%7D%7D&message=%7B%7Brange%20.alerts%7D%7D%7B%7B.annotations.summary%7D%7D%0A%7B%7B.annotations.description%7D%7D%0A%7B%7Bend%7D%7D&click=https%3A%2F%2Forrery.netbird.nathalie-stiefsohn.eu
        - name: ntfy-alerts-vpn-warning
          webhook_configs:
          - http_config:
              authorization:
                credentials_file: /etc/alertmanager-ntfy/token
            send_resolved: true
            url: http://ntfy.ntfy.svc.cluster.local:8080/alerts-vpn?tpl=yes&priority=%7B%7Bif%20eq%20.status%20%22firing%22%7D%7D2%7B%7Belse%7D%7D1%7B%7Bend%7D%7D&title=%7B%7Bif%20eq%20.status%20%22firing%22%7D%7D%E2%9A%A0%EF%B8%8F%7B%7Belse%7D%7D%E2%9C%85%20Resolved%3A%7B%7Bend%7D%7D%20%7B%7B.commonLabels.alertname%7D%7D%7B%7Bif%20.commonLabels.namespace%7D%7D%20%C2%B7%20%7B%7B.commonLabels.namespace%7D%7D%7B%7Bend%7D%7D&message=%7B%7Brange%20.alerts%7D%7D%7B%7B.annotations.summary%7D%7D%0A%7B%7B.annotations.description%7D%7D%0A%7B%7Bend%7D%7D&click=https%3A%2F%2Forrery.netbird.nathalie-stiefsohn.eu
        - name: ntfy-alerts-storage-critical
          webhook_configs:
          - http_config:
              authorization:
                credentials_file: /etc/alertmanager-ntfy/token
            send_resolved: true
            url: http://ntfy.ntfy.svc.cluster.local:8080/alerts-storage?tpl=yes&priority=%7B%7Bif%20eq%20.status%20%22firing%22%7D%7D4%7B%7Belse%7D%7D2%7B%7Bend%7D%7D&title=%7B%7Bif%20eq%20.status%20%22firing%22%7D%7D%F0%9F%9A%A8%7B%7Belse%7D%7D%E2%9C%85%20Resolved%3A%7B%7Bend%7D%7D%20%7B%7B.commonLabels.alertname%7D%7D%7B%7Bif%20.commonLabels.namespace%7D%7D%20%C2%B7%20%7B%7B.commonLabels.namespace%7D%7D%7B%7Bend%7D%7D&message=%7B%7Brange%20.alerts%7D%7D%7B%7B.annotations.summary%7D%7D%0A%7B%7B.annotations.description%7D%7D%0A%7B%7Bend%7D%7D&click=https%3A%2F%2Forrery.netbird.nathalie-stiefsohn.eu
        - name: ntfy-alerts-storage-warning
          webhook_configs:
          - http_config:
              authorization:
                credentials_file: /etc/alertmanager-ntfy/token
            send_resolved: true
            url: http://ntfy.ntfy.svc.cluster.local:8080/alerts-storage?tpl=yes&priority=%7B%7Bif%20eq%20.status%20%22firing%22%7D%7D2%7B%7Belse%7D%7D1%7B%7Bend%7D%7D&title=%7B%7Bif%20eq%20.status%20%22firing%22%7D%7D%E2%9A%A0%EF%B8%8F%7B%7Belse%7D%7D%E2%9C%85%20Resolved%3A%7B%7Bend%7D%7D%20%7B%7B.commonLabels.alertname%7D%7D%7B%7Bif%20.commonLabels.namespace%7D%7D%20%C2%B7%20%7B%7B.commonLabels.namespace%7D%7D%7B%7Bend%7D%7D&message=%7B%7Brange%20.alerts%7D%7D%7B%7B.annotations.summary%7D%7D%0A%7B%7B.annotations.description%7D%7D%0A%7B%7Bend%7D%7D&click=https%3A%2F%2Forrery.netbird.nathalie-stiefsohn.eu
        - name: ntfy-alerts-nodes-critical
          webhook_configs:
          - http_config:
              authorization:
                credentials_file: /etc/alertmanager-ntfy/token
            send_resolved: true
            url: http://ntfy.ntfy.svc.cluster.local:8080/alerts-nodes?tpl=yes&priority=%7B%7Bif%20eq%20.status%20%22firing%22%7D%7D4%7B%7Belse%7D%7D2%7B%7Bend%7D%7D&title=%7B%7Bif%20eq%20.status%20%22firing%22%7D%7D%F0%9F%9A%A8%7B%7Belse%7D%7D%E2%9C%85%20Resolved%3A%7B%7Bend%7D%7D%20%7B%7B.commonLabels.alertname%7D%7D%7B%7Bif%20.commonLabels.namespace%7D%7D%20%C2%B7%20%7B%7B.commonLabels.namespace%7D%7D%7B%7Bend%7D%7D&message=%7B%7Brange%20.alerts%7D%7D%7B%7B.annotations.summary%7D%7D%0A%7B%7B.annotations.description%7D%7D%0A%7B%7Bend%7D%7D&click=https%3A%2F%2Forrery.netbird.nathalie-stiefsohn.eu
        - name: ntfy-alerts-nodes-warning
          webhook_configs:
          - http_config:
              authorization:
                credentials_file: /etc/alertmanager-ntfy/token
            send_resolved: true
            url: http://ntfy.ntfy.svc.cluster.local:8080/alerts-nodes?tpl=yes&priority=%7B%7Bif%20eq%20.status%20%22firing%22%7D%7D2%7B%7Belse%7D%7D1%7B%7Bend%7D%7D&title=%7B%7Bif%20eq%20.status%20%22firing%22%7D%7D%E2%9A%A0%EF%B8%8F%7B%7Belse%7D%7D%E2%9C%85%20Resolved%3A%7B%7Bend%7D%7D%20%7B%7B.commonLabels.alertname%7D%7D%7B%7Bif%20.commonLabels.namespace%7D%7D%20%C2%B7%20%7B%7B.commonLabels.namespace%7D%7D%7B%7Bend%7D%7D&message=%7B%7Brange%20.alerts%7D%7D%7B%7B.annotations.summary%7D%7D%0A%7B%7B.annotations.description%7D%7D%0A%7B%7Bend%7D%7D&click=https%3A%2F%2Forrery.netbird.nathalie-stiefsohn.eu
        - name: ntfy-alerts-platform-critical
          webhook_configs:
          - http_config:
              authorization:
                credentials_file: /etc/alertmanager-ntfy/token
            send_resolved: true
            url: http://ntfy.ntfy.svc.cluster.local:8080/alerts-platform?tpl=yes&priority=%7B%7Bif%20eq%20.status%20%22firing%22%7D%7D4%7B%7Belse%7D%7D2%7B%7Bend%7D%7D&title=%7B%7Bif%20eq%20.status%20%22firing%22%7D%7D%F0%9F%9A%A8%7B%7Belse%7D%7D%E2%9C%85%20Resolved%3A%7B%7Bend%7D%7D%20%7B%7B.commonLabels.alertname%7D%7D%7B%7Bif%20.commonLabels.namespace%7D%7D%20%C2%B7%20%7B%7B.commonLabels.namespace%7D%7D%7B%7Bend%7D%7D&message=%7B%7Brange%20.alerts%7D%7D%7B%7B.annotations.summary%7D%7D%0A%7B%7B.annotations.description%7D%7D%0A%7B%7Bend%7D%7D&click=https%3A%2F%2Forrery.netbird.nathalie-stiefsohn.eu
        - name: ntfy-alerts-platform-warning
          webhook_configs:
          - http_config:
              authorization:
                credentials_file: /etc/alertmanager-ntfy/token
            send_resolved: true
            url: http://ntfy.ntfy.svc.cluster.local:8080/alerts-platform?tpl=yes&priority=%7B%7Bif%20eq%20.status%20%22firing%22%7D%7D2%7B%7Belse%7D%7D1%7B%7Bend%7D%7D&title=%7B%7Bif%20eq%20.status%20%22firing%22%7D%7D%E2%9A%A0%EF%B8%8F%7B%7Belse%7D%7D%E2%9C%85%20Resolved%3A%7B%7Bend%7D%7D%20%7B%7B.commonLabels.alertname%7D%7D%7B%7Bif%20.commonLabels.namespace%7D%7D%20%C2%B7%20%7B%7B.commonLabels.namespace%7D%7D%7B%7Bend%7D%7D&message=%7B%7Brange%20.alerts%7D%7D%7B%7B.annotations.summary%7D%7D%0A%7B%7B.annotations.description%7D%7D%0A%7B%7Bend%7D%7D&click=https%3A%2F%2Forrery.netbird.nathalie-stiefsohn.eu
        - name: ntfy-alerts-apps-critical
          webhook_configs:
          - http_config:
              authorization:
                credentials_file: /etc/alertmanager-ntfy/token
            send_resolved: true
            url: http://ntfy.ntfy.svc.cluster.local:8080/alerts-apps?tpl=yes&priority=%7B%7Bif%20eq%20.status%20%22firing%22%7D%7D4%7B%7Belse%7D%7D2%7B%7Bend%7D%7D&title=%7B%7Bif%20eq%20.status%20%22firing%22%7D%7D%F0%9F%9A%A8%7B%7Belse%7D%7D%E2%9C%85%20Resolved%3A%7B%7Bend%7D%7D%20%7B%7B.commonLabels.alertname%7D%7D%7B%7Bif%20.commonLabels.namespace%7D%7D%20%C2%B7%20%7B%7B.commonLabels.namespace%7D%7D%7B%7Bend%7D%7D&message=%7B%7Brange%20.alerts%7D%7D%7B%7B.annotations.summary%7D%7D%0A%7B%7B.annotations.description%7D%7D%0A%7B%7Bend%7D%7D&click=https%3A%2F%2Forrery.netbird.nathalie-stiefsohn.eu
        - name: ntfy-alerts-apps-warning
          webhook_configs:
          - http_config:
              authorization:
                credentials_file: /etc/alertmanager-ntfy/token
            send_resolved: true
            url: http://ntfy.ntfy.svc.cluster.local:8080/alerts-apps?tpl=yes&priority=%7B%7Bif%20eq%20.status%20%22firing%22%7D%7D2%7B%7Belse%7D%7D1%7B%7Bend%7D%7D&title=%7B%7Bif%20eq%20.status%20%22firing%22%7D%7D%E2%9A%A0%EF%B8%8F%7B%7Belse%7D%7D%E2%9C%85%20Resolved%3A%7B%7Bend%7D%7D%20%7B%7B.commonLabels.alertname%7D%7D%7B%7Bif%20.commonLabels.namespace%7D%7D%20%C2%B7%20%7B%7B.commonLabels.namespace%7D%7D%7B%7Bend%7D%7D&message=%7B%7Brange%20.alerts%7D%7D%7B%7B.annotations.summary%7D%7D%0A%7B%7B.annotations.description%7D%7D%0A%7B%7Bend%7D%7D&click=https%3A%2F%2Forrery.netbird.nathalie-stiefsohn.eu
        - name: ntfy-alerts-monitoring-critical
          webhook_configs:
          - http_config:
              authorization:
                credentials_file: /etc/alertmanager-ntfy/token
            send_resolved: true
            url: http://ntfy.ntfy.svc.cluster.local:8080/alerts-monitoring?tpl=yes&priority=%7B%7Bif%20eq%20.status%20%22firing%22%7D%7D4%7B%7Belse%7D%7D2%7B%7Bend%7D%7D&title=%7B%7Bif%20eq%20.status%20%22firing%22%7D%7D%F0%9F%9A%A8%7B%7Belse%7D%7D%E2%9C%85%20Resolved%3A%7B%7Bend%7D%7D%20%7B%7B.commonLabels.alertname%7D%7D%7B%7Bif%20.commonLabels.namespace%7D%7D%20%C2%B7%20%7B%7B.commonLabels.namespace%7D%7D%7B%7Bend%7D%7D&message=%7B%7Brange%20.alerts%7D%7D%7B%7B.annotations.summary%7D%7D%0A%7B%7B.annotations.description%7D%7D%0A%7B%7Bend%7D%7D&click=https%3A%2F%2Forrery.netbird.nathalie-stiefsohn.eu
        - name: ntfy-alerts-monitoring-warning
          webhook_configs:
          - http_config:
              authorization:
                credentials_file: /etc/alertmanager-ntfy/token
            send_resolved: true
            url: http://ntfy.ntfy.svc.cluster.local:8080/alerts-monitoring?tpl=yes&priority=%7B%7Bif%20eq%20.status%20%22firing%22%7D%7D2%7B%7Belse%7D%7D1%7B%7Bend%7D%7D&title=%7B%7Bif%20eq%20.status%20%22firing%22%7D%7D%E2%9A%A0%EF%B8%8F%7B%7Belse%7D%7D%E2%9C%85%20Resolved%3A%7B%7Bend%7D%7D%20%7B%7B.commonLabels.alertname%7D%7D%7B%7Bif%20.commonLabels.namespace%7D%7D%20%C2%B7%20%7B%7B.commonLabels.namespace%7D%7D%7B%7Bend%7D%7D&message=%7B%7Brange%20.alerts%7D%7D%7B%7B.annotations.summary%7D%7D%0A%7B%7B.annotations.description%7D%7D%0A%7B%7Bend%7D%7D&click=https%3A%2F%2Forrery.netbird.nathalie-stiefsohn.eu
        - name: healthchecks
          webhook_configs:
          - send_resolved: false
            url_file: /etc/alertmanager-healthchecks/watchdog-ping-url
        route:
          group_by:
          - alertname
          - namespace
          group_interval: 5m
          group_wait: 30s
          receiver: blackhole
          repeat_interval: 12h
          routes:
          - group_interval: 1m
            group_wait: 0s
            matchers:
            - alertname="Watchdog"
            receiver: healthchecks
            repeat_interval: 1m
          - matchers:
            - severity=~"critical|warning"
            receiver: blackhole
            routes:
            - matchers:
              - topic="alerts-vpn"
              receiver: ntfy-alerts-vpn-warning
              routes:
              - matchers:
                - severity="critical"
                receiver: ntfy-alerts-vpn-critical
              - matchers:
                - severity="warning"
                receiver: ntfy-alerts-vpn-warning
                repeat_interval: 24h
            - matchers:
              - topic="alerts-storage"
              receiver: ntfy-alerts-storage-warning
              routes:
              - matchers:
                - severity="critical"
                receiver: ntfy-alerts-storage-critical
              - matchers:
                - severity="warning"
                receiver: ntfy-alerts-storage-warning
                repeat_interval: 24h
            - matchers:
              - topic="alerts-nodes"
              receiver: ntfy-alerts-nodes-warning
              routes:
              - matchers:
                - severity="critical"
                receiver: ntfy-alerts-nodes-critical
              - matchers:
                - severity="warning"
                receiver: ntfy-alerts-nodes-warning
                repeat_interval: 24h
            - matchers:
              - topic="alerts-platform"
              receiver: ntfy-alerts-platform-warning
              routes:
              - matchers:
                - severity="critical"
                receiver: ntfy-alerts-platform-critical
              - matchers:
                - severity="warning"
                receiver: ntfy-alerts-platform-warning
                repeat_interval: 24h
            - matchers:
              - topic="alerts-apps"
              receiver: ntfy-alerts-apps-warning
              routes:
              - matchers:
                - severity="critical"
                receiver: ntfy-alerts-apps-critical
              - matchers:
                - severity="warning"
                receiver: ntfy-alerts-apps-warning
                repeat_interval: 24h
            - matchers:
              - topic="alerts-monitoring"
              receiver: ntfy-alerts-monitoring-warning
              routes:
              - matchers:
                - severity="critical"
                receiver: ntfy-alerts-monitoring-critical
              - matchers:
                - severity="warning"
                receiver: ntfy-alerts-monitoring-warning
                repeat_interval: 24h
            - matchers:
              - topic=""
              - alertname=~"KubePersistentVolume.*"
              receiver: ntfy-alerts-storage-warning
              routes:
              - matchers:
                - severity="critical"
                receiver: ntfy-alerts-storage-critical
              - matchers:
                - severity="warning"
                receiver: ntfy-alerts-storage-warning
                repeat_interval: 24h
            - matchers:
              - topic=""
              - alertname=~"Kube(Pod|Container|Deployment|StatefulSet|DaemonSet|Job|Hpa|Pdb).*"
              receiver: ntfy-alerts-apps-warning
              routes:
              - matchers:
                - severity="critical"
                receiver: ntfy-alerts-apps-critical
              - matchers:
                - severity="warning"
                receiver: ntfy-alerts-apps-warning
                repeat_interval: 24h
            - matchers:
              - topic=""
              - alertname=~"Node.*|Kubelet.*|KubeNode.*|KubeVersionMismatch"
              receiver: ntfy-alerts-nodes-warning
              routes:
              - matchers:
                - severity="critical"
                receiver: ntfy-alerts-nodes-critical
              - matchers:
                - severity="warning"
                receiver: ntfy-alerts-nodes-warning
                repeat_interval: 24h
            - matchers:
              - topic=""
              - alertname=~"KubeAPI.*|KubeAggregatedAPI.*|KubeClient.*|KubeStateMetrics.*|Kube(CPU|Memory)(Quota)?Overcommit|KubeQuota.*"
              receiver: ntfy-alerts-platform-warning
              routes:
              - matchers:
                - severity="critical"
                receiver: ntfy-alerts-platform-critical
              - matchers:
                - severity="warning"
                receiver: ntfy-alerts-platform-warning
                repeat_interval: 24h
            - matchers: []
              receiver: ntfy-alerts-monitoring-warning
              routes:
              - matchers:
                - severity="critical"
                receiver: ntfy-alerts-monitoring-critical
              - matchers:
                - severity="warning"
                receiver: ntfy-alerts-monitoring-warning
                repeat_interval: 24h
      spec:
        volumeMounts:
        - mountPath: /etc/alertmanager-ntfy
          name: ntfy-token
          readOnly: true
        - mountPath: /etc/alertmanager-healthchecks
          name: healthchecks-ping
          readOnly: true
        volumes:
        - name: ntfy-token
          secret:
            optional: true
            secretName: victoria-metrics-ntfy-token
        - name: healthchecks-ping
          secret:
            optional: true
            secretName: victoria-metrics-healthchecks-ping
    defaultDashboards:
      enabled: false
    defaultRules:
      groups:
        etcd:
          create: false
        k8s.rules.container_cpu_limits:
          create: false
        k8s.rules.container_cpu_usage_seconds_total:
          create: false
        k8s.rules.container_memory_cache:
          create: false
        k8s.rules.container_memory_limits:
          create: false
        k8s.rules.container_memory_rss:
          create: false
        k8s.rules.container_memory_swap:
          create: false
        k8s.rules.container_memory_working_set_bytes:
          create: false
        k8s.rules.pod_owner:
          create: false
        kube-prometheus-general.rules:
          create: false
        kubeApiserverAvailability:
          create: false
        kubeApiserverBurnrate:
          create: false
        kubeApiserverHistogram:
          create: false
        kubeApiserverSlos:
          create: false
        kubeScheduler:
          create: false
        kubernetesSystemControllerManager:
          create: false
        kubernetesSystemScheduler:
          create: false
      rules:
        NodeSystemSaturation:
          spec:
            expr: (node_load1{job="node-exporter"} / count(node_cpu_seconds_total{job="node-exporter",mode="idle"}) without(cpu,mode)) > 2 and (sum(rate(node_cpu_seconds_total{job="node-exporter",mode!~"idle|iowait"}[5m])) without(cpu,mode) / count(node_cpu_seconds_total{job="node-exporter",mode="idle"}) without(cpu,mode)) > 0.8
    grafana:
      enabled: false
    kube-state-metrics:
      customResourceState:
        config:
          spec:
            resources:
            - groupVersionKind:
                group: kustomize.toolkit.fluxcd.io
                version: v1
                kind: Kustomization
              metricNamePrefix: gotk
              metrics:
              - name: resource_info
                help: The current state of a Flux Kustomization resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name:
                      - metadata
                      - name
                labelsFromPath:
                  exported_namespace:
                  - metadata
                  - namespace
                  ready:
                  - status
                  - conditions
                  - "[type=Ready]"
                  - status
                  suspended:
                  - spec
                  - suspend
                  revision:
                  - status
                  - lastAppliedRevision
                  source_name:
                  - spec
                  - sourceRef
                  - name
            - groupVersionKind:
                group: helm.toolkit.fluxcd.io
                version: v2
                kind: HelmRelease
              metricNamePrefix: gotk
              metrics:
              - name: resource_info
                help: The current state of a Flux HelmRelease resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name:
                      - metadata
                      - name
                labelsFromPath:
                  exported_namespace:
                  - metadata
                  - namespace
                  ready:
                  - status
                  - conditions
                  - "[type=Ready]"
                  - status
                  suspended:
                  - spec
                  - suspend
                  revision:
                  - status
                  - lastAppliedRevision
                  chart_name:
                  - spec
                  - chart
                  - spec
                  - chart
                  chart_version:
                  - spec
                  - chart
                  - spec
                  - version
            - groupVersionKind:
                group: source.toolkit.fluxcd.io
                version: v1
                kind: GitRepository
              metricNamePrefix: gotk
              metrics:
              - name: resource_info
                help: The current state of a Flux GitRepository resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name:
                      - metadata
                      - name
                labelsFromPath:
                  exported_namespace:
                  - metadata
                  - namespace
                  ready:
                  - status
                  - conditions
                  - "[type=Ready]"
                  - status
                  suspended:
                  - spec
                  - suspend
                  revision:
                  - status
                  - artifact
                  - revision
                  url:
                  - spec
                  - url
            - groupVersionKind:
                group: source.toolkit.fluxcd.io
                version: v1
                kind: OCIRepository
              metricNamePrefix: gotk
              metrics:
              - name: resource_info

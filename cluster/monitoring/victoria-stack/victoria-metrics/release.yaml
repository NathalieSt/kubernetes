---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics
spec:
  interval: 24h
  chartRef:
    kind: OCIRepository
    name: victoria-metrics-repo
  timeout: 10m
  releaseName: victoria-metrics
  install:
    remediation:
      retries: 3
  values:
    defaultDashboards:
      enabled: false
    grafana:
      enabled: false
    kubelet:
      enabled: true
      vmScrapes:
        cadvisor:
          enabled: true
          spec:
            bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
            honorLabels: true
            metricRelabelConfigs:
            - action: keep
              regex: container_cpu_usage_seconds_total|container_cpu_cfs_periods_total|container_cpu_cfs_throttled_periods_total|container_cpu_cfs_throttled_seconds_total|container_memory_rss|container_memory_working_set_bytes|container_memory_cache|container_memory_swap|container_memory_usage_bytes|container_oom_events_total|container_fs_reads_bytes_total|container_fs_writes_bytes_total|container_network_receive_bytes_total|container_network_transmit_bytes_total|container_spec_cpu_quota|container_spec_cpu_period|container_spec_memory_limit_bytes|machine_cpu_cores|machine_memory_bytes|cadvisor_version_info
              sourceLabels:
              - __name__
            - action: labeldrop
              regex: ^(feature_node_kubernetes_io|beta_kubernetes_io|gpu_intel_com|intel_feature_node_kubernetes_io|node_kubernetes_io_instance_type).*
            path: /metrics/cadvisor
            scheme: https
            tlsConfig:
              insecureSkipVerify: true
        kubelet:
          enabled: true
          spec:
            bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
            honorLabels: true
            metricRelabelConfigs:
            - action: labeldrop
              regex: ^(feature_node_kubernetes_io|beta_kubernetes_io|gpu_intel_com|intel_feature_node_kubernetes_io|node_kubernetes_io_instance_type).*
            scheme: https
            tlsConfig:
              insecureSkipVerify: true
        probes:
          enabled: true
          spec:
            bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
            honorLabels: true
            metricRelabelConfigs:
            - action: labeldrop
              regex: ^(feature_node_kubernetes_io|beta_kubernetes_io|gpu_intel_com|intel_feature_node_kubernetes_io|node_kubernetes_io_instance_type).*
            path: /metrics/probes
            scheme: https
            tlsConfig:
              insecureSkipVerify: true
        resource:
          enabled: true
          spec:
            bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
            honorLabels: true
            metricRelabelConfigs:
            - action: labeldrop
              regex: ^(feature_node_kubernetes_io|beta_kubernetes_io|gpu_intel_com|intel_feature_node_kubernetes_io|node_kubernetes_io_instance_type).*
            path: /metrics/resource
            scheme: https
            tlsConfig:
              insecureSkipVerify: true
    nameOverride: vmks
    prometheus-node-exporter:
      extraArgs:
      - --collector.mountstats
      vmScrape:
        spec:
          endpoints:
          - metricRelabelConfigs:
            - action: drop
              regex: /var/lib/kubelet/pods.+
              source_labels:
              - mountpoint
            - action: labeldrop
              regex: ^(feature_node_kubernetes_io|beta_kubernetes_io|gpu_intel_com|intel_feature_node_kubernetes_io|node_kubernetes_io_instance_type).*
            port: metrics
            relabelConfigs:
            - sourceLabels:
              - __meta_kubernetes_endpoint_node_name
              targetLabel: node
    victoria-metrics-operator:
      operator:
        disable_prometheus_converter: true
    vmagent:
      spec:
        inlineScrapeConfig: |
          
          - job_name: cilium-agent
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names: [kube-system]
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_k8s_app]
                regex: cilium
                action: keep
              - source_labels: [__meta_kubernetes_pod_container_port_number]
                regex: "9962"
                action: keep
              - source_labels: [__meta_kubernetes_pod_node_name]
                target_label: node
              - source_labels: [__meta_kubernetes_pod_name]
                target_label: pod
              - source_labels: [__meta_kubernetes_namespace]
                target_label: namespace
              - target_label: job
                replacement: cilium-agent

          # Hubble's metrics server, on the cilium agent pods but a different port from
          # the agent's own metrics above. This is the job that makes a *flow* graph
          # possible: cilium_* is aggregate per node and says how much was forwarded and
          # dropped, while hubble_flows_processed_total carries source and destination
          # labels and so says who talked to whom.
          #
          # Enabled by hubble.metrics on the cilium release, which also declares
          # containerPort 9965 on the DaemonSet - and that declaration is what makes the
          # target discoverable at all, since this job keeps only pods whose spec names
          # the port.
          #
          # Cardinality is bounded by the source/destination contexts being
          # workload-name rather than pod: a pod context would mint a new series on every
          # restart, and the topology is drawn per workload anyway.
          - job_name: hubble
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names: [kube-system]
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_k8s_app]
                regex: cilium
                action: keep
              - source_labels: [__meta_kubernetes_pod_container_port_number]
                regex: "9965"
                action: keep
              - source_labels: [__meta_kubernetes_pod_node_name]
                target_label: node
              - source_labels: [__meta_kubernetes_pod_name]
                target_label: pod
              - source_labels: [__meta_kubernetes_namespace]
                target_label: namespace
              - target_label: job
                replacement: hubble

          - job_name: cilium-operator
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names: [kube-system]
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_name]
                regex: cilium-operator
                action: keep
              - source_labels: [__meta_kubernetes_pod_container_port_number]
                regex: "9963"
                action: keep
              - source_labels: [__meta_kubernetes_pod_node_name]
                target_label: node
              - source_labels: [__meta_kubernetes_pod_name]
                target_label: pod
              - source_labels: [__meta_kubernetes_namespace]
                target_label: namespace
              - target_label: job
                replacement: cilium-operator

          # All six Flux controllers in one job. They are bootstrapped by flux itself
          # rather than generated here, so there is no GeneratorMeta to declare Metrics
          # on - but they share app.kubernetes.io/part-of and all serve Prometheus on
          # 8080, so one job with the controller name lifted off the "app" label covers
          # every one, including any controller added by a later flux bump.
          - job_name: flux
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names: [flux-system]
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_part_of]
                regex: flux
                action: keep
              - source_labels: [__meta_kubernetes_pod_container_port_number]
                regex: "8080"
                action: keep
              - source_labels: [__meta_kubernetes_pod_node_name]
                target_label: node
              - source_labels: [__meta_kubernetes_pod_name]
                target_label: pod
              - source_labels: [__meta_kubernetes_namespace]
                target_label: namespace
              # Keeps the six controllers apart on a dashboard - without it every series
              # says job="flux" and the reconciliation failures cannot be attributed.
              - source_labels: [__meta_kubernetes_pod_label_app]
                target_label: controller
              - target_label: job
                replacement: flux

          - job_name: cert-manager
            metrics_path: /metrics
            scheme: http
            kubernetes_sd_configs:
            - role: pod
              namespaces:
                names:
                - cert-manager
            relabel_configs:
            - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
              regex: cert-manager
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_container_port_number
              regex: "9402"
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_node_name
              target_label: node
            - source_labels:
              - __meta_kubernetes_pod_name
              target_label: pod
            - source_labels:
              - __meta_kubernetes_namespace
              target_label: namespace
            - target_label: job
              replacement: cert-manager
          - job_name: cnpg
            metrics_path: /metrics
            scheme: http
            kubernetes_sd_configs:
            - role: pod
              namespaces:
                names:
                - cnpg-system
            relabel_configs:
            - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
              regex: cloudnative-pg
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_container_port_number
              regex: "8080"
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_node_name
              target_label: node
            - source_labels:
              - __meta_kubernetes_pod_name
              target_label: pod
            - source_labels:
              - __meta_kubernetes_namespace
              target_label: namespace
            - target_label: job
              replacement: cnpg
          - job_name: daybook
            metrics_path: /metrics
            scheme: http
            kubernetes_sd_configs:
            - role: pod
              namespaces:
                names:
                - daybook
            relabel_configs:
            - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
              regex: daybook
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_container_port_number
              regex: "8080"
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_node_name
              target_label: node
            - source_labels:
              - __meta_kubernetes_pod_name
              target_label: pod
            - source_labels:
              - __meta_kubernetes_namespace
              target_label: namespace
            - target_label: job
              replacement: daybook
          - job_name: forgejo
            metrics_path: /metrics
            scheme: http
            kubernetes_sd_configs:
            - role: pod
              namespaces:
                names:
                - forgejo
            relabel_configs:
            - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
              regex: forgejo
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_container_port_number
              regex: "3000"
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_node_name
              target_label: node
            - source_labels:
              - __meta_kubernetes_pod_name
              target_label: pod
            - source_labels:
              - __meta_kubernetes_namespace
              target_label: namespace
            - target_label: job
              replacement: forgejo
          - job_name: garage
            metrics_path: /metrics
            scheme: http
            bearer_token_file: /etc/vm/secrets/garage-metrics-token-secret/metrics_token
            kubernetes_sd_configs:
            - role: pod
              namespaces:
                names:
                - garage
            relabel_configs:
            - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
              regex: garage
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_container_port_number
              regex: "3903"
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_node_name
              target_label: node
            - source_labels:
              - __meta_kubernetes_pod_name
              target_label: pod
            - source_labels:
              - __meta_kubernetes_namespace
              target_label: namespace
            - target_label: job
              replacement: garage
          - job_name: internal-gateway
            metrics_path: /metrics
            scheme: http
            kubernetes_sd_configs:
            - role: pod
              namespaces:
                names:
                - internal-gateway
            relabel_configs:
            - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
              regex: internal-gateway
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_container_port_number
              regex: "8082"
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_node_name
              target_label: node
            - source_labels:
              - __meta_kubernetes_pod_name
              target_label: pod
            - source_labels:
              - __meta_kubernetes_namespace
              target_label: namespace
            - target_label: job
              replacement: internal-gateway
          - job_name: jellyfin
            metrics_path: /metrics
            scheme: http
            kubernetes_sd_configs:
            - role: pod
              namespaces:
                names:
                - jellyfin
            relabel_configs:
            - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
              regex: jellyfin
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_container_port_number
              regex: "8096"
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_node_name
              target_label: node
            - source_labels:
              - __meta_kubernetes_pod_name
              target_label: pod
            - source_labels:
              - __meta_kubernetes_namespace
              target_label: namespace
            - target_label: job
              replacement: jellyfin
          - job_name: k8up
            metrics_path: /metrics
            scheme: http
            kubernetes_sd_configs:
            - role: pod
              namespaces:
                names:
                - k8up
            relabel_configs:
            - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
              regex: k8up
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_container_port_number
              regex: "8080"
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_node_name
              target_label: node
            - source_labels:
              - __meta_kubernetes_pod_name
              target_label: pod
            - source_labels:
              - __meta_kubernetes_namespace
              target_label: namespace
            - target_label: job
              replacement: k8up
          - job_name: keda
            metrics_path: /metrics
            scheme: http
            kubernetes_sd_configs:
            - role: pod
              namespaces:
                names:
                - keda
            relabel_configs:
            - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
              regex: keda-operator
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_container_port_number
              regex: "8080"
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_node_name
              target_label: node
            - source_labels:
              - __meta_kubernetes_pod_name
              target_label: pod
            - source_labels:
              - __meta_kubernetes_namespace
              target_label: namespace
            - target_label: job
              replacement: keda
          - job_name: mariadb
            metrics_path: /metrics
            scheme: http
            kubernetes_sd_configs:
            - role: pod
              namespaces:
                names:
                - mariadb
            relabel_configs:
            - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
              regex: mariadb
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_container_port_number
              regex: "9104"
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_node_name
              target_label: node
            - source_labels:
              - __meta_kubernetes_pod_name
              target_label: pod
            - source_labels:
              - __meta_kubernetes_namespace
              target_label: namespace
            - target_label: job
              replacement: mariadb
          - job_name: netbird-operator
            metrics_path: /metrics
            scheme: http
            kubernetes_sd_configs:
            - role: pod
              namespaces:
                names:
                - netbird
            relabel_configs:
            - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
              regex: netbird-operator
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_container_port_number
              regex: "8080"
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_node_name
              target_label: node
            - source_labels:
              - __meta_kubernetes_pod_name
              target_label: pod
            - source_labels:
              - __meta_kubernetes_namespace
              target_label: namespace
            - target_label: job
              replacement: netbird-operator
          - job_name: redis
            metrics_path: /metrics
            scheme: http
            kubernetes_sd_configs:
            - role: pod
              namespaces:
                names:
                - redis
            relabel_configs:
            - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
              regex: redis
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_container_port_number
              regex: "9121"
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_node_name
              target_label: node
            - source_labels:
              - __meta_kubernetes_pod_name
              target_label: pod
            - source_labels:
              - __meta_kubernetes_namespace
              target_label: namespace
            - target_label: job
              replacement: redis
          - job_name: security-dashboard
            metrics_path: /metrics
            scheme: http
            kubernetes_sd_configs:
            - role: pod
              namespaces:
                names:
                - security-dashboard
            relabel_configs:
            - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
              regex: security-dashboard
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_container_port_number
              regex: "8080"
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_node_name
              target_label: node
            - source_labels:
              - __meta_kubernetes_pod_name
              target_label: pod
            - source_labels:
              - __meta_kubernetes_namespace
              target_label: namespace
            - target_label: job
              replacement: security-dashboard
          - job_name: transmission
            metrics_path: /metrics
            scheme: http
            kubernetes_sd_configs:
            - role: pod
              namespaces:
                names:
                - jellyfin
            relabel_configs:
            - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
              regex: transmission
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_container_port_number
              regex: "19091"
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_node_name
              target_label: node
            - source_labels:
              - __meta_kubernetes_pod_name
              target_label: pod
            - source_labels:
              - __meta_kubernetes_namespace
              target_label: namespace
            - target_label: job
              replacement: transmission
          - job_name: valkey
            metrics_path: /metrics
            scheme: http
            kubernetes_sd_configs:
            - role: pod
              namespaces:
                names:
                - valkey
            relabel_configs:
            - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
              regex: valkey
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_container_port_number
              regex: "9121"
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_node_name
              target_label: node
            - source_labels:
              - __meta_kubernetes_pod_name
              target_label: pod
            - source_labels:
              - __meta_kubernetes_namespace
              target_label: namespace
            - target_label: job
              replacement: valkey
          - job_name: vault
            metrics_path: /v1/sys/metrics
            params:
              format:
              - prometheus
            scheme: http
            kubernetes_sd_configs:
            - role: pod
              namespaces:
                names:
                - vault
            relabel_configs:
            - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
              regex: vault
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_container_port_number
              regex: "8200"
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_node_name
              target_label: node
            - source_labels:
              - __meta_kubernetes_pod_name
              target_label: pod
            - source_labels:
              - __meta_kubernetes_namespace
              target_label: namespace
            - target_label: job
              replacement: vault
          - job_name: vector
            metrics_path: /metrics
            scheme: http
            kubernetes_sd_configs:
            - role: pod
              namespaces:
                names:
                - vector
            relabel_configs:
            - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
              regex: vector
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_container_port_number
              regex: "9090"
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_node_name
              target_label: node
            - source_labels:
              - __meta_kubernetes_pod_name
              target_label: pod
            - source_labels:
              - __meta_kubernetes_namespace
              target_label: namespace
            - target_label: job
              replacement: vector
        secrets:
        - garage-metrics-token-secret
    vmsingle:
      spec:
        extraArgs:
          maxLabelsPerTimeseries: "120"
          search.maxConcurrentRequests: "8"
          search.maxQueryDuration: 60s
          search.maxQueueDuration: 30s
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: 300m
            memory: 768Mi
        storage:
          storageClassName: nfs-remote

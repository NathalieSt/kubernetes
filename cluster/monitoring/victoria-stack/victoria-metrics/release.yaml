---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics
spec:
  interval: 24h
  chartRef:
    kind: OCIRepository
    name: victoria-metrics-repo
  timeout: 10m
  releaseName: victoria-metrics
  install:
    remediation:
      retries: 3
  values:
    defaultDashboards:
      enabled: false
    grafana:
      enabled: false
    kube-state-metrics:
      customResourceState:
        config:
          spec:
            resources:
            - groupVersionKind:
                group: kustomize.toolkit.fluxcd.io
                version: v1
                kind: Kustomization
              metricNamePrefix: gotk
              metrics:
              - name: resource_info
                help: The current state of a Flux Kustomization resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name:
                      - metadata
                      - name
                labelsFromPath:
                  exported_namespace:
                  - metadata
                  - namespace
                  ready:
                  - status
                  - conditions
                  - "[type=Ready]"
                  - status
                  suspended:
                  - spec
                  - suspend
                  revision:
                  - status
                  - lastAppliedRevision
                  source_name:
                  - spec
                  - sourceRef
                  - name
            - groupVersionKind:
                group: helm.toolkit.fluxcd.io
                version: v2
                kind: HelmRelease
              metricNamePrefix: gotk
              metrics:
              - name: resource_info
                help: The current state of a Flux HelmRelease resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name:
                      - metadata
                      - name
                labelsFromPath:
                  exported_namespace:
                  - metadata
                  - namespace
                  ready:
                  - status
                  - conditions
                  - "[type=Ready]"
                  - status
                  suspended:
                  - spec
                  - suspend
                  revision:
                  - status
                  - lastAppliedRevision
                  chart_name:
                  - spec
                  - chart
                  - spec
                  - chart
                  chart_version:
                  - spec
                  - chart
                  - spec
                  - version
            - groupVersionKind:
                group: source.toolkit.fluxcd.io
                version: v1
                kind: GitRepository
              metricNamePrefix: gotk
              metrics:
              - name: resource_info
                help: The current state of a Flux GitRepository resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name:
                      - metadata
                      - name
                labelsFromPath:
                  exported_namespace:
                  - metadata
                  - namespace
                  ready:
                  - status
                  - conditions
                  - "[type=Ready]"
                  - status
                  suspended:
                  - spec
                  - suspend
                  revision:
                  - status
                  - artifact
                  - revision
                  url:
                  - spec
                  - url
            - groupVersionKind:
                group: source.toolkit.fluxcd.io
                version: v1
                kind: OCIRepository
              metricNamePrefix: gotk
              metrics:
              - name: resource_info
                help: The current state of a Flux OCIRepository resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name:
                      - metadata
                      - name
                labelsFromPath:
                  exported_namespace:
                  - metadata
                  - namespace
                  ready:
                  - status
                  - conditions
                  - "[type=Ready]"
                  - status
                  suspended:
                  - spec
                  - suspend
                  revision:
                  - status
                  - artifact
                  - revision
                  url:
                  - spec
                  - url
            - groupVersionKind:
                group: source.toolkit.fluxcd.io
                version: v1
                kind: HelmRepository
              metricNamePrefix: gotk
              metrics:
              - name: resource_info
                help: The current state of a Flux HelmRepository resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name:
                      - metadata
                      - name
                labelsFromPath:
                  exported_namespace:
                  - metadata
                  - namespace
                  ready:
                  - status
                  - conditions
                  - "[type=Ready]"
                  - status
                  suspended:
                  - spec
                  - suspend
                  url:
                  - spec
                  - url
            - groupVersionKind:
                group: source.toolkit.fluxcd.io
                version: v1
                kind: HelmChart
              metricNamePrefix: gotk
              metrics:
              - name: resource_info
                help: The current state of a Flux HelmChart resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name:
                      - metadata
                      - name
                labelsFromPath:
                  exported_namespace:
                  - metadata
                  - namespace
                  ready:
                  - status
                  - conditions
                  - "[type=Ready]"
                  - status
                  suspended:
                  - spec
                  - suspend
                  revision:
                  - status
                  - artifact
                  - revision
                  chart_name:
                  - spec
                  - chart
                  chart_version:
                  - spec
                  - version
        enabled: true
      rbac:
        extraRules:
        - apiGroups:
          - kustomize.toolkit.fluxcd.io
          - helm.toolkit.fluxcd.io
          - source.toolkit.fluxcd.io
          resources:
          - "*"
          verbs:
          - list
          - watch
    kubeApiServer:
      enabled: true
      vmScrape:
        spec:
          endpoints:
          - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
            metricRelabelConfigs:
            - action: drop
              regex: apiserver_request_duration_seconds_bucket|etcd_request_duration_seconds_bucket|apiserver_request_body_size_bytes_bucket|apiserver_response_sizes_bucket|apiserver_watch_cache_read_wait_seconds_bucket|apiserver_watch_events_sizes_bucket|workqueue_queue_duration_seconds_bucket|workqueue_work_duration_seconds_bucket
              sourceLabels:
              - __name__
            - action: labeldrop
              regex: ^(feature_node_kubernetes_io|beta_kubernetes_io|gpu_intel_com|intel_feature_node_kubernetes_io|node_kubernetes_io_instance_type).*
            port: https
            scheme: https
            tlsConfig:
              caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              serverName: kubernetes
    kubelet:
      enabled: true
      vmScrapes:
        cadvisor:
          enabled: true
          spec:
            bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
            honorLabels: true
            metricRelabelConfigs:
            - action: keep
              regex: container_cpu_usage_seconds_total|container_cpu_cfs_periods_total|container_cpu_cfs_throttled_periods_total|container_cpu_cfs_throttled_seconds_total|container_memory_rss|container_memory_working_set_bytes|container_memory_cache|container_memory_swap|container_memory_usage_bytes|container_oom_events_total|container_fs_reads_bytes_total|container_fs_writes_bytes_total|container_network_receive_bytes_total|container_network_transmit_bytes_total|container_spec_cpu_quota|container_spec_cpu_period|container_spec_memory_limit_bytes|machine_cpu_cores|machine_memory_bytes|cadvisor_version_info
              sourceLabels:
              - __name__
            - action: labeldrop
              regex: ^(feature_node_kubernetes_io|beta_kubernetes_io|gpu_intel_com|intel_feature_node_kubernetes_io|node_kubernetes_io_instance_type).*
            path: /metrics/cadvisor
            scheme: https
            tlsConfig:
              insecureSkipVerify: true
        kubelet:
          enabled: true
          spec:
            bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
            honorLabels: true
            metricRelabelConfigs:
            - action: labeldrop
              regex: ^(feature_node_kubernetes_io|beta_kubernetes_io|gpu_intel_com|intel_feature_node_kubernetes_io|node_kubernetes_io_instance_type).*
            scheme: https
            tlsConfig:
              insecureSkipVerify: true
        probes:
          enabled: true
          spec:
            bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
            honorLabels: true
            metricRelabelConfigs:
            - action: labeldrop
              regex: ^(feature_node_kubernetes_io|beta_kubernetes_io|gpu_intel_com|intel_feature_node_kubernetes_io|node_kubernetes_io_instance_type).*
            path: /metrics/probes
            scheme: https
            tlsConfig:
              insecureSkipVerify: true
        resources:
          enabled: true
          spec:
            bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
            honorLabels: true
            metricRelabelConfigs:
            - action: labeldrop
              regex: ^(feature_node_kubernetes_io|beta_kubernetes_io|gpu_intel_com|intel_feature_node_kubernetes_io|node_kubernetes_io_instance_type).*
            path: /metrics/resource
            scheme: https
            tlsConfig:
              insecureSkipVerify: true
    nameOverride: vmks
    prometheus-node-exporter:
      extraArgs:
      - --collector.mountstats
      vmScrape:
        spec:
          endpoints:
          - metricRelabelConfigs:
            - action: drop
              regex: /var/lib/kubelet/pods.+
              source_labels:
              - mountpoint
            - action: labeldrop
              regex: ^(feature_node_kubernetes_io|beta_kubernetes_io|gpu_intel_com|intel_feature_node_kubernetes_io|node_kubernetes_io_instance_type).*
            port: metrics
            relabelConfigs:
            - sourceLabels:
              - __meta_kubernetes_endpoint_node_name
              targetLabel: node
    victoria-metrics-operator:
      operator:
        disable_prometheus_converter: true
    vmagent:
      spec:
        inlineScrapeConfig: |
          
          - job_name: cilium-agent
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names: [kube-system]
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_k8s_app]
                regex: cilium
                action: keep
              - source_labels: [__meta_kubernetes_pod_container_port_number]
                regex: "9962"
                action: keep
              - source_labels: [__meta_kubernetes_pod_node_name]
                target_label: node
              - source_labels: [__meta_kubernetes_pod_name]
                target_label: pod
              - source_labels: [__meta_kubernetes_namespace]
                target_label: namespace
              - target_label: job
                replacement: cilium-agent

          # Hubble's metrics server, on the cilium agent pods but a different port from
          # the agent's own metrics above. This is the job that makes a *flow* graph
          # possible: cilium_* is aggregate per node and says how much was forwarded and
          # dropped, while hubble_flows_processed_total carries source and destination
          # labels and so says who talked to whom.
          #
          # Enabled by hubble.metrics on the cilium release, which also declares
          # containerPort 9965 on the DaemonSet - and that declaration is what makes the
          # target discoverable at all, since this job keeps only pods whose spec names
          # the port.
          #
          # Cardinality is bounded by the source/destination contexts being
          # workload-name rather than pod: a pod context would mint a new series on every
          # restart, and the topology is drawn per workload anyway.
          - job_name: hubble
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names: [kube-system]
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_k8s_app]
                regex: cilium
                action: keep
              - source_labels: [__meta_kubernetes_pod_container_port_number]
                regex: "9965"
                action: keep
              - source_labels: [__meta_kubernetes_pod_node_name]
                target_label: node
              - source_labels: [__meta_kubernetes_pod_name]
                target_label: pod
              - source_labels: [__meta_kubernetes_namespace]
                target_label: namespace
              - target_label: job
                replacement: hubble

          - job_name: cilium-operator
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names: [kube-system]
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_name]
                regex: cilium-operator
                action: keep
              - source_labels: [__meta_kubernetes_pod_container_port_number]
                regex: "9963"
                action: keep
              - source_labels: [__meta_kubernetes_pod_node_name]
                target_label: node
              - source_labels: [__meta_kubernetes_pod_name]
                target_label: pod
              - source_labels: [__meta_kubernetes_namespace]
                target_label: namespace
              - target_label: job
                replacement: cilium-operator

          # All six Flux controllers in one job. They are bootstrapped by flux itself
          # rather than generated here, so there is no GeneratorMeta to declare Metrics
          # on - but they share app.kubernetes.io/part-of and all serve Prometheus on
          # 8080, so one job with the controller name lifted off the "app" label covers
          # every one, including any controller added by a later flux bump.
          - job_name: flux
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names: [flux-system]
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_part_of]
                regex: flux
                action: keep
              - source_labels: [__meta_kubernetes_pod_container_port_number]
                regex: "8080"
                action: keep
              - source_labels: [__meta_kubernetes_pod_node_name]
                target_label: node
              - source_labels: [__meta_kubernetes_pod_name]
                target_label: pod
              - source_labels: [__meta_kubernetes_namespace]
                target_label: namespace
              # Keeps the six controllers apart on a dashboard - without it every series
              # says job="flux" and the reconciliation failures cannot be attributed.
              - source_labels: [__meta_kubernetes_pod_label_app]
                target_label: controller
              - target_label: job
                replacement: flux

          - job_name: cert-manager
            metrics_path: /metrics
            scheme: http
            kubernetes_sd_configs:
            - role: pod
              namespaces:
                names:
                - cert-manager
            relabel_configs:
            - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
              regex: cert-manager
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_container_port_number
              regex: "9402"
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_node_name
              target_label: node
            - source_labels:
              - __meta_kubernetes_pod_name
              target_label: pod
            - source_labels:
              - __meta_kubernetes_namespace
              target_label: namespace
            - target_label: job
              replacement: cert-manager
          - job_name: cnpg
            metrics_path: /metrics
            scheme: http
            kubernetes_sd_configs:
            - role: pod
              namespaces:
                names:
                - cnpg-system
            relabel_configs:
            - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
              regex: cloudnative-pg
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_container_port_number
              regex: "8080"
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_node_name
              target_label: node
            - source_labels:
              - __meta_kubernetes_pod_name
              target_label: pod
            - source_labels:
              - __meta_kubernetes_namespace
              target_label: namespace
            - target_label: job
              replacement: cnpg
          - job_name: daybook
            metrics_path: /metrics
            scheme: http
            kubernetes_sd_configs:
            - role: pod
              namespaces:
                names:
                - daybook
            relabel_configs:
            - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
              regex: daybook
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_container_port_number
              regex: "8080"
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_node_name
              target_label: node
            - source_labels:
              - __meta_kubernetes_pod_name
              target_label: pod
            - source_labels:
              - __meta_kubernetes_namespace
              target_label: namespace
            - target_label: job
              replacement: daybook
          - job_name: forgejo
            metrics_path: /metrics
            scheme: http
            kubernetes_sd_configs:
            - role: pod
              namespaces:
                names:
                - forgejo
            relabel_configs:
            - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
              regex: forgejo
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_container_port_number
              regex: "3000"
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_node_name
              target_label: node
            - source_labels:
              - __meta_kubernetes_pod_name
              target_label: pod
            - source_labels:
              - __meta_kubernetes_namespace
              target_label: namespace
            - target_label: job
              replacement: forgejo
          - job_name: garage
            metrics_path: /metrics
            scheme: http
            bearer_token_file: /etc/vm/secrets/garage-metrics-token-secret/metrics_token
            kubernetes_sd_configs:
            - role: pod
              namespaces:
                names:
                - garage
            relabel_configs:
            - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
              regex: garage
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_container_port_number
              regex: "3903"
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_node_name
              target_label: node
            - source_labels:
              - __meta_kubernetes_pod_name
              target_label: pod
            - source_labels:
              - __meta_kubernetes_namespace
              target_label: namespace
            - target_label: job
              replacement: garage
          - job_name: internal-gateway
            metrics_path: /metrics
            scheme: http
            kubernetes_sd_configs:
            - role: pod
              namespaces:
                names:
                - internal-gateway
            relabel_configs:
            - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
              regex: internal-gateway
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_container_port_number
              regex: "8082"
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_node_name
              target_label: node
            - source_labels:
              - __meta_kubernetes_pod_name
              target_label: pod
            - source_labels:
              - __meta_kubernetes_namespace
              target_label: namespace
            - target_label: job
              replacement: internal-gateway
          - job_name: jellyfin
            metrics_path: /metrics
            scheme: http
            kubernetes_sd_configs:
            - role: pod
              namespaces:
                names:
                - jellyfin
            relabel_configs:
            - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
              regex: jellyfin
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_container_port_number
              regex: "8096"
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_node_name
              target_label: node
            - source_labels:
              - __meta_kubernetes_pod_name
              target_label: pod
            - source_labels:
              - __meta_kubernetes_namespace
              target_label: namespace
            - target_label: job
              replacement: jellyfin
          - job_name: k8up
            metrics_path: /metrics
            scheme: http
            kubernetes_sd_configs:
            - role: pod
              namespaces:
                names:
                - k8up
            relabel_configs:
            - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
              regex: k8up
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_container_port_number
              regex: "8080"
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_node_name
              target_label: node
            - source_labels:
              - __meta_kubernetes_pod_name
              target_label: pod
            - source_labels:
              - __meta_kubernetes_namespace
              target_label: namespace
            - target_label: job
              replacement: k8up
          - job_name: keda
            metrics_path: /metrics
            scheme: http
            kubernetes_sd_configs:
            - role: pod
              namespaces:
                names:
                - keda
            relabel_configs:
            - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
              regex: keda-operator
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_container_port_number
              regex: "8080"
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_node_name
              target_label: node
            - source_labels:
              - __meta_kubernetes_pod_name
              target_label: pod
            - source_labels:
              - __meta_kubernetes_namespace
              target_label: namespace
            - target_label: job
              replacement: keda
          - job_name: limes
            metrics_path: /metrics
            scheme: http
            kubernetes_sd_configs:
            - role: pod
              namespaces:
                names:
                - limes
            relabel_configs:
            - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
              regex: limes
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_container_port_number
              regex: "8080"
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_node_name
              target_label: node
            - source_labels:
              - __meta_kubernetes_pod_name
              target_label: pod
            - source_labels:
              - __meta_kubernetes_namespace
              target_label: namespace
            - target_label: job
              replacement: limes
          - job_name: mariadb
            metrics_path: /metrics
            scheme: http
            kubernetes_sd_configs:
            - role: pod
              namespaces:
                names:
                - mariadb
            relabel_configs:
            - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
              regex: mariadb
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_container_port_number
              regex: "9104"
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_node_name
              target_label: node
            - source_labels:
              - __meta_kubernetes_pod_name
              target_label: pod
            - source_labels:
              - __meta_kubernetes_namespace
              target_label: namespace
            - target_label: job
              replacement: mariadb
          - job_name: netbird-operator
            metrics_path: /metrics
            scheme: http
            kubernetes_sd_configs:
            - role: pod
              namespaces:
                names:
                - netbird
            relabel_configs:
            - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
              regex: netbird-operator
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_container_port_number
              regex: "8080"
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_node_name
              target_label: node
            - source_labels:
              - __meta_kubernetes_pod_name
              target_label: pod
            - source_labels:
              - __meta_kubernetes_namespace
              target_label: namespace
            - target_label: job
              replacement: netbird-operator
          - job_name: redis
            metrics_path: /metrics
            scheme: http
            kubernetes_sd_configs:
            - role: pod
              namespaces:
                names:
                - redis
            relabel_configs:
            - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
              regex: redis
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_container_port_number
              regex: "9121"
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_node_name
              target_label: node
            - source_labels:
              - __meta_kubernetes_pod_name
              target_label: pod
            - source_labels:
              - __meta_kubernetes_namespace
              target_label: namespace
            - target_label: job
              replacement: redis
          - job_name: transmission
            metrics_path: /metrics
            scheme: http
            kubernetes_sd_configs:
            - role: pod
              namespaces:
                names:
                - jellyfin
            relabel_configs:
            - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
              regex: transmission
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_container_port_number
              regex: "19091"
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_node_name
              target_label: node
            - source_labels:
              - __meta_kubernetes_pod_name
              target_label: pod
            - source_labels:
              - __meta_kubernetes_namespace
              target_label: namespace
            - target_label: job
              replacement: transmission
          - job_name: valkey
            metrics_path: /metrics
            scheme: http
            kubernetes_sd_configs:
            - role: pod
              namespaces:
                names:
                - valkey
            relabel_configs:
            - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
              regex: valkey
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_container_port_number
              regex: "9121"
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_node_name
              target_label: node
            - source_labels:
              - __meta_kubernetes_pod_name
              target_label: pod
            - source_labels:
              - __meta_kubernetes_namespace
              target_label: namespace
            - target_label: job
              replacement: valkey
          - job_name: vault
            metrics_path: /v1/sys/metrics
            params:
              format:
              - prometheus
            scheme: http
            kubernetes_sd_configs:
            - role: pod
              namespaces:
                names:
                - vault
            relabel_configs:
            - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
              regex: vault
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_container_port_number
              regex: "8200"
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_node_name
              target_label: node
            - source_labels:
              - __meta_kubernetes_pod_name
              target_label: pod
            - source_labels:
              - __meta_kubernetes_namespace
              target_label: namespace
            - target_label: job
              replacement: vault
          - job_name: vector
            metrics_path: /metrics
            scheme: http
            kubernetes_sd_configs:
            - role: pod
              namespaces:
                names:
                - vector
            relabel_configs:
            - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
              regex: vector
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_container_port_number
              regex: "9090"
              action: keep
            - source_labels:
              - __meta_kubernetes_pod_node_name
              target_label: node
            - source_labels:
              - __meta_kubernetes_pod_name
              target_label: pod
            - source_labels:
              - __meta_kubernetes_namespace
              target_label: namespace
            - target_label: job
              replacement: vector
        secrets:
        - garage-metrics-token-secret
    vmsingle:
      spec:
        extraArgs:
          deleteAuthKey: file:///etc/vm-authkeys/adminAuthKey
          forceFlushAuthKey: file:///etc/vm-authkeys/adminAuthKey
          forceMergeAuthKey: file:///etc/vm-authkeys/adminAuthKey
          maxLabelsPerTimeseries: "120"
          metricNamesStatsResetAuthKey: file:///etc/vm-authkeys/adminAuthKey
          search.maxConcurrentRequests: "8"
          search.maxQueryDuration: 60s
          search.maxQueueDuration: 30s
          search.resetCacheAuthKey: file:///etc/vm-authkeys/adminAuthKey
          snapshotAuthKey: file:///etc/vm-authkeys/adminAuthKey
        initContainers:
        - command:
          - sh
          - -c
          - |
            #!/bin/sh
            # Guarantees that the file VictoriaMetrics' authKey flags read from exists and
            # holds something unguessable, whatever state Vault is in.
            #
            # This runs as an init container in front of vmsingle. The flags are set with
            # `-deleteAuthKey=file://...`, and VictoriaMetrics refuses to start if that path
            # is missing — so whatever produces the file has to be something that cannot
            # fail, and a VaultStaticSecret is not that. Vault's KV path is created by
            # OpenTofu that is applied by a *suspended* CronJob, on purpose, so on the
            # reconcile that first ships this change the Secret does not exist yet. Gating
            # the metrics store on it would take monitoring down until somebody ran a job by
            # hand, which is exactly the class of failure the admin endpoints are being
            # closed against in the first place.
            #
            # So: Vault's value when there is a real one, a fresh random one otherwise.
            # Either way the endpoints are closed. The difference is only whether an
            # operator can look the key up when they genuinely need to delete a series.
            #
            # The placeholder counts as "no value". vault-config seeds a new KV path with
            # "REPLACE ME — vault kv patch ...", which is a real string that would be
            # accepted as a key — and it is published in the manifests repository, so using
            # it would leave the endpoints open to anyone who has read that repo while
            # looking closed. SecretGuard makes the same check and refuses to start; here
            # refusing to start is the wrong answer, so it falls back instead.

            set -eu

            source_file="$AUTHKEY_SOURCE_DIR/$AUTHKEY_NAME"
            target_file="$AUTHKEY_TARGET_DIR/$AUTHKEY_NAME"

            use_random() {
            	# 32 bytes as hex. busybox has no openssl; od and tr are enough, and the
            	# result is the same 64 hex characters `openssl rand -hex 32` would give.
            	od -An -tx1 -N32 /dev/urandom | tr -d ' \n' >"$target_file"
            	echo "authkey: $1 — generated a random key for this pod." >&2
            	echo "authkey: the admin endpoints are closed, but nothing can open them." >&2
            	echo "authkey: to make the key knowable, put one in Vault:" >&2
            	echo "authkey:   vault kv patch kvv2/${VAULT_PATH} ${AUTHKEY_NAME}=\$(openssl rand -hex 32)" >&2
            }

            if [ ! -s "$source_file" ]; then
            	use_random "no value in Vault yet"
            else
            	value=$(cat "$source_file")
            	case "$value" in
            	"REPLACE ME"*)
            		use_random "Vault still holds the vault-config placeholder"
            		;;
            	*)
            		printf '%s' "$value" >"$target_file"
            		echo "authkey: using the key from Vault." >&2
            		;;
            	esac
            fi

            # World-readable, because the vmsingle container beside this one runs as a
            # different uid and has to read it. The file is on an emptyDir that only this
            # pod can see, so the audience is the pod itself.
            chmod 0444 "$target_file"
          env:
          - name: AUTHKEY_SOURCE_DIR
            value: /etc/vm-authkeys-vault
          - name: AUTHKEY_TARGET_DIR
            value: /etc/vm-authkeys
          - name: AUTHKEY_NAME
            value: adminAuthKey
          - name: VAULT_PATH
            value: victoria-metrics
          image: busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
          name: authkey
          resources:
            limits:
              cpu: 100m
              memory: 32Mi
            requests:
              cpu: 10m
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
          volumeMounts:
          - mountPath: /etc/vm-authkeys-vault
            name: authkeys-vault
            readOnly: true
          - mountPath: /etc/vm-authkeys
            name: authkeys
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: 300m
            memory: 768Mi
        storage:
          storageClassName: nfs-remote
        volumeMounts:
        - mountPath: /etc/vm-authkeys
          name: authkeys
          readOnly: true
        volumes:
        - name: authkeys-vault
          secret:
            optional: true
            secretName: victoria-metrics-authkeys
        - emptyDir: {}
          name: authkeys
  driftDetection:
    mode: warn

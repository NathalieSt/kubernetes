---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: limes-role
rules:
- apiGroups:
  - batch
  resources:
  - cronjobs
  verbs:
  - get
  - list
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: limes-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: limes-role
subjects:
- kind: ServiceAccount
  name: limes
  namespace: limes

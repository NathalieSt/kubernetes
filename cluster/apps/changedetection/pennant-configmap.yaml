---
apiVersion: v1
kind: ConfigMap
metadata:
  name: changedetection-pennant
  namespace: changedetection
data:
  append-stylesheet.sh: |
    #!/bin/sh
    # Appends Pennant to an application's own stylesheet, in a copy of the
    # directory that holds it. Run as an init container from the application's own
    # image, so the file it copies is the one that version actually serves. See
    # StylesheetAppend.res for why this exists at all.
    #
    #   $1   the directory in the image
    #   $2   the emptyDir mounted over that directory in the application container
    #   $3   the stylesheet to append
    #   $4…  globs, relative to the directory, naming the files to append to
    #
    # A theme must never be the reason an application does not start. So a layout
    # this does not recognise -- the application moved its assets in an upgrade --
    # is reported on stderr and the pod starts unthemed, from a faithful copy.
    # Everything else (a failed copy, a full disk) still fails, because then the
    # copy the application would be served from is incomplete.
    set -eu

    source_dir=$1
    target_dir=$2
    css=$3
    shift 3

    warn() {
      echo "WARNING: Pennant not applied: $*" >&2
    }

    if [ ! -d "$source_dir" ]; then
      # Nothing to copy, and nothing is hidden by mounting over a path that does
      # not exist in this image.
      warn "$source_dir does not exist in this image -- the asset layout has changed"
      exit 0
    fi

    cp -R "$source_dir/." "$target_dir/"
    # An image may ship its assets read-only, and cp keeps the mode. The contents
    # only: the emptyDir's own root belongs to root, and a chmod of it fails.
    find "$target_dir" -mindepth 1 -exec chmod u+w {} +

    for pattern in "$@"; do
      matched=0
      # Unquoted on purpose: this is the glob.
      for file in "$target_dir"/$pattern; do
        [ -f "$file" ] || continue
        matched=$((matched + 1))
        printf '\n' >>"$file"
        cat "$css" >>"$file"
        # A pre-compressed sibling is served in preference to the file itself, so
        # one left as it was would quietly serve the unthemed stylesheet to every
        # browser that accepts the encoding -- which is all of them. gzip is in
        # every image this runs from; brotli is in none, so that copy is dropped
        # and the server falls back to the gzip one.
        rm -f "$file.br"
        if [ -e "$file.gz" ]; then
          gzip -9 -c "$file" >"$file.gz"
        fi
        echo "appended Pennant to ${file#"$target_dir"/}"
      done
      if [ "$matched" -eq 0 ]; then
        warn "no file under $source_dir matches '$pattern' -- the asset layout has changed"
      fi
    done
  pennant.css: |
    /* Pennant for changedetection.io, appended by kubernetes-generator (src/generators/theme). */

    :root {
      --color-background-page: #2e3436;
      --color-background-gradient-first: #007495;
      --color-background-gradient-second: #635bb1;
      --color-background-gradient-third: #984a72;
      --color-background: #ffffff;
      --color-text: #2e3436;
      --color-link: #984a72;
      --color-menu-accent: #984a72;
      --color-background-code: #f1f4f5;
      --color-error: #af3d34;
      --color-error-input: #ffe6e3;
      --color-error-list: #af3d34;
      --color-table-background: #ffffff;
      --color-table-stripe: #f1f4f5;
      --watchlist-row-selected: #ffe4f0;
      --watchlist-row-hover: #f1f4f5;
      --color-text-tab-active: #2e3436;
      --color-api-key: #007495;
      --color-background-button-primary: #984a72;
      --color-background-button-green: #1e7c44;
      --color-background-button-red: #af3d34;
      --color-background-button-success: #1e7c44;
      --color-background-button-error: #af3d34;
      --color-background-button-warning: #8e5e00;
      --color-background-button-secondary: #007495;
      --color-background-button-cancel: #666d71;
      --color-background-button-tag: #666d71;
      --color-background-button-tag-active: #484e51;
      --color-background-snapshot-age: #e3e7e9;
      --color-error-background-snapshot-age: #af3d34;
      --color-border-notification: #e3e7e9;
      --color-warning: #8e5e00;
      --color-link-new-version: #984a72;
      --color-last-checked: #838b8e;
      --color-text-footer: #666d71;
      --color-border-watch-table-cell: #e3e7e9;
      --color-text-watch-tag-list: #984a7266;
      --color-border-input: #838b8e;
      --color-shadow-input: #e3e7e9;
      --color-background-input: #ffffff;
      --color-text-input-description: #666d71;
      --color-text-input-placeholder: #838b8e;
      --color-background-table-thead: #f1f4f5;
      --color-border-table-cell: #e3e7e9;
      --color-text-menu-link: #666d71;
      --color-background-menu-link-hover: #f1f4f5;
      --color-text-menu-link-hover: #2e3436;
      --color-watch-table-error: #af3d34;
      --color-watch-table-row-text: #2e3436;
      --color-table-line: #e3e7e9;
      --color-sidebar-text: #2e3436;
    }

    html[data-darkmode=true] {
      --color-background-page: #090c0d;
      --color-background-gradient-first: #003e52;
      --color-background-gradient-second: #343063;
      --color-background-gradient-third: #54263d;
      --color-background: #121617;
      --color-text: #f1f4f5;
      --color-link: #f5adce;
      --color-menu-accent: #f5adce;
      --color-background-code: #1d2123;
      --color-error: #ffaea2;
      --color-error-input: #40100d;
      --color-error-list: #ffaea2;
      --color-table-background: #121617;
      --color-table-stripe: #1d2123;
      --watchlist-row-selected: #371627;
      --watchlist-row-hover: #1d2123;
      --color-text-tab-active: #f1f4f5;
      --color-api-key: #6bd5ff;
      --color-background-snapshot-age: #2e3436;
      --color-border-notification: #2e3436;
      --color-warning: #eebc77;
      --color-link-new-version: #f5adce;
      --color-last-checked: #9ea6a9;

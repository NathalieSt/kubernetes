---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
spec:
  interval: 24h
  chartRef:
    kind: OCIRepository
    name: forgejo-repo
  timeout: 10m
  releaseName: forgejo
  install:
    remediation:
      retries: 3
  values:
    extraContainerVolumeMounts:
    - mountPath: /data/gitea/public/assets/css
      name: pennant-theme
      readOnly: true
    extraVolumes:
    - configMap:
        name: forgejo-theme
      name: pennant-theme
    gitea:
      admin:
        passwordMode: initialOnlyRequireReset
        username: Nathi
      config:
        cache:
          ADAPTER: redis
          HOST: redis://valkey.valkey.svc.cluster.local:6379/1
        database:
          DB_TYPE: postgres
          HOST: forgejo-pg-rw.forgejo-pg-cluster.svc.cluster.local:5432
          NAME: forgejo
        queue:
          CONN_STR: redis://valkey.valkey.svc.cluster.local:6379/0?
          TYPE: redis
        repository:
          ALLOW_ADOPTION_OF_UNADOPTED_REPOSITORIES: true
          ENABLE_PUSH_CREATE_ORG: true
          ENABLE_PUSH_CREATE_USER: true
        server:
          ROOT_URL: https://code.netbird.nathalie-stiefsohn.eu
          SSH_DOMAIN: code.netbird.nathalie-stiefsohn.eu
          SSH_PORT: "2222"
        session:
          PROVIDER: redis
          PROVIDER_CONFIG: redis://valkey.valkey.svc.cluster.local:6379/2
        ui:
          DEFAULT_THEME: pennant
          THEMES: forgejo-auto,forgejo-light,forgejo-dark,gitea-auto,gitea-light,gitea-dark,forgejo-auto-deuteranopia-protanopia,forgejo-light-deuteranopia-protanopia,forgejo-dark-deuteranopia-protanopia,forgejo-auto-tritanopia,forgejo-light-tritanopia,forgejo-dark-tritanopia,pennant
      metrics:
        enabled: true
    persistence:
      annotations:
        k8up.io/backup: "true"
      enabled: true
      storageClass: nfs-remote
    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    service:
      ssh:
        port: 2222
  valuesFrom:
  - kind: Secret
    name: forgejo-pg-creds-secret
    valuesKey: username
    targetPath: gitea.config.database.USER
  - kind: Secret
    name: forgejo-pg-creds-secret
    valuesKey: password
    targetPath: gitea.config.database.PASSWD

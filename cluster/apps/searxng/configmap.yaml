---
apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
    app.kubernetes.io/name: searxng
  name: searxng-configmap
data:
  settings.yml: |
    # SearXNG settings
    use_default_settings: true

    general:
      debug: false
      instance_name: "Nathalies SearXNG"

    # The only part of SearXNG that Pennant can reach. Its simple theme is compiled
    # LESS with no hook for an extra stylesheet, and nothing here mounts a custom
    # one -- so the page itself stays SearXNG's. These six values feed
    # /manifest.json, which is what colours the splash screen and the browser chrome
    # of an installed PWA, and nothing else. Narrow, but it is a real supported
    # setting rather than a stylesheet smuggled past the theme.
    #
    # black is SearXNG's own third style, a true-black variant of dark; it takes the
    # dark accent on a black ground rather than a third palette.
    brand:
      pwa_colors:
        theme_color_light: "#984a72"
        background_color_light: "#f9fafb"
        theme_color_dark: "#f5adce"
        background_color_dark: "#090c0d"
        theme_color_black: "#f5adce"
        background_color_black: "#000000"

    search:
      safe_search: 2
      autocomplete: 'duckduckgo'
      formats:
        - html

    server:
      secret_key: "mBrieVOfZQzc7"
      limiter: true
      image_proxy: true

    valkey:
      url: valkey://valkey.valkey.svc.cluster.local:6379/0

    outgoing:
      request_timeout: 4.0       # default timeout in seconds, can be override by engine
      max_request_timeout: 10.0  # the maximum timeout in seconds
      useragent_suffix: ""       # information like an email address to the administrator
      pool_connections: 100      # Maximum number of allowable connections, or null
                    # for no limits. The default is 100.
      pool_maxsize: 10           # Number of allowable keep-alive connections, or null
                    # to always allow. The default is 10.
      enable_http2: true         # See https://www.python-httpx.org/http2/
      proxies:
        all://:
          - http://gluetun-proxy.gluetun-proxy.svc.cluster.local:8888

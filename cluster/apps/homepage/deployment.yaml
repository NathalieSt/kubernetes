---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: homepage
    app.kubernetes.io/version: v2.3.0
  name: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage
  template:
    metadata:
      annotations:
        homelab/homepage-config-hash: 0e01e77ea9d08b10
      labels:
        app.kubernetes.io/name: homepage
        app.kubernetes.io/version: v2.3.0
    spec:
      initContainers:
      - command:
        - cp
        - -a
        - /app/.next/.
        - /next/
        image: ghcr.io/gethomepage/homepage:v2.3.0
        name: copy-next
        volumeMounts:
        - mountPath: /next
          name: next
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 200m
            memory: 64Mi
        securityContext:
          capabilities:
            drop:
            - ALL
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
      serviceAccountName: homepage
      enableServiceLinks: false
      containers:
      - image: ghcr.io/gethomepage/homepage:v2.3.0
        name: homepage
        ports:
        - containerPort: 3000
          name: http
        volumeMounts:
        - mountPath: /app/config
          name: config
          readOnly: true
        - mountPath: /app/.next
          name: next
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: HOMEPAGE_ALLOWED_HOSTS
          value: home.netbird.nathalie-stiefsohn.eu,$(POD_IP):3000
        - name: LOG_TARGETS
          value: stdout
        - name: HOSTNAME
          value: 0.0.0.0
        resources:
          requests:
            cpu: 20m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 384Mi
        securityContext:
          capabilities:
            drop:
            - ALL
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        readinessProbe:
          httpGet:
            path: /api/healthcheck
            port: 3000
          periodSeconds: 10
        startupProbe:
          httpGet:
            path: /api/revalidate
            port: 3000
          periodSeconds: 2
          failureThreshold: 30
      volumes:
      - name: config
        configMap:
          name: homepage-config
      - name: next
        emptyDir: {}
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

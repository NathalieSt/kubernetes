---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
data:
  bookmarks.yaml: |
    - Links:
      - my-homelab:
        - icon: forgejo.png
          href: https://code.netbird.nathalie-stiefsohn.eu/my-homelab
          description: Every repo
      - homelab-docs:
        - icon: mdi-book-open-page-variant-outline
          href: https://code.netbird.nathalie-stiefsohn.eu/my-homelab/homelab-docs
          description: Architecture, runbooks
      - Codeberg:
        - icon: codeberg.png
          href: https://codeberg.org/NathalieStiefsohn
          description: The mirror Flux reads
      - NetBird:
        - icon: netbird.png
          href: https://netbird.nathalie-stiefsohn.eu
          description: Peers, policies
  custom.css: |
    /* Pennant for Homepage. Generated by kubernetes-generator; edit HomepageTheme.res. */

    :root, .theme-slate {
      --color-50: 249 250 251;
      --color-100: 241 244 245;
      --color-200: 227 231 233;
      --color-300: 208 213 216;
      --color-400: 184 191 194;
      --color-500: 158 166 169;
      --color-600: 131 139 142;
      --color-700: 102 109 113;
      --color-800: 72 78 81;
      --color-900: 46 52 54;
      --color-logo-start: 245 173 206;
      --color-logo-stop: 107 213 255;
    }

    html.dark, .dark body { --bg-color: 9 12 13; }

    /* The two soft washes are the flag's colours, faint enough that the page
       still reads as the plain background. */
    body {
      font-family: 'Inter var', Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      color: #f1f4f5;
      background:
        radial-gradient(1200px 600px at 10% -10%, #37162766, transparent 60%),
        radial-gradient(1000px 600px at 100% 0%, #00273588, transparent 55%),
        #090c0d !important;
      background-attachment: fixed !important;
    }
    #page_wrapper, #inner_wrapper { background: transparent !important; }

    /* ---- Header: the data widgets are cards; logo, title and search are not. */

    #information-widgets { gap: 0.75rem; border: 0 !important; padding-bottom: 0.5rem; }
    #information-widgets .widget-container:not(.information-widget-logo):not(.information-widget-greeting):not(.information-widget-search) {
      height: 4.75rem;
      align-self: center;
      background: #121617cc !important;
      border: 1px solid #2e3436;
      border-radius: 14px !important;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.30);
      backdrop-filter: blur(8px);
    }
    #information-widgets .information-widget-logo,
    #information-widgets .information-widget-greeting,
    #information-widgets .information-widget-search {
      background: transparent !important;
      border: 0 !important;
      box-shadow: none !important;
    }
    #information-widgets .information-widget-logo { padding-right: 0 !important; margin-right: -0.5rem; }
    #information-widgets .information-widget-greeting { padding-left: 0 !important; }

    /* The logo widget has no way to take an inline image, so its fallback (the
       Homepage mark) is hidden and the Pennant mark painted behind it. */
    .information-widget-logo .fallback svg { display: none; }
    .information-widget-logo .fallback {
      background: url("data:image/png;base64,") center / contain no-repeat;
    }

    .information-widget-greeting, .information-widget-greeting span {
      font-size: 1.75rem !important;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #f1f4f5;
    }

    .information-widget-search { flex: 1 1 18rem; }
    .information-widget-search input {
      height: 2.6rem;
      color: #f1f4f5;
      background: #1d2123 !important;
      border-color: #2e3436 !important;
      border-radius: 10px !important;
    }
    .information-widget-search input:focus { outline: 2px solid #f5adce; outline-offset: 1px; }

    @media (max-width: 640px) {
      #widgets-wrap { justify-content: flex-start !important; }
      #information-widgets .widget-container:not(.information-widget-logo):not(.information-widget-greeting) { flex: 1 1 45%; }
      .information-widget-search { flex-basis: 100% !important; }
    }

    /* ---- Sections: quiet uppercase headings with a tinted icon. */

    .service-group-name, .bookmark-group-name {
      font-size: 0.75rem !important;
      font-weight: 600 !important;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #9ea6a9 !important;
    }
    .service-group-icon, .bookmark-group-icon { width: 1.1rem !important; height: 1.1rem !important; margin-right: 0.5rem !important; }
    .service-group-icon div, .bookmark-group-icon div { background: #f5adce !important; }

    /* Homepage lays unstyled groups out as a quarter each, which leaves the last
       row of six stretched to double width. Three per row on a wide screen and
       two on a tablet. The first group is the Cluster row and always spans the
       page, as does the Links row of bookmarks. */
    .services-group, .bookmark-group { padding: 0.5rem 0.75rem !important; }
    .bookmark-group { flex: 0 0 100% !important; max-width: 100%; }
    @media (min-width: 1024px) {
      #layout-groups > .services-group { flex: 0 0 33.333% !important; max-width: 33.333%; }
      #layout-groups > .services-group:first-child { flex-basis: 100% !important; max-width: 100%; }
    }
    @media (min-width: 768px) and (max-width: 1023px) {
      #layout-groups > .services-group { flex: 0 0 50% !important; max-width: 50%; }
      #layout-groups > .services-group:first-child { flex-basis: 100% !important; max-width: 100%; }
    }

    /* ---- Tiles. */

    .service-card {
      color: #f1f4f5 !important;
      background: #121617d9 !important;
      border: 1px solid #2e3436;
      border-radius: 10px !important;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.30) !important;
      padding: 0.35rem !important;
      transition: transform 180ms cubic-bezier(0.2, 0, 0.2, 1), border-color 180ms cubic-bezier(0.2, 0, 0.2, 1), background 180ms cubic-bezier(0.2, 0, 0.2, 1) !important;
    }
    .service-card:hover {
      background: #1d2123 !important;
      border-color: #e68eb888;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.38) !important;
      transform: translateY(-1px);
    }
    .service-icon img { filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.35)); }
    .service-icon div[style*="mask"] { background: #6bd5ff !important; }
    .service-name { font-weight: 500; font-size: 0.9375rem !important; color: #f1f4f5; }
    .service-description { color: #b8bfc2 !important; font-size: 0.75rem !important; margin-top: 1px; }

    /* Status: the pill becomes a dot, vertically centred, with a soft ring in
       the matching semantic colour. */
    .service-tags { top: 50% !important; transform: translateY(-50%); right: 0.35rem !important; }
    .k8s-status { padding: 0.6rem !important; border-radius: 999px !important; }
    .k8s-status > div { width: 0.5rem !important; height: 0.5rem !important; }
    .k8s-status .bg-emerald-500 {
      background: #93d9a6 !important;
      box-shadow: 0 0 0 3px #042b13, 0 0 10px #6bc58688;
    }
    .k8s-status .bg-orange-400 { background: #eebc77 !important; box-shadow: 0 0 0 3px #321e00; }
    .k8s-status .bg-rose-500 { background: #ffaea2 !important; box-shadow: 0 0 0 3px #40100d; }

    /* The numbers under the Cluster tiles. */
    .service-container { gap: 0.35rem; padding: 0 0.25rem 0.25rem; }
    .service-block { background: #1d2123 !important; border-radius: 6px !important; padding: 0.4rem 0.25rem !important; }
    .service-block > div:first-child {
      font-weight: 600 !important;
      font-size: 1rem !important;
      font-variant-numeric: tabular-nums;
      color: #f1f4f5;
    }
    .service-block > div:last-child {
      font-weight: 500 !important;
      font-size: 0.625rem !important;
      letter-spacing: 0.06em;
      color: #9ea6a9 !important;
    }

    /* ---- Links. */

    .bookmark { background: #121617d9 !important; border: 1px solid #2e3436; border-radius: 10px !important; }
    .bookmark:hover { background: #1d2123 !important; border-color: #07bff488; }
    .bookmark-icon { background: transparent !important; }
    .bookmark-text, .bookmark-name { color: #f1f4f5 !important; }
    .bookmark-description { color: #b8bfc2 !important; }
  custom.js: ""
  docker.yaml: ""
  kubernetes.yaml: |
    mode: cluster
    ingress: false
    traefik: false
    gateway: false
  proxmox.yaml: ""
  services.yaml: |
    - Cluster:
      - Flux:
          href: https://headlamp.netbird.nathalie-stiefsohn.eu
          icon: mdi-sync
          description: Kustomizations and HelmReleases
          widget:
            type: prometheusmetric
            url: http://vmsingle-victoria-metrics-vmks.victoria-metrics.svc.cluster.local:8428
            refreshInterval: 60000
            metrics:
            - label: Ready
              query: count(gotk_resource_info{customresource_kind=~"Kustomization|HelmRelease",ready="True"}) or vector(0)
              format:
                type: number
            - label: Failing
              query: count(gotk_resource_info{customresource_kind=~"Kustomization|HelmRelease",ready!="True"}) or vector(0)
              format:
                type: number
            - label: Suspended
              query: count(gotk_resource_info{suspended="true"}) or vector(0)
              format:
                type: number
      - Workloads:
          href: https://orrery.netbird.nathalie-stiefsohn.eu
          icon: mdi-cube-outline
          description: Pods across every namespace
          widget:
            type: prometheusmetric
            url: http://vmsingle-victoria-metrics-vmks.victoria-metrics.svc.cluster.local:8428
            refreshInterval: 60000
            metrics:
            - label: Running
              query: count(count by (namespace, pod) (kube_pod_status_phase{phase=~"Running"} == 1)) or vector(0)
              format:
                type: number
            - label: Not running
              query: count(count by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Failed|Unknown"} == 1)) or vector(0)
              format:
                type: number
            - label: Restarts 24h
              query: round(sum(max by (namespace, pod, container) (increase(kube_pod_container_status_restarts_total[24h])))) or vector(0)
              format:
                type: number
      - Alerts:
          href: https://orrery.netbird.nathalie-stiefsohn.eu
          icon: mdi-bell-ring-outline
          description: Firing in vmalert
          widget:
            type: prometheusmetric
            url: http://vmsingle-victoria-metrics-vmks.victoria-metrics.svc.cluster.local:8428
            refreshInterval: 60000
            metrics:
            - label: Critical
              query: count(ALERTS{alertstate="firing",severity="critical"}) or vector(0)
              format:
                type: number
            - label: Warning
              query: count(ALERTS{alertstate="firing",severity="warning"}) or vector(0)
              format:
                type: number
      - Backups:
          href: https://backups.netbird.nathalie-stiefsohn.eu
          icon: mdi-backup-restore
          description: K8up backup jobs
          widget:
            type: prometheusmetric
            url: http://vmsingle-victoria-metrics-vmks.victoria-metrics.svc.cluster.local:8428
            refreshInterval: 300000
            metrics:
            - label: Succeeded 24h
              query: round(sum(increase(k8up_jobs_successful_counter{jobType="backup"}[24h]))) or vector(0)
              format:
                type: number
            - label: Failed 24h
              query: round(sum(increase(k8up_jobs_failed_counter{jobType="backup"}[24h]))) or vector(0)
              format:
                type: number
      - Storage:
          href: https://headlamp.netbird.nathalie-stiefsohn.eu
          icon: mdi-harddisk
          description: Volumes and certificates
          widget:
            type: prometheusmetric
            url: http://vmsingle-victoria-metrics-vmks.victoria-metrics.svc.cluster.local:8428
            refreshInterval: 300000
            metrics:
            - label: Fullest PVC
              query: max(kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes)
              format:
                type: percent
                scale: 100
                options:
                  maximumFractionDigits: 0
            - label: Cert expiry
              query: floor(min(certmanager_certificate_expiration_timestamp_seconds - time()) / 86400)
              format:
                type: number
                suffix: " d"
    - Media:
      - audiomuse-ai:
          href: https://audiomuse.netbird.nathalie-stiefsohn.eu
          icon: audiomuse-ai.png
          description: Playlists from how the music sounds
          namespace: jellyfin
          app: audiomuse-ai
          podSelector: app.kubernetes.io/name=audiomuse-ai-flask
      - flood:
          href: https://transmission.netbird.nathalie-stiefsohn.eu
          icon: flood.png
          description: Torrents, through the VPN
          namespace: jellyfin
          app: flood
      - jellyfin:
          href: https://jellyfin.netbird.nathalie-stiefsohn.eu
          icon: jellyfin.png
          description: Films, series and music
          namespace: jellyfin
          app: jellyfin
      - kavita:
          href: https://kavita.netbird.nathalie-stiefsohn.eu
          icon: kavita.png
          description: Books and comics
          namespace: kavita
          app: kavita
      - music-library-builder:
          href: https://music.netbird.nathalie-stiefsohn.eu
          icon: mdi-music-box-multiple
          description: yt-dlp into the Jellyfin music library
          namespace: jellyfin
          app: music-library-builder
    - Personal:
      - daybook:
          href: https://daybook.netbird.nathalie-stiefsohn.eu
          icon: mdi-book-lock-outline
          description: Encrypted diary and habit tracker
          namespace: daybook
          app: daybook
      - mail:
          href: https://mail.netbird.nathalie-stiefsohn.eu
          icon: roundcube.png
          description: Webmail
          namespace: mail
          app: mail
          podSelector: app.kubernetes.io/name=roundcube
      - psono-client:
          href: https://psono.netbird.nathalie-stiefsohn.eu
          icon: mdi-lock-outline
          description: Password manager
          namespace: psono
          app: psono-client
      - tandoor:
          href: https://tandoor.netbird.nathalie-stiefsohn.eu
          icon: tandoor-recipes.png
          description: Recipes and meal plans
          namespace: tandoor
          app: tandoor
      - zyme:
          href: https://zyme.netbird.nathalie-stiefsohn.eu
          icon: mdi-bottle-tonic-outline
          description: "Fermentation: batches, sensors and reminders"
          namespace: zyme
          app: zyme
    - Development:
      - code-server:
          href: https://vscode.netbird.nathalie-stiefsohn.eu
          icon: code-server.png
          description: VS Code in the browser
          namespace: code-server
          app: code-server
      - forgejo:
          href: https://code.netbird.nathalie-stiefsohn.eu
          icon: forgejo.png
          description: Git, CI and package registry
          namespace: forgejo
          app: forgejo
      - it-tools:
          href: https://it-tools.netbird.nathalie-stiefsohn.eu
          icon: it-tools.png
          description: Developer utilities
          namespace: it-tools
          app: it-tools
      - omni-tools:
          href: https://omni-tools.netbird.nathalie-stiefsohn.eu
          icon: omni-tools.png
          description: File, image and text tools
          namespace: omni-tools
          app: omni-tools
      - vim-dojo:
          href: https://dojo.netbird.nathalie-stiefsohn.eu
          icon: si-neovim
          description: Neovim in the browser
          namespace: vim-dojo
          app: vim-dojo
    - Web:
      - changedetection:
          href: https://changedetection.netbird.nathalie-stiefsohn.eu
          icon: changedetection.png
          description: Watches pages for changes
          namespace: changedetection
          app: changedetection
      - fourget:
          href: https://4get.netbird.nathalie-stiefsohn.eu
          icon: mdi-magnify
          description: Private metasearch
          namespace: fourget
          app: fourget
      - neko:
          href: https://neko.netbird.nathalie-stiefsohn.eu
          icon: neko.png
          description: Disposable Firefox, streamed
          namespace: neko
          app: neko
      - redlib:
          href: https://redlib.netbird.nathalie-stiefsohn.eu
          icon: redlib.png
          description: Private Reddit front end
          namespace: redlib
          app: redlib
    - Platform:
      - authelia:
          href: https://auth.netbird.nathalie-stiefsohn.eu
          icon: authelia.png
          description: Single sign-on
          namespace: authelia
          app: authelia
      - backup-dashboard:
          href: https://backups.netbird.nathalie-stiefsohn.eu
          icon: restic.png
          description: "K8up backups: browse, restore, trigger"
          namespace: backup-dashboard
          app: backup-dashboard
      - headlamp:
          href: https://headlamp.netbird.nathalie-stiefsohn.eu
          icon: headlamp.png
          description: Kubernetes UI
          namespace: headlamp
          app: headlamp
      - homelab-docs:
          href: https://docs.netbird.nathalie-stiefsohn.eu
          icon: homelab-docs.png
          description: How the homelab works, and runbooks
          namespace: homelab-docs
          app: homelab-docs
      - psono-server:
          href: https://psono-api.netbird.nathalie-stiefsohn.eu
          icon: mdi-api
          description: Psono's API, which the web client and apps call
          namespace: psono
          app: psono-server
      - vault:
          href: https://vault.netbird.nathalie-stiefsohn.eu
          icon: hashicorp-vault.png
          description: Secrets
          namespace: vault
          app: vault
    - Observability:
      - glitchtip:
          href: https://glitchtip.netbird.nathalie-stiefsohn.eu
          icon: glitchtip.png
          description: Error tracking
          namespace: glitchtip
          app: glitchtip
      - healthchecks:
          href: https://healthchecks.netbird.nathalie-stiefsohn.eu
          icon: healthchecks.png
          description: Cron job monitoring
          namespace: healthchecks
          app: healthchecks
      - limes:
          href: https://limes.netbird.nathalie-stiefsohn.eu
          icon: mdi-shield-search
          description: Security scans of every image in the cluster
          namespace: limes
          app: limes
      - ntfy:
          href: https://ntfy.netbird.nathalie-stiefsohn.eu
          icon: ntfy.png
          description: Push notifications
          namespace: ntfy
          app: ntfy
      - orrery:
          href: https://orrery.netbird.nathalie-stiefsohn.eu
          icon: mdi-orbit
          description: Topology, metrics and logs
          namespace: orrery
          app: orrery
    - Other:
      - helium-services:
          href: https://helium.netbird.nathalie-stiefsohn.eu
          icon: helium-services.png
          namespace: helium-services
          app: helium-services
  settings.yaml: |
    title: Homelab
    favicon: data:image/png;base64,
    theme: dark
    color: slate
    headerStyle: boxedWidgets
    statusStyle: dot
    hideVersion: true
    disableUpdateCheck: true
    useEqualHeights: true
    target: _blank
    quicklaunch:
      searchDescriptions: true
      hideVisitURL: true
      provider: custom
      url: https://4get.netbird.nathalie-stiefsohn.eu/web?s=
      target: _blank
    layout:
      Cluster:
        style: row
        columns: 5
        icon: mdi-kubernetes
      Media:
        icon: mdi-play-circle-outline
      Personal:
        icon: mdi-account-heart-outline
      Development:
        icon: mdi-code-braces
      Web:
        icon: mdi-web
      Platform:
        icon: mdi-server-security
      Observability:
        icon: mdi-chart-timeline-variant
      Other:
        icon: mdi-help-circle-outline
      Links:
        style: row
        columns: 4
        icon: mdi-link-variant
  widgets.yaml: |
    - logo: {}
    - greeting:
        text_size: xl
        text: Homelab
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: cluster
        nodes:
          show: false
    - openmeteo:
        label: Vienna
        latitude: 48.2082
        longitude: 16.3738
        timezone: Europe/Vienna
        units: metric
        cache: 15
    - datetime:
        text_size: md
        format:
          dateStyle: medium
          timeStyle: short
          hourCycle: h23
    - search:
        provider: custom
        url: https://4get.netbird.nathalie-stiefsohn.eu/web?s=
        target: _blank
        focus: false

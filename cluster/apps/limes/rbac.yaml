---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: limes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: limes-cluster-role
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
- apiGroups:
  - ""
  resources:
  - pods/log
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: limes-cluster-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: limes-cluster-role
subjects:
- kind: ServiceAccount
  name: limes
  namespace: limes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: limes-role
rules:
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: limes-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: limes-role
subjects:
- kind: ServiceAccount
  name: limes
  namespace: limes

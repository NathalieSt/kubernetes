---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: limes
    app.kubernetes.io/version: 6f00388
  name: limes
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: limes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: limes
        app.kubernetes.io/version: 6f00388
    spec:
      imagePullSecrets:
      - name: forgejo-registry-secret
      serviceAccountName: limes
      containers:
      - image: code.netbird.nathalie-stiefsohn.eu/my-homelab/limes:6f00388@sha256:480713259af71f0a34531b9f062f84f8a8ad1996ff2a608ef1860f0238edbe58
        name: limes
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - mountPath: /etc/limes/pins
          name: version-pins
          readOnly: true
        env:
        - name: LIMES_SCAN_NAMESPACE
          value: limes
        - name: LIMES_INVENTORY_NAMESPACES
          value: ""
        - name: LIMES_GRYPE_IMAGE
          value: anchore/grype@sha256:58ab03590058b55a3815e90fc44d9475c7621629c366e7053ab941e3fcf9ec1b
        - name: LIMES_GRYPE_CACHE_CLAIM
          value: limes-grype-cache-pvc
        - name: LIMES_CLAMAV_NAMESPACE
          value: clamav
        - name: LIMES_CLAMAV_CRONJOBS
          value: clamav-scan-local,clamav-scan-nas
        - name: LIMES_PATROL_ENABLED
          value: "true"
        - name: LIMES_PATROL_CONCURRENCY
          value: "2"
        - name: LIMES_PATROL_INTERVAL_MS
          value: "900000"
        - name: LIMES_PATROL_MAX_AGE_MS
          value: "86400000"
        - name: LIMES_SCAN_AVOID_NODES
          value: raspberry-pi-5-0,raspberry-pi-5-1,raspberry-pi-5-2
        - name: LIMES_VM_URL
          value: http://vmsingle-victoria-metrics-vmks.victoria-metrics.svc.cluster.local:8428
        - name: LIMES_PINS_FILE
          value: /etc/limes/pins/pins.json
        - name: LIMES_OWN_REGISTRY
          value: code.netbird.nathalie-stiefsohn.eu/my-homelab
        - name: LIMES_NTFY_URL
          value: http://ntfy.ntfy.svc.cluster.local:8080
        - name: LIMES_NTFY_TOPIC
          value: limes
        - name: LIMES_NTFY_TOKEN
          valueFrom:
            secretKeyRef:
              key: ntfy-token
              name: limes-secret
              optional: true
        - name: LIMES_PUBLIC_URL
          value: https://limes.netbird.nathalie-stiefsohn.eu
        - name: LIMES_FORGEJO_URL
          value: http://forgejo-http.forgejo.svc.cluster.local:3000
        - name: LIMES_FORGEJO_REPO
          value: my-homelab/kubernetes-generator
        - name: LIMES_FORGEJO_TOKEN
          valueFrom:
            secretKeyRef:
              key: forgejo-token
              name: limes-secret
              optional: true
        - name: LIMES_DATABASE_URL
          value: postgres://postgres-rw.postgres.svc.cluster.local:5432/limes
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              key: username
              name: postgres-creds-secret
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: postgres-creds-secret
        - name: LIMES_REGISTRY_SECRET
          value: forgejo-registry-secret
        - name: LIMES_REGISTRY_PULL_ADDRESS
          value: forgejo-http.forgejo.svc.cluster.local:3000
        - name: LIMES_REGISTRY_TOKEN_IMAGE
          value: curlimages/curl:8.22.0
        - name: TZ
          value: Europe/Vienna
        - name: LIMES_OIDC_AUTHORITY
          value: https://auth.netbird.nathalie-stiefsohn.eu
        - name: LIMES_OIDC_CLIENT_ID
          value: limes
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        securityContext:
          capabilities:
            drop:
            - ALL
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          runAsNonRoot: true
      volumes:
      - name: version-pins
        configMap:
          name: limes-version-pins

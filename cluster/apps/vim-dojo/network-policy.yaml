---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vim-dojo-networkpolicy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vim-dojo
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: internal-gateway
      podSelector:
        matchLabels:
          app.kubernetes.io/name: internal-gateway

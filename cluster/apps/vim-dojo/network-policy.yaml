---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vim-dojo-networkpolicy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vim-dojo
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: internal-gateway
      podSelector:
        matchLabels:
          app.kubernetes.io/name: internal-gateway
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: egress-proxy
      podSelector:
        matchLabels:
          app.kubernetes.io/name: egress-proxy
    ports:
    - port: 8888
      protocol: TCP

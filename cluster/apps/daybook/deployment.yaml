---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: daybook
    app.kubernetes.io/version: f2dbb2e
  name: daybook
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: daybook
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: daybook
        app.kubernetes.io/version: f2dbb2e
    spec:
      imagePullSecrets:
      - name: forgejo-registry-secret
      initContainers:
      - command:
        - sh
        - -c
        - chown 1000:1000 /var/lib/daybook
        image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
        name: permission-fix
        volumeMounts:
        - mountPath: /var/lib/daybook
          name: data-volume
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
      - image: code.netbird.nathalie-stiefsohn.eu/my-homelab/daybook:f2dbb2e@sha256:e9e4deb4d5d8aa876b8b8a83697762672b24ce1e6b39b4b335039e329129260f
        name: daybook
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - mountPath: /var/lib/daybook
          name: data-volume
        env:
        - name: WEB_ADDR
          value: :8080
        - name: DAYBOOK_DATA_DIR
          value: /var/lib/daybook
        - name: DAYBOOK_STATIC_ROOT
          value: /app/ui/dist
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          capabilities:
            drop:
            - ALL
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: daybook-data-pvc
      securityContext:
        seccompProfile:
          type: RuntimeDefault

---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: sonarr
    app.kubernetes.io/version: 4.0.20.3014-ls325
  name: sonarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sonarr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sonarr
        app.kubernetes.io/version: 4.0.20.3014-ls325
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
      - image: linuxserver/sonarr:4.0.20.3014-ls325@sha256:a5c1a5fecbef946927ab90ad68df319ac5fe644057e5fc18cd993f01ac07b2b2
        name: sonarr
        ports:
        - containerPort: 8989
          name: http
        volumeMounts:
        - mountPath: /config
          name: config
        - mountPath: /data
          name: media
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "10"
        - name: TZ
          value: Europe/Vienna
        - name: SONARR__POSTGRES__HOST
          value: postgres-rw.postgres.svc.cluster.local
        - name: SONARR__POSTGRES__PORT
          value: "5432"
        - name: SONARR__POSTGRES__USER
          valueFrom:
            secretKeyRef:
              key: username
              name: postgres-creds-secret
        - name: SONARR__POSTGRES__PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: postgres-creds-secret
        - name: SONARR__POSTGRES__MAINDB
          value: sonarr-main
        - name: SONARR__POSTGRES__LOGDB
          value: sonarr-log
        - name: SONARR__AUTH__METHOD
          value: External
        - name: SONARR__LOG__ANALYTICSENABLED
          value: "False"
        - name: HTTPS_PROXY
          value: http://gluetun-proxy.gluetun-proxy.svc.cluster.local:8888
        - name: https_proxy
          value: http://gluetun-proxy.gluetun-proxy.svc.cluster.local:8888
        - name: HTTP_PROXY
          value: http://gluetun-proxy.gluetun-proxy.svc.cluster.local:8888
        - name: http_proxy
          value: http://gluetun-proxy.gluetun-proxy.svc.cluster.local:8888
        - name: NO_PROXY
          value: localhost,127.0.0.1,.svc,.cluster.local,sonarr,sonarr.jellyfin,radarr,radarr.jellyfin,lidarr,lidarr.jellyfin,prowlarr,prowlarr.jellyfin,bazarr,bazarr.jellyfin,seerr,seerr.jellyfin,qbittorrent,qbittorrent.jellyfin,sabnzbd,sabnzbd.jellyfin,jellyfin,jellyfin.jellyfin
        - name: no_proxy
          value: localhost,127.0.0.1,.svc,.cluster.local,sonarr,sonarr.jellyfin,radarr,radarr.jellyfin,lidarr,lidarr.jellyfin,prowlarr,prowlarr.jellyfin,bazarr,bazarr.jellyfin,seerr,seerr.jellyfin,qbittorrent,qbittorrent.jellyfin,sabnzbd,sabnzbd.jellyfin,jellyfin,jellyfin.jellyfin
        resources:
          requests:
            cpu: 50m
            memory: 192Mi
          limits:
            cpu: "1"
            memory: 1Gi
        readinessProbe:
          httpGet:
            path: /ping
            port: 8989
          periodSeconds: 30
        startupProbe:
          httpGet:
            path: /ping
            port: 8989
          periodSeconds: 10
          failureThreshold: 60
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: sonarr-config
      - name: media
        persistentVolumeClaim:
          claimName: jellyfin-pvc

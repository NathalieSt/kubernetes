---
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/name: music-library-builder
    app.kubernetes.io/version: latest
  name: music-library-builder-sync
spec:
  schedule: 30 4 * * *
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: music-library-builder
            app.kubernetes.io/version: latest
        spec:
          imagePullSecrets:
          - name: forgejo-registry-secret
          initContainers:
          - command:
            - sh
            - -c
            - chown 1000:1000 /state
            image: busybox
            name: permission-fix
            volumeMounts:
            - mountPath: /state
              name: state-volume
          containers:
          - args:
            - ./bin/mlb.mjs
            - sync
            image: code.netbird.nathalie-stiefsohn.eu/my-homelab/music-library-builder:latest
            name: music-library-builder-sync
            volumeMounts:
            - mountPath: /media
              name: media-volume
            - mountPath: /state
              name: state-volume
            env:
            - name: MLB_LIBRARY_ROOT
              value: /media/music
            - name: MLB_STATE_DIR
              value: /state
            - name: MLB_PROXY
              value: http://gluetun-media.jellyfin.svc.cluster.local:8888
            - name: MLB_VPN_CONTROL_URL
              value: http://gluetun-media.jellyfin.svc.cluster.local:8000
            - name: MLB_NO_PROXY
              value: svc.cluster.local,cluster.local,localhost
            - name: MLB_CONCURRENCY
              value: "2"
            - name: MLB_BROWSE_ROOTS
              value: /media
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 2000m
                memory: 1Gi
          volumes:
          - name: media-volume
            persistentVolumeClaim:
              claimName: jellyfin-pvc
          - name: state-volume
            persistentVolumeClaim:
              claimName: music-library-builder-state-pvc
          restartPolicy: OnFailure

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: seerr-arr-networkpolicy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: seerr
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app.kubernetes.io/name
          operator: In
          values:
          - sonarr
          - radarr
          - lidarr
          - prowlarr
          - bazarr
    ports:
    - port: 5055
      protocol: TCP

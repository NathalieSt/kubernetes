---
apiVersion: v1
kind: ConfigMap
metadata:
  name: seerr-scripts
data:
  proxy-set.sh: |
    #!/bin/sh
    # Pins Seerr's own proxy setting (Settings > Network) in settings.json, every start.
    # Seerr ignores HTTP(S)_PROXY for most of its requests, and its egress policy refuses
    # anything that does not go through the proxy, so an unset proxy is a Seerr that can
    # reach nothing outside the cluster.
    #
    #   SETTINGS_FILE  settings.json
    #   PROXY_HOST     the VPN proxy's address
    #   PROXY_PORT     its port
    #   PROXY_BYPASS   Seerr's bypassFilter: comma-separated names, `*.suffix` allowed
    #
    # Only an existing file is changed. A partial one stops Seerr at startup (it reads the
    # file raw before merging its defaults), so on a fresh volume the first start writes the
    # defaults, reaches nothing outside the cluster, and the next start pins the proxy.
    set -eu

    if [ ! -s "$SETTINGS_FILE" ]; then
      echo "proxy-set: $SETTINGS_FILE does not exist yet; restart Seerr once it has written it" >&2
      exit 0
    fi

    yq -i -p=json -o=json '.network.proxy = {
      "enabled": true,
      "hostname": strenv(PROXY_HOST),
      "port": (strenv(PROXY_PORT) | to_number),
      "useSsl": false,
      "user": "",
      "password": "",
      "bypassFilter": strenv(PROXY_BYPASS),
      "bypassLocalAddresses": true
    }' "$SETTINGS_FILE"

    echo "proxy-set: proxy $PROXY_HOST:$PROXY_PORT" >&2

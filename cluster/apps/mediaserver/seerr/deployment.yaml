---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: seerr
    app.kubernetes.io/version: v3.4.1
  name: seerr
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: seerr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seerr
        app.kubernetes.io/version: v3.4.1
    spec:
      initContainers:
      - command:
        - sh
        - -c
        - chown -R 1000:1000 /app/config
        image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
        name: permission-fix
        volumeMounts:
        - mountPath: /app/config
          name: config
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
      - image: ghcr.io/seerr-team/seerr:v3.4.1@sha256:f4768de5f616248d723e05891f3345a1402123775d03bf0890dbfedc0831bda1
        name: seerr
        ports:
        - containerPort: 5055
          name: http
        volumeMounts:
        - mountPath: /app/config
          name: config
        env:
        - name: TZ
          value: Europe/Vienna
        - name: DB_TYPE
          value: postgres
        - name: DB_HOST
          value: postgres-rw.postgres.svc.cluster.local
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: seerr
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              key: username
              name: postgres-creds-secret
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              key: password
              name: postgres-creds-secret
        resources:
          requests:
            cpu: 50m
            memory: 192Mi
          limits:
            cpu: "1"
            memory: 1Gi
        securityContext:
          capabilities:
            drop:
            - ALL
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          runAsNonRoot: true
        readinessProbe:
          httpGet:
            path: /api/v1/status
            port: 5055
          periodSeconds: 30
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: seerr-config

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jellyfin-theme
  namespace: jellyfin
data:
  branding.xml: |-
    <?xml version="1.0" encoding="utf-8"?>
    <BrandingOptions xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema">
      <CustomCss>/* Pennant -- the homelab's shared palette, from the styles repo.
     * GENERATED by kubernetes-generator (src/generators/theme/JellyfinTheme.res).
     * To change it: edit tokens/tokens.json in the styles repo, release it, then
     * bump @my-homelab/styles here and regenerate. Editing this in
     * Dashboard &gt; Branding will not stick:
     * branding.xml is rewritten from the ConfigMap on every pod start. */

    :root {
      --pennant-accent: #b95f8c;
      --pennant-accent-hover: #d375a4;
      --pennant-accent-tint: #b95f8c33;
      --pennant-on-accent: #f9fafb;
      --pennant-danger: #d35145;
    }

    html[data-theme="light"],
    html[data-theme="appletv"] {
      --pennant-accent: #984a72;
      --pennant-accent-hover: #763757;
      --pennant-accent-tint: #984a7233;
      --pennant-on-accent: #f9fafb;
      --pennant-danger: #af3d34;
    }

    html[data-theme="dark"],
    html[data-theme="blueradiance"],
    html[data-theme="purplehaze"],
    html[data-theme="wmc"] {
      --pennant-accent: #f5adce;
      --pennant-accent-hover: #ffcbe2;
      --pennant-accent-tint: #f5adce33;
      --pennant-on-accent: #090c0d;
      --pennant-danger: #ff8577;
    }

    @media (hover: hover) and (pointer: fine) {
      .paper-icon-button-light:hover:not(:disabled) {
        color: var(--pennant-accent);
        background-color: var(--pennant-accent-tint);
      }
    }

    .paper-icon-button-light:active:not(:disabled) {
      color: var(--pennant-accent);
      background-color: var(--pennant-accent-tint);
    }

    .paper-icon-button-light.show-focus:focus {
      color: var(--pennant-accent);
    }

    .button-submit {
      background: var(--pennant-accent);
      color: var(--pennant-on-accent);
    }

    .button-submit:focus {
      background: var(--pennant-accent-hover);
      color: var(--pennant-on-accent);
    }

    .button-delete {
      background: var(--pennant-danger);
      color: var(--pennant-on-accent);
    }

    .inputLabelFocused,
    .selectLabelFocused,
    .textareaLabelFocused {
      color: var(--pennant-accent);
    }

    .itemSelectionPanel {
      border: 1px solid var(--pennant-accent);
    }

    .selectionCommandsPanel {
      background: var(--pennant-accent);
      color: var(--pennant-on-accent);
    }

    .upNextDialog-countdownText {
      color: var(--pennant-accent);
    }

    .alphaPickerButton-tv:focus {
      background-color: var(--pennant-accent);
      color: var(--pennant-on-accent) !important;
    }

    .progressring-spiner {
      border-color: var(--pennant-accent);
    }

    .button-flat:hover {
      color: var(--pennant-accent);
    }

    .button-link {
      color: var(--pennant-accent);
    }

    .emby-input:focus,
    .emby-textarea:focus {
      border-color: var(--pennant-accent);
    }

    .emby-select-withcolor:focus {
      border-color: var(--pennant-accent) !important;
    }

    .emby-select-tv-withcolor:focus {
      background-color: var(--pennant-accent) !important;
      color: var(--pennant-on-accent) !important;
    }

    .emby-checkbox:checked + span + .checkboxOutline {
      border-color: var(--pennant-accent);
    }

    .emby-checkbox:checked + span + .checkboxOutline,
    .itemProgressBarForeground {
      background-color: var(--pennant-accent);
    }

    .emby-checkbox:focus:not(:checked) + span + .checkboxOutline {
      border-color: var(--pennant-accent);
    }

    .itemProgressBarForeground-recording {
      background-color: var(--pennant-danger);
    }

    .countIndicator,
    .fullSyncIndicator,
    .mediaSourceIndicator,
    .playedIndicator {
      background: var(--pennant-accent);
    }

    .navMenuOption-selected {
      background: var(--pennant-accent) !important;
      color: var(--pennant-on-accent);
    }

    .emby-button.show-focus:focus {
      background: var(--pennant-accent);
      color: var(--pennant-on-accent);
    }

    .emby-tab-button.show-focus:focus {
      color: var(--pennant-accent);
    }

    .emby-tab-button:hover {
      color: var(--pennant-accent);
    }

    .guide-channelHeaderCell:focus,
    .programCell:focus {
      background-color: var(--pennant-accent) !important;
      color: var(--pennant-on-accent) !important;
    }

    .guide-date-tab-button.emby-tab-button-active,
    .guide-date-tab-button:focus {
      color: var(--pennant-accent);
    }

    .guide-date-tab-button.show-focus:focus {
      background-color: var(--pennant-accent);
      color: var(--pennant-on-accent);
    }

    .buttonActive {
      color: var(--pennant-accent) !important;
    }

    .card:focus .cardBox.visualCardBox,
    .card:focus .cardBox:not(.visualCardBox) .cardScalable {
      border-color: var(--pennant-accent) !important;
    }

    .metadataSidebarIcon {
      color: var(--pennant-accent);
    }

    .emby-button.detailFloatingButton {
      background-color: var(--pennant-accent);
      color: var(--pennant-on-accent);
    }

    .layout-tv .emby-button.detailFloatingButton:focus {
      color: #984a72;
    }

    #dialogToc .bookplayerButtonIcon:hover {
      color: var(--pennant-accent);
    }

    #dialogToc .toc li a:active,
    #dialogToc .toc li a:hover {
      color: var(--pennant-accent);
    }

    /* Two rules that are accent-coloured in some built-in themes and a plain
     surface in others, so they are scoped to exactly the themes that paint them
     with the accent. Overriding them unscoped would put a pink bar across the dark
     theme's dialogs, which that theme deliberately keeps grey. */
    html[data-theme="light"] .formDialogHeader:not(.formDialogHeader-clear) {
      background-color: var(--pennant-accent);
      color: var(--pennant-on-accent);
    }

    html[data-theme="light"] .alphaPickerButton-selected,
    html[data-theme="appletv"] .alphaPickerButton-selected,
    html[data-theme="wmc"] .alphaPickerButton-selected {
      background-color: var(--pennant-accent);
      color: var(--pennant-on-accent) !important;
    }
    </CustomCss>
      <SplashscreenEnabled>false</SplashscreenEnabled>
    </BrandingOptions>

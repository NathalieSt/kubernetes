---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lidarr-arr-networkpolicy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: lidarr
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app.kubernetes.io/name
          operator: In
          values:
          - sonarr
          - radarr
          - prowlarr
          - bazarr
          - seerr
    ports:
    - port: 8686
      protocol: TCP

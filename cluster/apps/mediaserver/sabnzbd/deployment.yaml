---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: sabnzbd
    app.kubernetes.io/version: 5.1.3-ls273
  name: sabnzbd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sabnzbd
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sabnzbd
        app.kubernetes.io/version: 5.1.3-ls273
    spec:
      initContainers:
      - command:
        - sh
        - /scripts/ini-set.sh
        image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
        name: config
        volumeMounts:
        - mountPath: /config
          name: config
        - mountPath: /data
          name: media
        - mountPath: /scripts
          name: scripts
          readOnly: true
        env:
        - name: INI_FILE
          value: /config/sabnzbd.ini
        - name: INI_KEYS
          value: |-
            [misc]host_whitelist=sabnzbd, sabnzbd.jellyfin, sabnzbd.jellyfin.svc.cluster.local, sabnzbd.netbird.nathalie-stiefsohn.eu
            [misc]download_dir=/data/usenet/incomplete
            [misc]complete_dir=/data/usenet/complete
        - name: INI_OWNER
          value: "1000:10"
        - name: INI_DIRS
          value: /data/usenet /data/usenet/incomplete /data/usenet/complete
      - image: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
        name: gluetun
        env:
        - name: VPN_SERVICE_PROVIDER
          value: protonvpn
        - name: VPN_TYPE
          value: openvpn
        - name: OPENVPN_PROTOCOL
          value: udp
        - name: OPENVPN_ENDPOINT_PORT
          value: "1194"
        - name: OPENVPN_USER
          valueFrom:
            secretKeyRef:
              key: user
              name: sabnzbd-vpn
        - name: OPENVPN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: sabnzbd-vpn
        - name: SERVER_COUNTRIES
          value: Netherlands
        - name: FIREWALL_INPUT_PORTS
          value: "8080"
        - name: FIREWALL_OUTBOUND_SUBNETS
          value: 10.42.0.0/16
        - name: TZ
          value: Europe/Vienna
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
        startupProbe:
          exec:
            command:
            - /gluetun-entrypoint
            - healthcheck
          periodSeconds: 5
          failureThreshold: 120
        restartPolicy: Always
      automountServiceAccountToken: false
      enableServiceLinks: false
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - 127.0.0.1
      containers:
      - image: linuxserver/sabnzbd:5.1.3-ls273@sha256:948ea3dc45d68943ec14b33ba37ffa1488da3e9837bf3ca0f75621e971614d85
        name: sabnzbd
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - mountPath: /config
          name: config
        - mountPath: /data
          name: media
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "10"
        - name: TZ
          value: Europe/Vienna
        resources:
          requests:
            cpu: 50m
            memory: 192Mi
          limits:
            cpu: "1"
            memory: 1Gi
      - command:
        - /bin/sh
        - /scripts/ipleak.sh
        image: curlimages/curl:8.22.0
        name: ipleak
        volumeMounts:
        - mountPath: /scripts
          name: scripts
          readOnly: true
        env:
        - name: IPLEAK_EXPECTED_COUNTRY
          value: NL
        - name: IPLEAK_INTERVAL
          value: "300"
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: sabnzbd-config
      - name: media
        persistentVolumeClaim:
          claimName: jellyfin-pvc
      - name: scripts
        configMap:
          name: sabnzbd-scripts

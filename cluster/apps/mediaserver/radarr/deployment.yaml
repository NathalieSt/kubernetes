---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: radarr
    app.kubernetes.io/version: 6.4.4.10685-ls317
  name: radarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: radarr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radarr
        app.kubernetes.io/version: 6.4.4.10685-ls317
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
      - image: linuxserver/radarr:6.4.4.10685-ls317@sha256:c960f2b52ec6542dbe6707c5a21e696a7c74fd8b17997454f4d10a55dacee133
        name: radarr
        ports:
        - containerPort: 7878
          name: http
        volumeMounts:
        - mountPath: /config
          name: config
        - mountPath: /data
          name: media
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "10"
        - name: TZ
          value: Europe/Vienna
        - name: RADARR__POSTGRES__HOST
          value: postgres-rw.postgres.svc.cluster.local
        - name: RADARR__POSTGRES__PORT
          value: "5432"
        - name: RADARR__POSTGRES__USER
          valueFrom:
            secretKeyRef:
              key: username
              name: postgres-creds-secret
        - name: RADARR__POSTGRES__PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: postgres-creds-secret
        - name: RADARR__POSTGRES__MAINDB
          value: radarr-main
        - name: RADARR__POSTGRES__LOGDB
          value: radarr-log
        - name: RADARR__AUTH__METHOD
          value: External
        - name: RADARR__LOG__ANALYTICSENABLED
          value: "False"
        resources:
          requests:
            cpu: 50m
            memory: 192Mi
          limits:
            cpu: "1"
            memory: 1Gi
        readinessProbe:
          httpGet:
            path: /ping
            port: 7878
          periodSeconds: 30
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: radarr-config
      - name: media
        persistentVolumeClaim:
          claimName: jellyfin-pvc

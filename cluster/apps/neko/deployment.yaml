---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: neko
    app.kubernetes.io/version: 8342ddb
  name: neko
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: neko
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        homelab/neko-initial-preferences-hash: 8cf7c6da3b494d16
      labels:
        app.kubernetes.io/name: neko
        app.kubernetes.io/version: 8342ddb
    spec:
      imagePullSecrets:
      - name: forgejo-registry-secret
      initContainers:
      - command:
        - sh
        - -c
        - |
          #!/bin/sh
          #
          # Refuses to let a workload start while any secret it depends on is missing,
          # empty, or still holding the placeholder that vault-config writes when it
          # creates a KV path.
          #
          # Kept next to the generator rather than inlined so it can be linted and run by
          # hand:
          #
          #     GUARDED_SECRET=neko-secret VAULT_PATH=neko \
          #     EXPECTED_KEYS="password admin-password" \
          #     GUARD_DIR=./fixture ./check.sh
          #
          # See SecretGuard.res for why this exists at all.

          set -eu

          : "${GUARDED_SECRET:?GUARDED_SECRET is required}"
          : "${VAULT_PATH:?VAULT_PATH is required}"
          : "${EXPECTED_KEYS:?EXPECTED_KEYS is required}"

          dir="${GUARD_DIR:-/guarded}"
          status=0

          for key in $EXPECTED_KEYS; do
              file="$dir/$key"

              if [ ! -f "$file" ]; then
                  echo "refusing to start: ${GUARDED_SECRET} has no key '${key}'." >&2
                  echo "  The VaultStaticSecret syncs whatever is at kvv2/${VAULT_PATH}," >&2
                  echo "  and that key is not there yet." >&2
                  status=1
                  continue
              fi

              value=$(cat "$file")

              case "$value" in
                  # The prefix, not the whole sentence: the placeholder embeds the path
                  # and key, so matching it exactly would mean rebuilding the string here
                  # and keeping two copies of it in step.
                  "REPLACE ME"*)
                      echo "refusing to start: ${GUARDED_SECRET}/${key} is still the vault-config placeholder." >&2
                      echo "  This value is written into the manifests repository, so it is" >&2
                      echo "  public knowledge and must never reach a running workload." >&2
                      echo "  Fix it with:  vault kv patch kvv2/${VAULT_PATH} ${key}=<value>" >&2
                      status=1
                      ;;
                  "")
                      echo "refusing to start: ${GUARDED_SECRET}/${key} is empty." >&2
                      echo "  Fix it with:  vault kv patch kvv2/${VAULT_PATH} ${key}=<value>" >&2
                      status=1
                      ;;
              esac
          done

          if [ "$status" -ne 0 ]; then
              echo "" >&2
              echo "Once Vault holds real values the VaultStaticSecret picks them up within" >&2
              echo "its refresh interval, and the next restart of this pod succeeds on its" >&2
              echo "own — there is nothing else to do here." >&2
          fi

          exit "$status"
        image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
        name: neko-secret-guard
        volumeMounts:
        - mountPath: /guarded
          name: neko-secret-guard-volume
          readOnly: true
        env:
        - name: GUARDED_SECRET
          value: neko-secret
        - name: VAULT_PATH
          value: neko
        - name: EXPECTED_KEYS
          value: password admin-password
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 32Mi
        securityContext:
          capabilities:
            drop:
            - ALL
          runAsUser: 65534
          runAsGroup: 65534
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
      - image: code.netbird.nathalie-stiefsohn.eu/my-homelab/neko-helium:8342ddb@sha256:275f535704f5f23a2d5f23b03d71309afa47951c17f5d3b01c565cf55380a370
        name: neko
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 52000
          name: webrtc
          protocol: UDP
        volumeMounts:
        - mountPath: /etc/chromium/policies/managed
          name: browser-config-volume
          readOnly: true
        - mountPath: /opt/helium/initial_preferences
          subPath: initial_preferences
          name: initial-preferences-volume
          readOnly: true
        - mountPath: /dev/shm
          name: shm-volume
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: NEKO_WEBRTC_NAT1TO1
          value: $(POD_IP)
        - name: NEKO_WEBRTC_UDPMUX
          value: "52000"
        - name: NEKO_WEBRTC_ICESERVERS_FRONTEND
          value: "[{\"urls\":[\"turn:neko.netbird.nathalie-stiefsohn.eu:3478?transport=tcp\"],\"username\":\"neko\",\"credential\":\"neko-turn\"}]"
        - name: NEKO_DESKTOP_SCREEN
          value: 1920x1080@30
        - name: NEKO_CAPTURE_VIDEO_CODEC
          value: vp8
        - name: NEKO_CAPTURE_VIDEO_IDS
          value: main
        - name: NEKO_CAPTURE_VIDEO_PIPELINES
          value: "{\"main\":{\"fps\":\"20\",\"gst_encoder\":\"vp8enc\",\"show_pointer\":false,\"gst_params\":{\"target-bitrate\":\"round(3072 * 650)\",\"cpu-used\":\"16\",\"end-usage\":\"cbr\",\"threads\":\"4\",\"deadline\":\"1\",\"undershoot\":\"95\",\"buffer-size\":\"12288\",\"buffer-initial-size\":\"6144\",\"buffer-optimal-size\":\"9216\",\"keyframe-max-dist\":\"25\",\"min-quantizer\":\"4\",\"max-quantizer\":\"20\"}},\"legacy\":{\"fps\":\"20\",\"gst_encoder\":\"vp8enc\",\"show_pointer\":true,\"gst_params\":{\"target-bitrate\":\"round(3072 * 650)\",\"cpu-used\":\"16\",\"end-usage\":\"cbr\",\"threads\":\"4\",\"deadline\":\"1\",\"undershoot\":\"95\",\"buffer-size\":\"12288\",\"buffer-initial-size\":\"6144\",\"buffer-optimal-size\":\"9216\",\"keyframe-max-dist\":\"25\",\"min-quantizer\":\"4\",\"max-quantizer\":\"20\"}}}"
        - name: HELIUM_EXTRA_FLAGS
          value: --host-resolver-rules="MAP helium.netbird.nathalie-stiefsohn.eu internal-gateway.internal-gateway.svc.cluster.local"
        - name: NEKO_MEMBER_PROVIDER
          value: multiuser
        - name: NEKO_MEMBER_MULTIUSER_USER_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: neko-secret
        - name: NEKO_MEMBER_MULTIUSER_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: admin-password
              name: neko-secret
        - name: TZ
          value: Europe/Vienna
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 4000m
            memory: 4Gi
        securityContext:
          capabilities:
            add:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - SETGID
            - SETUID
            drop:
            - ALL
          allowPrivilegeEscalation: false
      - args:
        - -n
        - --log-file=stdout
        - --listening-port=3478
        - --listening-ip=$(POD_IP)
        - --relay-ip=$(POD_IP)
        - --min-port=49160
        - --max-port=49200
        - --relay-threads=1
        - --no-udp
        - --no-tls
        - --no-tcp-relay
        - --denied-peer-ip=0.0.0.0-255.255.255.255
        - --allowed-peer-ip=$(POD_IP)
        - --no-multicast-peers
        - --realm=neko
        - --lt-cred-mech
        - --user=neko:neko-turn
        - --fingerprint
        - --pidfile=/dev/null
        command:
        - turnserver
        image: coturn/coturn:4.18.0-alpine@sha256:c29135c08565810d37053f384584392b7c24b69570fc81a721b878d6fe63e04e
        name: turn
        ports:
        - containerPort: 3478
          name: turn
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        resources:
          requests:
            cpu: 20m
            memory: 16Mi
          limits:
            cpu: 1000m
            memory: 128Mi
        securityContext:
          capabilities:
            add:
            - NET_BIND_SERVICE
            drop:
            - ALL
          runAsUser: 65534
          runAsGroup: 65534
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
      volumes:
      - name: neko-secret-guard-volume
        secret:
          secretName: neko-secret
      - name: browser-config-volume
        configMap:
          name: neko-browser-config
          items:
          - key: policies.json
            path: policies.json
      - name: initial-preferences-volume
        configMap:
          name: neko-browser-config
          items:
          - key: initial_preferences
            path: initial_preferences
      - name: shm-volume
        emptyDir:
          medium: Memory
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/arch: amd64

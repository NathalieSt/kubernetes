---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: backup-dashboard
  name: backup-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backup-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backup-dashboard
    spec:
      imagePullSecrets:
      - name: forgejo-registry-secret
      serviceAccountName: backup-dashboard
      containers:
      - image: code.netbird.nathalie-stiefsohn.eu/my-homelab/backup-dashboard:latest
        name: backup-dashboard
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - mountPath: /secrets/restic-seed
          name: restic-seed
        - mountPath: /secrets/restic-overrides
          name: restic-overrides
        - mountPath: /secrets/garage-key
          name: garage-key
        env:
        - name: BASIC_AUTH_USER
          valueFrom:
            secretKeyRef:
              key: username
              name: backup-dashboard-basic-auth-secret
        - name: BASIC_AUTH_PASS
          valueFrom:
            secretKeyRef:
              key: password
              name: backup-dashboard-basic-auth-secret
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: restic-seed
        secret:
          secretName: restic-seed-password-secret
      - name: restic-overrides
        secret:
          secretName: restic-override-passwords-secret
          optional: true
      - name: garage-key
        secret:
          secretName: garage-backup-access-key-secret
      nodeSelector:
        kubernetes.io/arch: arm64

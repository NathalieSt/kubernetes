---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-dashboard-vault-serviceaccount
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-token-reviewer
rules:
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - authorization.k8s.io
  resources:
  - subjectaccessreviews
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backup-dashboard-vault-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vault-token-reviewer
subjects:
- kind: ServiceAccount
  name: backup-dashboard-vault-serviceaccount
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: backup-dashboard-vault-auth
spec:
  kubernetes:
    role: backup-dashboard
    serviceAccount: backup-dashboard-vault-serviceaccount
  vaultAuthGlobalRef:
    allowDefault: true
    namespace: vault-secrets-operator
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: backup-dashboard-basic-auth-static-secret
spec:
  vaultAuthRef: backup-dashboard-vault-auth
  mount: kvv2
  type: kv-v2
  path: backup-dashboard/basic-auth
  refreshAfter: 10s
  destination:
    create: true
    name: backup-dashboard-basic-auth-secret
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: backup-dashboard-registry-static-secret
spec:
  vaultAuthRef: backup-dashboard-vault-auth
  mount: kvv2
  type: kv-v2
  path: backup-dashboard/registry
  refreshAfter: 10s
  destination:
    create: true
    name: backup-dashboard-registry-secret
    type: kubernetes.io/dockerconfigjson

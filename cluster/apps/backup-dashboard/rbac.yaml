---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-dashboard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backup-dashboard-cluster-role
rules:
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - k8up.io
  resources:
  - backups
  - restores
  - schedules
  verbs:
  - get
  - list
  - watch
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backup-dashboard-cluster-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backup-dashboard-cluster-role
subjects:
- kind: ServiceAccount
  name: backup-dashboard
  namespace: backup-dashboard

---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: forgejo-runner
    app.kubernetes.io/version: "12.13"
  name: forgejo-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-runner
        app.kubernetes.io/version: "12.13"
    spec:
      initContainers:
      - command:
        - /bin/sh
        - -c
        - chown 1000:1000 /cache && chmod 0770 /cache
        image: busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
        name: fix-cache-permissions
        volumeMounts:
        - mountPath: /cache
          name: runner-cache
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        securityContext:
          runAsUser: 0
      automountServiceAccountToken: false
      containers:
      - command:
        - /bin/sh
        - -c
        - |
          set -eu

          # The daemon refuses to start without a reachable Docker Engine, and the dind sidecar writes its
          # certificates before the TLS listener is up — so wait for the listener and the shared socket.
          while [ ! -S /var/run/docker-shared/docker.sock ] || ! nc -z 127.0.0.1 2376; do sleep 1; done

          uuid=$(printf '%s' "$FORGEJO_RUNNER_SECRET" | cut -c1-16 | od -An -tx1 | tr -d ' \n' \
            | sed 's/\(.\{8\}\)\(.\{4\}\)\(.\{4\}\)\(.\{4\}\)\(.\{12\}\).*/\1-\2-\3-\4-\5/')

          cat > /data/config.yml <<EOF
          log:
            level: info
            job_level: info
          runner:
            # The only correct way to make CI parallel here. Scaling the Deployment does not: replicas share a
            # connection uuid, one config.yml and one bolt lock. Jobs run in the dind sidecar — raise both.
            capacity: 3
            timeout: 3h
            shutdown_timeout: 3h
          cache:
            # On, and on a node-local disk: the cache index is a bolt.db needing flock(), which fails on the
            # nfs-remote mount /data uses — so it silently never worked. Every StorageClass here is NFS-backed.
            enabled: true
            dir: /cache
          container:
            # Bind-mounted into every job container at /var/run/docker.sock. The path is resolved by the dind
            # daemon, which mounts the same volume, so it has to be identical on both sides.
            docker_host: unix:///var/run/docker-shared/docker.sock
          server:
            connections:
              forgejo:
                url: $FORGEJO_INSTANCE_URL
                uuid: $uuid
                token: $FORGEJO_RUNNER_SECRET
                labels:
                  - ubuntu-latest:docker://node:20-bookworm
                  - docker:docker://docker:27-cli
                  # Built locally by the image-warmer sidecar, never pulled. force_pull defaults to false, so a
                  # locally present image is used as-is — which is what makes a private image workable at all.
                  - go:docker://homelab-ci-go:1
                  - nvim:docker://homelab-ci-nvim:1
          EOF

          exec forgejo-runner daemon --config /data/config.yml
        image: code.forgejo.org/forgejo/runner:12.13
        name: forgejo-runner
        volumeMounts:
        - mountPath: /data
          name: runner-data
        - mountPath: /cache
          name: runner-cache
        - mountPath: /var/run/docker-shared
          name: docker-sock
        env:
        - name: FORGEJO_INSTANCE_URL
          value: http://forgejo-http.forgejo.svc.cluster.local:3000
        - name: XDG_CACHE_HOME
          value: /cache
        - name: FORGEJO_RUNNER_SECRET
          valueFrom:
            secretKeyRef:
              key: RUNNER_SECRET
              name: forgejo-runner-secret
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      - args:
        - --host=unix:///var/run/docker-shared/docker.sock
        - --group=1000
        image: docker:27-dind
        name: docker
        volumeMounts:
        - mountPath: /certs
          name: docker-certs
        - mountPath: /var/run/docker-shared
          name: docker-sock
        - mountPath: /var/lib/docker
          name: docker-storage
        env:
        - name: DOCKER_TLS_CERTDIR
          value: /certs
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 4000m
            memory: 8Gi
        securityContext:
          privileged: true
      - command:
        - /bin/sh
        - -c
        - |
          set -eu

          while [ ! -S /var/run/docker-shared/docker.sock ]; do sleep 1; done
          export DOCKER_HOST=unix:///var/run/docker-shared/docker.sock

          # QEMU for the architectures this node is not: images are built for amd64 and arm64 while this pod is
          # pinned to arm64. Writes the host kernel's binfmt_misc, is idempotent, and is not fatal on failure.
          echo "registering binfmt handlers"
          if docker run --privileged --rm tonistiigi/binfmt:qemu-v9.2.2 --install arm64,amd64; then
            echo "  ok: qemu registered"
          else
            echo "  WARNING: could not register binfmt; multi-arch builds that need emulation will fail" >&2
          fi

          # "<dockerfile> <tag>" per line, generated from ciImages so the tag always
          # matches the file it is built from and the label that names it.
          builds='go.Dockerfile homelab-ci-go:1
          nvim.Dockerfile homelab-ci-nvim:1'

          # No "is it already there?" shortcut on purpose: a build against a warm cache costs about a second
          # and, unlike an image-exists check, notices a changed Dockerfile instead of serving a stale image.
          echo "$builds" | while read -r file tag; do
            [ -n "$file" ] || continue
            echo "warming ${tag} from ${file}"
            # /dockerfiles as the context: it holds only these files, so the build
            # context stays a few kilobytes.
            if docker build -t "$tag" -f "/dockerfiles/${file}" /dockerfiles; then
              echo "  ok: ${tag}"
            else
              echo "  WARNING: could not build ${tag}; jobs using it will fail until this container restarts" >&2
            fi
          done

          echo "image warmer done; idling"
          while true; do sleep 3600; done
        image: docker:27-cli
        name: image-warmer
        volumeMounts:
        - mountPath: /var/run/docker-shared
          name: docker-sock
        - mountPath: /dockerfiles
          name: ci-dockerfiles
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
      volumes:
      - name: runner-data
        persistentVolumeClaim:
          claimName: forgejo-runner-data-pvc
      - name: runner-cache
        hostPath:
          path: /var/lib/forgejo-runner/0/cache
          type: DirectoryOrCreate
      - name: docker-storage
        hostPath:
          path: /var/lib/forgejo-runner/0/docker
          type: DirectoryOrCreate
      - name: docker-certs
        emptyDir: {}
      - name: docker-sock
        emptyDir: {}
      - name: ci-dockerfiles
        configMap:
          name: forgejo-runner-dockerfiles
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/hostname: debian-mgt-0

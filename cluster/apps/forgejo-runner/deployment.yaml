---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: forgejo-runner
    app.kubernetes.io/version: "12.13"
  name: forgejo-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-runner
        app.kubernetes.io/version: "12.13"
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - /bin/sh
        - -c
        - |

          set -eu

          # The daemon refuses to start without a reachable Docker Engine, and the dind
          # sidecar writes its client certificates before the TLS listener is up, so wait
          # for the listener and the shared socket rather than for the certificates alone.
          while [ ! -S /var/run/docker-shared/docker.sock ] || ! nc -z 127.0.0.1 2376; do sleep 1; done

          uuid=$(printf '%s' "$FORGEJO_RUNNER_SECRET" | cut -c1-16 | od -An -tx1 | tr -d ' \n' \
            | sed 's/\(.\{8\}\)\(.\{4\}\)\(.\{4\}\)\(.\{4\}\)\(.\{12\}\).*/\1-\2-\3-\4-\5/')

          cat > /data/config.yml <<EOF
          log:
            level: info
            job_level: info
          runner:
            capacity: 1
            timeout: 3h
            shutdown_timeout: 3h
          cache:
            enabled: true
            dir: /data/cache
          container:
            # Bind-mounted into every job container at /var/run/docker.sock so that steps
            # can run docker themselves. The path is resolved by the dind daemon, which
            # mounts the same volume, so it has to be identical on both sides.
            docker_host: unix:///var/run/docker-shared/docker.sock
          server:
            connections:
              forgejo:
                url: $FORGEJO_INSTANCE_URL
                uuid: $uuid
                token: $FORGEJO_RUNNER_SECRET
                labels:
                  - ubuntu-latest:docker://node:20-bookworm
                  - docker:docker://docker:27-cli
          EOF

          exec forgejo-runner daemon --config /data/config.yml
        image: code.forgejo.org/forgejo/runner:12.13
        name: forgejo-runner
        volumeMounts:
        - mountPath: /data
          name: runner-data
        - mountPath: /var/run/docker-shared
          name: docker-sock
        env:
        - name: FORGEJO_INSTANCE_URL
          value: http://forgejo-http.forgejo.svc.cluster.local:3000
        - name: FORGEJO_RUNNER_SECRET
          valueFrom:
            secretKeyRef:
              key: RUNNER_SECRET
              name: forgejo-runner-secret
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      - args:
        - --host=unix:///var/run/docker-shared/docker.sock
        - --group=1000
        image: docker:27-dind
        name: docker
        volumeMounts:
        - mountPath: /certs
          name: docker-certs
        - mountPath: /var/run/docker-shared
          name: docker-sock
        env:
        - name: DOCKER_TLS_CERTDIR
          value: /certs
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        securityContext:
          privileged: true
      volumes:
      - name: runner-data
        persistentVolumeClaim:
          claimName: forgejo-runner-data-pvc
      - name: docker-certs
        emptyDir: {}
      - name: docker-sock
        emptyDir: {}
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

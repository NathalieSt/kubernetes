---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: forgejo-runner
    app.kubernetes.io/version: sha256_e070b166b921f
  name: forgejo-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-runner
        app.kubernetes.io/version: sha256_e070b166b921f
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - /bin/sh
        - -c
        - sleep 5; [ -f /data/config.yml ] || forgejo-runner generate-config > /data/config.yml; [ -f /data/.runner ] || forgejo-runner register --no-interactive --instance "$FORGEJO_INSTANCE_URL" --token "$FORGEJO_RUNNER_REGISTRATION_TOKEN" --name forgejo-runner --labels ubuntu-latest:docker://node:20-bookworm --config /data/config.yml; forgejo-runner daemon --config /data/config.yml
        image: code.forgejo.org/forgejo/runner:sha256:e070b166b921f12a2abef432cf6108e63519d0183722c2a14ecbb8d0b0621652
        name: forgejo-runner
        volumeMounts:
        - mountPath: /data
          name: runner-data
        - mountPath: /certs
          name: docker-certs
        env:
        - name: FORGEJO_INSTANCE_URL
          value: http://forgejo-http.forgejo.svc.cluster.local:3000
        - name: FORGEJO_RUNNER_REGISTRATION_TOKEN
          valueFrom:
            secretKeyRef:
              key: RUNNER_TOKEN
              name: forgejo-runner-secret
        - name: DOCKER_HOST
          value: tcp://localhost:2376
        - name: DOCKER_TLS_CERTDIR
          value: /certs
        - name: DOCKER_CERT_PATH
          value: /certs/client
        - name: DOCKER_TLS_VERIFY
          value: "1"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      - image: docker:27-dind
        name: docker
        volumeMounts:
        - mountPath: /certs
          name: docker-certs
        env:
        - name: DOCKER_TLS_CERTDIR
          value: /certs
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        securityContext:
          privileged: true
      volumes:
      - name: runner-data
        persistentVolumeClaim:
          claimName: forgejo-runner-data-pvc
      - name: docker-certs
        emptyDir: {}
      securityContext:
        fsGroup: 1000

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: code-server-kubeconfig
  namespace: code-server
data:
  config: |
    # The read-only view of this cluster, for kubectl and for the Kubernetes
    # extension. Mounted from a ConfigMap; KUBECONFIG points at it.
    #
    # There is no credential in this file and there cannot be one. Both the token
    # and the CA come from the ServiceAccount projection the kubelet maintains at
    # /var/run/secrets/kubernetes.io/serviceaccount, and `tokenFile` is what makes
    # kubectl re-read the token from disk on every request rather than caching the
    # one it saw at startup — which matters, because that token is bound and
    # rotated roughly hourly. A token pasted in here as `token:` would work for an
    # hour and then stop, in a way that reads like a broken cluster.
    #
    # What this identity can do is decided entirely by RBAC, in CodeServerMeta:
    # get/list/watch, no secrets, no exec, no writes. Nothing about this file
    # constrains it, so do not read the absence of a namespace or the presence of a
    # context as a boundary.
    apiVersion: v1
    kind: Config
    current-context: homelab
    clusters:
      - name: homelab
        cluster:
          # The in-cluster Service, not a node address, so this survives a control
          # plane node being replaced. Reaching it needs the CiliumNetworkPolicy
          # beside this file: a plain NetworkPolicy cannot allow it.
          server: https://kubernetes.default.svc
          certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    contexts:
      - name: homelab
        context:
          cluster: homelab
          user: code-server
          # Its own namespace, so a bare `kubectl get pods` answers "what is running
          # where I am" rather than showing the default namespace, which is empty
          # in this cluster. Every other namespace is one -n away and readable.
          namespace: code-server
    users:
      - name: code-server
        user:
          tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token

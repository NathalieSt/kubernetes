---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: code-server
    app.kubernetes.io/version: sha256_ccd326184d71e
  name: code-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: code-server
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: code-server
        app.kubernetes.io/version: sha256_ccd326184d71e
    spec:
      initContainers:
      - command:
        - sh
        - -c
        - |
          #!/bin/sh
          #
          # Refuses to let a workload start while any secret it depends on is missing,
          # empty, or still holding the placeholder that vault-config writes when it
          # creates a KV path.
          #
          # Kept next to the generator rather than inlined so it can be linted and run by
          # hand:
          #
          #     GUARDED_SECRET=neko-secret VAULT_PATH=neko \
          #     EXPECTED_KEYS="password admin-password" \
          #     GUARD_DIR=./fixture ./check.sh
          #
          # See SecretGuard.res for why this exists at all.

          set -eu

          : "${GUARDED_SECRET:?GUARDED_SECRET is required}"
          : "${VAULT_PATH:?VAULT_PATH is required}"
          : "${EXPECTED_KEYS:?EXPECTED_KEYS is required}"

          dir="${GUARD_DIR:-/guarded}"
          status=0

          for key in $EXPECTED_KEYS; do
              file="$dir/$key"

              if [ ! -f "$file" ]; then
                  echo "refusing to start: ${GUARDED_SECRET} has no key '${key}'." >&2
                  echo "  The VaultStaticSecret syncs whatever is at kvv2/${VAULT_PATH}," >&2
                  echo "  and that key is not there yet." >&2
                  status=1
                  continue
              fi

              value=$(cat "$file")

              case "$value" in
                  # The prefix, not the whole sentence: the placeholder embeds the path
                  # and key, so matching it exactly would mean rebuilding the string here
                  # and keeping two copies of it in step.
                  "REPLACE ME"*)
                      echo "refusing to start: ${GUARDED_SECRET}/${key} is still the vault-config placeholder." >&2
                      echo "  This value is written into the manifests repository, so it is" >&2
                      echo "  public knowledge and must never reach a running workload." >&2
                      echo "  Fix it with:  vault kv patch kvv2/${VAULT_PATH} ${key}=<value>" >&2
                      status=1
                      ;;
                  "")
                      echo "refusing to start: ${GUARDED_SECRET}/${key} is empty." >&2
                      echo "  Fix it with:  vault kv patch kvv2/${VAULT_PATH} ${key}=<value>" >&2
                      status=1
                      ;;
              esac
          done

          if [ "$status" -ne 0 ]; then
              echo "" >&2
              echo "Once Vault holds real values the VaultStaticSecret picks them up within" >&2
              echo "its refresh interval, and the next restart of this pod succeeds on its" >&2
              echo "own — there is nothing else to do here." >&2
          fi

          exit "$status"
        image: busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
        name: code-server-secret-guard
        volumeMounts:
        - mountPath: /guarded
          name: code-server-secret-guard-volume
          readOnly: true
        env:
        - name: GUARDED_SECRET
          value: code-server-secret
        - name: VAULT_PATH
          value: code-server
        - name: EXPECTED_KEYS
          value: password
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 32Mi
        securityContext:
          capabilities:
            drop:
            - ALL
          runAsUser: 65534
          runAsGroup: 65534
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
      - command:
        - sh
        - -c
        - chown 1000:1000 /home/coder
        image: busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
        name: permission-fix
        volumeMounts:
        - mountPath: /home/coder
          name: home-volume
      - command:
        - sh
        - -c
        - cp /usr/bin/kubectl /opt/cluster-tools/kubectl
        image: alpine/k8s:1.34.4@sha256:22284d679fe7a0414199396fe33fec521a92a4fc9efbda35aaadd074c4576394
        name: cluster-tools
        volumeMounts:
        - mountPath: /opt/cluster-tools
          name: cluster-tools-volume
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 500m
            memory: 128Mi
        securityContext:
          capabilities:
            drop:
            - ALL
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
      - command:
        - sh
        - /etc/code-server/bootstrap/bootstrap.sh
        image: codercom/code-server@sha256:ccd326184d71efc5ebb94155eda7bb30153902342a35dbc8525450d81aa55012
        name: editor-bootstrap
        volumeMounts:
        - mountPath: /home/coder
          name: home-volume
        - mountPath: /etc/code-server/theme
          name: theme-volume
          readOnly: true
        - mountPath: /etc/code-server/bootstrap
          name: bootstrap-volume
          readOnly: true
        env:
        - name: HOME
          value: /home/coder
        - name: THEME_ASSET_DIR
          value: /etc/code-server/theme
        - name: SETTINGS_ASSET
          value: /etc/code-server/bootstrap/settings.json
        - name: BOOTSTRAP_ASSET_DIR
          value: /etc/code-server/bootstrap
        - name: CODE_SERVER_EXTENSIONS
          value: golang.go chenglou92.rescript-vscode redhat.vscode-yaml ms-azuretools.vscode-docker ms-kubernetes-tools.vscode-kubernetes-tools dbaeumer.vscode-eslint eamodio.gitlens anthropic.claude-code vscode-icons-team.vscode-icons
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 2000m
            memory: 1Gi
        securityContext:
          capabilities:
            drop:
            - ALL
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          runAsNonRoot: true
      - command:
        - sh
        - /etc/code-server/bootstrap/repos.sh
        image: codercom/code-server@sha256:ccd326184d71efc5ebb94155eda7bb30153902342a35dbc8525450d81aa55012
        name: repo-bootstrap
        volumeMounts:
        - mountPath: /home/coder
          name: home-volume
        - mountPath: /etc/code-server/bootstrap
          name: bootstrap-volume
          readOnly: true
        - mountPath: /etc/code-server/git-credentials
          name: git-secret-volume
          readOnly: true
        env:
        - name: HOME
          value: /home/coder
        - name: GIT_SECRET_DIR
          value: /etc/code-server/git-credentials
        - name: WORKSPACE_DIR
          value: /home/coder/dev/my-homelab
        - name: FORGEJO_BASE
          value: https://code.netbird.nathalie-stiefsohn.eu/my-homelab
        - name: GIT_CONFIG_COUNT
          value: "1"
        - name: GIT_CONFIG_KEY_0
          value: credential.https://code.netbird.nathalie-stiefsohn.eu.helper
        - name: GIT_CONFIG_VALUE_0
          value: "!f() { test \"$1\" = get && { echo \"username=$(cat /etc/code-server/git-credentials/username)\"; echo \"password=$(cat /etc/code-server/git-credentials/token)\"; }; }; f"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 2000m
            memory: 512Mi
        securityContext:
          capabilities:
            drop:
            - ALL
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          runAsNonRoot: true
      serviceAccountName: code-server-cluster-reader
      automountServiceAccountToken: true
      enableServiceLinks: false
      containers:
      - command:
        - /usr/bin/dumb-init
        - /usr/bin/code-server
        - --bind-addr
        - 0.0.0.0:8080
        - /home/coder/dev/my-homelab/my-homelab.code-workspace
        image: codercom/code-server@sha256:ccd326184d71efc5ebb94155eda7bb30153902342a35dbc8525450d81aa55012
        name: code-server
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - mountPath: /home/coder
          name: home-volume
        - mountPath: /tmp
          name: tmp-volume
        - mountPath: /etc/kube
          name: kubeconfig-volume
          readOnly: true
        - mountPath: /opt/cluster-tools
          name: cluster-tools-volume
          readOnly: true
        - mountPath: /etc/code-server/git-credentials
          name: git-secret-volume
          readOnly: true
        env:
        - name: PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: code-server-secret
        - name: HOME
          value: /home/coder
        - name: USER
          value: coder
        - name: LANG
          value: en_US.UTF-8
        - name: TZ
          value: Europe/Vienna
        - name: PATH
          value: /opt/cluster-tools:/home/coder/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        - name: KUBECONFIG
          value: /etc/kube/config
        - name: HOMELAB_METRICS_URL
          value: http://vmsingle-victoria-metrics-vmks.victoria-metrics.svc.cluster.local:8428
        - name: HOMELAB_LOGS_URL
          value: http://victoria-logs.victoria-logs.svc.cluster.local:9428
        - name: GIT_CONFIG_COUNT
          value: "1"
        - name: GIT_CONFIG_KEY_0
          value: credential.https://code.netbird.nathalie-stiefsohn.eu.helper
        - name: GIT_CONFIG_VALUE_0
          value: "!f() { test \"$1\" = get && { echo \"username=$(cat /etc/code-server/git-credentials/username)\"; echo \"password=$(cat /etc/code-server/git-credentials/token)\"; }; }; f"
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 4Gi
        securityContext:
          capabilities:
            drop:
            - ALL
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
      volumes:
      - name: code-server-secret-guard-volume
        secret:
          secretName: code-server-secret
      - name: home-volume
        persistentVolumeClaim:
          claimName: code-server-home-pvc
      - name: tmp-volume
        emptyDir: {}
      - name: theme-volume
        configMap:
          name: code-server-theme
      - name: bootstrap-volume
        configMap:
          name: code-server-bootstrap
      - name: kubeconfig-volume
        configMap:
          name: code-server-kubeconfig
      - name: cluster-tools-volume
        emptyDir: {}
      - name: git-secret-volume
        secret:
          secretName: code-server-git-secret
          optional: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault

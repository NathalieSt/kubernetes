---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: code-server-networkpolicy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: code-server
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: netbird
      podSelector:
        matchLabels:
          app.kubernetes.io/name: networkrouter
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: internal-gateway
      podSelector:
        matchLabels:
          app.kubernetes.io/name: internal-gateway

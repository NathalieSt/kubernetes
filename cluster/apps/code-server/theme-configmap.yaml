      "tokenColors": [
        {
          "name": "Comment",
          "scope": [
            "comment",
            "punctuation.definition.comment"
          ],
          "settings": {
            "foreground": "#9ea6a9",
            "fontStyle": "italic"
          }
        },
        {
          "name": "String",
          "scope": [
            "string",
            "constant.other.symbol",
            "punctuation.definition.string"
          ],
          "settings": {
            "foreground": "#93d9a6"
          }
        },
        {
          "name": "Regular expression",
          "scope": [
            "string.regexp",
            "constant.character.escape"
          ],
          "settings": {
            "foreground": "#aee6ff"
          }
        },
        {
          "name": "Number and language constant",
          "scope": [
            "constant.numeric",
            "constant.language",
            "constant.character",
            "keyword.other.unit"
          ],
          "settings": {
            "foreground": "#eebc77"
          }
        },
        {
          "name": "Keyword and storage",
          "scope": [
            "keyword",
            "keyword.control",
            "storage",
            "storage.type",
            "storage.modifier"
          ],
          "settings": {
            "foreground": "#f5adce"
          }
        },
        {
          "name": "Operator and punctuation",
          "scope": [
            "keyword.operator",
            "punctuation",
            "meta.brace"
          ],
          "settings": {
            "foreground": "#b8bfc2"
          }
        },
        {
          "name": "Function",
          "scope": [
            "entity.name.function",
            "support.function",
            "variable.function",
            "meta.function-call.generic"
          ],
          "settings": {
            "foreground": "#6bd5ff"
          }
        },
        {
          "name": "Type and class",
          "scope": [
            "entity.name.type",
            "entity.name.class",
            "entity.name.namespace",
            "entity.other.inherited-class",
            "support.class",
            "support.type"
          ],
          "settings": {
            "foreground": "#bfbeff"
          }
        },
        {
          "name": "Variable",
          "scope": [
            "variable",
            "variable.other",
            "meta.definition.variable.name",
            "support.variable"
          ],
          "settings": {
            "foreground": "#f1f4f5"
          }
        },
        {
          "name": "Parameter",
          "scope": [
            "variable.parameter"
          ],
          "settings": {
            "foreground": "#b8bfc2",
            "fontStyle": "italic"
          }
        },
        {
          "name": "Property and key",
          "scope": [
            "support.type.property-name",
            "meta.object-literal.key",
            "variable.other.property",
            "entity.name.tag.yaml"
          ],
          "settings": {
            "foreground": "#6bd5ff"
          }
        },
        {
          "name": "Markup tag",
          "scope": [
            "entity.name.tag",
            "punctuation.definition.tag"
          ],
          "settings": {
            "foreground": "#f5adce"
          }
        },
        {
          "name": "Markup attribute",
          "scope": [
            "entity.other.attribute-name",
            "meta.decorator",
            "entity.name.label"
          ],
          "settings": {
            "foreground": "#eebc77"
          }
        },
        {
          "name": "Markdown heading",
          "scope": [
            "markup.heading",
            "entity.name.section"
          ],
          "settings": {
            "foreground": "#ffcbe2",
            "fontStyle": "bold"
          }
        },
        {
          "name": "Markdown bold",
          "scope": [
            "markup.bold"
          ],
          "settings": {
            "foreground": "#f1f4f5",
            "fontStyle": "bold"
          }
        },
        {
          "name": "Markdown italic",
          "scope": [
            "markup.italic"
          ],
          "settings": {
            "foreground": "#f1f4f5",
            "fontStyle": "italic"
          }
        },
        {
          "name": "Markdown code",
          "scope": [
            "markup.inline.raw",
            "markup.fenced_code",
            "markup.raw"
          ],
          "settings": {
            "foreground": "#93d9a6"
          }
        },
        {
          "name": "Markdown link",
          "scope": [
            "markup.underline.link"
          ],
          "settings": {
            "foreground": "#6bd5ff"
          }
        },
        {
          "name": "Diff inserted",
          "scope": [
            "markup.inserted"
          ],
          "settings": {
            "foreground": "#93d9a6"
          }
        },
        {
          "name": "Diff deleted",
          "scope": [
            "markup.deleted"
          ],
          "settings": {
            "foreground": "#ffaea2"
          }
        },
        {
          "name": "Diff changed",
          "scope": [
            "markup.changed"
          ],
          "settings": {
            "foreground": "#eebc77"
          }
        },
        {
          "name": "Invalid",
          "scope": [
            "invalid",
            "invalid.illegal"
          ],
          "settings": {
            "foreground": "#ffaea2"
          }
        }
      ]
    }

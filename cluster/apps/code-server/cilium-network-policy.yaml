---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: code-server-cilium-networkpolicy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: code-server
  description: Read-only access to the API server and to the metrics and log stores.
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
      rules:
        dns:
        - matchPattern: "*"
  - toFQDNs:
    - matchName: open-vsx.org
    - matchPattern: "*.open-vsx.org"
    - matchPattern: "*.blob.core.windows.net"
    - matchName: code.netbird.nathalie-stiefsohn.eu
    - matchName: github.com
    - matchPattern: "*.github.com"
    - matchPattern: "*.githubusercontent.com"
    - matchName: codeberg.org
    - matchPattern: "*.codeberg.org"
    - matchPattern: "*.npmjs.org"
    - matchName: pypi.org
    - matchPattern: "*.pythonhosted.org"
    - matchName: crates.io
    - matchPattern: "*.crates.io"
    - matchPattern: "*.golang.org"
    - matchPattern: "*.rubygems.org"
    - matchPattern: "*.debian.org"
    - matchPattern: "*.ubuntu.com"
    - matchPattern: "*.alpinelinux.org"
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
      - port: "80"
        protocol: TCP
  - toFQDNs:
    - matchName: github.com
    - matchPattern: "*.github.com"
    - matchName: codeberg.org
    toPorts:
    - ports:
      - port: "22"
        protocol: TCP
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: "6443"
        protocol: TCP
      - port: "443"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: victoria-metrics
    toPorts:
    - ports:
      - port: "8428"
        protocol: TCP
      rules:
        http:
        - method: ^(GET|POST)$
          path: ^/api/v1/query(_range)?([?].*)?$
        - method: ^(GET|POST)$
          path: ^/api/v1/(series|labels|metadata|targets|rules|alerts)([?].*)?$
        - method: ^(GET|POST)$
          path: ^/api/v1/label/[^/?]+/values([?].*)?$
        - method: ^(GET|POST)$
          path: ^/api/v1/status/[^?]*([?].*)?$
        - method: ^(GET|POST)$
          path: ^/api/v1/export[^?]*([?].*)?$
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: victoria-logs
    toPorts:
    - ports:
      - port: "9428"
        protocol: TCP
      rules:
        http:
        - method: ^(GET|POST)$
          path: ^/select/.*$

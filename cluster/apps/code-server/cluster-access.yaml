---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: code-server-cluster-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: code-server-cluster-reader
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  - persistentvolumes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - admissionregistration.k8s.io
  - apiextensions.k8s.io
  - apiregistration.k8s.io
  - coordination.k8s.io
  - events.k8s.io
  - node.k8s.io
  - rbac.authorization.k8s.io
  - scheduling.k8s.io
  - storage.k8s.io
  resources:
  - "*"
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - cilium.io
  - deviceplugin.intel.com
  - eventing.keda.sh
  - fpga.intel.com
  - keda.sh
  - netbird.io
  - nfd.k8s-sigs.io
  - postgresql.cnpg.io
  - secrets.hashicorp.com
  resources:
  - "*"
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: code-server-cluster-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: code-server-cluster-reader
subjects:
- kind: ServiceAccount
  name: code-server-cluster-reader
  namespace: code-server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: code-server-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
- kind: ServiceAccount
  name: code-server-cluster-reader
  namespace: code-server

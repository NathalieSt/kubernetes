---
apiVersion: v1
kind: ConfigMap
metadata:
  name: code-server-bootstrap
  namespace: code-server
data:
  bootstrap.sh: |
    #!/bin/sh
    # Prepares the editor's home directory before code-server starts.
    #
    # Runs as an init container from the code-server image itself, as the same uid
    # the editor runs as, against the same persistent volume. That is what makes
    # `code-server --install-extension` the right tool here rather than an
    # unpacked download: it is the same code path the UI uses, so the extension
    # tree and its index stay in the shape the editor expects.
    #
    # Three jobs, in order of how much they are allowed to touch:
    #
    #   1. The Pennant theme, packaged and reinstalled on every start. It is
    #      generated output and nobody edits it in place, so there is nothing to
    #      preserve.
    #   2. The default settings, written exactly once against a marker file. After
    #      that the file belongs to whoever is using the editor.
    #   3. The declared extensions, installed if missing. Never removed.
    #
    # Nothing here is allowed to fail the pod except a genuinely broken volume.
    # Extension installation reaches Open VSX over the internet, and an editor that
    # will not start because a marketplace is having an afternoon is a worse outcome
    # than an editor with one missing extension.

    set -eu

    log() { echo "bootstrap: $*" >&2; }

    data_dir="$HOME/.local/share/code-server"
    ext_dir="$data_dir/extensions"
    user_dir="$data_dir/User"
    seed_marker="$data_dir/.pennant-seeded"

    mkdir -p "$ext_dir" "$user_dir"

    # ------------------------------------------------------------------- theme
    #
    # Packaged as a .vsix and installed, rather than written into the extensions
    # directory and left for the scanner to find. The scanner does not find it:
    # extensions.json is an install index rather than a cache of what is on disk,
    # and on Code 1.135 the extensions directory is enumerated from that file. A
    # hand-placed directory is invisible; see PennantThemeScript.res, which also
    # repairs the two ways the index can be left inconsistent by the old approach.
    #
    # The image ships no zip, no jq and no `node` on PATH — but code-server is a
    # node application, so its own interpreter is there to be used. Resolved rather
    # than hardcoded so an image layout change fails here, loudly, instead of
    # further down as a theme that quietly stopped being installed.
    if command -v node >/dev/null 2>&1; then
    	node_bin=node
    elif [ -x /usr/lib/code-server/lib/node ]; then
    	node_bin=/usr/lib/code-server/lib/node
    else
    	log "WARNING: no node interpreter found — skipping the Pennant theme"
    	node_bin=""
    fi

    if [ -n "$node_bin" ]; then
    	vsix="$data_dir/.pennant-theme.vsix"
    	log "building the Pennant theme package"

    	# The script prints the extension id on stdout and its narration on stderr,
    	# so this captures the one without swallowing the other.
    	if theme_id=$("$node_bin" "$BOOTSTRAP_ASSET_DIR/pennant-theme.mjs" \
    		"$THEME_ASSET_DIR" "$ext_dir" "$vsix"); then

    		# --force because the version in package.json does not change when the
    		# palette does. Without it a palette bump would build a new .vsix, find
    		# 1.0.0 already installed and keep the old colours indefinitely.
    		if timeout 300 code-server --install-extension "$vsix" --force >&2; then
    			log "installed $theme_id"

    			# The directory the previous approach hand-placed. Inert now — it is
    			# not in the index, which is the whole bug — but it is also the
    			# thing someone debugging this will find first and believe, so it
    			# goes once the real install has succeeded.
    			legacy_dir="$ext_dir/pennant-theme"
    			if [ -d "$legacy_dir" ]; then
    				log "removing the unregistered $legacy_dir left by the old layout"
    				rm -rf "$legacy_dir"
    			fi
    		else
    			log "WARNING: could not install the Pennant theme — the editor will start with its default colours"
    		fi
    	else
    		log "WARNING: could not build the Pennant theme package"
    	fi

    	rm -f "$vsix"
    fi

    # ---------------------------------------------------------------- settings
    #
    # The marker rather than the file's own absence, so that a user who deletes
    # every setting they disagreed with does not get them all back on the next pod
    # restart. The one-time backup exists because this seeding was added to an
    # editor that had already been in use, and overwriting a settings file someone
    # had edited with no copy of it would be the kind of small data loss that is
    # only noticed much later.
    if [ -e "$seed_marker" ]; then
    	log "settings already seeded; leaving $user_dir/settings.json alone"
    else
    	if [ -e "$user_dir/settings.json" ]; then
    		log "keeping the previous settings.json as settings.json.pre-pennant"
    		cp "$user_dir/settings.json" "$user_dir/settings.json.pre-pennant"
    	fi
    	cp "$SETTINGS_ASSET" "$user_dir/settings.json"
    	: >"$seed_marker"
    	log "seeded $user_dir/settings.json"
    fi

    # -------------------------------------------------------------- extensions
    #
    # One listing up front rather than one probe per extension: --list-extensions
    # starts a Node process and scans the whole tree, and doing that eight times
    # turns a fast start into a slow one for no additional information.
    #
    # The listing is taken after the theme is installed, so the theme is in it and
    # is not reinstalled from a marketplace that has never heard of it.
    installed=$(code-server --list-extensions 2>/dev/null || true)

    for id in $CODE_SERVER_EXTENSIONS; do
    	if echo "$installed" | grep -qixF -- "$id"; then
    		log "$id is already installed"
    		continue
    	fi

    	log "installing $id"
    	# Bounded, because an unbounded one is the difference between a missing
    	# extension and a pod that never starts. A stalled TCP connection to the
    	# marketplace does not fail on its own, and this runs in an init container:
    	# the editor is not serving anything while it waits, and the Kustomization
    	# holds a kustomize-controller worker for its full 10m timeout behind it.
    	#
    	# Per install, not for the loop: a marketplace that is simply down fails
    	# every one of these in seconds, so the case this bounds is one or two
    	# hanging connections and not all eight. A cold install of the whole list
    	# takes two to four minutes when the marketplace is healthy.
    	if timeout 300 code-server --install-extension "$id" >&2; then
    		log "installed $id"
    	else
    		# Not fatal, and worth being loud about: this is the one step here that
    		# depends on something outside the cluster. A missing extension shows up
    		# as an editor that has lost a language server, which is easy to
    		# misread as a broken language server.
    		log "WARNING: could not install $id — the editor will start without it"
    	fi
    done

    log "done"

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: security-dashboard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: security-dashboard-cluster-role
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
- apiGroups:
  - ""
  resources:
  - pods/log
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: security-dashboard-cluster-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: security-dashboard-cluster-role
subjects:
- kind: ServiceAccount
  name: security-dashboard
  namespace: security-dashboard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: security-dashboard-role
rules:
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: security-dashboard-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: security-dashboard-role
subjects:
- kind: ServiceAccount
  name: security-dashboard
  namespace: security-dashboard

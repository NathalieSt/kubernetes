---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kavita-theme
  namespace: kavita
data:
  pennant-light.css: |
    /* Pennant -- the homelab's shared palette, from the styles repo.
     * GENERATED by kubernetes-generator (src/generators/theme/KavitaTheme.res). Edit tokens.json in styles
     * and regenerate. The selector below must match the filename: Kavita derives the class from it. */

    :root .bg-pennant-light {
      --theme-color: #984a72;
      --color-scheme: light;
      --primary-color: #984a72;
      --primary-color-dark-shade: #763757;
      --primary-color-darker-shade: #763757;
      --primary-color-darkest-shade: #54263d;
      --error-color: #af3d34;
      --bs-body-bg: #f9fafb;
      --body-text-color: #2e3436;
      --btn-icon-filter: none;

      /* Scrollbar */
      --primary-color-scrollbar: #984a72bf;

      /* Navbar */
      --navbar-bg-color: #ffffff;
      --navbar-text-color: #2e3436;
      --navbar-fa-icon-color: #2e3436;
      --navbar-btn-hover-outline-color: #984a72;

      /* Side Nav */
      --side-nav-bg-color: #ffffff66;
      --side-nav-mobile-bg-color: #ffffff;
      --side-nav-box-shadow: #e3e7e980;
      --side-nav-hover-text-color: #f9fafb;
      --side-nav-hover-bg-color: #984a72;
      --side-nav-color: #2e3436;
      --side-nav-border: none;
      --side-nav-border-closed: none;
      --side-nav-closed-bg-color: transparent;
      --side-nav-item-active-color: var(--primary-color);
      --side-nav-item-active-text-color: #f9fafb;
      --side-nav-active-bg-color: #984a72;
      --side-nav-overlay-color: #007495;

      /* Inputs */
      --input-bg-color: #f1f4f5;
      --input-bg-readonly-color: #e3e7e9;
      --input-focused-border-color: #b95f8c;
      --input-text-color: #2e3436;
      --input-placeholder-color: #838b8e;
      --input-border-color: #e3e7e9;
      --input-focus-boxshadow-color: #b95f8c80;
      --input-range-color: var(--primary-color);
      --input-range-active-color: var(--primary-color-darker-shade);

      /* Buttons */
      --btn-focus-boxshadow-color: #b95f8c80;
      --btn-primary-text-color: #f9fafb;
      --btn-primary-bg-color: var(--primary-color);
      --btn-primary-border-color: var(--primary-color);
      --btn-primary-hover-text-color: #f9fafb;
      --btn-primary-hover-bg-color: var(--primary-color-darker-shade);
      --btn-primary-hover-border-color: var(--primary-color-darker-shade);
      --btn-alt-bg-color: #f1f4f5;
      --btn-alt-border-color: #e3e7e9;
      --btn-alt-hover-bg-color: #e3e7e9;
      --btn-alt-focus-bg-color: #e3e7e9;
      --btn-alt-focus-boxshadow-color: #b95f8c80;
      --btn-fa-icon-color: #666d71;
      --btn-disabled-bg-color: #f1f4f5;
      --btn-disabled-text-color: #838b8e;
      --btn-disabled-border-color: #e3e7e9;

      /* Nav */
      --nav-tab-border-color: #e3e7e9;
      --nav-tab-text-color: var(--body-text-color);
      --nav-tab-bg-color: var(--primary-color);
      --nav-tab-hover-border-color: var(--primary-color);
      --nav-tab-active-text-color: #f9fafb;
      --nav-tab-border-hover-color: transparent;
      --nav-tab-hover-text-color: var(--body-text-color);
      --nav-tab-hover-bg-color: transparent;
      --nav-tab-border-top: #e3e7e9;
      --nav-tab-border-left: #e3e7e9;
      --nav-tab-border-bottom: #e3e7e9;
      --nav-tab-border-right: #e3e7e9;
      --nav-tab-hover-border-top: #e3e7e9;
      --nav-tab-hover-border-left: #e3e7e9;
      --nav-tab-hover-border-bottom: var(--bs-body-bg);
      --nav-tab-hover-border-right: #e3e7e9;
      --nav-tab-active-hover-bg-color: var(--primary-color);

      --nav-link-bg-color: var(--primary-color);
      --nav-link-active-text-color: #f9fafb;
      --nav-link-text-color: #2e3436;

      --nav-header-text-color: #f9fafb;
      --nav-header-bg-color: #984a72;

      /* Toasts */
      --toast-success-bg-color: #1e7c44;
      --toast-error-bg-color: #af3d34;
      --toast-info-bg-color: #635bb1;
      --toast-warning-bg-color: #8e5e00;

      /* Checkboxes */
      --checkbox-checked-bg-color: var(--primary-color);
      --checkbox-border-color: #838b8e;
      --checkbox-focus-border-color: var(--primary-color);
      --checkbox-focus-boxshadow-color: #b95f8c80;

      /* Tagbadge */
      --tagbadge-border-color: #e3e7e9;
      --tagbadge-text-color: var(--body-text-color);
      --tagbadge-bg-color: #f1f4f5;
      --tagbadge-filled-border-color: #e3e7e9;
      --tagbadge-filled-text-color: #763757;
      --tagbadge-filled-bg-color: #ffe4f0;

      /* List items */
      --list-group-item-text-color: var(--body-text-color);
      --list-group-item-bg-color: #ffffff;
      --list-group-item-border-color: #e3e7e9;
      --list-group-hover-text-color: #f9fafb;
      --list-group-hover-bg-color: #984a72;
      --list-group-active-border-color: none;

      /* Popover */
      --popover-body-bg-color: #ffffff;
      --popover-body-text-color: #2e3436;
      --popover-outerarrow-color: transparent;
      --popover-arrow-color: transparent;
      --popover-bg-color: #ffffff;
      --popover-border-color: #e3e7e9;

      /* Pagination */
      --pagination-active-link-border-color: var(--primary-color);
      --pagination-active-link-bg-color: var(--primary-color);
      --pagination-active-link-text-color: #f9fafb;
      --pagination-link-border-color: #e3e7e9;
      --pagination-link-text-color: #2e3436;
      --pagination-link-bg-color: #ffffff80;
      --pagination-focus-border-color: var(--primary-color);
      --pagination-link-hover-color: var(--primary-color);

      /* Progress */
      --progress-bg-color: #e3e7e9;
      --progress-bar-color: var(--primary-color);

      /* Dropdown */
      --dropdown-item-hover-text-color: #f9fafb;
      --dropdown-item-hover-bg-color: #984a72;
      --dropdown-item-text-color: #2e3436;
      --dropdown-item-bg-color: #ffffff;
      --dropdown-overlay-color: #e3e7e980;

      /* Accordion */
      --accordion-header-text-color: #2e3436;
      --accordion-header-bg-color: #f1f4f5;
      --accordion-body-bg-color: #ffffff;
      --accordion-body-border-color: #e3e7e9;
      --accordion-body-text-color: var(--body-text-color);
      --accordion-header-collapsed-text-color: #2e3436;
      --accordion-header-collapsed-bg-color: #f1f4f5;
      --accordion-active-body-bg-color: #ffffff;

      /* Breadcrumb */
      --breadcrumb-bg-color: #f1f4f5;
      --breadcrumb-item-text-color: var(--body-text-color);

      /* Rating star */
      --ratingstar-color: #8e5e00;
      --ratingstar-star-empty: #e3e7e9;
      --ratingstar-star-filled: #8e5e00;

      /* Global */
      --hr-color: #e3e7e9;
      --accent-bg-color: #f1f4f5;
      --accent-text-color: #666d71;

      /* Card */
      --card-bg-color: #ffffff;
      --card-text-color: var(--body-text-color);
      --card-border-color: #e3e7e9;
      --card-progress-bar-color: var(--primary-color);
      --card-overlay-bg-color: #e3e7e900;
      --card-overlay-hover-bg-color: #e3e7e933;

      /* Slider */
      --slider-text-color: #2e3436;

      /* Manga Reader */
      --manga-reader-overlay-bg-color: #ffffff80;
      --manga-reader-overlay-text-color: #2e3436;
      --manga-reader-bg-color: #f9fafb;
      --manga-reader-next-highlight-bg-color: #984a72;
      --manga-reader-prev-highlight-bg-color: #007495;

      /* Radios */
      --radio-accent-color: var(--primary-color);
      --radio-hover-accent-color: var(--primary-color);
      --radio-focus-boxshadow-color: #b95f8c80;

      /* Carousel */
      --carousel-header-text-color: var(--body-text-color);

      /* Drawer */
      --drawer-background-color: #f9fafb;
      --drawer-bg-color: #ffffff;
      --drawer-text-color: #2e3436;

      /* Event Widget */
      --event-widget-bg-color: #ffffff;
      --event-widget-item-bg-color: #f1f4f5;
      --event-widget-text-color: var(--body-text-color);
      --event-widget-item-border-color: #e3e7e9;
      --event-widget-border-color: #e3e7e9;

      /* Bulk Selection */
      --bulk-selection-text-color: #2e3436;
      --bulk-selection-highlight-text-color: var(--primary-color);

      /* Card list */
      --card-list-item-bg-color: linear-gradient(
        180deg,
        #f1f4f526 0%,
        #f1f4f526 1%,
        #f1f4f500 100%
      );
    }

    /* Bootstrap's outline button reads its own --bs-* variables rather than
     Kavita's, so it is the one place a theme has to write rules instead of
     values. */
    .bg-pennant-light .btn-outline-primary {
      --bs-btn-color: var(--primary-color) !important;
      --bs-btn-border-color: var(--primary-color) !important;
      --bs-btn-hover-color: #f9fafb !important;
      --bs-btn-hover-bg: var(--primary-color) !important;
      --bs-btn-hover-border-color: var(--primary-color) !important;
      --bs-btn-active-bg: var(--primary-color-darkest-shade) !important;
      --bs-btn-active-border-color: var(--primary-color-darkest-shade) !important;
      --bs-btn-disabled-color: #838b8e !important;
      --bs-btn-disabled-border-color: #e3e7e9 !important;
    }
  pennant.css: |
    /* Pennant -- the homelab's shared palette, from the styles repo.

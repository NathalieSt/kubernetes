---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: kavita
    app.kubernetes.io/version: sha256_ca6af7a18d712
  name: kavita
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kavita
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kavita
        app.kubernetes.io/version: sha256_ca6af7a18d712
    spec:
      initContainers:
      - command:
        - sh
        - -c
        - chown -R 1000:1000 /kavita/config
        image: busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
        name: permission-fix
        volumeMounts:
        - mountPath: /kavita/config
          name: config-volume
      - command:
        - sh
        - /scripts/oidc-appsettings.sh
        - /kavita/config/appsettings.json
        image: mikefarah/yq@sha256:b9285dd3b0bea3c34d0c54415dd48d767dabd9644d489bd6e253660847b58419
        name: oidc-config
        volumeMounts:
        - mountPath: /kavita/config
          name: config-volume
        - mountPath: /scripts
          name: oidc-script-volume
          readOnly: true
        - mountPath: /secrets/oidc
          name: oidc-secret-volume
          readOnly: true
        - mountPath: /tmp
          name: tmp
        env:
        - name: OIDC_AUTHORITY
          value: https://auth.netbird.nathalie-stiefsohn.eu
        - name: OIDC_CLIENT_ID
          value: kavita
        - name: OIDC_CUSTOM_SCOPES
          value: groups
        - name: OIDC_SECRET_FILE
          value: /secrets/oidc/client-secret
        securityContext:
          capabilities:
            drop:
            - ALL
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
      - image: jvmilazz0/kavita@sha256:ca6af7a18d7124d014702983c2364e485294f808c1552e9555f2595b7cda7982
        name: kavita
        ports:
        - containerPort: 5000
          name: kavita
        volumeMounts:
        - mountPath: /kavita/config
          name: config-volume
        - mountPath: /kavita/config/themes
          name: theme-volume
          readOnly: true
        - mountPath: /books
          name: library-volume
          readOnly: true
        env:
        - name: TZ
          value: Europe/Vienna
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        securityContext:
          capabilities:
            drop:
            - ALL
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
      volumes:
      - name: config-volume
        persistentVolumeClaim:
          claimName: kavita-config-pvc
      - name: library-volume
        persistentVolumeClaim:
          claimName: kavita-library-pvc
      - name: theme-volume
        configMap:
          name: kavita-theme
      - name: oidc-script-volume
        configMap:
          name: kavita-oidc-script
          defaultMode: 365
      - name: oidc-secret-volume
        secret:
          secretName: kavita-oidc-secret
      - name: tmp
        emptyDir: {}

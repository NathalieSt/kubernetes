---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: paperless
    app.kubernetes.io/version: 3.2.1
  name: paperless
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: paperless
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paperless
        app.kubernetes.io/version: 3.2.1
    spec:
      initContainers:
      - command:
        - sh
        - -c
        - chown 1000:1000 /usr/src/paperless/data /usr/src/paperless/media
        image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
        name: permission-fix
        volumeMounts:
        - mountPath: /usr/src/paperless/data
          name: data
        - mountPath: /usr/src/paperless/media
          name: media
      - args:
        - valkey-server
        - --bind
        - 127.0.0.1
        - --port
        - "6379"
        - --save
        - ""
        - --appendonly
        - "no"
        image: valkey/valkey:9-alpine3.22
        name: valkey
        volumeMounts:
        - mountPath: /data
          name: valkey
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 250m
            memory: 128Mi
        securityContext:
          capabilities:
            drop:
            - ALL
          runAsUser: 999
          runAsGroup: 999
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        startupProbe:
          exec:
            command:
            - valkey-cli
            - ping
          periodSeconds: 2
          failureThreshold: 30
        restartPolicy: Always
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
      - image: ghcr.io/paperless-ngx/paperless-ngx:3.2.1@sha256:5fa76604a81df6945086e0837b14b56543d137e8ce4f311cc5d9ebe907e74e79
        name: paperless
        ports:
        - containerPort: 8000
          name: http
        volumeMounts:
        - mountPath: /usr/src/paperless/data
          name: data
        - mountPath: /usr/src/paperless/media
          name: media
        - mountPath: /usr/src/paperless/consume
          name: consume
        - mountPath: /tmp
          name: tmp
        - mountPath: /run
          name: run
        env:
        - name: TZ
          value: Europe/Vienna
        - name: PAPERLESS_TIME_ZONE
          value: Europe/Vienna
        - name: PAPERLESS_URL
          value: https://paperless.netbird.nathalie-stiefsohn.eu
        - name: PAPERLESS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              key: secret-key
              name: paperless-secret
        - name: PAPERLESS_REDIS
          value: redis://127.0.0.1:6379/0
        - name: PAPERLESS_DBHOST
          value: postgres-rw.postgres.svc.cluster.local
        - name: PAPERLESS_DBPORT
          value: "5432"
        - name: PAPERLESS_DBNAME
          value: paperless
        - name: PAPERLESS_DBUSER
          valueFrom:
            secretKeyRef:
              key: username
              name: postgres-creds-secret
        - name: PAPERLESS_DBPASS
          valueFrom:
            secretKeyRef:
              key: password
              name: postgres-creds-secret
        - name: PAPERLESS_OCR_LANGUAGE
          value: deu+eng
        - name: PAPERLESS_APPS
          value: allauth.socialaccount.providers.openid_connect
        - name: OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              key: client-secret
              name: paperless-oidc-secret
        - name: PAPERLESS_SOCIALACCOUNT_PROVIDERS
          value: "{\"openid_connect\":{\"OAUTH_PKCE_ENABLED\":true,\"SCOPE\":[\"openid\",\"profile\",\"email\",\"groups\"],\"APPS\":[{\"provider_id\":\"authelia\",\"name\":\"Authelia\",\"client_id\":\"paperless\",\"secret\":\"$(OIDC_CLIENT_SECRET)\",\"settings\":{\"server_url\":\"https://auth.netbird.nathalie-stiefsohn.eu\"}}]}}"
        - name: PAPERLESS_SOCIAL_AUTO_SIGNUP
          value: "true"
        - name: PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS
          value: "true"
        - name: PAPERLESS_SOCIAL_ACCOUNT_SYNC_SUPERUSER_GROUP
          value: admins
        - name: PAPERLESS_DISABLE_REGULAR_LOGIN
          value: "true"
        resources:
          requests:
            cpu: 250m
            memory: 768Mi
          limits:
            cpu: 2000m
            memory: 2Gi
        securityContext:
          capabilities:
            drop:
            - ALL
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        readinessProbe:
          httpGet:
            path: /accounts/login/
            port: 8000
          periodSeconds: 15
        startupProbe:
          httpGet:
            path: /accounts/login/
            port: 8000
          periodSeconds: 10
          failureThreshold: 60
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: paperless-data-pvc
      - name: media
        persistentVolumeClaim:
          claimName: paperless-media-pvc
      - name: consume
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      - name: run
        emptyDir: {}
      - name: valkey
        emptyDir: {}
      securityContext:
        seccompProfile:
          type: RuntimeDefault

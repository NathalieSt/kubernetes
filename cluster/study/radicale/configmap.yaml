---
apiVersion: v1
kind: ConfigMap
metadata:
  name: radicale-config
  namespace: radicale
data:
  config: |
    [server]
    hosts = 0.0.0.0:5232

    [auth]
    type = htpasswd
    htpasswd_filename = /secrets/htpasswd
    htpasswd_encryption = autodetect
    # Seconds added to every failed login; the port is on the mesh with no gateway login.
    delay = 2

    [rights]
    type = owner_only

    [storage]
    filesystem_folder = /var/lib/radicale/collections

    [logging]
    level = info

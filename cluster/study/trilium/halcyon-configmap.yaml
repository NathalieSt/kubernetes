---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trilium-halcyon
  namespace: trilium
data:
  append-stylesheet.sh: |
    #!/bin/sh
    # Appends Halcyon to an application's own stylesheet, in a copy of the
    # directory that holds it. Run as an init container from the application's own
    # image, so the file it copies is the one that version actually serves. See
    # StylesheetAppend.res for why this exists at all.
    #
    #   $1   the directory in the image
    #   $2   the emptyDir mounted over that directory in the application container
    #   $3   the stylesheet to append
    #   $4…  globs, relative to the directory, naming the files to append to
    #
    # A theme must never be the reason an application does not start. So a layout
    # this does not recognise -- the application moved its assets in an upgrade --
    # is reported on stderr and the pod starts unthemed, from a faithful copy.
    # Everything else (a failed copy, a full disk) still fails, because then the
    # copy the application would be served from is incomplete.
    set -eu

    source_dir=$1
    target_dir=$2
    css=$3
    shift 3

    warn() {
      echo "WARNING: Halcyon not applied: $*" >&2
    }

    if [ ! -d "$source_dir" ]; then
      # Nothing to copy, and nothing is hidden by mounting over a path that does
      # not exist in this image.
      warn "$source_dir does not exist in this image -- the asset layout has changed"
      exit 0
    fi

    cp -R "$source_dir/." "$target_dir/"
    # An image may ship its assets read-only, and cp keeps the mode. The contents
    # only: the emptyDir's own root belongs to root, and a chmod of it fails. Not
    # through symlinks, whose targets are in the image's read-only root.
    find "$target_dir" -mindepth 1 ! -type l -exec chmod u+w {} +

    for pattern in "$@"; do
      matched=0
      # Unquoted on purpose: this is the glob.
      for file in "$target_dir"/$pattern; do
        [ -f "$file" ] || continue
        matched=$((matched + 1))
        # A symlink stays one in the copy (Paperless' collectstatic links every
        # file back into its source tree), and appending through it would write
        # into the image. So the file being themed becomes a real one; links
        # elsewhere are left, since the image they point into is the same.
        if [ -L "$file" ]; then
          cp "$file" "$file.real" && rm "$file" && mv "$file.real" "$file"
          chmod u+w "$file"
        fi
        printf '\n' >>"$file"
        cat "$css" >>"$file"
        # A pre-compressed sibling is served in preference to the file itself, so
        # one left as it was would quietly serve the unthemed stylesheet to every
        # browser that accepts the encoding -- which is all of them. gzip is in
        # every image this runs from; brotli is in none, so that copy is dropped
        # and the server falls back to the gzip one.
        rm -f "$file.br"
        # -L too: a compressed sibling may be a link, even one shared with other
        # directories' identical files, and must not be written through.
        if [ -e "$file.gz" ] || [ -L "$file.gz" ]; then
          rm -f "$file.gz"
          gzip -9 -c "$file" >"$file.gz"
        fi
        echo "appended Halcyon to ${file#"$target_dir"/}"
      done
      if [ "$matched" -eq 0 ]; then
        warn "no file under $source_dir matches '$pattern' -- the asset layout has changed"
      fi
    done
  halcyon.css: |
    /* Halcyon for Trilium, appended by kubernetes-generator (src/generators/theme). */

    :root {
      --main-background-color: light-dark(#e8f8fb, #093842);
      --main-text-color: light-dark(#1a3742, #eaf6fb);
      --main-border-color: light-dark(#d8eaf1, #305360);
      --subtle-border-color: light-dark(#d8eaf1, #305360);
      --dropdown-border-color: light-dark(#d8eaf1, #305360);
      --accented-background-color: light-dark(#eaf6fb, #1a3742);
      --muted-text-color: light-dark(#305360, #c0d9e4);
      --root-background: light-dark(#eaf6fb, #071a21);
      --link-color: light-dark(#005a66, #86d4e2);
      --link-hover-color: light-dark(#004049, #b3e7f1);
      --selection-background-color: light-dark(#d5f3f9, #00282e);
      --hover-item-text-color: light-dark(#1a3742, #eaf6fb);
      --hover-item-background-color: light-dark(#eaf6fb, #1a3742);
      --active-item-text-color: light-dark(#004049, #b3e7f1);
      --active-item-background-color: light-dark(#d5f3f9, #00282e);
      --input-background-color: light-dark(#eaf6fb, #1a3742);
      --input-text-color: light-dark(#1a3742, #eaf6fb);
      --input-placeholder-color: light-dark(#4c7281, #a4c4d1);
      --input-focus-outline-color: light-dark(#007785, #86d4e2);
      --input-selection-background: light-dark(#d5f3f9, #00282e);
      --input-selection-text-color: light-dark(#004049, #b3e7f1);
      --menu-text-color: light-dark(#1a3742, #eaf6fb);
      --menu-background-color: light-dark(#e8f8fb, #093842);
      --menu-background-color-no-backdrop: light-dark(#e8f8fb, #093842);
      --modal-background-color: light-dark(#e8f8fb, #093842);
      --modal-border-color: light-dark(#d8eaf1, #305360);
      --modal-footer-background: light-dark(#eaf6fb, #1a3742);
      --left-pane-background-color: light-dark(#eaf6fb, #071a21);
      --left-pane-text-color: light-dark(#1a3742, #eaf6fb);
      --left-pane-item-hover-background: light-dark(#eaf6fb, #1a3742);
      --left-pane-item-selected-background: light-dark(#d5f3f9, #00282e);
      --left-pane-item-selected-color: light-dark(#004049, #b3e7f1);
      --launcher-pane-text-color: light-dark(#305360, #c0d9e4);
      --launcher-pane-vert-background-color: light-dark(#eaf6fb, #071a21);
      --launcher-pane-horiz-background-color: light-dark(#eaf6fb, #071a21);
      --launcher-pane-vert-button-hover-background: light-dark(#eaf6fb, #1a3742);
      --launcher-pane-horiz-button-hover-background: light-dark(#eaf6fb, #1a3742);
      --active-tab-background-color: light-dark(#e8f8fb, #093842);
      --active-tab-text-color: light-dark(#1a3742, #eaf6fb);
      --active-tab-icon-color: light-dark(#005a66, #86d4e2);
      --inactive-tab-background-color: light-dark(#eaf6fb, #1a3742);
      --inactive-tab-text-color: light-dark(#305360, #c0d9e4);
      --new-tab-button-hover-background: light-dark(#eaf6fb, #1a3742);
      --right-pane-background-color: light-dark(#eaf6fb, #071a21);
      --bottom-panel-background-color: light-dark(#eaf6fb, #071a21);
      --card-background-color: light-dark(#e8f8fb, #093842);
      --card-border-color: light-dark(#d8eaf1, #305360);
      --cmd-button-background-color: light-dark(#eaf6fb, #1a3742);
      --cmd-button-text-color: light-dark(#1a3742, #eaf6fb);
      --cmd-button-hover-background-color: light-dark(#d8eaf1, #305360);
      --button-group-active-button-background-color: light-dark(#005a66, #b3e7f1);
      --button-group-active-button-color: light-dark(#f4fcff, #020d12);
      --quick-search-background: light-dark(#eaf6fb, #1a3742);
      --quick-search-focus-border: light-dark(#007785, #86d4e2);
      --badge-background-color: light-dark(#d8eaf1, #305360);
      --badge-text-color: light-dark(#1a3742, #eaf6fb);
      --scrollbar-thumb-color: light-dark(#4c7281, #6890a0);
      --calendar-day-highlight-background: light-dark(#d5f3f9, #00282e);
      --tooltip-background-color: light-dark(#e8f8fb, #093842);
      --tooltip-foreground-color: light-dark(#1a3742, #eaf6fb);
    }

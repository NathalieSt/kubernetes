---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: trilium
    app.kubernetes.io/version: v0.105.0
  name: trilium
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trilium
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trilium
        app.kubernetes.io/version: v0.105.0
    spec:
      initContainers:
      - command:
        - sh
        - -c
        - chown 1000:1000 /home/node/trilium-data
        image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
        name: permission-fix
        volumeMounts:
        - mountPath: /home/node/trilium-data
          name: data
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
      - command:
        - node
        - ./main.cjs
        image: triliumnext/trilium:v0.105.0@sha256:cc6a15edd7ac3df9bb98ad39dd40af8ffda6c1c0bfafe37c26137ddcbecdb7e5
        name: trilium
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - mountPath: /home/node/trilium-data
          name: data
        - mountPath: /tmp
          name: tmp
        env:
        - name: TZ
          value: Europe/Vienna
        - name: TRILIUM_DATA_DIR
          value: /home/node/trilium-data
        - name: TRILIUM_NETWORK_TRUSTEDREVERSEPROXY
          value: "1"
        resources:
          requests:
            cpu: 25m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        securityContext:
          capabilities:
            drop:
            - ALL
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          periodSeconds: 15
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: trilium-data-pvc
      - name: tmp
        emptyDir: {}
      securityContext:
        seccompProfile:
          type: RuntimeDefault

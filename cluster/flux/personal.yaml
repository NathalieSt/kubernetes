---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: device-configuration-manager
  namespace: flux-system
spec:
  interval: 24h
  retryInterval: 2m
  targetNamespace: device-configuration-manager
  sourceRef:
    kind: GitRepository
    name: manifests
  path: ./cluster/personal/device-configuration-manager
  prune: true
  wait: true
  timeout: 10m
  dependsOn:
  - name: namespaces
  - name: flux-rbac
  - name: main-pg
  - name: reflector
  - name: vault-secrets-operator-config
  serviceAccountName: flux-device-configuration-manager

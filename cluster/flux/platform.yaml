---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: backup-dashboard
  namespace: flux-system
spec:
  interval: 24h
  retryInterval: 2m
  targetNamespace: backup-dashboard
  sourceRef:
    kind: GitRepository
    name: manifests
  path: ./cluster/platform/backup-dashboard
  prune: true
  wait: true
  timeout: 10m
  dependsOn:
  - name: namespaces
  - name: flux-rbac
  - name: garage
  - name: k8up
  - name: vault-secrets-operator-config
  serviceAccountName: flux-privileged
---

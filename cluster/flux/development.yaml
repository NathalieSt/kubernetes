  path: ./cluster/development/it-tools
  prune: true
  wait: true
  timeout: 10m
  dependsOn:
  - name: namespaces
  - name: flux-rbac
  - name: keda
  serviceAccountName: flux-it-tools
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: omni-tools
  namespace: flux-system
spec:
  interval: 24h
  targetNamespace: omni-tools
  sourceRef:
    kind: GitRepository

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vim-dojo
  namespace: flux-system
spec:
  interval: 24h
  targetNamespace: vim-dojo
  sourceRef:
    kind: GitRepository
    name: manifests
  path: ./cluster/development/vim-dojo
  prune: true
  wait: true
  timeout: 10m
  dependsOn:
  - name: namespaces
  - name: flux-rbac
  - name: csi-driver-nfs

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flaresolverr-arr-networkpolicy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: flaresolverr
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app.kubernetes.io/name
          operator: In
          values:
          - prowlarr
    ports:
    - port: 8191
      protocol: TCP

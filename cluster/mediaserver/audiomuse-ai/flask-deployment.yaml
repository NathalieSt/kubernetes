---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: audiomuse-ai-flask
    app.kubernetes.io/version: 3.7.0
  name: audiomuse-ai-flask
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: audiomuse-ai-flask
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audiomuse-ai-flask
        app.kubernetes.io/version: 3.7.0
    spec:
      automountServiceAccountToken: false
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - 10.43.0.54
        searches:
        - jellyfin.svc.cluster.local
        - svc.cluster.local
        - cluster.local
      containers:
      - image: ghcr.io/neptunehub/audiomuse-ai:3.7.0@sha256:38ac3c2cdb1a82e89c1bd405e5865e2efe5ad924a53b8373f5989f964a7de110
        name: audiomuse-ai-flask
        ports:
        - containerPort: 8000
          name: flask
        volumeMounts:
        - mountPath: /app/temp_audio
          name: temp-volume
        env:
        - name: SERVICE_TYPE
          value: flask
        - name: CLAP_ENABLED
          value: "false"
        - name: JELLYFIN_USER_ID
          valueFrom:
            secretKeyRef:
              key: userid
              name: jellyfin-creds
        - name: JELLYFIN_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: jellyfin-creds
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              key: username
              name: audiomuseai-db-secret
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: audiomuseai-db-secret
        envFrom:
        - configMapRef:
            name: audiomuse-configmap
      volumes:
      - name: temp-volume
        persistentVolumeClaim:
          claimName: audiomuse-ai-pvc

---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: media-dns
    app.kubernetes.io/version: 1.14.7
  name: media-dns
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: media-dns
  template:
    metadata:
      annotations:
        homelab/media-dns-config-hash: 92904b1f375ad777303421352d45fcfbdd3251d8fdc8bd6d8a12e34731030814
      labels:
        app.kubernetes.io/name: media-dns
        app.kubernetes.io/version: 1.14.7
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
      - args:
        - -conf
        - /etc/coredns/Corefile
        image: coredns/coredns:1.14.7@sha256:7efd3c635b03efd68c4e8398fc45f0d993d0e9ab016f72c1cefb0fd6d01aa286
        name: media-dns
        ports:
        - containerPort: 5353
          name: dns
          protocol: UDP
        - containerPort: 5353
          name: dns-tcp
          protocol: TCP
        volumeMounts:
        - mountPath: /etc/coredns
          name: config
          readOnly: true
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        securityContext:
          capabilities:
            add:
            - NET_BIND_SERVICE
            drop:
            - ALL
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        readinessProbe:
          httpGet:
            path: /ready
            port: 8181
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 10
          failureThreshold: 5
      volumes:
      - name: config
        configMap:
          name: media-dns-config
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

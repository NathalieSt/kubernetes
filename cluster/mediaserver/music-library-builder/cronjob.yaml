---
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/name: music-library-builder
    app.kubernetes.io/version: 3c92a51
  name: music-library-builder-sync
spec:
  schedule: 30 4 * * *
  timeZone: Europe/Vienna
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: music-library-builder
            app.kubernetes.io/version: 3c92a51
        spec:
          imagePullSecrets:
          - name: forgejo-registry-secret
          initContainers:
          - command:
            - sh
            - -c
            - chown 1000:1000 /state
            image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
            name: permission-fix
            volumeMounts:
            - mountPath: /state
              name: state-volume
          dnsPolicy: None
          dnsConfig:
            nameservers:
            - 10.43.0.53
            searches:
            - jellyfin.svc.cluster.local
            - svc.cluster.local
            - cluster.local
          containers:
          - args:
            - ./bin/mlb.mjs
            - sync
            image: code.netbird.nathalie-stiefsohn.eu/my-homelab/music-library-builder:3c92a51@sha256:16fa51cedeaceda8488888816d7f91d6094cbbbacb9b7c4744cc1d03929d0b7d
            name: music-library-builder-sync
            volumeMounts:
            - mountPath: /media
              name: media-volume
            - mountPath: /state
              name: state-volume
            env:
            - name: MLB_LIBRARY_ROOT
              value: /media/music
            - name: MLB_STATE_DIR
              value: /state
            - name: MLB_PROXY
              value: http://gluetun-media.gluetun-media.svc.cluster.local:8888
            - name: MLB_VPN_CONTROL_URL
              value: http://gluetun-media.gluetun-media.svc.cluster.local:8000
            - name: MLB_NO_PROXY
              value: svc.cluster.local,cluster.local,localhost
            - name: MLB_CONCURRENCY
              value: "2"
            - name: MLB_BROWSE_ROOTS
              value: /media
            - name: MLB_NTFY_URL
              value: http://ntfy.ntfy.svc.cluster.local:8080
            - name: MLB_NTFY_TOPIC
              value: music-library-builder
            - name: MLB_NTFY_CLICK
              value: https://music.netbird.nathalie-stiefsohn.eu
            - name: MLB_NTFY_TOKEN
              valueFrom:
                secretKeyRef:
                  key: ntfy-token
                  name: music-library-builder-secret
                  optional: true
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 2000m
                memory: 1Gi
          volumes:
          - name: media-volume
            persistentVolumeClaim:
              claimName: jellyfin-pvc
          - name: state-volume
            persistentVolumeClaim:
              claimName: music-library-builder-state-pvc
          restartPolicy: OnFailure

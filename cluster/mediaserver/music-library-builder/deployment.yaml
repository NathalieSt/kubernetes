---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: music-library-builder
    app.kubernetes.io/version: b87c9a9
  name: music-library-builder
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: music-library-builder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: music-library-builder
        app.kubernetes.io/version: b87c9a9
    spec:
      imagePullSecrets:
      - name: forgejo-registry-secret
      initContainers:
      - command:
        - sh
        - -c
        - chown 1000:1000 /state
        image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
        name: permission-fix
        volumeMounts:
        - mountPath: /state
          name: state-volume
      automountServiceAccountToken: false
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - 10.43.0.53
        searches:
        - jellyfin.svc.cluster.local
        - svc.cluster.local
        - cluster.local
      containers:
      - image: code.netbird.nathalie-stiefsohn.eu/my-homelab/music-library-builder:b87c9a9@sha256:327c0f01e915d865a603e383779f7eeb8187d84285a2536fe99ebb683dc9b5c0
        name: music-library-builder
        ports:
        - containerPort: 8140
          name: http
        volumeMounts:
        - mountPath: /media
          name: media-volume
        - mountPath: /state
          name: state-volume
        env:
        - name: MLB_LIBRARY_ROOT
          value: /media/music
        - name: MLB_STATE_DIR
          value: /state
        - name: MLB_PROXY
          value: http://gluetun-proxy.gluetun-proxy.svc.cluster.local:8888
        - name: MLB_VPN_CONTROL_URL
          value: http://gluetun-proxy.gluetun-proxy.svc.cluster.local:8001
        - name: MLB_NO_PROXY
          value: svc.cluster.local,cluster.local,localhost
        - name: MLB_CONCURRENCY
          value: "2"
        - name: MLB_BROWSE_ROOTS
          value: /media
        - name: MLB_HOST
          value: 0.0.0.0
        - name: MLB_PORT
          value: "8140"
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 2000m
            memory: 1Gi
      volumes:
      - name: media-volume
        persistentVolumeClaim:
          claimName: jellyfin-pvc
      - name: state-volume
        persistentVolumeClaim:
          claimName: music-library-builder-state-pvc

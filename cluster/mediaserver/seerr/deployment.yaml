---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: seerr
    app.kubernetes.io/version: v3.4.1
  name: seerr
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: seerr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seerr
        app.kubernetes.io/version: v3.4.1
    spec:
      initContainers:
      - command:
        - sh
        - -c
        - chown -R 1000:1000 /app/config
        image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
        name: permission-fix
        volumeMounts:
        - mountPath: /app/config
          name: config
      - command:
        - sh
        - /scripts/proxy-set.sh
        image: mikefarah/yq:4.53.6@sha256:cfc4eee658595834ef304eadb0c3ea721f3b7cb6404ad8b7cb909cc5b5145b23
        name: proxy
        volumeMounts:
        - mountPath: /app/config
          name: config
        - mountPath: /scripts
          name: scripts
          readOnly: true
        - mountPath: /tmp
          name: tmp
        env:
        - name: SETTINGS_FILE
          value: /app/config/settings.json
        - name: PROXY_HOST
          value: gluetun-proxy.gluetun-proxy.svc.cluster.local
        - name: PROXY_PORT
          value: "8888"
        - name: PROXY_BYPASS
          value: "*.svc,*.cluster.local,sonarr,sonarr.jellyfin,radarr,radarr.jellyfin,lidarr,lidarr.jellyfin,prowlarr,prowlarr.jellyfin,bazarr,bazarr.jellyfin,seerr,seerr.jellyfin,jellyfin,jellyfin.jellyfin,qbittorrent.qbittorrent,sabnzbd.qbittorrent"
        securityContext:
          capabilities:
            drop:
            - ALL
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
      automountServiceAccountToken: false
      enableServiceLinks: false
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - 10.43.0.53
        searches:
        - jellyfin.svc.cluster.local
        - svc.cluster.local
        - cluster.local
      containers:
      - image: ghcr.io/seerr-team/seerr:v3.4.1@sha256:f4768de5f616248d723e05891f3345a1402123775d03bf0890dbfedc0831bda1
        name: seerr
        ports:
        - containerPort: 5055
          name: http
        volumeMounts:
        - mountPath: /app/config
          name: config
        env:
        - name: TZ
          value: Europe/Vienna
        - name: DB_TYPE
          value: postgres
        - name: DB_HOST
          value: postgres-rw.postgres.svc.cluster.local
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: seerr
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              key: username
              name: postgres-creds-secret
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              key: password
              name: postgres-creds-secret
        resources:
          requests:
            cpu: 50m
            memory: 192Mi
          limits:
            cpu: "1"
            memory: 1Gi
        securityContext:
          capabilities:
            drop:
            - ALL
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          runAsNonRoot: true
        readinessProbe:
          httpGet:
            path: /api/v1/status
            port: 5055
          periodSeconds: 30
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: seerr-config
      - name: scripts
        configMap:
          name: seerr-scripts
      - name: tmp
        emptyDir: {}

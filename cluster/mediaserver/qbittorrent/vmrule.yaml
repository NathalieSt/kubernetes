---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: qbittorrent-vpn-rules
spec:
  groups:
  - name: vpn
    interval: 1m
    rules:
    - alert: VpnLeakDetectorTripped
      expr: increase(kube_pod_container_status_restarts_total{namespace="qbittorrent",container="ipleak"}[15m]) > 0
      for: 5m
      labels:
        severity: critical
      annotations:
        description: "The leak detector in {{ $labels.namespace }}/{{ $labels.pod }} saw an exit IP outside NL, stopped every torrent and latched. Nothing left the house: the tunnel was up and the egress policy admits nothing but the VPN. Read `kubectl logs -n {{ $labels.namespace }} {{ $labels.pod }} -c ipleak --previous` for the address and country, then delete the pod to clear the latch."
        summary: qbittorrent left NL — downloads stopped

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: audiomuse-ai-flask-gateway-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: audiomuse-ai-flask
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: internal-gateway
      podSelector:
        matchExpressions:
        - key: app.kubernetes.io/name
          operator: In
          values:
          - internal-gateway
          - internal-gateway-secondary
    ports:
    - port: 8000
      protocol: TCP

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jellyfin-theme
  namespace: jellyfin
data:
  branding.xml: |-
    <?xml version="1.0" encoding="utf-8"?>
    <BrandingOptions xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema">
      <CustomCss>/* Halcyon -- the homelab's shared palette, from the styles repo.
     * GENERATED by kubernetes-generator (src/generators/theme/JellyfinTheme.res). Edit tokens.json in
     * styles and regenerate; Dashboard &gt; Branding will not stick, branding.xml is rewritten on pod start. */

    :root {
      --halcyon-accent: #4e84c7;
      --halcyon-accent-hover: #639be1;
      --halcyon-accent-tint: #4e84c733;
      --halcyon-on-accent: #f4fcff;
      --halcyon-danger: #bc6749;
    }

    html[data-theme="light"],
    html[data-theme="appletv"] {
      --halcyon-accent: #005a66;
      --halcyon-accent-hover: #004049;
      --halcyon-accent-tint: #005a6633;
      --halcyon-on-accent: #f4fcff;
      --halcyon-danger: #783d28;
    }

    html[data-theme="dark"],
    html[data-theme="blueradiance"],
    html[data-theme="purplehaze"],
    html[data-theme="wmc"] {
      --halcyon-accent: #86d4e2;
      --halcyon-accent-hover: #b3e7f1;
      --halcyon-accent-tint: #86d4e233;
      --halcyon-on-accent: #020d12;
      --halcyon-danger: #f7b39b;
    }

    @media (hover: hover) and (pointer: fine) {
      .paper-icon-button-light:hover:not(:disabled) {
        color: var(--halcyon-accent);
        background-color: var(--halcyon-accent-tint);
      }
    }

    .paper-icon-button-light:active:not(:disabled) {
      color: var(--halcyon-accent);
      background-color: var(--halcyon-accent-tint);
    }

    .paper-icon-button-light.show-focus:focus {
      color: var(--halcyon-accent);
    }

    .button-submit {
      background: var(--halcyon-accent);
      color: var(--halcyon-on-accent);
    }

    .button-submit:focus {
      background: var(--halcyon-accent-hover);
      color: var(--halcyon-on-accent);
    }

    .button-delete {
      background: var(--halcyon-danger);
      color: var(--halcyon-on-accent);
    }

    .inputLabelFocused,
    .selectLabelFocused,
    .textareaLabelFocused {
      color: var(--halcyon-accent);
    }

    .itemSelectionPanel {
      border: 1px solid var(--halcyon-accent);
    }

    .selectionCommandsPanel {
      background: var(--halcyon-accent);
      color: var(--halcyon-on-accent);
    }

    .upNextDialog-countdownText {
      color: var(--halcyon-accent);
    }

    .alphaPickerButton-tv:focus {
      background-color: var(--halcyon-accent);
      color: var(--halcyon-on-accent) !important;
    }

    .progressring-spiner {
      border-color: var(--halcyon-accent);
    }

    .button-flat:hover {
      color: var(--halcyon-accent);
    }

    .button-link {
      color: var(--halcyon-accent);
    }

    .emby-input:focus,
    .emby-textarea:focus {
      border-color: var(--halcyon-accent);
    }

    .emby-select-withcolor:focus {
      border-color: var(--halcyon-accent) !important;
    }

    .emby-select-tv-withcolor:focus {
      background-color: var(--halcyon-accent) !important;
      color: var(--halcyon-on-accent) !important;
    }

    .emby-checkbox:checked + span + .checkboxOutline {
      border-color: var(--halcyon-accent);
    }

    .emby-checkbox:checked + span + .checkboxOutline,
    .itemProgressBarForeground {
      background-color: var(--halcyon-accent);
    }

    .emby-checkbox:focus:not(:checked) + span + .checkboxOutline {
      border-color: var(--halcyon-accent);
    }

    .itemProgressBarForeground-recording {
      background-color: var(--halcyon-danger);
    }

    .countIndicator,
    .fullSyncIndicator,
    .mediaSourceIndicator,
    .playedIndicator {
      background: var(--halcyon-accent);
    }

    .navMenuOption-selected {
      background: var(--halcyon-accent) !important;
      color: var(--halcyon-on-accent);
    }

    .emby-button.show-focus:focus {
      background: var(--halcyon-accent);
      color: var(--halcyon-on-accent);
    }

    .emby-tab-button.show-focus:focus {
      color: var(--halcyon-accent);
    }

    .emby-tab-button:hover {
      color: var(--halcyon-accent);
    }

    .guide-channelHeaderCell:focus,
    .programCell:focus {
      background-color: var(--halcyon-accent) !important;
      color: var(--halcyon-on-accent) !important;
    }

    .guide-date-tab-button.emby-tab-button-active,
    .guide-date-tab-button:focus {
      color: var(--halcyon-accent);
    }

    .guide-date-tab-button.show-focus:focus {
      background-color: var(--halcyon-accent);
      color: var(--halcyon-on-accent);
    }

    .buttonActive {
      color: var(--halcyon-accent) !important;
    }

    .card:focus .cardBox.visualCardBox,
    .card:focus .cardBox:not(.visualCardBox) .cardScalable {
      border-color: var(--halcyon-accent) !important;
    }

    .metadataSidebarIcon {
      color: var(--halcyon-accent);
    }

    .emby-button.detailFloatingButton {
      background-color: var(--halcyon-accent);
      color: var(--halcyon-on-accent);
    }

    .layout-tv .emby-button.detailFloatingButton:focus {
      color: #3c6aa4;
    }

    #dialogToc .bookplayerButtonIcon:hover {
      color: var(--halcyon-accent);
    }

    #dialogToc .toc li a:active,
    #dialogToc .toc li a:hover {
      color: var(--halcyon-accent);
    }

    /* Two rules that are accent-coloured in some built-in themes and a plain
     surface in others, so they are scoped to exactly the themes that paint them
     with the accent. Overriding them unscoped would put an accent bar across the dark
     theme's dialogs, which that theme deliberately keeps grey. */
    html[data-theme="light"] .formDialogHeader:not(.formDialogHeader-clear) {
      background-color: var(--halcyon-accent);
      color: var(--halcyon-on-accent);
    }

    html[data-theme="light"] .alphaPickerButton-selected,
    html[data-theme="appletv"] .alphaPickerButton-selected,
    html[data-theme="wmc"] .alphaPickerButton-selected {
      background-color: var(--halcyon-accent);
      color: var(--halcyon-on-accent) !important;
    }
    </CustomCss>
      <SplashscreenEnabled>false</SplashscreenEnabled>
    </BrandingOptions>

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-theme
  namespace: forgejo
data:
  theme-pennant.css: |
    /* Pennant -- the homelab's shared palette, from the styles repo.
     * GENERATED by kubernetes-generator (src/generators/theme/ForgejoTheme.res). To change it: edit
     * tokens/tokens.json in the styles repo, release it, bump @my-homelab/styles here, regenerate. */

    @import url("theme-forgejo-auto.css");

    :root {
      --color-primary: #3c6aa4;
      --color-primary-contrast: #ffffff;
      --color-primary-dark-1: #3c6aa4;
      --color-primary-dark-2: #2c517f;
      --color-primary-dark-3: #2c517f;
      --color-primary-dark-4: #1d395b;
      --color-primary-dark-5: #1d395b;
      --color-primary-dark-6: #10233c;
      --color-primary-dark-7: #10233c;
      --color-primary-light-1: #4e84c7;
      --color-primary-light-2: #639be1;
      --color-primary-light-3: #7fb1f1;
      --color-primary-light-4: #a0c9fd;
      --color-primary-light-5: #c6dfff;
      --color-primary-light-6: #e1eeff;
      --color-primary-light-7: #f2f7ff;
      --color-primary-alpha-10: #3c6aa419;
      --color-primary-alpha-20: #3c6aa433;
      --color-primary-alpha-30: #3c6aa44b;
      --color-primary-alpha-40: #3c6aa466;
      --color-primary-alpha-50: #3c6aa480;
      --color-primary-alpha-60: #3c6aa499;
      --color-primary-alpha-70: #3c6aa4b3;
      --color-primary-alpha-80: #3c6aa4cc;
      --color-primary-alpha-90: #3c6aa4e1;
      --color-primary-hover: var(--color-primary-dark-2);
      --color-primary-active: var(--color-primary-dark-4);
      --color-accent: #005c60;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --color-primary: #a0c9fd;
        --color-primary-contrast: #090b0e;
        --color-primary-dark-1: #c6dfff;
        --color-primary-dark-2: #c6dfff;
        --color-primary-dark-3: #e1eeff;
        --color-primary-dark-4: #e1eeff;
        --color-primary-dark-5: #f2f7ff;
        --color-primary-dark-6: #f2f7ff;
        --color-primary-dark-7: #f2f7ff;
        --color-primary-light-1: #7fb1f1;
        --color-primary-light-2: #639be1;
        --color-primary-light-3: #4e84c7;
        --color-primary-light-4: #3c6aa4;
        --color-primary-light-5: #2c517f;
        --color-primary-light-6: #1d395b;
        --color-primary-light-7: #10233c;
        --color-primary-alpha-10: #a0c9fd19;
        --color-primary-alpha-20: #a0c9fd33;
        --color-primary-alpha-30: #a0c9fd4b;
        --color-primary-alpha-40: #a0c9fd66;
        --color-primary-alpha-50: #a0c9fd80;
        --color-primary-alpha-60: #a0c9fd99;
        --color-primary-alpha-70: #a0c9fdb3;
        --color-primary-alpha-80: #a0c9fdcc;
        --color-primary-alpha-90: #a0c9fde1;
        --color-primary-hover: var(--color-primary-dark-2);
        --color-primary-active: var(--color-primary-dark-4);
        --color-accent: #89d5d9;
      }
    }

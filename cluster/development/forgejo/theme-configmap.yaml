---
apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-theme
  namespace: forgejo
data:
  theme-pennant.css: |
    /* Halcyon -- the homelab's shared palette, from the styles repo.
     * GENERATED by kubernetes-generator (src/generators/theme/ForgejoTheme.res). To change it: edit
     * tokens/tokens.json in the styles repo, release it, bump @my-homelab/styles here, regenerate. */

    @import url("theme-forgejo-auto.css");

    :root {
      --color-primary: #656874;
      --color-primary-contrast: #ffffff;
      --color-primary-dark-1: #656874;
      --color-primary-dark-2: #4d4f59;
      --color-primary-dark-3: #4d4f59;
      --color-primary-dark-4: #36383f;
      --color-primary-dark-5: #36383f;
      --color-primary-dark-6: #212328;
      --color-primary-dark-7: #212328;
      --color-primary-light-1: #7e818f;
      --color-primary-light-2: #9498a6;
      --color-primary-light-3: #aaadbb;
      --color-primary-light-4: #c2c5d0;
      --color-primary-light-5: #dadce4;
      --color-primary-light-6: #ebecf1;
      --color-primary-light-7: #f6f7f9;
      --color-primary-alpha-10: #65687419;
      --color-primary-alpha-20: #65687433;
      --color-primary-alpha-30: #6568744b;
      --color-primary-alpha-40: #65687466;
      --color-primary-alpha-50: #65687480;
      --color-primary-alpha-60: #65687499;
      --color-primary-alpha-70: #656874b3;
      --color-primary-alpha-80: #656874cc;
      --color-primary-alpha-90: #656874e1;
      --color-primary-hover: var(--color-primary-dark-2);
      --color-primary-active: var(--color-primary-dark-4);
      --color-accent: #30323c;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --color-primary: #c2c5d0;
        --color-primary-contrast: #0a0b0f;
        --color-primary-dark-1: #dadce4;
        --color-primary-dark-2: #dadce4;
        --color-primary-dark-3: #ebecf1;
        --color-primary-dark-4: #ebecf1;
        --color-primary-dark-5: #f6f7f9;
        --color-primary-dark-6: #f6f7f9;
        --color-primary-dark-7: #f6f7f9;
        --color-primary-light-1: #aaadbb;
        --color-primary-light-2: #9498a6;
        --color-primary-light-3: #7e818f;
        --color-primary-light-4: #656874;
        --color-primary-light-5: #4d4f59;
        --color-primary-light-6: #36383f;
        --color-primary-light-7: #212328;
        --color-primary-alpha-10: #c2c5d019;
        --color-primary-alpha-20: #c2c5d033;
        --color-primary-alpha-30: #c2c5d04b;
        --color-primary-alpha-40: #c2c5d066;
        --color-primary-alpha-50: #c2c5d080;
        --color-primary-alpha-60: #c2c5d099;
        --color-primary-alpha-70: #c2c5d0b3;
        --color-primary-alpha-80: #c2c5d0cc;
        --color-primary-alpha-90: #c2c5d0e1;
        --color-primary-hover: var(--color-primary-dark-2);
        --color-primary-active: var(--color-primary-dark-4);
        --color-accent: #f2f3f8;
      }
    }

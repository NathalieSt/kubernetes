---
apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-theme
  namespace: forgejo
data:
  theme-pennant.css: |
    /* Pennant -- the homelab's shared palette, from the styles repo.
     * GENERATED by kubernetes-generator (src/generators/theme/ForgejoTheme.res). To change it: edit
     * tokens/tokens.json in the styles repo, release it, bump @my-homelab/styles here, regenerate. */

    @import url("theme-forgejo-auto.css");

    :root {
      --color-primary: #984a72;
      --color-primary-contrast: #ffffff;
      --color-primary-dark-1: #984a72;
      --color-primary-dark-2: #763757;
      --color-primary-dark-3: #763757;
      --color-primary-dark-4: #54263d;
      --color-primary-dark-5: #54263d;
      --color-primary-dark-6: #371627;
      --color-primary-dark-7: #371627;
      --color-primary-light-1: #b95f8c;
      --color-primary-light-2: #d375a4;
      --color-primary-light-3: #e68eb8;
      --color-primary-light-4: #f5adce;
      --color-primary-light-5: #ffcbe2;
      --color-primary-light-6: #ffe4f0;
      --color-primary-light-7: #fff3f8;
      --color-primary-alpha-10: #984a7219;
      --color-primary-alpha-20: #984a7233;
      --color-primary-alpha-30: #984a724b;
      --color-primary-alpha-40: #984a7266;
      --color-primary-alpha-50: #984a7280;
      --color-primary-alpha-60: #984a7299;
      --color-primary-alpha-70: #984a72b3;
      --color-primary-alpha-80: #984a72cc;
      --color-primary-alpha-90: #984a72e1;
      --color-primary-hover: var(--color-primary-dark-2);
      --color-primary-active: var(--color-primary-dark-4);
      --color-accent: #007495;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --color-primary: #f5adce;
        --color-primary-contrast: #090c0d;
        --color-primary-dark-1: #ffcbe2;
        --color-primary-dark-2: #ffcbe2;
        --color-primary-dark-3: #ffe4f0;
        --color-primary-dark-4: #ffe4f0;
        --color-primary-dark-5: #fff3f8;
        --color-primary-dark-6: #fff3f8;
        --color-primary-dark-7: #fff3f8;
        --color-primary-light-1: #e68eb8;
        --color-primary-light-2: #d375a4;
        --color-primary-light-3: #b95f8c;
        --color-primary-light-4: #984a72;
        --color-primary-light-5: #763757;
        --color-primary-light-6: #54263d;
        --color-primary-light-7: #371627;
        --color-primary-alpha-10: #f5adce19;
        --color-primary-alpha-20: #f5adce33;
        --color-primary-alpha-30: #f5adce4b;
        --color-primary-alpha-40: #f5adce66;
        --color-primary-alpha-50: #f5adce80;
        --color-primary-alpha-60: #f5adce99;
        --color-primary-alpha-70: #f5adceb3;
        --color-primary-alpha-80: #f5adcecc;
        --color-primary-alpha-90: #f5adcee1;
        --color-primary-hover: var(--color-primary-dark-2);
        --color-primary-active: var(--color-primary-dark-4);
        --color-accent: #6bd5ff;
      }
    }

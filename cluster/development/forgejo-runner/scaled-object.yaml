---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: forgejo-runner-scaledobject
spec:
  scaleTargetRef:
    kind: Deployment
    name: forgejo-runner
  minReplicaCount: 0
  maxReplicaCount: 1
  cooldownPeriod: 600
  fallback:
    failureThreshold: 3
    replicas: 1
  triggers:
  - type: prometheus
    metadata:
      serverAddress: http://vmsingle-victoria-metrics-vmks.victoria-metrics.svc.cluster.local:8428
      query: max(cnpg_forgejo_actions_active)
      threshold: "1"
      ignoreNullValues: "false"

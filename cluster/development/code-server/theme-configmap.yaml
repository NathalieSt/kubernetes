      "tokenColors": [
        {
          "name": "Comment",
          "scope": [
            "comment",
            "punctuation.definition.comment"
          ],
          "settings": {
            "foreground": "#4c7281",
            "fontStyle": "italic"
          }
        },
        {
          "name": "String",
          "scope": [
            "string",
            "constant.other.symbol",
            "punctuation.definition.string"
          ],
          "settings": {
            "foreground": "#2b7a55"
          }
        },
        {
          "name": "Regular expression",
          "scope": [
            "string.regexp",
            "constant.character.escape"
          ],
          "settings": {
            "foreground": "#005a66"
          }
        },
        {
          "name": "Number and language constant",
          "scope": [
            "constant.numeric",
            "constant.language",
            "constant.character",
            "keyword.other.unit"
          ],
          "settings": {
            "foreground": "#806518"
          }
        },
        {
          "name": "Keyword and storage",
          "scope": [
            "keyword",
            "keyword.control",
            "storage",
            "storage.type",
            "storage.modifier"
          ],
          "settings": {
            "foreground": "#3c6aa4"
          }
        },
        {
          "name": "Operator and punctuation",
          "scope": [
            "keyword.operator",
            "punctuation",
            "meta.brace"
          ],
          "settings": {
            "foreground": "#305360"
          }
        },
        {
          "name": "Function",
          "scope": [
            "entity.name.function",
            "support.function",
            "variable.function",
            "meta.function-call.generic"
          ],
          "settings": {
            "foreground": "#007785"
          }
        },
        {
          "name": "Type and class",
          "scope": [
            "entity.name.type",
            "entity.name.class",
            "entity.name.namespace",
            "entity.other.inherited-class",
            "support.class",
            "support.type"
          ],
          "settings": {
            "foreground": "#725b98"
          }
        },
        {
          "name": "Variable",
          "scope": [
            "variable",
            "variable.other",
            "meta.definition.variable.name",
            "support.variable"
          ],
          "settings": {
            "foreground": "#1a3742"
          }
        },
        {
          "name": "Parameter",
          "scope": [
            "variable.parameter"
          ],
          "settings": {
            "foreground": "#305360",
            "fontStyle": "italic"
          }
        },
        {
          "name": "Property and key",
          "scope": [
            "support.type.property-name",
            "meta.object-literal.key",
            "variable.other.property",
            "entity.name.tag.yaml"
          ],
          "settings": {
            "foreground": "#007785"
          }
        },
        {
          "name": "Markup tag",
          "scope": [
            "entity.name.tag",
            "punctuation.definition.tag"
          ],
          "settings": {
            "foreground": "#3c6aa4"
          }
        },
        {
          "name": "Markup attribute",
          "scope": [
            "entity.other.attribute-name",
            "meta.decorator",
            "entity.name.label"
          ],
          "settings": {
            "foreground": "#806518"
          }
        },
        {
          "name": "Markdown heading",
          "scope": [
            "markup.heading",
            "entity.name.section"
          ],
          "settings": {
            "foreground": "#2c517f",
            "fontStyle": "bold"
          }
        },
        {
          "name": "Markdown bold",
          "scope": [
            "markup.bold"
          ],
          "settings": {
            "foreground": "#1a3742",
            "fontStyle": "bold"
          }
        },
        {
          "name": "Markdown italic",
          "scope": [
            "markup.italic"
          ],
          "settings": {
            "foreground": "#1a3742",
            "fontStyle": "italic"
          }
        },
        {
          "name": "Markdown code",
          "scope": [
            "markup.inline.raw",
            "markup.fenced_code",
            "markup.raw"
          ],
          "settings": {
            "foreground": "#2b7a55"
          }
        },
        {
          "name": "Markdown link",
          "scope": [
            "markup.underline.link"
          ],
          "settings": {
            "foreground": "#2c517f"
          }
        },
        {
          "name": "Diff inserted",
          "scope": [
            "markup.inserted"
          ],
          "settings": {
            "foreground": "#1d5d40"
          }
        },
        {
          "name": "Diff deleted",
          "scope": [
            "markup.deleted"
          ],
          "settings": {
            "foreground": "#783d28"
          }
        },
        {
          "name": "Diff changed",
          "scope": [
            "markup.changed"
          ],
          "settings": {
            "foreground": "#624d0e"
          }
        },
        {
          "name": "Invalid",
          "scope": [
            "invalid",
            "invalid.illegal"
          ],
          "settings": {
            "foreground": "#783d28"
          }
        }
      ]
    }

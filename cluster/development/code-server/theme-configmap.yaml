      "tokenColors": [
        {
          "name": "Comment",
          "scope": [
            "comment",
            "punctuation.definition.comment"
          ],
          "settings": {
            "foreground": "#b9bec5",
            "fontStyle": "italic"
          }
        },
        {
          "name": "String",
          "scope": [
            "string",
            "constant.other.symbol",
            "punctuation.definition.string"
          ],
          "settings": {
            "foreground": "#a1d5ab"
          }
        },
        {
          "name": "Regular expression",
          "scope": [
            "string.regexp",
            "constant.character.escape"
          ],
          "settings": {
            "foreground": "#b4e8ea"
          }
        },
        {
          "name": "Number and language constant",
          "scope": [
            "constant.numeric",
            "constant.language",
            "constant.character",
            "keyword.other.unit"
          ],
          "settings": {
            "foreground": "#e1c18b"
          }
        },
        {
          "name": "Keyword and storage",
          "scope": [
            "keyword",
            "keyword.control",
            "storage",
            "storage.type",
            "storage.modifier"
          ],
          "settings": {
            "foreground": "#a0c9fd"
          }
        },
        {
          "name": "Operator and punctuation",
          "scope": [
            "keyword.operator",
            "punctuation",
            "meta.brace"
          ],
          "settings": {
            "foreground": "#d0d5da"
          }
        },
        {
          "name": "Function",
          "scope": [
            "entity.name.function",
            "support.function",
            "variable.function",
            "meta.function-call.generic"
          ],
          "settings": {
            "foreground": "#89d5d9"
          }
        },
        {
          "name": "Type and class",
          "scope": [
            "entity.name.type",
            "entity.name.class",
            "entity.name.namespace",
            "entity.other.inherited-class",
            "support.class",
            "support.type"
          ],
          "settings": {
            "foreground": "#cdbbf2"
          }
        },
        {
          "name": "Variable",
          "scope": [
            "variable",
            "variable.other",
            "meta.definition.variable.name",
            "support.variable"
          ],
          "settings": {
            "foreground": "#f2f4f6"
          }
        },
        {
          "name": "Parameter",
          "scope": [
            "variable.parameter"
          ],
          "settings": {
            "foreground": "#d0d5da",
            "fontStyle": "italic"
          }
        },
        {
          "name": "Property and key",
          "scope": [
            "support.type.property-name",
            "meta.object-literal.key",
            "variable.other.property",
            "entity.name.tag.yaml"
          ],
          "settings": {
            "foreground": "#89d5d9"
          }
        },
        {
          "name": "Markup tag",
          "scope": [
            "entity.name.tag",
            "punctuation.definition.tag"
          ],
          "settings": {
            "foreground": "#a0c9fd"
          }
        },
        {
          "name": "Markup attribute",
          "scope": [
            "entity.other.attribute-name",
            "meta.decorator",
            "entity.name.label"
          ],
          "settings": {
            "foreground": "#e1c18b"
          }
        },
        {
          "name": "Markdown heading",
          "scope": [
            "markup.heading",
            "entity.name.section"
          ],
          "settings": {
            "foreground": "#c6dfff",
            "fontStyle": "bold"
          }
        },
        {
          "name": "Markdown bold",
          "scope": [
            "markup.bold"
          ],
          "settings": {
            "foreground": "#f2f4f6",
            "fontStyle": "bold"
          }
        },
        {
          "name": "Markdown italic",
          "scope": [
            "markup.italic"
          ],
          "settings": {
            "foreground": "#f2f4f6",
            "fontStyle": "italic"
          }
        },
        {
          "name": "Markdown code",
          "scope": [
            "markup.inline.raw",
            "markup.fenced_code",
            "markup.raw"
          ],
          "settings": {
            "foreground": "#a1d5ab"
          }
        },
        {
          "name": "Markdown link",
          "scope": [
            "markup.underline.link"
          ],
          "settings": {
            "foreground": "#89d5d9"
          }
        },
        {
          "name": "Diff inserted",
          "scope": [
            "markup.inserted"
          ],
          "settings": {
            "foreground": "#a1d5ab"
          }
        },
        {
          "name": "Diff deleted",
          "scope": [
            "markup.deleted"
          ],
          "settings": {
            "foreground": "#fdadad"
          }
        },
        {
          "name": "Diff changed",
          "scope": [
            "markup.changed"
          ],
          "settings": {
            "foreground": "#e1c18b"
          }
        },
        {
          "name": "Invalid",
          "scope": [
            "invalid",
            "invalid.illegal"
          ],
          "settings": {
            "foreground": "#fdadad"
          }
        }
      ]
    }

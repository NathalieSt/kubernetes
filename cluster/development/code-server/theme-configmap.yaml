      "tokenColors": [
        {
          "name": "Comment",
          "scope": [
            "comment",
            "punctuation.definition.comment"
          ],
          "settings": {
            "foreground": "#a4c4d1",
            "fontStyle": "italic"
          }
        },
        {
          "name": "String",
          "scope": [
            "string",
            "constant.other.symbol",
            "punctuation.definition.string"
          ],
          "settings": {
            "foreground": "#98d6b4"
          }
        },
        {
          "name": "Regular expression",
          "scope": [
            "string.regexp",
            "constant.character.escape"
          ],
          "settings": {
            "foreground": "#b3e7f1"
          }
        },
        {
          "name": "Number and language constant",
          "scope": [
            "constant.numeric",
            "constant.language",
            "constant.character",
            "keyword.other.unit"
          ],
          "settings": {
            "foreground": "#dbc38a"
          }
        },
        {
          "name": "Keyword and storage",
          "scope": [
            "keyword",
            "keyword.control",
            "storage",
            "storage.type",
            "storage.modifier"
          ],
          "settings": {
            "foreground": "#a0c9fd"
          }
        },
        {
          "name": "Operator and punctuation",
          "scope": [
            "keyword.operator",
            "punctuation",
            "meta.brace"
          ],
          "settings": {
            "foreground": "#c0d9e4"
          }
        },
        {
          "name": "Function",
          "scope": [
            "entity.name.function",
            "support.function",
            "variable.function",
            "meta.function-call.generic"
          ],
          "settings": {
            "foreground": "#86d4e2"
          }
        },
        {
          "name": "Type and class",
          "scope": [
            "entity.name.type",
            "entity.name.class",
            "entity.name.namespace",
            "entity.other.inherited-class",
            "support.class",
            "support.type"
          ],
          "settings": {
            "foreground": "#cdbbf2"
          }
        },
        {
          "name": "Variable",
          "scope": [
            "variable",
            "variable.other",
            "meta.definition.variable.name",
            "support.variable"
          ],
          "settings": {
            "foreground": "#eaf6fb"
          }
        },
        {
          "name": "Parameter",
          "scope": [
            "variable.parameter"
          ],
          "settings": {
            "foreground": "#c0d9e4",
            "fontStyle": "italic"
          }
        },
        {
          "name": "Property and key",
          "scope": [
            "support.type.property-name",
            "meta.object-literal.key",
            "variable.other.property",
            "entity.name.tag.yaml"
          ],
          "settings": {
            "foreground": "#86d4e2"
          }
        },
        {
          "name": "Markup tag",
          "scope": [
            "entity.name.tag",
            "punctuation.definition.tag"
          ],
          "settings": {
            "foreground": "#a0c9fd"
          }
        },
        {
          "name": "Markup attribute",
          "scope": [
            "entity.other.attribute-name",
            "meta.decorator",
            "entity.name.label"
          ],
          "settings": {
            "foreground": "#dbc38a"
          }
        },
        {
          "name": "Markdown heading",
          "scope": [
            "markup.heading",
            "entity.name.section"
          ],
          "settings": {
            "foreground": "#c6dfff",
            "fontStyle": "bold"
          }
        },
        {
          "name": "Markdown bold",
          "scope": [
            "markup.bold"
          ],
          "settings": {
            "foreground": "#eaf6fb",
            "fontStyle": "bold"
          }
        },
        {
          "name": "Markdown italic",
          "scope": [
            "markup.italic"
          ],
          "settings": {
            "foreground": "#eaf6fb",
            "fontStyle": "italic"
          }
        },
        {
          "name": "Markdown code",
          "scope": [
            "markup.inline.raw",
            "markup.fenced_code",
            "markup.raw"
          ],
          "settings": {
            "foreground": "#98d6b4"
          }
        },
        {
          "name": "Markdown link",
          "scope": [
            "markup.underline.link"
          ],
          "settings": {
            "foreground": "#a0c9fd"
          }
        },
        {
          "name": "Diff inserted",
          "scope": [
            "markup.inserted"
          ],
          "settings": {
            "foreground": "#98d6b4"
          }
        },
        {
          "name": "Diff deleted",
          "scope": [
            "markup.deleted"
          ],
          "settings": {
            "foreground": "#f7b39b"
          }
        },
        {
          "name": "Diff changed",
          "scope": [
            "markup.changed"
          ],
          "settings": {
            "foreground": "#dbc38a"
          }
        },
        {
          "name": "Invalid",
          "scope": [
            "invalid",
            "invalid.illegal"
          ],
          "settings": {
            "foreground": "#f7b39b"
          }
        }
      ]
    }

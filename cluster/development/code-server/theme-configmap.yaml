  name: code-server-theme
  namespace: code-server
data:
  package.json: |-
    {
      "name": "pennant-theme",
      "displayName": "Pennant",
      "description": "The homelab's shared palette, from the @my-homelab/styles design tokens.",
      "publisher": "my-homelab",
      "version": "1.0.0",
      "license": "UNLICENSED",
      "engines": {
        "vscode": "^1.70.0"
      },
      "categories": [
        "Themes"
      ],
      "contributes": {
        "themes": [
          {
            "label": "Pennant Dark",
            "uiTheme": "vs-dark",
            "path": "./themes/pennant-dark-color-theme.json"
          },
          {
            "label": "Pennant Light",
            "uiTheme": "vs",
            "path": "./themes/pennant-light-color-theme.json"
          }
        ]
      }
    }

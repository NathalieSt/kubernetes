---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: code-server-cilium-networkpolicy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: code-server
  description: The egress proxy, the API server read-only, and the metrics and log stores read-only.
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:app.kubernetes.io/name: egress-proxy
        k8s:io.kubernetes.pod.namespace: egress-proxy
    toPorts:
    - ports:
      - port: "8888"
        protocol: TCP
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: "6443"
        protocol: TCP
      - port: "443"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: victoria-metrics
    toPorts:
    - ports:
      - port: "8428"
        protocol: TCP
      rules:
        http:
        - method: ^(GET|POST)$
          path: ^/api/v1/query(_range)?([?].*)?$
        - method: ^(GET|POST)$
          path: ^/api/v1/(series|labels|metadata|targets|rules|alerts)([?].*)?$
        - method: ^(GET|POST)$
          path: ^/api/v1/label/[^/?]+/values([?].*)?$
        - method: ^(GET|POST)$
          path: ^/api/v1/status/[^?]*([?].*)?$
        - method: ^(GET|POST)$
          path: ^/api/v1/export[^?]*([?].*)?$
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: victoria-logs
    toPorts:
    - ports:
      - port: "9428"
        protocol: TCP
      rules:
        http:
        - method: ^(GET|POST)$
          path: ^/select/.*$

---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: psono-client
    app.kubernetes.io/version: 7f64e32
  name: psono-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: psono-client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: psono-client
        app.kubernetes.io/version: 7f64e32
    spec:
      imagePullSecrets:
      - name: forgejo-registry-secret
      automountServiceAccountToken: false
      containers:
      - image: code.netbird.nathalie-stiefsohn.eu/my-homelab/psono-client:7f64e32@sha256:d7213b808395fe1e27c38db3f088cca4ddc9e685bffe1ea067df59ae996da538
        name: psono-client
        ports:
        - containerPort: 80
          name: http
        env:
        - name: PSONO_WEBCLIENT_CONFIG_JSON
          value: "{\"backend_servers\":[{\"title\":\"Homelab\",\"url\":\"https://psono-api.netbird.nathalie-stiefsohn.eu\",\"domain\":\"homelab.internal\"}],\"base_url\":\"https://psono.netbird.nathalie-stiefsohn.eu/\",\"allow_custom_server\":false,\"allow_registration\":false,\"allow_lost_password\":false,\"allow_delete_account\":false,\"authentication_methods\":[\"AUTHKEY\"],\"more_links\":[],\"theme\":{\"palette\":{\"background\":{\"default\":\"#15171b\",\"paper\":\"#ffffff\"},\"primary\":{\"main\":\"#2c517f\"},\"secondary\":{\"main\":\"#005c60\"},\"action\":{\"disabledBackground\":\"#2c517f80\"},\"lightGreyText\":{\"main\":\"#676c74\",\"light\":\"#676c74\",\"dark\":\"#676c74\",\"contrastText\":\"#676c74\"},\"greyText\":{\"main\":\"#484e54\",\"light\":\"#484e54\",\"dark\":\"#484e54\",\"contrastText\":\"#484e54\"},\"checked\":{\"main\":\"#2c517f\",\"light\":\"#2c517f\",\"dark\":\"#2c517f\",\"contrastText\":\"#2c517f\"},\"blueBackground\":{\"main\":\"#202327\",\"light\":\"#202327\",\"dark\":\"#202327\",\"contrastText\":\"#202327\"},\"badgeBackground\":{\"main\":\"#676c74\",\"light\":\"#676c74\",\"dark\":\"#676c74\",\"contrastText\":\"#676c74\"},\"appBarText\":{\"main\":\"#484e54\",\"light\":\"#484e54\",\"dark\":\"#484e54\",\"contrastText\":\"#484e54\"},\"appBarBackground\":{\"main\":\"#ffffff\",\"light\":\"#ffffff\",\"dark\":\"#ffffff\",\"contrastText\":\"#ffffff\"},\"appBarReadOnlyText\":{\"main\":\"#493409\",\"light\":\"#493409\",\"dark\":\"#493409\",\"contrastText\":\"#493409\"},\"appBarReadOnlyBackground\":{\"main\":\"#f9ebd5\",\"light\":\"#f9ebd5\",\"dark\":\"#f9ebd5\",\"contrastText\":\"#f9ebd5\"},\"baseBackground\":{\"main\":\"#e3e6ea\",\"light\":\"#e3e6ea\",\"dark\":\"#e3e6ea\",\"contrastText\":\"#e3e6ea\"},\"baseTitleBackground\":{\"main\":\"#f2f4f6\",\"light\":\"#f2f4f6\",\"dark\":\"#f2f4f6\",\"contrastText\":\"#f2f4f6\"},\"lightBackground\":{\"main\":\"#ffffff\",\"light\":\"#ffffff\",\"dark\":\"#ffffff\",\"contrastText\":\"#ffffff\"}}}}"
        - name: PSONO_SERVICE_WORKER_DISABLE
          value: "true"
        - name: TZ
          value: Europe/Vienna
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        securityContext:
          capabilities:
            add:
            - CHOWN
            - SETUID
            - SETGID
            - NET_BIND_SERVICE
            drop:
            - ALL
          allowPrivilegeEscalation: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault

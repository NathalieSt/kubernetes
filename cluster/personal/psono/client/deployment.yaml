---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: psono-client
    app.kubernetes.io/version: 94201a8
  name: psono-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: psono-client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: psono-client
        app.kubernetes.io/version: 94201a8
    spec:
      imagePullSecrets:
      - name: forgejo-registry-secret
      automountServiceAccountToken: false
      containers:
      - image: code.netbird.nathalie-stiefsohn.eu/my-homelab/psono-client:94201a8@sha256:af1d42ff2b4a6eb246d38c505f2b0fcada6cec2105c23206920920cb60afb0df
        name: psono-client
        ports:
        - containerPort: 80
          name: http
        env:
        - name: PSONO_WEBCLIENT_CONFIG_JSON
          value: "{\"backend_servers\":[{\"title\":\"Homelab\",\"url\":\"https://psono-api.netbird.nathalie-stiefsohn.eu\",\"domain\":\"homelab.internal\"}],\"base_url\":\"https://psono.netbird.nathalie-stiefsohn.eu/\",\"allow_custom_server\":false,\"allow_registration\":false,\"allow_lost_password\":false,\"allow_delete_account\":false,\"authentication_methods\":[\"AUTHKEY\"],\"more_links\":[],\"theme\":{\"palette\":{\"background\":{\"default\":\"#071a21\",\"paper\":\"#e8f8fb\"},\"primary\":{\"main\":\"#005a66\"},\"secondary\":{\"main\":\"#2c517f\"},\"action\":{\"disabledBackground\":\"#005a6680\"},\"lightGreyText\":{\"main\":\"#4c7281\",\"light\":\"#4c7281\",\"dark\":\"#4c7281\",\"contrastText\":\"#4c7281\"},\"greyText\":{\"main\":\"#305360\",\"light\":\"#305360\",\"dark\":\"#305360\",\"contrastText\":\"#305360\"},\"checked\":{\"main\":\"#005a66\",\"light\":\"#005a66\",\"dark\":\"#005a66\",\"contrastText\":\"#005a66\"},\"blueBackground\":{\"main\":\"#093842\",\"light\":\"#093842\",\"dark\":\"#093842\",\"contrastText\":\"#093842\"},\"badgeBackground\":{\"main\":\"#4c7281\",\"light\":\"#4c7281\",\"dark\":\"#4c7281\",\"contrastText\":\"#4c7281\"},\"appBarText\":{\"main\":\"#305360\",\"light\":\"#305360\",\"dark\":\"#305360\",\"contrastText\":\"#305360\"},\"appBarBackground\":{\"main\":\"#e8f8fb\",\"light\":\"#e8f8fb\",\"dark\":\"#e8f8fb\",\"contrastText\":\"#e8f8fb\"},\"appBarReadOnlyText\":{\"main\":\"#463608\",\"light\":\"#463608\",\"dark\":\"#463608\",\"contrastText\":\"#463608\"},\"appBarReadOnlyBackground\":{\"main\":\"#f6ecd4\",\"light\":\"#f6ecd4\",\"dark\":\"#f6ecd4\",\"contrastText\":\"#f6ecd4\"},\"baseBackground\":{\"main\":\"#d8eaf1\",\"light\":\"#d8eaf1\",\"dark\":\"#d8eaf1\",\"contrastText\":\"#d8eaf1\"},\"baseTitleBackground\":{\"main\":\"#eaf6fb\",\"light\":\"#eaf6fb\",\"dark\":\"#eaf6fb\",\"contrastText\":\"#eaf6fb\"},\"lightBackground\":{\"main\":\"#e8f8fb\",\"light\":\"#e8f8fb\",\"dark\":\"#e8f8fb\",\"contrastText\":\"#e8f8fb\"}}}}"
        - name: PSONO_SERVICE_WORKER_DISABLE
          value: "true"
        - name: TZ
          value: Europe/Vienna
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        securityContext:
          capabilities:
            add:
            - CHOWN
            - SETUID
            - SETGID
            - NET_BIND_SERVICE
            drop:
            - ALL
          allowPrivilegeEscalation: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault

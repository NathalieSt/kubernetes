---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: clavis
    app.kubernetes.io/version: 30c0def
  name: clavis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clavis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clavis
        app.kubernetes.io/version: 30c0def
    spec:
      imagePullSecrets:
      - name: forgejo-registry-secret
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
      - image: code.netbird.nathalie-stiefsohn.eu/my-homelab/clavis:30c0def@sha256:bb13dc439993973d17396dc44e1ea270e6721252b816aaefa41a8d7683985d94
        name: clavis
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - mountPath: /etc/nginx/conf.d
          name: conf
        - mountPath: /tmp
          name: tmp
        env:
        - name: CLAVIS_SERVER
          value: https://psono-api.netbird.nathalie-stiefsohn.eu
        - name: CLAVIS_VERIFY_KEY
          value: eaaf761c976ca2c489f9aa9706298643cb0e10fd239470fc1aa69a7c9d8c0fc8
        - name: TZ
          value: Europe/Vienna
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        securityContext:
          capabilities:
            drop:
            - ALL
          runAsUser: 101
          runAsGroup: 101
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 10
      volumes:
      - name: conf
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      securityContext:
        seccompProfile:
          type: RuntimeDefault

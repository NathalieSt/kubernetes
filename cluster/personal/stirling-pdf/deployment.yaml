---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: stirling-pdf
    app.kubernetes.io/version: 3.2.2
  name: stirling-pdf
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stirling-pdf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stirling-pdf
        app.kubernetes.io/version: 3.2.2
    spec:
      initContainers:
      - command:
        - python3
        - /halcyon/jar-stylesheet-override.py
        - /app/app.jar
        - static/index.html
        - /customFiles/static
        - /halcyon/halcyon.css
        image: stirlingtools/stirling-pdf:3.2.2@sha256:c6872dd056b0046a14c5de1e9970283e7f1e1ff685bb08090c6b37a231127d31
        name: halcyon
        volumeMounts:
        - mountPath: /halcyon
          name: halcyon
          readOnly: true
        - mountPath: /customFiles
          name: scratch-customfiles
        securityContext:
          capabilities:
            drop:
            - ALL
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
      - image: stirlingtools/stirling-pdf:3.2.2@sha256:c6872dd056b0046a14c5de1e9970283e7f1e1ff685bb08090c6b37a231127d31
        name: stirling-pdf
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - mountPath: /tmp
          name: scratch-tmp
        - mountPath: /configs
          name: scratch-configs
        - mountPath: /logs
          name: scratch-logs
        - mountPath: /customFiles
          name: scratch-customfiles
        - mountPath: /pipeline
          name: scratch-pipeline
        env:
        - name: TZ
          value: Europe/Vienna
        - name: SECURITY_ENABLELOGIN
          value: "false"
        - name: SYSTEM_ENABLEANALYTICS
          value: "false"
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 2Gi
        securityContext:
          capabilities:
            add:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - SETUID
            - SETGID
            drop:
            - ALL
          allowPrivilegeEscalation: false
        readinessProbe:
          httpGet:
            path: /api/v1/info/status
            port: 8080
          periodSeconds: 15
        startupProbe:
          httpGet:
            path: /api/v1/info/status
            port: 8080
          periodSeconds: 5
          failureThreshold: 36
      volumes:
      - name: scratch-tmp
        emptyDir: {}
      - name: scratch-configs
        emptyDir: {}
      - name: scratch-logs
        emptyDir: {}
      - name: scratch-customfiles
        emptyDir: {}
      - name: scratch-pipeline
        emptyDir: {}
      - name: halcyon
        configMap:
          name: stirling-pdf-halcyon
      securityContext:
        seccompProfile:
          type: RuntimeDefault

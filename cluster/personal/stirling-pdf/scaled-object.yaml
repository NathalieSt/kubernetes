---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: stirling-pdf-scaledobject
spec:
  scaleTargetRef:
    kind: Deployment
    name: stirling-pdf
  minReplicaCount: 0
  maxReplicaCount: 1
  pollingInterval: 10
  cooldownPeriod: 300
  fallback:
    failureThreshold: 3
    replicas: 1
  triggers:
  - type: prometheus
    metadata:
      serverAddress: http://vmsingle-victoria-metrics-vmks.victoria-metrics.svc.cluster.local:8428
      query: (sum(increase(traefik_service_requests_total{service="stirling-pdf@file"}[30m])) or vector(0)) + on() (0 * max(up{job="internal-gateway"} == 1))
      threshold: "1"
      ignoreNullValues: "false"

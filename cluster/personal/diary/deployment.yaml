---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: diary
    app.kubernetes.io/version: "5615191"
  name: diary
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: diary
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: diary
        app.kubernetes.io/version: "5615191"
    spec:
      imagePullSecrets:
      - name: forgejo-registry-secret
      initContainers:
      - command:
        - sh
        - -c
        - chown 1000:1000 /var/lib/diary
        image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
        name: permission-fix
        volumeMounts:
        - mountPath: /var/lib/diary
          name: data-volume
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
      - image: code.netbird.nathalie-stiefsohn.eu/my-homelab/diary:5615191@sha256:3d2651f2eb425af0de51991adbf67390458b2e646aac0a90cbdd4da1f0a1b6a4
        name: diary
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - mountPath: /var/lib/diary
          name: data-volume
        env:
        - name: WEB_ADDR
          value: :8080
        - name: DIARY_DATA_DIR
          value: /var/lib/diary
        - name: DIARY_STATIC_ROOT
          value: /app/ui/dist
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          capabilities:
            drop:
            - ALL
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: diary-data-pvc
      securityContext:
        seccompProfile:
          type: RuntimeDefault

apiVersion: v1
kind: ConfigMap
metadata:
  name: kavita-theme
  namespace: kavita
data:
  pennant-light.css: |
    /* Halcyon -- the homelab's shared palette, from the styles repo.
     * GENERATED by kubernetes-generator (src/generators/theme/KavitaTheme.res). Edit tokens.json in styles
     * and regenerate. The selector below must match the filename: Kavita derives the class from it. */

    :root .bg-pennant-light {
      --theme-color: #30323c;
      --color-scheme: light;
      --primary-color: #30323c;
      --primary-color-dark-shade: #4d4f59;
      --primary-color-darker-shade: #4d4f59;
      --primary-color-darkest-shade: #36383f;
      --error-color: #783d28;
      --bs-body-bg: #f2f3f8;
      --body-text-color: #30323c;
      --btn-icon-filter: none;

      /* Scrollbar */
      --primary-color-scrollbar: #30323cbf;

      /* Navbar */
      --navbar-bg-color: #ffffff;
      --navbar-text-color: #30323c;
      --navbar-fa-icon-color: #30323c;
      --navbar-btn-hover-outline-color: #30323c;

      /* Side Nav */
      --side-nav-bg-color: #ffffff66;
      --side-nav-mobile-bg-color: #ffffff;
      --side-nav-box-shadow: #e4e6ed80;
      --side-nav-hover-text-color: #f9fafd;
      --side-nav-hover-bg-color: #30323c;
      --side-nav-color: #30323c;
      --side-nav-border: none;
      --side-nav-border-closed: none;
      --side-nav-closed-bg-color: transparent;
      --side-nav-item-active-color: var(--primary-color);
      --side-nav-item-active-text-color: #f9fafd;
      --side-nav-active-bg-color: #30323c;
      --side-nav-overlay-color: #30323c;

      /* Inputs */
      --input-bg-color: #f2f3f8;
      --input-bg-readonly-color: #e4e6ed;
      --input-focused-border-color: #30323c;
      --input-text-color: #30323c;
      --input-placeholder-color: #686b79;
      --input-border-color: #d1d4dd;
      --input-focus-boxshadow-color: #30323c80;
      --input-range-color: var(--primary-color);
      --input-range-active-color: var(--primary-color-darker-shade);

      /* Buttons */
      --btn-focus-boxshadow-color: #30323c80;
      --btn-primary-text-color: #f9fafd;
      --btn-primary-bg-color: var(--primary-color);
      --btn-primary-border-color: var(--primary-color);
      --btn-primary-hover-text-color: #f9fafd;
      --btn-primary-hover-bg-color: var(--primary-color-darker-shade);
      --btn-primary-hover-border-color: var(--primary-color-darker-shade);
      --btn-alt-bg-color: #f2f3f8;
      --btn-alt-border-color: #d1d4dd;
      --btn-alt-hover-bg-color: #e4e6ed;
      --btn-alt-focus-bg-color: #e4e6ed;
      --btn-alt-focus-boxshadow-color: #30323c80;
      --btn-fa-icon-color: #4a4c58;
      --btn-disabled-bg-color: #f2f3f8;
      --btn-disabled-text-color: #686b79;
      --btn-disabled-border-color: #d1d4dd;

      /* Nav */
      --nav-tab-border-color: #d1d4dd;
      --nav-tab-text-color: var(--body-text-color);
      --nav-tab-bg-color: var(--primary-color);
      --nav-tab-hover-border-color: var(--primary-color);
      --nav-tab-active-text-color: #f9fafd;
      --nav-tab-border-hover-color: transparent;
      --nav-tab-hover-text-color: var(--body-text-color);
      --nav-tab-hover-bg-color: transparent;
      --nav-tab-border-top: #d1d4dd;
      --nav-tab-border-left: #d1d4dd;
      --nav-tab-border-bottom: #d1d4dd;
      --nav-tab-border-right: #d1d4dd;
      --nav-tab-hover-border-top: #d1d4dd;
      --nav-tab-hover-border-left: #d1d4dd;
      --nav-tab-hover-border-bottom: var(--bs-body-bg);
      --nav-tab-hover-border-right: #d1d4dd;
      --nav-tab-active-hover-bg-color: var(--primary-color);

      --nav-link-bg-color: var(--primary-color);
      --nav-link-active-text-color: #f9fafd;
      --nav-link-text-color: #30323c;

      --nav-header-text-color: #f9fafd;
      --nav-header-bg-color: #30323c;

      /* Toasts */
      --toast-success-bg-color: #1d5d40;
      --toast-error-bg-color: #783d28;
      --toast-info-bg-color: #21222a;
      --toast-warning-bg-color: #624d0e;

      /* Checkboxes */
      --checkbox-checked-bg-color: var(--primary-color);
      --checkbox-border-color: #686b79;
      --checkbox-focus-border-color: var(--primary-color);
      --checkbox-focus-boxshadow-color: #30323c80;

      /* Tagbadge */
      --tagbadge-border-color: #d1d4dd;
      --tagbadge-text-color: var(--body-text-color);
      --tagbadge-bg-color: #f2f3f8;
      --tagbadge-filled-border-color: #d1d4dd;
      --tagbadge-filled-text-color: #21222a;
      --tagbadge-filled-bg-color: #e4e6ed;

      /* List items */
      --list-group-item-text-color: var(--body-text-color);
      --list-group-item-bg-color: #ffffff;
      --list-group-item-border-color: #d1d4dd;
      --list-group-hover-text-color: #f9fafd;
      --list-group-hover-bg-color: #30323c;
      --list-group-active-border-color: none;

      /* Popover */
      --popover-body-bg-color: #ffffff;
      --popover-body-text-color: #30323c;
      --popover-outerarrow-color: transparent;
      --popover-arrow-color: transparent;
      --popover-bg-color: #ffffff;
      --popover-border-color: #d1d4dd;

      /* Pagination */
      --pagination-active-link-border-color: var(--primary-color);
      --pagination-active-link-bg-color: var(--primary-color);
      --pagination-active-link-text-color: #f9fafd;
      --pagination-link-border-color: #d1d4dd;
      --pagination-link-text-color: #30323c;
      --pagination-link-bg-color: #ffffff80;
      --pagination-focus-border-color: var(--primary-color);
      --pagination-link-hover-color: var(--primary-color);

      /* Progress */
      --progress-bg-color: #e4e6ed;
      --progress-bar-color: var(--primary-color);

      /* Dropdown */
      --dropdown-item-hover-text-color: #f9fafd;
      --dropdown-item-hover-bg-color: #30323c;
      --dropdown-item-text-color: #30323c;
      --dropdown-item-bg-color: #ffffff;
      --dropdown-overlay-color: #e4e6ed80;

      /* Accordion */
      --accordion-header-text-color: #30323c;
      --accordion-header-bg-color: #f2f3f8;
      --accordion-body-bg-color: #ffffff;
      --accordion-body-border-color: #d1d4dd;
      --accordion-body-text-color: var(--body-text-color);
      --accordion-header-collapsed-text-color: #30323c;
      --accordion-header-collapsed-bg-color: #f2f3f8;
      --accordion-active-body-bg-color: #ffffff;

      /* Breadcrumb */
      --breadcrumb-bg-color: #f2f3f8;
      --breadcrumb-item-text-color: var(--body-text-color);

      /* Rating star */
      --ratingstar-color: #624d0e;
      --ratingstar-star-empty: #e4e6ed;
      --ratingstar-star-filled: #624d0e;

      /* Global */
      --hr-color: #d1d4dd;
      --accent-bg-color: #f2f3f8;
      --accent-text-color: #4a4c58;

      /* Card */
      --card-bg-color: #ffffff;
      --card-text-color: var(--body-text-color);
      --card-border-color: #d1d4dd;
      --card-progress-bar-color: var(--primary-color);
      --card-overlay-bg-color: #e4e6ed00;
      --card-overlay-hover-bg-color: #e4e6ed33;

      /* Slider */
      --slider-text-color: #30323c;

      /* Manga Reader */
      --manga-reader-overlay-bg-color: #ffffff80;
      --manga-reader-overlay-text-color: #30323c;
      --manga-reader-bg-color: #f2f3f8;
      --manga-reader-next-highlight-bg-color: #30323c;
      --manga-reader-prev-highlight-bg-color: #30323c;

      /* Radios */
      --radio-accent-color: var(--primary-color);
      --radio-hover-accent-color: var(--primary-color);
      --radio-focus-boxshadow-color: #30323c80;

      /* Carousel */
      --carousel-header-text-color: var(--body-text-color);

      /* Drawer */
      --drawer-background-color: #f2f3f8;
      --drawer-bg-color: #ffffff;
      --drawer-text-color: #30323c;

      /* Event Widget */
      --event-widget-bg-color: #ffffff;
      --event-widget-item-bg-color: #f2f3f8;
      --event-widget-text-color: var(--body-text-color);
      --event-widget-item-border-color: #d1d4dd;
      --event-widget-border-color: #d1d4dd;

      /* Bulk Selection */
      --bulk-selection-text-color: #30323c;
      --bulk-selection-highlight-text-color: var(--primary-color);

      /* Card list */
      --card-list-item-bg-color: linear-gradient(
        180deg,
        #f2f3f826 0%,
        #f2f3f826 1%,
        #f2f3f800 100%
      );

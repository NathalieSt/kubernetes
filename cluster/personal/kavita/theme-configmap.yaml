    :root .bg-pennant-light {
      --theme-color: #005a66;
      --color-scheme: light;
      --primary-color: #005a66;
      --primary-color-dark-shade: #2c517f;
      --primary-color-darker-shade: #2c517f;
      --primary-color-darkest-shade: #1d395b;
      --error-color: #783d28;
      --bs-body-bg: #eaf6fb;
      --body-text-color: #1a3742;
      --btn-icon-filter: none;

      /* Scrollbar */
      --primary-color-scrollbar: #005a66bf;

      /* Navbar */
      --navbar-bg-color: #e8f8fb;
      --navbar-text-color: #1a3742;
      --navbar-fa-icon-color: #1a3742;
      --navbar-btn-hover-outline-color: #005a66;

      /* Side Nav */
      --side-nav-bg-color: #e8f8fb66;
      --side-nav-mobile-bg-color: #e8f8fb;
      --side-nav-box-shadow: #d8eaf180;
      --side-nav-hover-text-color: #f4fcff;
      --side-nav-hover-bg-color: #005a66;
      --side-nav-color: #1a3742;
      --side-nav-border: none;
      --side-nav-border-closed: none;
      --side-nav-closed-bg-color: transparent;
      --side-nav-item-active-color: var(--primary-color);
      --side-nav-item-active-text-color: #f4fcff;
      --side-nav-active-bg-color: #005a66;
      --side-nav-overlay-color: #2c517f;

      /* Inputs */
      --input-bg-color: #eaf6fb;
      --input-bg-readonly-color: #d8eaf1;
      --input-focused-border-color: #007785;
      --input-text-color: #1a3742;
      --input-placeholder-color: #4c7281;
      --input-border-color: #d8eaf1;
      --input-focus-boxshadow-color: #00778580;
      --input-range-color: var(--primary-color);
      --input-range-active-color: var(--primary-color-darker-shade);

      /* Buttons */
      --btn-focus-boxshadow-color: #00778580;
      --btn-primary-text-color: #f4fcff;
      --btn-primary-bg-color: var(--primary-color);
      --btn-primary-border-color: var(--primary-color);
      --btn-primary-hover-text-color: #f4fcff;
      --btn-primary-hover-bg-color: var(--primary-color-darker-shade);
      --btn-primary-hover-border-color: var(--primary-color-darker-shade);
      --btn-alt-bg-color: #eaf6fb;
      --btn-alt-border-color: #d8eaf1;
      --btn-alt-hover-bg-color: #d8eaf1;
      --btn-alt-focus-bg-color: #d8eaf1;
      --btn-alt-focus-boxshadow-color: #00778580;
      --btn-fa-icon-color: #305360;
      --btn-disabled-bg-color: #eaf6fb;
      --btn-disabled-text-color: #4c7281;
      --btn-disabled-border-color: #d8eaf1;

      /* Nav */
      --nav-tab-border-color: #d8eaf1;
      --nav-tab-text-color: var(--body-text-color);
      --nav-tab-bg-color: var(--primary-color);
      --nav-tab-hover-border-color: var(--primary-color);
      --nav-tab-active-text-color: #f4fcff;
      --nav-tab-border-hover-color: transparent;
      --nav-tab-hover-text-color: var(--body-text-color);
      --nav-tab-hover-bg-color: transparent;
      --nav-tab-border-top: #d8eaf1;
      --nav-tab-border-left: #d8eaf1;
      --nav-tab-border-bottom: #d8eaf1;
      --nav-tab-border-right: #d8eaf1;
      --nav-tab-hover-border-top: #d8eaf1;
      --nav-tab-hover-border-left: #d8eaf1;
      --nav-tab-hover-border-bottom: var(--bs-body-bg);
      --nav-tab-hover-border-right: #d8eaf1;
      --nav-tab-active-hover-bg-color: var(--primary-color);

      --nav-link-bg-color: var(--primary-color);
      --nav-link-active-text-color: #f4fcff;
      --nav-link-text-color: #1a3742;

      --nav-header-text-color: #f4fcff;
      --nav-header-bg-color: #005a66;

      /* Toasts */
      --toast-success-bg-color: #1d5d40;
      --toast-error-bg-color: #783d28;
      --toast-info-bg-color: #574576;
      --toast-warning-bg-color: #624d0e;

      /* Checkboxes */
      --checkbox-checked-bg-color: var(--primary-color);
      --checkbox-border-color: #4c7281;
      --checkbox-focus-border-color: var(--primary-color);
      --checkbox-focus-boxshadow-color: #00778580;

      /* Tagbadge */
      --tagbadge-border-color: #d8eaf1;
      --tagbadge-text-color: var(--body-text-color);
      --tagbadge-bg-color: #eaf6fb;
      --tagbadge-filled-border-color: #d8eaf1;
      --tagbadge-filled-text-color: #004049;
      --tagbadge-filled-bg-color: #d5f3f9;

      /* List items */
      --list-group-item-text-color: var(--body-text-color);
      --list-group-item-bg-color: #e8f8fb;
      --list-group-item-border-color: #d8eaf1;
      --list-group-hover-text-color: #f4fcff;
      --list-group-hover-bg-color: #005a66;
      --list-group-active-border-color: none;

      /* Popover */
      --popover-body-bg-color: #e8f8fb;
      --popover-body-text-color: #1a3742;
      --popover-outerarrow-color: transparent;
      --popover-arrow-color: transparent;
      --popover-bg-color: #e8f8fb;
      --popover-border-color: #d8eaf1;

      /* Pagination */
      --pagination-active-link-border-color: var(--primary-color);
      --pagination-active-link-bg-color: var(--primary-color);
      --pagination-active-link-text-color: #f4fcff;
      --pagination-link-border-color: #d8eaf1;
      --pagination-link-text-color: #1a3742;
      --pagination-link-bg-color: #e8f8fb80;
      --pagination-focus-border-color: var(--primary-color);
      --pagination-link-hover-color: var(--primary-color);

      /* Progress */
      --progress-bg-color: #d8eaf1;
      --progress-bar-color: var(--primary-color);

      /* Dropdown */
      --dropdown-item-hover-text-color: #f4fcff;
      --dropdown-item-hover-bg-color: #005a66;
      --dropdown-item-text-color: #1a3742;
      --dropdown-item-bg-color: #e8f8fb;
      --dropdown-overlay-color: #d8eaf180;

      /* Accordion */
      --accordion-header-text-color: #1a3742;
      --accordion-header-bg-color: #eaf6fb;
      --accordion-body-bg-color: #e8f8fb;
      --accordion-body-border-color: #d8eaf1;
      --accordion-body-text-color: var(--body-text-color);
      --accordion-header-collapsed-text-color: #1a3742;
      --accordion-header-collapsed-bg-color: #eaf6fb;
      --accordion-active-body-bg-color: #e8f8fb;

      /* Breadcrumb */
      --breadcrumb-bg-color: #eaf6fb;
      --breadcrumb-item-text-color: var(--body-text-color);

      /* Rating star */
      --ratingstar-color: #624d0e;
      --ratingstar-star-empty: #d8eaf1;
      --ratingstar-star-filled: #624d0e;

      /* Global */
      --hr-color: #d8eaf1;
      --accent-bg-color: #eaf6fb;
      --accent-text-color: #305360;

      /* Card */
      --card-bg-color: #e8f8fb;
      --card-text-color: var(--body-text-color);
      --card-border-color: #d8eaf1;
      --card-progress-bar-color: var(--primary-color);
      --card-overlay-bg-color: #d8eaf100;
      --card-overlay-hover-bg-color: #d8eaf133;

      /* Slider */
      --slider-text-color: #1a3742;

      /* Manga Reader */
      --manga-reader-overlay-bg-color: #e8f8fb80;
      --manga-reader-overlay-text-color: #1a3742;
      --manga-reader-bg-color: #eaf6fb;
      --manga-reader-next-highlight-bg-color: #005a66;
      --manga-reader-prev-highlight-bg-color: #2c517f;

      /* Radios */
      --radio-accent-color: var(--primary-color);
      --radio-hover-accent-color: var(--primary-color);
      --radio-focus-boxshadow-color: #00778580;

      /* Carousel */
      --carousel-header-text-color: var(--body-text-color);

      /* Drawer */
      --drawer-background-color: #eaf6fb;
      --drawer-bg-color: #e8f8fb;
      --drawer-text-color: #1a3742;

      /* Event Widget */
      --event-widget-bg-color: #e8f8fb;
      --event-widget-item-bg-color: #eaf6fb;
      --event-widget-text-color: var(--body-text-color);
      --event-widget-item-border-color: #d8eaf1;
      --event-widget-border-color: #d8eaf1;

      /* Bulk Selection */
      --bulk-selection-text-color: #1a3742;
      --bulk-selection-highlight-text-color: var(--primary-color);

      /* Card list */
      --card-list-item-bg-color: linear-gradient(
        180deg,
        #eaf6fb26 0%,
        #eaf6fb26 1%,
        #eaf6fb00 100%
      );

    :root .bg-pennant-light {
      --theme-color: #2c517f;
      --color-scheme: light;
      --primary-color: #2c517f;
      --primary-color-dark-shade: #2c517f;
      --primary-color-darker-shade: #2c517f;
      --primary-color-darkest-shade: #1d395b;
      --error-color: #7c3739;
      --bs-body-bg: #f9fafc;
      --body-text-color: #2f3339;
      --btn-icon-filter: none;

      /* Scrollbar */
      --primary-color-scrollbar: #2c517fbf;

      /* Navbar */
      --navbar-bg-color: #ffffff;
      --navbar-text-color: #2f3339;
      --navbar-fa-icon-color: #2f3339;
      --navbar-btn-hover-outline-color: #2c517f;

      /* Side Nav */
      --side-nav-bg-color: #ffffff66;
      --side-nav-mobile-bg-color: #ffffff;
      --side-nav-box-shadow: #e3e6ea80;
      --side-nav-hover-text-color: #f9fafc;
      --side-nav-hover-bg-color: #2c517f;
      --side-nav-color: #2f3339;
      --side-nav-border: none;
      --side-nav-border-closed: none;
      --side-nav-closed-bg-color: transparent;
      --side-nav-item-active-color: var(--primary-color);
      --side-nav-item-active-text-color: #f9fafc;
      --side-nav-active-bg-color: #2c517f;
      --side-nav-overlay-color: #005c60;

      /* Inputs */
      --input-bg-color: #f2f4f6;
      --input-bg-readonly-color: #e3e6ea;
      --input-focused-border-color: #3c6aa4;
      --input-text-color: #2f3339;
      --input-placeholder-color: #676c74;
      --input-border-color: #e3e6ea;
      --input-focus-boxshadow-color: #3c6aa480;
      --input-range-color: var(--primary-color);
      --input-range-active-color: var(--primary-color-darker-shade);

      /* Buttons */
      --btn-focus-boxshadow-color: #3c6aa480;
      --btn-primary-text-color: #f9fafc;
      --btn-primary-bg-color: var(--primary-color);
      --btn-primary-border-color: var(--primary-color);
      --btn-primary-hover-text-color: #f9fafc;
      --btn-primary-hover-bg-color: var(--primary-color-darker-shade);
      --btn-primary-hover-border-color: var(--primary-color-darker-shade);
      --btn-alt-bg-color: #f2f4f6;
      --btn-alt-border-color: #e3e6ea;
      --btn-alt-hover-bg-color: #e3e6ea;
      --btn-alt-focus-bg-color: #e3e6ea;
      --btn-alt-focus-boxshadow-color: #3c6aa480;
      --btn-fa-icon-color: #484e54;
      --btn-disabled-bg-color: #f2f4f6;
      --btn-disabled-text-color: #676c74;
      --btn-disabled-border-color: #e3e6ea;

      /* Nav */
      --nav-tab-border-color: #e3e6ea;
      --nav-tab-text-color: var(--body-text-color);
      --nav-tab-bg-color: var(--primary-color);
      --nav-tab-hover-border-color: var(--primary-color);
      --nav-tab-active-text-color: #f9fafc;
      --nav-tab-border-hover-color: transparent;
      --nav-tab-hover-text-color: var(--body-text-color);
      --nav-tab-hover-bg-color: transparent;
      --nav-tab-border-top: #e3e6ea;
      --nav-tab-border-left: #e3e6ea;
      --nav-tab-border-bottom: #e3e6ea;
      --nav-tab-border-right: #e3e6ea;
      --nav-tab-hover-border-top: #e3e6ea;
      --nav-tab-hover-border-left: #e3e6ea;
      --nav-tab-hover-border-bottom: var(--bs-body-bg);
      --nav-tab-hover-border-right: #e3e6ea;
      --nav-tab-active-hover-bg-color: var(--primary-color);

      --nav-link-bg-color: var(--primary-color);
      --nav-link-active-text-color: #f9fafc;
      --nav-link-text-color: #2f3339;

      --nav-header-text-color: #f9fafc;
      --nav-header-bg-color: #2c517f;

      /* Toasts */
      --toast-success-bg-color: #2b5c37;
      --toast-error-bg-color: #7c3739;
      --toast-info-bg-color: #574576;
      --toast-warning-bg-color: #674a0f;


      --pagination-active-link-text-color: #f9fafc;
      --pagination-link-border-color: #e3e6ea;
      --pagination-link-text-color: #2f3339;
      --pagination-link-bg-color: #ffffff80;
      --pagination-focus-border-color: var(--primary-color);
      --pagination-link-hover-color: var(--primary-color);

      /* Progress */
      --progress-bg-color: #e3e6ea;
      --progress-bar-color: var(--primary-color);

      /* Dropdown */
      --dropdown-item-hover-text-color: #f9fafc;
      --dropdown-item-hover-bg-color: #2c517f;
      --dropdown-item-text-color: #2f3339;
      --dropdown-item-bg-color: #ffffff;
      --dropdown-overlay-color: #e3e6ea80;

      /* Accordion */
      --accordion-header-text-color: #2f3339;
      --accordion-header-bg-color: #f2f4f6;
      --accordion-body-bg-color: #ffffff;
      --accordion-body-border-color: #e3e6ea;
      --accordion-body-text-color: var(--body-text-color);
      --accordion-header-collapsed-text-color: #2f3339;
      --accordion-header-collapsed-bg-color: #f2f4f6;
      --accordion-active-body-bg-color: #ffffff;

      /* Breadcrumb */
      --breadcrumb-bg-color: #f2f4f6;
      --breadcrumb-item-text-color: var(--body-text-color);

      /* Rating star */
      --ratingstar-color: #674a0f;
      --ratingstar-star-empty: #e3e6ea;
      --ratingstar-star-filled: #674a0f;

      /* Global */
      --hr-color: #e3e6ea;
      --accent-bg-color: #f2f4f6;
      --accent-text-color: #484e54;

      /* Card */
      --card-bg-color: #ffffff;
      --card-text-color: var(--body-text-color);
      --card-border-color: #e3e6ea;
      --card-progress-bar-color: var(--primary-color);
      --card-overlay-bg-color: #e3e6ea00;
      --card-overlay-hover-bg-color: #e3e6ea33;

      /* Slider */
      --slider-text-color: #2f3339;

      /* Manga Reader */
      --manga-reader-overlay-bg-color: #ffffff80;
      --manga-reader-overlay-text-color: #2f3339;
      --manga-reader-bg-color: #f9fafc;
      --manga-reader-next-highlight-bg-color: #2c517f;
      --manga-reader-prev-highlight-bg-color: #005c60;

      /* Radios */
      --radio-accent-color: var(--primary-color);
      --radio-hover-accent-color: var(--primary-color);
      --radio-focus-boxshadow-color: #3c6aa480;

      /* Carousel */
      --carousel-header-text-color: var(--body-text-color);

      /* Drawer */
      --drawer-background-color: #f9fafc;
      --drawer-bg-color: #ffffff;
      --drawer-text-color: #2f3339;

      /* Event Widget */
      --event-widget-bg-color: #ffffff;
      --event-widget-item-bg-color: #f2f4f6;
      --event-widget-text-color: var(--body-text-color);
      --event-widget-item-border-color: #e3e6ea;
      --event-widget-border-color: #e3e6ea;

      /* Bulk Selection */
      --bulk-selection-text-color: #2f3339;
      --bulk-selection-highlight-text-color: var(--primary-color);

      /* Card list */
      --card-list-item-bg-color: linear-gradient(
        180deg,
        #f2f4f626 0%,
        #f2f4f626 1%,
        #f2f4f600 100%
      );

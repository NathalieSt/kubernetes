      --checkbox-checked-bg-color: var(--primary-color);
      --checkbox-border-color: #676c74;
      --checkbox-focus-border-color: var(--primary-color);
      --checkbox-focus-boxshadow-color: #3c6aa480;

      /* Tagbadge */
      --tagbadge-border-color: #e3e6ea;
      --tagbadge-text-color: var(--body-text-color);
      --tagbadge-bg-color: #f2f4f6;
      --tagbadge-filled-border-color: #e3e6ea;
      --tagbadge-filled-text-color: #1d395b;
      --tagbadge-filled-bg-color: #e1eeff;

      /* List items */
      --list-group-item-text-color: var(--body-text-color);
      --list-group-item-bg-color: #ffffff;
      --list-group-item-border-color: #e3e6ea;
      --list-group-hover-text-color: #f9fafc;
      --list-group-hover-bg-color: #2c517f;
      --list-group-active-border-color: none;

      /* Popover */
      --popover-body-bg-color: #ffffff;
      --popover-body-text-color: #2f3339;
      --popover-outerarrow-color: transparent;
      --popover-arrow-color: transparent;
      --popover-bg-color: #ffffff;
      --popover-border-color: #e3e6ea;

      /* Pagination */
      --pagination-active-link-border-color: var(--primary-color);

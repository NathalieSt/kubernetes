    /* Bootstrap's outline button reads its own --bs-* variables rather than
     Kavita's, so it is the one place a theme has to write rules instead of
     values. */
    .bg-pennant-light .btn-outline-primary {
      --bs-btn-color: var(--primary-color) !important;
      --bs-btn-border-color: var(--primary-color) !important;

      --bs-btn-active-bg: var(--primary-color-darkest-shade) !important;
      --bs-btn-active-border-color: var(--primary-color-darkest-shade) !important;
      --bs-btn-disabled-color: #4c7281 !important;
      --bs-btn-disabled-border-color: #d8eaf1 !important;
    }

---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: price-tracker
spec:
  groups:
  - name: price-tracker
    interval: 1m
    rules:
    - alert: PriceTrackerStorePricesStale
      expr: time() - price_tracker_crawl_last_success_timestamp_seconds{job="price-tracker", store!="dm"} > 180000 or time() - price_tracker_crawl_last_success_timestamp_seconds{job="price-tracker", store="dm"} > 777600
      for: 30m
      labels:
        severity: warning
        topic: alerts-apps
      annotations:
        description: "{{ $labels.store }} has had no good crawl for two scheduled runs, so its prices, rankings and Tandoor costs are old. The store's last error is on the price tracker's /betrieb page; a changed store API is the usual cause."
        summary: The price tracker has no fresh prices for {{ $labels.store }}

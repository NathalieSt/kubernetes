---
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/name: price-tracker-crawl
    app.kubernetes.io/version: e4d1256
  name: price-tracker-crawl
spec:
  schedule: 30 3 * * *
  timeZone: Europe/Vienna
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: price-tracker-crawl
            app.kubernetes.io/version: e4d1256
        spec:
          imagePullSecrets:
          - name: forgejo-registry-secret
          automountServiceAccountToken: false
          enableServiceLinks: false
          dnsPolicy: None
          dnsConfig:
            nameservers:
            - 10.43.0.54
            searches:
            - price-tracker.svc.cluster.local
            - svc.cluster.local
            - cluster.local
          containers:
          - args:
            - bff/src/Crawl.res.mjs
            image: code.netbird.nathalie-stiefsohn.eu/my-homelab/price-tracker:e4d1256@sha256:16e3204c31a859ff307cc7aa75e203c78e76a1f0cce0217765e5c73e2fe7864e
            name: price-tracker-crawl
            env:
            - name: TZ
              value: Europe/Vienna
            - name: PRICE_TRACKER_DATABASE_URL
              value: postgres://postgres-rw.postgres.svc.cluster.local:5432/price-tracker
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: price-tracker-db-secret
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: price-tracker-db-secret
            - name: HTTPS_PROXY
              value: http://gluetun-proxy.gluetun-proxy.svc.cluster.local:8888
            - name: PRICE_TRACKER_EMBEDDINGS_URL
              value: http://embeddings.embeddings.svc.cluster.local:8080
            - name: PRICE_TRACKER_VPN_CONTROL_URL
              value: http://gluetun-proxy.gluetun-proxy.svc.cluster.local:8001
            - name: PRICE_TRACKER_SKIP_SOURCES
              value: dm,mueller
            - name: PRICE_TRACKER_NTFY_URL
              value: http://ntfy.ntfy.svc.cluster.local:8080/
            - name: PRICE_TRACKER_NTFY_TOPIC
              value: price-tracker
            - name: PRICE_TRACKER_NTFY_TOKEN
              valueFrom:
                secretKeyRef:
                  key: ntfy-token
                  name: price-tracker-secret
                  optional: true
            - name: PRICE_TRACKER_PUBLIC_URL
              value: https://price-tracker.netbird.nathalie-stiefsohn.eu
            - name: PRICE_TRACKER_TANDOOR_URL
              value: http://tandoor.tandoor.svc.cluster.local:8080
            - name: PRICE_TRACKER_TANDOOR_TOKEN
              valueFrom:
                secretKeyRef:
                  key: tandoor-token
                  name: price-tracker-secret
                  optional: true
            resources:
              requests:
                cpu: 50m
                memory: 192Mi
              limits:
                cpu: 1000m
                memory: 768Mi
            securityContext:
              capabilities:
                drop:
                - ALL
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          restartPolicy: Never
---

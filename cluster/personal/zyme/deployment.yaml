---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: zyme
    app.kubernetes.io/version: 6e72e2d
  name: zyme
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zyme
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zyme
        app.kubernetes.io/version: 6e72e2d
    spec:
      imagePullSecrets:
      - name: forgejo-registry-secret
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
      - image: code.netbird.nathalie-stiefsohn.eu/my-homelab/zyme:6e72e2d@sha256:41f07e6a959d52fef281d327ad83cb86389ef94228c7857363667d7b292ce899
        name: zyme
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: WEB_ADDR
          value: :8080
        - name: TZ
          value: Europe/Vienna
        - name: ZYME_DATABASE_URL
          value: postgres://postgres-rw.postgres.svc.cluster.local:5432/zyme
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              key: username
              name: zyme-db-secret
              optional: false
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: zyme-db-secret
              optional: false
        - name: ZYME_PUBLIC_URL
          value: https://zyme.netbird.nathalie-stiefsohn.eu
        - name: ZYME_NTFY_URL
          value: http://ntfy.ntfy.svc.cluster.local:8080/
        - name: ZYME_NTFY_TOPIC
          value: zyme
        - name: ZYME_NTFY_TOKEN
          valueFrom:
            secretKeyRef:
              key: ntfy-token
              name: zyme-secret
              optional: true
        - name: ZYME_OIDC_AUTHORITY
          value: https://auth.netbird.nathalie-stiefsohn.eu
        - name: ZYME_OIDC_CLIENT_ID
          value: zyme
        resources:
          requests:
            cpu: 25m
            memory: 96Mi
          limits:
            cpu: 500m
            memory: 384Mi
        securityContext:
          capabilities:
            drop:
            - ALL
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 10
      securityContext:
        seccompProfile:
          type: RuntimeDefault

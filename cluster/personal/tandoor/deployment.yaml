---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: tandoor
    app.kubernetes.io/version: sha256_f6c58afdea7a7
  name: tandoor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tandoor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tandoor
        app.kubernetes.io/version: sha256_f6c58afdea7a7
    spec:
      initContainers:
      - command:
        - sh
        - /pennant/append-stylesheet.sh
        - /opt/recipes/cookbook/static/vue3/assets
        - /pennant-out
        - /pennant/pennant.css
        - main-*.css
        image: vabene1111/recipes@sha256:f6c58afdea7a721d079ebd6ee5483f2c9da77dd1e709e16d60a82c218e80a451
        name: pennant
        volumeMounts:
        - mountPath: /pennant
          name: pennant-script-volume
          readOnly: true
        - mountPath: /pennant-out
          name: pennant-volume
        securityContext:
          capabilities:
            drop:
            - ALL
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
      - image: vabene1111/recipes@sha256:f6c58afdea7a721d079ebd6ee5483f2c9da77dd1e709e16d60a82c218e80a451
        name: tandoor
        ports:
        - containerPort: 8080
          name: tandoor
        volumeMounts:
        - mountPath: /opt/recipes/mediafiles
          name: media-volume
        - mountPath: /opt/recipes/staticfiles
          name: static-volume
        - mountPath: /opt/recipes/cookbook/static/vue3/assets
          name: pennant-volume
          readOnly: true
        env:
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              key: secret-key
              name: tandoor-secret
        - name: TZ
          value: Europe/Vienna
        - name: TANDOOR_PORT
          value: "8080"
        - name: ALLOWED_HOSTS
          value: tandoor.netbird.nathalie-stiefsohn.eu
        - name: CSRF_TRUSTED_ORIGINS
          value: https://tandoor.netbird.nathalie-stiefsohn.eu
        - name: DB_ENGINE
          value: django.db.backends.postgresql
        - name: POSTGRES_HOST
          value: postgres-rw.postgres.svc.cluster.local
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              key: username
              name: postgres-creds-secret
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: postgres-creds-secret
        - name: POSTGRES_DB
          value: tandoor
        - name: ENABLE_SIGNUP
          value: "0"
        - name: ALLAUTH_TRUSTED_PROXY_COUNT
          value: "1"
        - name: SOCIAL_PROVIDERS
          value: allauth.socialaccount.providers.openid_connect
        - name: OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              key: client-secret
              name: tandoor-oidc-secret
        - name: SOCIALACCOUNT_PROVIDERS
          value: "{\"openid_connect\":{\"OAUTH_PKCE_ENABLED\":true,\"APPS\":[{\"provider_id\":\"authelia\",\"name\":\"Authelia\",\"client_id\":\"tandoor\",\"secret\":\"$(OIDC_CLIENT_SECRET)\",\"settings\":{\"server_url\":\"https://auth.netbird.nathalie-stiefsohn.eu\"}}]}}"
        - name: SOCIALACCOUNT_EMAIL_AUTHENTICATION
          value: "1"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
      volumes:
      - name: media-volume
        persistentVolumeClaim:
          claimName: tandoor-media-pvc
      - name: static-volume
        emptyDir: {}
      - name: pennant-script-volume
        configMap:
          name: tandoor-pennant
      - name: pennant-volume
        emptyDir: {}

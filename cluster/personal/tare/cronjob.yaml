---
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/name: tare-crawl
    app.kubernetes.io/version: e6b7cd0
  name: tare-crawl
spec:
  schedule: 30 3 * * *
  timeZone: Europe/Vienna
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: tare-crawl
            app.kubernetes.io/version: e6b7cd0
        spec:
          imagePullSecrets:
          - name: forgejo-registry-secret
          automountServiceAccountToken: false
          enableServiceLinks: false
          containers:
          - args:
            - bff/src/Crawl.res.mjs
            image: code.netbird.nathalie-stiefsohn.eu/my-homelab/tare:e6b7cd0@sha256:4ab69216408fc24d4ea503515b9db434811fe0c1246a152a2a67c08265ef4da7
            name: tare-crawl
            env:
            - name: TZ
              value: Europe/Vienna
            - name: TARE_DATABASE_URL
              value: postgres://postgres-rw.postgres.svc.cluster.local:5432/tare
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: tare-db-secret
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: tare-db-secret
            - name: HTTPS_PROXY
              value: http://gluetun-proxy.gluetun-proxy.svc.cluster.local:8888
            resources:
              requests:
                cpu: 50m
                memory: 192Mi
              limits:
                cpu: 1000m
                memory: 768Mi
            securityContext:
              capabilities:
                drop:
                - ALL
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          restartPolicy: Never

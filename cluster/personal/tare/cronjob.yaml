---
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/name: tare-crawl
    app.kubernetes.io/version: 8239c73
  name: tare-crawl
spec:
  schedule: 30 3 * * *
  timeZone: Europe/Vienna
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: tare-crawl
            app.kubernetes.io/version: 8239c73
        spec:
          imagePullSecrets:
          - name: forgejo-registry-secret
          automountServiceAccountToken: false
          enableServiceLinks: false
          dnsPolicy: None
          dnsConfig:
            nameservers:
            - 10.43.0.53
            searches:
            - tare.svc.cluster.local
            - svc.cluster.local
            - cluster.local
          containers:
          - args:
            - bff/src/Crawl.res.mjs
            image: code.netbird.nathalie-stiefsohn.eu/my-homelab/tare:8239c73@sha256:1752d3f6f8880f2653f5ef73bb42a8385949ef6341251ba2a2d78b33f3d0ee8d
            name: tare-crawl
            env:
            - name: TZ
              value: Europe/Vienna
            - name: TARE_DATABASE_URL
              value: postgres://postgres-rw.postgres.svc.cluster.local:5432/tare
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: tare-db-secret
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: tare-db-secret
            - name: HTTPS_PROXY
              value: http://gluetun-proxy.gluetun-proxy.svc.cluster.local:8888
            - name: TARE_EMBEDDINGS_URL
              value: http://embeddings.embeddings.svc.cluster.local:8080
            - name: TARE_SKIP_SOURCES
              value: dm,mueller
            - name: TARE_NTFY_URL
              value: http://ntfy.ntfy.svc.cluster.local:8080/
            - name: TARE_NTFY_TOPIC
              value: tare
            - name: TARE_NTFY_TOKEN
              valueFrom:
                secretKeyRef:
                  key: ntfy-token
                  name: tare-secret
                  optional: true
            - name: TARE_PUBLIC_URL
              value: https://tare.netbird.nathalie-stiefsohn.eu
            - name: TARE_TANDOOR_URL
              value: http://tandoor.tandoor.svc.cluster.local:8080
            - name: TARE_TANDOOR_TOKEN
              valueFrom:
                secretKeyRef:
                  key: tandoor-token
                  name: tare-secret
                  optional: true
            resources:
              requests:
                cpu: 50m
                memory: 192Mi
              limits:
                cpu: 1000m
                memory: 768Mi
            securityContext:
              capabilities:
                drop:
                - ALL
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          restartPolicy: Never
---

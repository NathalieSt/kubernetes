---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: tare
    app.kubernetes.io/version: e6b7cd0
  name: tare
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tare
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tare
        app.kubernetes.io/version: e6b7cd0
    spec:
      imagePullSecrets:
      - name: forgejo-registry-secret
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
      - image: code.netbird.nathalie-stiefsohn.eu/my-homelab/tare:e6b7cd0@sha256:4ab69216408fc24d4ea503515b9db434811fe0c1246a152a2a67c08265ef4da7
        name: tare
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: TZ
          value: Europe/Vienna
        - name: TARE_DATABASE_URL
          value: postgres://postgres-rw.postgres.svc.cluster.local:5432/tare
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              key: username
              name: tare-db-secret
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: tare-db-secret
        - name: WEB_ADDR
          value: :8080
        resources:
          requests:
            cpu: 10m
            memory: 96Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          capabilities:
            drop:
            - ALL
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 10
      securityContext:
        seccompProfile:
          type: RuntimeDefault

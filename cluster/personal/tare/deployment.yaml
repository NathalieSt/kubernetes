---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: tare
    app.kubernetes.io/version: 43d833a
  name: tare
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tare
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tare
        app.kubernetes.io/version: 43d833a
    spec:
      imagePullSecrets:
      - name: forgejo-registry-secret
      automountServiceAccountToken: false
      enableServiceLinks: false
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - 10.43.0.53
        searches:
        - tare.svc.cluster.local
        - svc.cluster.local
        - cluster.local
      containers:
      - image: code.netbird.nathalie-stiefsohn.eu/my-homelab/tare:43d833a@sha256:221f18272249f9be9611e5e4820921e8339486a80fbf3fae8a7c79f4af57d8de
        name: tare
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: TZ
          value: Europe/Vienna
        - name: TARE_DATABASE_URL
          value: postgres://postgres-rw.postgres.svc.cluster.local:5432/tare
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              key: username
              name: tare-db-secret
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: tare-db-secret
        - name: WEB_ADDR
          value: :8080
        - name: HTTPS_PROXY
          value: http://gluetun-proxy.gluetun-proxy.svc.cluster.local:8888
        - name: TARE_NTFY_URL
          value: http://ntfy.ntfy.svc.cluster.local:8080/
        - name: TARE_NTFY_TOPIC
          value: tare
        - name: TARE_NTFY_TOKEN
          valueFrom:
            secretKeyRef:
              key: ntfy-token
              name: tare-secret
              optional: true
        - name: TARE_PUBLIC_URL
          value: https://tare.netbird.nathalie-stiefsohn.eu
        - name: TARE_TANDOOR_URL
          value: http://tandoor.tandoor.svc.cluster.local:8080
        - name: TARE_TANDOOR_TOKEN
          valueFrom:
            secretKeyRef:
              key: tandoor-token
              name: tare-secret
              optional: true
        resources:
          requests:
            cpu: 10m
            memory: 96Mi
          limits:
            cpu: 1000m
            memory: 768Mi
        securityContext:
          capabilities:
            drop:
            - ALL
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 10
      securityContext:
        seccompProfile:
          type: RuntimeDefault

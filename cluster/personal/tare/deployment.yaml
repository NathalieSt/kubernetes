---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: tare
    app.kubernetes.io/version: 3180ce3
  name: tare
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tare
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tare
        app.kubernetes.io/version: 3180ce3
    spec:
      imagePullSecrets:
      - name: forgejo-registry-secret
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
      - image: code.netbird.nathalie-stiefsohn.eu/my-homelab/tare:3180ce3@sha256:430eebe6cb8911cb1ee81b14259bf13942c909acb0b2e3ccfee84ff91e1a7743
        name: tare
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: TZ
          value: Europe/Vienna
        - name: TARE_DATABASE_URL
          value: postgres://postgres-rw.postgres.svc.cluster.local:5432/tare
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              key: username
              name: tare-db-secret
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: tare-db-secret
        - name: WEB_ADDR
          value: :8080
        - name: TARE_TANDOOR_URL
          value: http://tandoor.tandoor.svc.cluster.local:8080
        - name: TARE_TANDOOR_TOKEN
          valueFrom:
            secretKeyRef:
              key: tandoor-token
              name: tare-secret
              optional: true
        resources:
          requests:
            cpu: 10m
            memory: 96Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          capabilities:
            drop:
            - ALL
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 10
      securityContext:
        seccompProfile:
          type: RuntimeDefault

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tare-vault-serviceaccount
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tare-vault-token-reviewer
rules:
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - authorization.k8s.io
  resources:
  - subjectaccessreviews
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tare-vault-token-reviewer-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tare-vault-token-reviewer
subjects:
- kind: ServiceAccount
  name: tare-vault-serviceaccount
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: tare-vault-auth
spec:
  kubernetes:
    role: tare
    serviceAccount: tare-vault-serviceaccount
  vaultAuthGlobalRef:
    allowDefault: true
    namespace: vault-secrets-operator
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: tare-tare-db-static-secret
spec:
  vaultAuthRef: tare-vault-auth
  mount: kvv2
  type: kv-v2
  path: tare/db
  refreshAfter: 10s
  destination:
    create: true
    name: tare-db-secret
  rolloutRestartTargets:
  - kind: Deployment
    name: tare
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: tare-tare-static-secret
spec:
  vaultAuthRef: tare-vault-auth
  mount: kvv2
  type: kv-v2
  path: tare
  refreshAfter: 10s
  destination:
    create: true
    name: tare-secret

---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: tare
spec:
  groups:
  - name: tare
    interval: 1m
    rules:
    - alert: TareStorePricesStale
      expr: time() - tare_crawl_last_success_timestamp_seconds{job="tare", store!="dm"} > 180000 or time() - tare_crawl_last_success_timestamp_seconds{job="tare", store="dm"} > 777600
      for: 30m
      labels:
        severity: warning
        topic: alerts-apps
      annotations:
        description: "{{ $labels.store }} has had no good crawl for two scheduled runs, so its prices, rankings and Tandoor costs are old. The store's last error is on tare's /betrieb page; a changed store API is the usual cause."
        summary: tare has no fresh prices for {{ $labels.store }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: tessera
    app.kubernetes.io/version: 3dd345d
  name: tessera
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tessera
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tessera
        app.kubernetes.io/version: 3dd345d
    spec:
      imagePullSecrets:
      - name: forgejo-registry-secret
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
      - image: code.netbird.nathalie-stiefsohn.eu/my-homelab/tessera:3dd345d@sha256:781d446cb0c27e3da0b8456ec3f0b2f69f50d39b84b77cb619946ea32290590c
        name: tessera
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: WEB_ADDR
          value: :8080
        - name: TZ
          value: Europe/Vienna
        - name: TESSERA_DATABASE_URL
          value: postgres://postgres-rw.postgres.svc.cluster.local:5432/tessera
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              key: username
              name: tessera-db-secret
              optional: false
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: tessera-db-secret
              optional: false
        - name: TESSERA_PUBLIC_URL
          value: https://tessera.netbird.nathalie-stiefsohn.eu
        - name: TESSERA_OIDC_AUTHORITY
          value: https://auth.netbird.nathalie-stiefsohn.eu
        - name: TESSERA_OIDC_CLIENT_ID
          value: tessera
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        securityContext:
          capabilities:
            drop:
            - ALL
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 10
      securityContext:
        seccompProfile:
          type: RuntimeDefault

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: roundcube-pennant-skin
  namespace: mail
data:
  _variables.less: |
    // Pennant for Roundcube Elastic, generated by kubernetes-generator (src/generators/theme/RoundcubeTheme.res).
    @color-main: #2c517f;
    @color-black: #15171b;
    @color-font: #2f3339;
    @color-link: #2c517f;
    @color-link-hover: #1d395b;
    @color-border: #e3e6ea;
    @color-error: #7c3739;
    @color-success: #2b5c37;
    @color-warning: #e1c18b;
    @color-black-shade-text: #484e54;
    @color-black-shade-border: #e3e6ea;
    @color-black-shade-bg: #f2f4f6;
    @color-layout-header-background: #f2f4f6;
    @color-searchbar-background: #ffffff;
    @color-taskmenu-background: #2f3339;
    @color-taskmenu-button-action: #a0c9fd;
    @color-taskmenu-button-action-hover: #c6dfff;
    @color-list-selected-background: #e1eeff;
    @color-list-recent: #1d395b;
    @color-input-placeholder: #676c74;
    @color-btn-secondary-background: #676c74;
    @color-scrollbar-thumb: #b9bec5;
    @color-scrollbar-track: #f2f4f6;
    @color-dark-main: #3c6aa4;
    @color-dark-background: #202327;
    @color-dark-font: #f2f4f6;
    @color-dark-border: #484e54;
    @color-dark-list-selected: #a0c9fd;
    @color-dark-list-selected-background: #10233c;
    @color-dark-list-border: #484e54;
    @color-dark-input-border: #848a92;
    @color-dark-input-focus: #f2f4f6;
    @color-dark-input-border-focus: #a0c9fd;
    @color-dark-popover-background: #15171b;
    @color-dark-popover-border: #676c74;
    @color-dark-scrollbar-thumb: #676c74;
    @color-dark-blockquote-0: #a0c9fd;
  roundcube-skin-compile.sh: |
    #!/bin/sh
    # Step 2 of 3, in the lessc image: compile the three stylesheets Elastic serves,
    # with the same flags as Elastic's own Makefile. See RoundcubeSkin.res.
    #
    #   $1  the emptyDir the sources were copied into
    #
    # Each sheet is compiled to a temporary name and only renamed once lessc has
    # succeeded, so step 3 never installs a half-written file. A sheet that fails
    # to compile is left out and reported; Roundcube keeps its own copy of it.
    set -u

    skin=$1

    if [ ! -f "$skin/styles/_variables.less" ]; then
      echo "WARNING: Pennant not applied: no sources to compile (see the sources step's log)" >&2
      exit 0
    fi

    mkdir -p "$skin/compiled"
    cd "$skin/styles" || exit 0

    for sheet in styles print embed; do
      target="$skin/compiled/$sheet.min.css"
      if lessc --clean-css="--s1 --advanced" "$sheet.less" "$target.partial"; then
        mv "$target.partial" "$target"
        echo "compiled $sheet.min.css"
      else
        rm -f "$target.partial"
        echo "WARNING: Pennant not applied to $sheet.min.css: it did not compile" >&2
      fi
    done
    exit 0
  roundcube-skin-install.sh: |
    #!/bin/sh
    # Step 3 of 3, in the Roundcube container itself: a post-setup task, which
    # Roundcube's entrypoint runs after it has copied Roundcube into the docroot --
    # the only point at which the files being replaced exist. See RoundcubeSkin.res.
    #
    # The entrypoint exits if a task does, and a palette is never a reason for
    # webmail not to start, so every failure here is a warning.
    set -u

    compiled=/pennant-skin/compiled
    styles=/var/www/html/skins/elastic/styles

    for sheet in styles print embed; do
      if [ -s "$compiled/$sheet.min.css" ] && cp "$compiled/$sheet.min.css" "$styles/$sheet.min.css"; then
        echo "Pennant: installed $sheet.min.css"
      else
        echo "WARNING: Pennant not applied to $sheet.min.css" >&2
      fi
    done
    exit 0
  roundcube-skin-sources.sh: |
    #!/bin/sh
    # Step 1 of 3, in the Roundcube image: copy Elastic's LESS sources out of the
    # image that is deployed, and add Pennant's _variables.less beside them. See
    # RoundcubeSkin.res.
    #
    #   $1  the emptyDir shared with the next two steps
    #   $2  the generated _variables.less
    #
    # Every failure is a warning, never a failed pod. Nothing is mounted over
    # Roundcube's own files -- step 3 copies over them only what compiled -- so a
    # step that gives up leaves Roundcube starting with the skin it shipped.
    set -u

    out=$1
    variables=$2
    elastic=/usr/src/roundcubemail/skins/elastic

    if [ ! -d "$elastic/styles" ]; then
      echo "WARNING: Pennant not applied: $elastic/styles does not exist in this image" >&2
      exit 0
    fi

    # The image may ship the skin read-only, and cp keeps the mode. The contents
    # only: the emptyDir's own root belongs to root.
    if cp -R "$elastic/." "$out/" &&
      find "$out" -mindepth 1 -exec chmod u+w {} + &&
      cp "$variables" "$out/styles/_variables.less"; then
      echo "copied Elastic's sources and Pennant's _variables.less"
    else
      # Without the variables file, step 2 compiles nothing.
      rm -f "$out/styles/_variables.less"
      echo "WARNING: Pennant not applied: copying Elastic's sources failed" >&2
    fi
    exit 0

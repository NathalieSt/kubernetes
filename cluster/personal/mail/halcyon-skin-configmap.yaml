---
apiVersion: v1
kind: ConfigMap
metadata:
  name: roundcube-halcyon-skin
  namespace: mail
data:
  _variables.less: |
    // Halcyon for Roundcube Elastic, generated by kubernetes-generator (src/generators/theme/RoundcubeTheme.res).
    @color-main: #005a66;
    @color-black: #071a21;
    @color-font: #1a3742;
    @color-link: #005a66;
    @color-link-hover: #004049;
    @color-border: #d8eaf1;
    @color-error: #783d28;
    @color-success: #1d5d40;
    @color-warning: #dbc38a;
    @color-black-shade-text: #305360;
    @color-black-shade-border: #d8eaf1;
    @color-black-shade-bg: #eaf6fb;
    @color-layout-header-background: #eaf6fb;
    @color-searchbar-background: #e8f8fb;
    @color-taskmenu-background: #1a3742;
    @color-taskmenu-button-action: #86d4e2;
    @color-taskmenu-button-action-hover: #b3e7f1;
    @color-list-selected-background: #d5f3f9;
    @color-list-recent: #004049;
    @color-input-placeholder: #4c7281;
    @color-btn-secondary-background: #4c7281;
    @color-scrollbar-thumb: #a4c4d1;
    @color-scrollbar-track: #eaf6fb;
    @color-dark-main: #007785;
    @color-dark-background: #093842;
    @color-dark-font: #eaf6fb;
    @color-dark-border: #305360;
    @color-dark-list-selected: #86d4e2;
    @color-dark-list-selected-background: #00282e;
    @color-dark-list-border: #305360;
    @color-dark-input-border: #6890a0;
    @color-dark-input-focus: #eaf6fb;
    @color-dark-input-border-focus: #86d4e2;
    @color-dark-popover-background: #071a21;
    @color-dark-popover-border: #4c7281;
    @color-dark-scrollbar-thumb: #4c7281;
    @color-dark-blockquote-0: #86d4e2;
  roundcube-skin-compile.sh: |
    #!/bin/sh
    # Step 2 of 3, in the lessc image: compile the three stylesheets Elastic serves,
    # with the same flags as Elastic's own Makefile. See RoundcubeSkin.res.
    #
    #   $1  the emptyDir the sources were copied into
    #
    # Each sheet is compiled to a temporary name and only renamed once lessc has
    # succeeded, so step 3 never installs a half-written file. A sheet that fails
    # to compile is left out and reported; Roundcube keeps its own copy of it.
    set -u

    skin=$1

    if [ ! -f "$skin/styles/_variables.less" ]; then
      echo "WARNING: Halcyon not applied: no sources to compile (see the sources step's log)" >&2
      exit 0
    fi

    mkdir -p "$skin/compiled"
    cd "$skin/styles" || exit 0

    for sheet in styles print embed; do
      target="$skin/compiled/$sheet.min.css"
      if lessc --clean-css="--s1 --advanced" "$sheet.less" "$target.partial"; then
        mv "$target.partial" "$target"
        echo "compiled $sheet.min.css"
      else
        rm -f "$target.partial"
        echo "WARNING: Halcyon not applied to $sheet.min.css: it did not compile" >&2
      fi
    done
    exit 0
  roundcube-skin-install.sh: |
    #!/bin/sh
    # Step 3 of 3, in the Roundcube container itself: a post-setup task, which
    # Roundcube's entrypoint runs after it has copied Roundcube into the docroot --
    # the only point at which the files being replaced exist. See RoundcubeSkin.res.
    #
    # The entrypoint exits if a task does, and a palette is never a reason for
    # webmail not to start, so every failure here is a warning.
    set -u

    compiled=/halcyon-skin/compiled
    styles=/var/www/html/skins/elastic/styles

    for sheet in styles print embed; do
      if [ -s "$compiled/$sheet.min.css" ] && cp "$compiled/$sheet.min.css" "$styles/$sheet.min.css"; then
        echo "Halcyon: installed $sheet.min.css"
      else
        echo "WARNING: Halcyon not applied to $sheet.min.css" >&2
      fi
    done
    exit 0
  roundcube-skin-sources.sh: |
    #!/bin/sh
    # Step 1 of 3, in the Roundcube image: copy Elastic's LESS sources out of the
    # image that is deployed, and add Halcyon's _variables.less beside them. See
    # RoundcubeSkin.res.
    #
    #   $1  the emptyDir shared with the next two steps
    #   $2  the generated _variables.less
    #
    # Every failure is a warning, never a failed pod. Nothing is mounted over
    # Roundcube's own files -- step 3 copies over them only what compiled -- so a
    # step that gives up leaves Roundcube starting with the skin it shipped.
    set -u

    out=$1
    variables=$2
    elastic=/usr/src/roundcubemail/skins/elastic

    if [ ! -d "$elastic/styles" ]; then
      echo "WARNING: Halcyon not applied: $elastic/styles does not exist in this image" >&2
      exit 0
    fi

    # The image may ship the skin read-only, and cp keeps the mode. The contents
    # only: the emptyDir's own root belongs to root.
    if cp -R "$elastic/." "$out/" &&
      find "$out" -mindepth 1 -exec chmod u+w {} + &&
      cp "$variables" "$out/styles/_variables.less"; then
      echo "copied Elastic's sources and Halcyon's _variables.less"
    else
      # Without the variables file, step 2 compiles nothing.
      rm -f "$out/styles/_variables.less"
      echo "WARNING: Halcyon not applied: copying Elastic's sources failed" >&2
    fi
    exit 0

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: paperless-halcyon
  namespace: paperless
data:
  append-stylesheet.sh: |
    #!/bin/sh
    # Appends Halcyon to an application's own stylesheet, in a copy of the
    # directory that holds it. Run as an init container from the application's own
    # image, so the file it copies is the one that version actually serves. See
    # StylesheetAppend.res for why this exists at all.
    #
    #   $1   the directory in the image
    #   $2   the emptyDir mounted over that directory in the application container
    #   $3   the stylesheet to append
    #   $4…  globs, relative to the directory, naming the files to append to
    #
    # A theme must never be the reason an application does not start. So a layout
    # this does not recognise -- the application moved its assets in an upgrade --
    # is reported on stderr and the pod starts unthemed, from a faithful copy.
    # Everything else (a failed copy, a full disk) still fails, because then the
    # copy the application would be served from is incomplete.
    set -eu

    source_dir=$1
    target_dir=$2
    css=$3
    shift 3

    warn() {
      echo "WARNING: Halcyon not applied: $*" >&2
    }

    if [ ! -d "$source_dir" ]; then
      # Nothing to copy, and nothing is hidden by mounting over a path that does
      # not exist in this image.
      warn "$source_dir does not exist in this image -- the asset layout has changed"
      exit 0
    fi

    cp -R "$source_dir/." "$target_dir/"
    # An image may ship its assets read-only, and cp keeps the mode. The contents
    # only: the emptyDir's own root belongs to root, and a chmod of it fails. Not
    # through symlinks, whose targets are in the image's read-only root.
    find "$target_dir" -mindepth 1 ! -type l -exec chmod u+w {} +

    for pattern in "$@"; do
      matched=0
      # Unquoted on purpose: this is the glob.
      for file in "$target_dir"/$pattern; do
        [ -f "$file" ] || continue
        matched=$((matched + 1))
        # A symlink stays one in the copy (Paperless' collectstatic links every
        # file back into its source tree), and appending through it would write
        # into the image. So the file being themed becomes a real one; links
        # elsewhere are left, since the image they point into is the same.
        if [ -L "$file" ]; then
          cp "$file" "$file.real" && rm "$file" && mv "$file.real" "$file"
          chmod u+w "$file"
        fi
        printf '\n' >>"$file"
        cat "$css" >>"$file"
        # A pre-compressed sibling is served in preference to the file itself, so
        # one left as it was would quietly serve the unthemed stylesheet to every
        # browser that accepts the encoding -- which is all of them. gzip is in
        # every image this runs from; brotli is in none, so that copy is dropped
        # and the server falls back to the gzip one.
        rm -f "$file.br"
        # -L too: a compressed sibling may be a link, even one shared with other
        # directories' identical files, and must not be written through.
        if [ -e "$file.gz" ] || [ -L "$file.gz" ]; then
          rm -f "$file.gz"
          gzip -9 -c "$file" >"$file.gz"
        fi
        echo "appended Halcyon to ${file#"$target_dir"/}"
      done
      if [ "$matched" -eq 0 ]; then
        warn "no file under $source_dir matches '$pattern' -- the asset layout has changed"
      fi
    done
  halcyon.css: |
    /* Halcyon for Paperless-ngx, appended by kubernetes-generator (src/generators/theme). */

    :root {
      --pngx-primary: 213, 49%;
      --pngx-primary-lightness: 34%;
      --pngx-primary-text-contrast: #f9fafc;
      --pngx-bg-alt: #ffffff;
      --pngx-bg-alt2: #f2f4f6;
      --pngx-bg-darker: #f2f4f6;
      --pngx-bg-disabled: #f2f4f6;
      --pngx-body-color-accent: #484e54;
      --pngx-card-hover-border: #676c74;
      --bs-body-bg: #f9fafc;
      --bs-body-bg-rgb: 249, 250, 252;
      --bs-body-color: #2f3339;
      --bs-body-color-rgb: 47, 51, 57;
      --bs-secondary-color: #484e54;
      --bs-border-color: #e3e6ea;
      --bs-link-color: #2c517f;
      --bs-link-color-rgb: 44, 81, 127;
      --bs-link-hover-color: #1d395b;
      --bs-focus-ring-color: rgba(60, 106, 164, .35);
    }

    [data-bs-theme=dark] {
      --pngx-bg-alt: #202327;
      --pngx-bg-alt2: #2f3339;
      --pngx-bg-darker: #15171b;
      --pngx-bg-disabled: #2f3339;
      --pngx-body-color-accent: #d0d5da;
      --pngx-card-hover-border: #848a92;
      --bs-body-bg: #15171b;
      --bs-body-bg-rgb: 21, 23, 27;
      --bs-body-color: #f2f4f6;
      --bs-body-color-rgb: 242, 244, 246;
      --bs-secondary-color: #d0d5da;
      --bs-border-color: #484e54;
      --bs-link-color: #a0c9fd;
      --bs-link-color-rgb: 160, 201, 253;
      --bs-link-hover-color: #c6dfff;
      --bs-focus-ring-color: rgba(160, 201, 253, .35);
    }
    [data-bs-theme=dark] body:not(.primary-light):not(.primary-dark) {
      --pngx-primary: 214, 96%;
      --pngx-primary-lightness: 81%;
      --pngx-primary-text-contrast: #090b0e;
    }
    [data-bs-theme=dark] body:not(.primary-light):not(.primary-dark) .navbar.bg-primary {
      --pngx-primary: 214, 96%;
      --pngx-primary-lightness: 81%;
      --pngx-primary-text-contrast: #090b0e;
    }
    [data-bs-theme=dark] body:not(.primary-light):not(.primary-dark) .navbar.bg-primary .dropdown-menu {
      --pngx-primary: 214, 96%;
      --pngx-primary-lightness: 81%;
      --pngx-primary-text-contrast: #090b0e;
    }

    @media (prefers-color-scheme: dark) {
    [data-bs-theme=auto] body {
      --pngx-bg-alt: #202327;
      --pngx-bg-alt2: #2f3339;
      --pngx-bg-darker: #15171b;
      --pngx-bg-disabled: #2f3339;
      --pngx-body-color-accent: #d0d5da;
      --pngx-card-hover-border: #848a92;
      --bs-body-bg: #15171b;
      --bs-body-bg-rgb: 21, 23, 27;
      --bs-body-color: #f2f4f6;
      --bs-body-color-rgb: 242, 244, 246;
      --bs-secondary-color: #d0d5da;
      --bs-border-color: #484e54;
      --bs-link-color: #a0c9fd;
      --bs-link-color-rgb: 160, 201, 253;
      --bs-link-hover-color: #c6dfff;
      --bs-focus-ring-color: rgba(160, 201, 253, .35);
    }
    [data-bs-theme=auto] body:not(.primary-light):not(.primary-dark) {
      --pngx-primary: 214, 96%;
      --pngx-primary-lightness: 81%;
      --pngx-primary-text-contrast: #090b0e;
    }
    [data-bs-theme=auto] body:not(.primary-light):not(.primary-dark) .navbar.bg-primary {
      --pngx-primary: 214, 96%;
      --pngx-primary-lightness: 81%;
      --pngx-primary-text-contrast: #090b0e;
    }
    [data-bs-theme=auto] body:not(.primary-light):not(.primary-dark) .navbar.bg-primary .dropdown-menu {
      --pngx-primary: 214, 96%;
      --pngx-primary-lightness: 81%;
      --pngx-primary-text-contrast: #090b0e;
    }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: arca
    app.kubernetes.io/version: cb62b8c
  name: arca
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: arca
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arca
        app.kubernetes.io/version: cb62b8c
    spec:
      imagePullSecrets:
      - name: forgejo-registry-secret
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
      - image: code.netbird.nathalie-stiefsohn.eu/my-homelab/arca:cb62b8c@sha256:97557bd201271af31f05cae5ec6e2b76abd1926cedf02d62d5c05d23760e3686
        name: arca
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - mountPath: /tmp
          name: tmp
        env:
        - name: WEB_ADDR
          value: :8080
        - name: TZ
          value: Europe/Vienna
        - name: ARCA_DATABASE_URL
          value: postgres://postgres-rw.postgres.svc.cluster.local:5432/arca
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              key: username
              name: arca-db-secret
              optional: false
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: arca-db-secret
              optional: false
        - name: ARCA_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              key: private-key
              name: arca-secret
              optional: false
        - name: ARCA_DB_SECRET
          valueFrom:
            secretKeyRef:
              key: db-secret
              name: arca-secret
              optional: false
        - name: ARCA_CORS_ORIGINS
          value: https://clavis.netbird.nathalie-stiefsohn.eu,tauri://localhost,http://tauri.localhost
        - name: ARCA_WEBAUTHN_ORIGINS
          value: https://clavis.netbird.nathalie-stiefsohn.eu
        - name: ARCA_NTFY_URL
          value: http://ntfy.ntfy.svc.cluster.local:8080/
        - name: ARCA_NTFY_TOPIC
          value: arca
        - name: ARCA_NTFY_TOKEN
          valueFrom:
            secretKeyRef:
              key: ntfy-token
              name: arca-ntfy-secret
              optional: true
        resources:
          requests:
            cpu: 20m
            memory: 96Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          capabilities:
            drop:
            - ALL
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 10
      volumes:
      - name: tmp
        emptyDir: {}
      securityContext:
        seccompProfile:
          type: RuntimeDefault

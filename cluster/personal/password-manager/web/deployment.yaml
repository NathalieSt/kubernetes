---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: password-manager
    app.kubernetes.io/version: 45777db
  name: password-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: password-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: password-manager
        app.kubernetes.io/version: 45777db
    spec:
      imagePullSecrets:
      - name: forgejo-registry-secret
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
      - image: code.netbird.nathalie-stiefsohn.eu/my-homelab/password-manager:45777db@sha256:4b447630753eb35d0ed99a73b7ff14e0eeec606cb339162b5dfe448f0ceb694d
        name: password-manager
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - mountPath: /etc/nginx/conf.d
          name: conf
        - mountPath: /tmp
          name: tmp
        env:
        - name: PASSWORD_MANAGER_SERVER
          value: https://psono-api.netbird.nathalie-stiefsohn.eu
        - name: PASSWORD_MANAGER_VERIFY_KEY
          value: eaaf761c976ca2c489f9aa9706298643cb0e10fd239470fc1aa69a7c9d8c0fc8
        - name: TZ
          value: Europe/Vienna
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        securityContext:
          capabilities:
            drop:
            - ALL
          runAsUser: 101
          runAsGroup: 101
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 10
      volumes:
      - name: conf
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      securityContext:
        seccompProfile:
          type: RuntimeDefault

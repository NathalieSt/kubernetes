---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: fermentation-tracker
    app.kubernetes.io/version: 68c9e25
  name: fermentation-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fermentation-tracker
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fermentation-tracker
        app.kubernetes.io/version: 68c9e25
    spec:
      imagePullSecrets:
      - name: forgejo-registry-secret
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
      - image: code.netbird.nathalie-stiefsohn.eu/my-homelab/fermentation-tracker:68c9e25@sha256:92234077f63d9468c4cc611310924cbfc829fed1376cd678c8308854b8684c5d
        name: fermentation-tracker
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: WEB_ADDR
          value: :8080
        - name: TZ
          value: Europe/Vienna
        - name: FERMENTATION_TRACKER_DATABASE_URL
          value: postgres://postgres-rw.postgres.svc.cluster.local:5432/fermentation-tracker
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              key: username
              name: fermentation-tracker-db-secret
              optional: false
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: fermentation-tracker-db-secret
              optional: false
        - name: FERMENTATION_TRACKER_PUBLIC_URL
          value: https://fermentation-tracker.netbird.nathalie-stiefsohn.eu
        - name: FERMENTATION_TRACKER_NTFY_URL
          value: http://ntfy.ntfy.svc.cluster.local:8080/
        - name: FERMENTATION_TRACKER_NTFY_TOPIC
          value: fermentation-tracker
        - name: FERMENTATION_TRACKER_NTFY_TOKEN
          valueFrom:
            secretKeyRef:
              key: ntfy-token
              name: fermentation-tracker-secret
              optional: true
        - name: FERMENTATION_TRACKER_OIDC_AUTHORITY
          value: https://auth.netbird.nathalie-stiefsohn.eu
        - name: FERMENTATION_TRACKER_OIDC_CLIENT_ID
          value: fermentation-tracker
        resources:
          requests:
            cpu: 25m
            memory: 96Mi
          limits:
            cpu: 500m
            memory: 384Mi
        securityContext:
          capabilities:
            drop:
            - ALL
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 10
      securityContext:
        seccompProfile:
          type: RuntimeDefault

---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: deny-pod-nfs
spec:
  endpointSelector: {}
  description: No pod may reach an NFS server; volumes are mounted by the host.
  egressDeny:
  - toEntities:
    - all
    toPorts:
    - ports:
      - port: "2049"
        protocol: ANY
      - port: "111"
        protocol: ANY
  enableDefaultDeny:
    ingress: false
    egress: false

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authelia-networkpolicy
spec:
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: internal-gateway
      podSelector:
        matchExpressions:
        - key: app.kubernetes.io/name
          operator: In
          values:
          - internal-gateway
          - internal-gateway-secondary
  - from:
    - namespaceSelector:
        matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
          - backup-dashboard
          - forgejo
          - glitchtip
          - healthchecks
          - kavita
          - limes
          - mail
          - orrery
          - paperless
          - tandoor
          - vault
          - zyme
    ports:
    - port: 9091
      protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authelia-networkpolicy
spec:
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: internal-gateway
      podSelector:
        matchExpressions:
        - key: app.kubernetes.io/name
          operator: In
          values:
          - internal-gateway
          - internal-gateway-secondary
          - blackbox-exporter
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: victoria-metrics
    ports:
    - port: 9959
      protocol: TCP
  - from:
    - namespaceSelector:
        matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
          - backup-dashboard
          - cluster-console
          - device-configuration-manager
          - fermentation-tracker
          - forgejo
          - gameyfin
          - glitchtip
          - healthchecks
          - host-management
          - image-scanner
          - karakeep
          - kavita
          - mail
          - miniflux
          - monitoring-dashboard
          - paperless
          - tandoor
          - trilium
          - vault
    ports:
    - port: 9091
      protocol: TCP

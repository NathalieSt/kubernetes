---
apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-config
data:
  configuration.yml: |
    theme: auto
    server:
      address: tcp://0.0.0.0:9091
      disable_healthcheck: true
      buffers:
        read: 8192
        write: 8192
      endpoints:
        authz:
          forward-auth:
            implementation: ForwardAuth
            authn_strategies:
            - name: CookieSession
      asset_path: /assets/
    log:
      level: trace
      format: json
    totp:
      issuer: netbird.nathalie-stiefsohn.eu
      period: 30
      skew: 1
    authentication_backend:
      password_reset:
        disable: true
      file:
        path: /secrets/users/users.yml
        watch: false
        password:
          algorithm: argon2
          iterations: 3
          memory: 65536
          parallelism: 4
          salt_length: 16
          key_length: 32
    access_control:
      default_policy: deny
      rules:
      - domain:
        - 4get.netbird.nathalie-stiefsohn.eu
        policy: one_factor
      - domain:
        - anki.netbird.nathalie-stiefsohn.eu
        policy: bypass
      - domain:
        - audiomuse.netbird.nathalie-stiefsohn.eu
        policy: one_factor
      - domain:
        - auth.netbird.nathalie-stiefsohn.eu
        policy: bypass
      - domain:
        - backups.netbird.nathalie-stiefsohn.eu
        policy: one_factor
      - domain:
        - bazarr.netbird.nathalie-stiefsohn.eu
        policy: one_factor
      - domain:
        - calendar.netbird.nathalie-stiefsohn.eu
        policy: bypass
      - domain:
        - changedetection.netbird.nathalie-stiefsohn.eu
        policy: one_factor
      - domain:
        - cluster-console.netbird.nathalie-stiefsohn.eu
        policy: two_factor
      - domain:
        - code.netbird.nathalie-stiefsohn.eu
        policy: bypass
      - domain:
        - device-configuration-manager.netbird.nathalie-stiefsohn.eu
        policy: bypass
      - domain:
        - diary.netbird.nathalie-stiefsohn.eu
        policy: one_factor
      - domain:
        - docs.netbird.nathalie-stiefsohn.eu
        policy: one_factor
      - domain:
        - fdroid.netbird.nathalie-stiefsohn.eu
        policy: bypass
      - domain:
        - fermentation-tracker.netbird.nathalie-stiefsohn.eu
        policy: one_factor
      - domain:
        - gameyfin.netbird.nathalie-stiefsohn.eu
        policy: one_factor
      - domain:
        - glitchtip.netbird.nathalie-stiefsohn.eu
        policy: bypass
      - domain:
        - headlamp.netbird.nathalie-stiefsohn.eu
        policy: two_factor
      - domain:
        - healthchecks.netbird.nathalie-stiefsohn.eu
        policy: one_factor
      - domain:
        - helium.netbird.nathalie-stiefsohn.eu
        policy: bypass
      - domain:
        - home.netbird.nathalie-stiefsohn.eu
        policy: one_factor
      - domain:
        - host-management.netbird.nathalie-stiefsohn.eu
        policy: two_factor
      - domain:
        - image-scanner.netbird.nathalie-stiefsohn.eu
        policy: one_factor
      - domain:
        - it-tools.netbird.nathalie-stiefsohn.eu
        policy: one_factor
      - domain:
        - jellyfin.netbird.nathalie-stiefsohn.eu
        policy: bypass
      - domain:
        - karakeep.netbird.nathalie-stiefsohn.eu
        policy: bypass
      - domain:
        - kavita.netbird.nathalie-stiefsohn.eu
        policy: one_factor
      - domain:
        - lidarr.netbird.nathalie-stiefsohn.eu
        policy: one_factor
      - domain:
        - mail.netbird.nathalie-stiefsohn.eu
        policy: one_factor
      - domain:
        - miniflux.netbird.nathalie-stiefsohn.eu
        policy: bypass
      - domain:
        - monitoring-dashboard.netbird.nathalie-stiefsohn.eu
        policy: bypass
      - domain:
        - music.netbird.nathalie-stiefsohn.eu
        policy: one_factor
      - domain:
        - neko.netbird.nathalie-stiefsohn.eu
        policy: one_factor
      - domain:
        - notes.netbird.nathalie-stiefsohn.eu
        policy: one_factor
      - domain:
        - ntfy.netbird.nathalie-stiefsohn.eu
        policy: bypass
      - domain:
        - omni-tools.netbird.nathalie-stiefsohn.eu
        policy: one_factor
      - domain:
        - paperless.netbird.nathalie-stiefsohn.eu
        policy: bypass
      - domain:
        - password-manager.netbird.nathalie-stiefsohn.eu
        policy: one_factor
      - domain:
        - password-server.netbird.nathalie-stiefsohn.eu
        policy: bypass
      - domain:
        - pdf.netbird.nathalie-stiefsohn.eu
        policy: one_factor
      - domain:
        - price-tracker.netbird.nathalie-stiefsohn.eu
        policy: one_factor
      - domain:
        - prowlarr.netbird.nathalie-stiefsohn.eu
        policy: one_factor
      - domain:
        - qbittorrent.netbird.nathalie-stiefsohn.eu
        policy: one_factor
      - domain:
        - radarr.netbird.nathalie-stiefsohn.eu
        policy: one_factor
      - domain:
        - redlib.netbird.nathalie-stiefsohn.eu
        policy: one_factor
      - domain:
        - requests.netbird.nathalie-stiefsohn.eu
        policy: one_factor
      - domain:
        - sabnzbd.netbird.nathalie-stiefsohn.eu
        policy: one_factor
      - domain:
        - sonarr.netbird.nathalie-stiefsohn.eu
        policy: one_factor
      - domain:
        - start-page.netbird.nathalie-stiefsohn.eu
        policy: one_factor
      - domain:
        - tandoor.netbird.nathalie-stiefsohn.eu
        policy: one_factor
      - domain:
        - vault.netbird.nathalie-stiefsohn.eu
        policy: bypass
      - domain:
        - vim-trainer.netbird.nathalie-stiefsohn.eu
        policy: one_factor
      - domain:
        - vscode.netbird.nathalie-stiefsohn.eu
        policy: one_factor
    session:
      secret: "{{ secret `/secrets/authelia/session-secret` }}"
      cookies:
      - domain: netbird.nathalie-stiefsohn.eu
        authelia_url: https://auth.netbird.nathalie-stiefsohn.eu
        default_redirection_url: https://monitoring-dashboard.netbird.nathalie-stiefsohn.eu
        name: authelia_session
        same_site: lax
        expiration: 1M
        inactivity: 1w
        remember_me: 1M
    regulation:
      max_retries: 3
      find_time: 2m
      ban_time: 5m
    storage:
      encryption_key: "{{ secret `/secrets/authelia/storage-encryption-key` }}"
      postgres:
        address: tcp://postgres-rw.postgres.svc.cluster.local:5432
        database: authelia
        username: authelia
        password: "{{ secret `/secrets/postgres/password` }}"
    notifier:
      disable_startup_check: true
      filesystem:
        filename: /notifications/notification.txt
    identity_validation:
      reset_password:
        jwt_secret: "{{ secret `/secrets/authelia/reset-password-jwt-secret` }}"
    identity_providers:
      oidc:
        hmac_secret: "{{ secret `/secrets/authelia/oidc-hmac-secret` }}"
        jwks:
        - key: {{ secret `/secrets/authelia/oidc-issuer-private-key` | mindent 8 "|" | msquote }}
        cors:
          endpoints:
          - token
          - userinfo
          - revocation
          allowed_origins_from_client_redirect_uris: true
        lifespans:
          refresh_token: 1M
        clients:
        - client_id: backup-dashboard
          client_name: backup-dashboard
          public: false
          client_secret: "{{ if glob `/secrets/oidc-clients/backup-dashboard` }}{{ secret `/secrets/oidc-clients/backup-dashboard` }}{{ else }}unwritten-secret-for-backup-dashboard{{ end }}"
          authorization_policy: one_factor
          require_pkce: true
          pkce_challenge_method: S256
          redirect_uris:
          - https://backups.netbird.nathalie-stiefsohn.eu/auth/callback
          scopes:
          - openid
          - profile
          - email
          - groups
          grant_types:
          - authorization_code
          response_types:
          - code
          token_endpoint_auth_method: client_secret_post
          consent_mode: implicit
        - client_id: cluster-console
          client_name: cluster-console
          public: true
          authorization_policy: two_factor
          require_pkce: true
          pkce_challenge_method: S256
          redirect_uris:
          - https://cluster-console.netbird.nathalie-stiefsohn.eu/auth/callback
          scopes:
          - openid
          - profile
          - email
          - groups
          - offline_access
          grant_types:
          - authorization_code
          - refresh_token
          response_types:
          - code
          token_endpoint_auth_method: none
          consent_mode: implicit
        - client_id: device-configuration-manager
          client_name: device-configuration-manager
          public: true
          authorization_policy: one_factor
          require_pkce: true
          pkce_challenge_method: S256
          redirect_uris:
          - https://device-configuration-manager.netbird.nathalie-stiefsohn.eu/auth/callback
          scopes:
          - openid
          - profile
          - email
          - groups
          - offline_access
          grant_types:
          - authorization_code
          - refresh_token
          response_types:
          - code
          token_endpoint_auth_method: none
          consent_mode: implicit
        - client_id: fermentation-tracker
          client_name: fermentation-tracker
          public: true
          authorization_policy: one_factor
          require_pkce: true
          pkce_challenge_method: S256
          redirect_uris:
          - https://fermentation-tracker.netbird.nathalie-stiefsohn.eu/auth/callback
          scopes:
          - openid
          - profile
          - email
          - groups
          - offline_access
          grant_types:
          - authorization_code
          - refresh_token
          response_types:

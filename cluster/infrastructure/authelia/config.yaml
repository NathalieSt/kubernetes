---
apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-config
data:
  configuration.yml: |
    theme: dark
    server:
      address: tcp://0.0.0.0:9091
      buffers:
        read: 8192
        write: 8192
    log:
      level: info
      format: json
    totp:
      issuer: netbird.nathalie-stiefsohn.eu
      period: 30
      skew: 1
    authentication_backend:
      password_reset:
        disable: true
      file:
        path: /secrets/users/users.yml
        watch: false
        password:
          algorithm: argon2
          iterations: 3
          memory: 65536
          parallelism: 4
          salt_length: 16
          key_length: 32
    access_control:
      default_policy: deny
      rules:
      - domain:
        - audiomuse.netbird.nathalie-stiefsohn.eu
        policy: one_factor
      - domain:
        - auth.netbird.nathalie-stiefsohn.eu
        policy: bypass
      - domain:
        - backups.netbird.nathalie-stiefsohn.eu
        policy: one_factor
      - domain:
        - code.netbird.nathalie-stiefsohn.eu
        policy: bypass
      - domain:
        - daybook.netbird.nathalie-stiefsohn.eu
        policy: one_factor
      - domain:
        - dojo.netbird.nathalie-stiefsohn.eu
        policy: one_factor
      - domain:
        - headlamp.netbird.nathalie-stiefsohn.eu
        policy: two_factor
      - domain:
        - it-tools.netbird.nathalie-stiefsohn.eu
        policy: one_factor
      - domain:
        - jellyfin.netbird.nathalie-stiefsohn.eu
        policy: bypass
      - domain:
        - kavita.netbird.nathalie-stiefsohn.eu
        policy: one_factor
      - domain:
        - limes.netbird.nathalie-stiefsohn.eu
        policy: one_factor
      - domain:
        - mail.netbird.nathalie-stiefsohn.eu
        policy: one_factor
      - domain:
        - music.netbird.nathalie-stiefsohn.eu
        policy: one_factor
      - domain:
        - neko.netbird.nathalie-stiefsohn.eu
        policy: one_factor
      - domain:
        - omni-tools.netbird.nathalie-stiefsohn.eu
        policy: one_factor
      - domain:
        - orrery.netbird.nathalie-stiefsohn.eu
        policy: one_factor
      - domain:
        - psono-api.netbird.nathalie-stiefsohn.eu
        policy: bypass
      - domain:
        - psono.netbird.nathalie-stiefsohn.eu
        policy: bypass
      - domain:
        - redlib.netbird.nathalie-stiefsohn.eu
        policy: one_factor
      - domain:
        - searxng.netbird.nathalie-stiefsohn.eu
        policy: one_factor
      - domain:
        - tandoor.netbird.nathalie-stiefsohn.eu
        policy: one_factor
      - domain:
        - transmission.netbird.nathalie-stiefsohn.eu
        policy: one_factor
      - domain:
        - vault.netbird.nathalie-stiefsohn.eu
        policy: bypass
      - domain:
        - vscode.netbird.nathalie-stiefsohn.eu
        policy: one_factor
    session:
      secret: "{{ secret `/secrets/authelia/session-secret` }}"
      cookies:
      - domain: netbird.nathalie-stiefsohn.eu
        authelia_url: https://auth.netbird.nathalie-stiefsohn.eu
        default_redirection_url: https://orrery.netbird.nathalie-stiefsohn.eu
        name: authelia_session
        same_site: lax
        expiration: 12h
        inactivity: 2h
        remember_me: 1M
    regulation:
      max_retries: 3
      find_time: 2m
      ban_time: 5m
    storage:
      encryption_key: "{{ secret `/secrets/authelia/storage-encryption-key` }}"
      postgres:
        address: tcp://postgres-rw.postgres.svc.cluster.local:5432
        database: authelia
        username: postgres
        password: "{{ secret `/secrets/postgres/password` }}"
    notifier:
      disable_startup_check: true
      filesystem:
        filename: /notifications/notification.txt
    identity_validation:
      reset_password:
        jwt_secret: "{{ secret `/secrets/authelia/reset-password-jwt-secret` }}"
    identity_providers:
      oidc:
        hmac_secret: "{{ secret `/secrets/authelia/oidc-hmac-secret` }}"
        jwks:
        - key: {{ secret `/secrets/authelia/oidc-issuer-private-key` | mindent 8 "|" | msquote }}
        clients:
        - client_id: backup-dashboard
          client_name: backup-dashboard
          public: false
          client_secret: "{{ secret `/secrets/oidc-clients/backup-dashboard` }}"
          authorization_policy: one_factor
          require_pkce: true
          pkce_challenge_method: S256
          redirect_uris:
          - https://backups.netbird.nathalie-stiefsohn.eu/auth/callback
          scopes:
          - openid
          - profile
          - email
          - groups
          grant_types:
          - authorization_code
          response_types:
          - code
          token_endpoint_auth_method: client_secret_post
          consent_mode: implicit
        - client_id: forgejo
          client_name: forgejo
          public: false
          client_secret: "{{ secret `/secrets/oidc-clients/forgejo` }}"
          authorization_policy: one_factor
          require_pkce: true
          pkce_challenge_method: S256
          redirect_uris:
          - https://code.netbird.nathalie-stiefsohn.eu/user/oauth2/authelia/callback
          scopes:
          - openid
          - profile
          - email
          - groups
          grant_types:
          - authorization_code
          response_types:
          - code
          token_endpoint_auth_method: client_secret_post
          consent_mode: implicit
        - client_id: limes
          client_name: limes
          public: true
          authorization_policy: one_factor
          require_pkce: true
          pkce_challenge_method: S256
          redirect_uris:
          - https://limes.netbird.nathalie-stiefsohn.eu/auth/callback
          scopes:
          - openid
          - profile
          - email
          - groups
          - offline_access
          grant_types:
          - authorization_code
          - refresh_token
          response_types:
          - code
          token_endpoint_auth_method: none
          consent_mode: implicit
        - client_id: orrery
          client_name: orrery
          public: true
          authorization_policy: one_factor
          require_pkce: true
          pkce_challenge_method: S256
          redirect_uris:
          - https://orrery.netbird.nathalie-stiefsohn.eu/auth/callback
          scopes:
          - openid
          - profile
          - email
          - groups
          - offline_access
          grant_types:
          - authorization_code
          - refresh_token
          response_types:
          - code
          token_endpoint_auth_method: none
          consent_mode: implicit
        - client_id: vault
          client_name: vault
          public: false
          client_secret: "{{ secret `/secrets/oidc-clients/vault` }}"
          authorization_policy: one_factor
          require_pkce: true
          pkce_challenge_method: S256
          redirect_uris:
          - https://vault.netbird.nathalie-stiefsohn.eu/ui/vault/auth/oidc/oidc/callback
          scopes:
          - openid
          - profile
          - email
          - groups
          grant_types:
          - authorization_code
          response_types:
          - code
          token_endpoint_auth_method: client_secret_post
          consent_mode: implicit

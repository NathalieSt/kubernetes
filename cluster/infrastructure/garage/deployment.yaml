---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: garage
  name: garage
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: garage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garage
    spec:
      initContainers:
      - command:
        - sh
        - -c
        - |
          set -e
          RPC_SECRET=$(cat /secrets/rpc_secret)
          ADMIN_TOKEN=$(cat /secrets/admin_token)
          METRICS_TOKEN=$(cat /secrets/metrics_token)
          export RPC_SECRET ADMIN_TOKEN METRICS_TOKEN

          for name in RPC_SECRET ADMIN_TOKEN METRICS_TOKEN; do
            eval "value=\$$name"
            if [ -z "$value" ]; then
              echo "ERROR: $name is empty - is the garage-node-secrets Secret populated from Vault?" >&2
              exit 1
            fi
            # A newline or a " / \ would produce a malformed TOML basic string, which
            # surfaces as an opaque config parse error inside garage rather than here.
            case "$value" in
            *'"'* | *'\'*)
              echo "ERROR: $name contains a quote or backslash and cannot be written to garage.toml" >&2
              exit 1
              ;;
            esac
            # Not folded into the case above: "$(printf '\n')" strips the trailing
            # newline and yields an empty pattern, which matches every value.
            if [ "$(printf '%s' "$value" | wc -l)" -ne 0 ]; then
              echo "ERROR: $name contains a newline and cannot be written to garage.toml" >&2
              exit 1
            fi
          done

          # garage requires rpc_secret to be exactly 32 bytes hex-encoded (64 hex chars). base64 — what
          # "openssl rand -base64 32" gives you — is rejected at startup. Generate it with "openssl rand -hex 32".
          case "$RPC_SECRET" in
          *[!0-9a-fA-F]*)
            echo "ERROR: rpc_secret must be hex-encoded (64 chars, 0-9a-f) - generate it with 'openssl rand -hex 32'" >&2
            exit 1
            ;;
          esac
          if [ ${#RPC_SECRET} -ne 64 ]; then
            echo "ERROR: rpc_secret must be 64 hex chars (32 bytes), got ${#RPC_SECRET}" >&2
            echo "       generate it with 'openssl rand -hex 32'" >&2
            exit 1
          fi

          awk '
          function subst(line, placeholder, value,   i, out) {
            while ((i = index(line, placeholder)) > 0) {
              out = out substr(line, 1, i - 1) value
              line = substr(line, i + length(placeholder))
            }
            return out line
          }
          {
            $0 = subst($0, "__RPC_SECRET__", ENVIRON["RPC_SECRET"])
            $0 = subst($0, "__ADMIN_TOKEN__", ENVIRON["ADMIN_TOKEN"])
            $0 = subst($0, "__METRICS_TOKEN__", ENVIRON["METRICS_TOKEN"])
            print
          }
          ' /template/garage.toml.tmpl > /config/garage.toml
        image: busybox:1.37
        name: render-config
        volumeMounts:
        - mountPath: /template
          name: config-template
        - mountPath: /secrets
          name: node-secrets
        - mountPath: /config
          name: config
      serviceAccountName: garage-vault-serviceaccount
      automountServiceAccountToken: true
      containers:
      - image: dxflrs/garage@sha256:8e854083d23122ccfb1f8d715fce298826dd7eca938f03694cb05a53a43dc0a4
        name: garage
        ports:
        - containerPort: 3900
          name: s3-api
        - containerPort: 3901
          name: rpc
        - containerPort: 3903
          name: admin
        volumeMounts:
        - mountPath: /etc/garage.toml
          subPath: garage.toml
          name: config
        - mountPath: /var/lib/garage/data
          name: data
        - mountPath: /var/lib/garage/meta
          name: meta
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
      volumes:
      - name: config-template
        configMap:
          name: garage-config-template
      - name: node-secrets
        secret:
          secretName: garage-node-secrets
      - name: config
        emptyDir: {}
      - name: data
        persistentVolumeClaim:
          claimName: garage-data-pvc
      - name: meta
        persistentVolumeClaim:
          claimName: garage-meta-pvc

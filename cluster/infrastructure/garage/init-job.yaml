---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: garage-init
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: garage-init-secret-writer
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
- apiGroups:
  - ""
  resources:
  - secrets
  resourceNames:
  - garage-backup-access-key-secret
  - restic-repo-password-secret
  verbs:
  - get
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: garage-init-secret-writer-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: garage-init-secret-writer
subjects:
- kind: ServiceAccount
  name: garage-init
  namespace: garage
---
apiVersion: batch/v1
kind: Job
metadata:
  name: garage-init
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 3600
  template:
    metadata: {}
    spec:
      serviceAccountName: garage-init
      containers:
      - command:
        - sh
        - -c
        - |
          set -e
          # openssl provides the HMAC used to derive each namespace's repository password.
          apk add --no-cache curl jq openssl >/dev/null

          ADMIN_TOKEN=$(cat /secrets/admin_token)
          API="http://garage.garage.svc.cluster.local:3903"
          AUTH="Authorization: Bearer ${ADMIN_TOKEN}"

          # Every per-namespace restic password is derived from this one value, so a new
          # namespace needs no new Vault entry and the passwords stay reproducible.
          RESTIC_SEED=$(cat /secrets/restic-seed/password)

          K8S_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          CACERT=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          K8S_API="https://kubernetes.default.svc"

          # api <method> <endpoint> [body] - wraps curl so a non-2xx response prints the
          # status and the response body before exiting. Plain "curl -sf" swallows both
          # (-s hides the body, -f collapses every HTTP error into exit code 22), which
          # makes a failed bootstrap show up as an empty log and a bare "Error" pod.
          api() {
            api_method="$1"
            api_endpoint="$2"
            api_body="$3"

            if [ -n "$api_body" ]; then
              api_status=$(curl -s -o /tmp/api_response -w '%{http_code}' \
                -H "$AUTH" -H "Content-Type: application/json" \
                -X "$api_method" "$API/$api_endpoint" -d "$api_body")
            else
              api_status=$(curl -s -o /tmp/api_response -w '%{http_code}' \
                -H "$AUTH" -X "$api_method" "$API/$api_endpoint")
            fi

            case "$api_status" in
            2??) cat /tmp/api_response ;;
            *)
              echo "ERROR: $api_method $api_endpoint returned HTTP $api_status" >&2
              echo "Request body: ${api_body:-<none>}" >&2
              echo "Response body:" >&2
              cat /tmp/api_response >&2
              echo >&2
              return 1
              ;;
            esac
          }

          for i in $(seq 1 30); do
            curl -sf -H "$AUTH" "$API/v2/GetClusterStatus" >/tmp/status.json && break
            echo "Waiting for garage admin API..."
            sleep 5
          done

          # GetClusterStatus has no top-level "node" field - the local node's ID is in
          # the "nodes" array. Reading .node instead yielded the literal string "null",
          # which UpdateClusterLayout rejected with a 400.
          NODE_ID=$(jq -r '.nodes[] | select(.isUp) | .id' /tmp/status.json | head -n 1)
          if [ -z "$NODE_ID" ] || [ "$NODE_ID" = "null" ]; then
            echo "ERROR: could not determine node ID from GetClusterStatus:" >&2
            cat /tmp/status.json >&2
            exit 1
          fi
          echo "Bootstrapping layout for node ${NODE_ID}"

          api POST v2/UpdateClusterLayout \
            "{\"roles\":[{\"id\":\"${NODE_ID}\",\"zone\":\"dc1\",\"capacity\":200000000000,\"tags\":[]}]}"

          LAYOUT_VERSION=$(api GET v2/GetClusterLayout | jq -r '.version')
          api POST v2/ApplyClusterLayout "{\"version\": $((LAYOUT_VERSION + 1))}"

          # Bucket and key endpoints return "Layout not ready" until the layout above is
          # applied and settled, so give them a moment rather than racing the apply.
          for i in $(seq 1 30); do
            curl -sf -H "$AUTH" "$API/v2/ListBuckets" >/dev/null 2>&1 && break
            echo "Waiting for layout to settle..."
            sleep 2
          done

          # ensure_bucket <name> - prints the bucket id, creating it when missing.
          ensure_bucket() {
            eb_name="$1"
            if api POST v2/CreateBucket "{\"globalAlias\":\"${eb_name}\"}" >/tmp/bucket.json 2>/dev/null; then
              jq -r '.id // .bucket.id' /tmp/bucket.json
              return 0
            fi
            api GET "v2/GetBucketInfo?globalAlias=${eb_name}" | jq -r '.id // .bucket.id'
          }

          # ensure_key <name> - prints "<accessKeyId> <secretAccessKey>", reusing an
          # existing key of that name. Minting a fresh key on every run would invalidate
          # the credentials already deployed in the namespaces, which is exactly what the
          # previous single-key version did whenever this Job was retried.
          ensure_key() {
            ek_name="$1"
            ek_id=$(api GET "v2/ListKeys" | jq -r --arg n "$ek_name" '.[] | select(.name == $n) | .id' | head -n 1)
            if [ -n "$ek_id" ] && [ "$ek_id" != "null" ]; then
              api GET "v2/GetKeyInfo?id=${ek_id}&showSecretKey=true" > /tmp/key.json
            else
              api POST v2/CreateKey "{\"name\":\"${ek_name}\"}" > /tmp/key.json
            fi

            ek_access=$(jq -r '.accessKeyId' /tmp/key.json)
            ek_secret=$(jq -r '.secretAccessKey' /tmp/key.json)
            if [ -z "$ek_access" ] || [ "$ek_access" = "null" ] ||
              [ -z "$ek_secret" ] || [ "$ek_secret" = "null" ]; then
              echo "ERROR: could not obtain credentials for key ${ek_name}:" >&2
              cat /tmp/key.json >&2
              return 1
            fi
            echo "${ek_access} ${ek_secret}"
          }

          # derive_password <namespace> - HMAC-SHA256 of the namespace under the seed.
          derive_password() {
            printf '%s' "$1" | openssl dgst -sha256 -hmac "$RESTIC_SEED" -binary | base64 | tr -d '\n'
          }

          # write_secret <namespace> <name> <json data map> - creates or replaces, so a
          # re-run refreshes the contents instead of leaving stale credentials behind.
          write_secret() {
            ws_ns="$1"
            ws_name="$2"
            ws_data="$3"

            ws_body="{\"apiVersion\":\"v1\",\"kind\":\"Secret\""
            ws_body="${ws_body},\"metadata\":{\"name\":\"${ws_name}\",\"namespace\":\"${ws_ns}\"}"
            ws_body="${ws_body},\"data\":${ws_data}}"

            ws_url="${K8S_API}/api/v1/namespaces/${ws_ns}/secrets"
            ws_status=$(curl -s -o /tmp/secret_response -w '%{http_code}' --cacert "$CACERT" \
              -H "Authorization: Bearer ${K8S_TOKEN}" -H "Content-Type: application/json" \
              -X POST "$ws_url" -d "$ws_body")

            if [ "$ws_status" = "409" ]; then
              ws_status=$(curl -s -o /tmp/secret_response -w '%{http_code}' --cacert "$CACERT" \
                -H "Authorization: Bearer ${K8S_TOKEN}" -H "Content-Type: application/json" \
                -X PUT "${ws_url}/${ws_name}" -d "$ws_body")
            fi

            case "$ws_status" in
            2??) echo "  wrote Secret ${ws_name} in ${ws_ns}" ;;
            *)
              echo "ERROR: writing Secret ${ws_name} in ${ws_ns} returned HTTP $ws_status" >&2
              cat /tmp/secret_response >&2
              echo >&2
              return 1
              ;;
            esac
          }

          # secret_exists <namespace> <name>
          secret_exists() {
            se_status=$(curl -s -o /dev/null -w '%{http_code}' --cacert "$CACERT" \
              -H "Authorization: Bearer ${K8S_TOKEN}" \
              "${K8S_API}/api/v1/namespaces/$1/secrets/$2")
            [ "$se_status" = "200" ]
          }

          b64() { printf '%s' "$1" | base64 | tr -d '\n'; }

          echo "Provisioning backup repository for namespace forgejo"
          BUCKET_ID=$(ensure_bucket "kubernetes-backups-forgejo")
          if [ -z "$BUCKET_ID" ] || [ "$BUCKET_ID" = "null" ]; then
            echo "ERROR: could not determine bucket ID for kubernetes-backups-forgejo" >&2
            exit 1
          fi

          set -- $(ensure_key "backup-forgejo")
          ACCESS_KEY_ID="$1"
          SECRET_ACCESS_KEY="$2"

          # Scoped to this one bucket: the namespace holding these credentials must not
          # be able to read or delete any other namespace's backups.
          GRANT="{\"bucketId\":\"${BUCKET_ID}\",\"accessKeyId\":\"${ACCESS_KEY_ID}\""
          GRANT="${GRANT},\"permissions\":{\"read\":true,\"write\":true,\"owner\":false}}"
          api POST v2/AllowBucketKey "$GRANT"

          write_secret "forgejo" "garage-backup-access-key-secret" \
            "{\"access-key-id\":\"$(b64 "$ACCESS_KEY_ID")\",\"secret-access-key\":\"$(b64 "$SECRET_ACCESS_KEY")\"}"


          REPO_PASSWORD=$(derive_password "forgejo")
          write_secret "forgejo" "restic-repo-password-secret" \
            "{\"password\":\"$(b64 "$REPO_PASSWORD")\"}"

          echo "Provisioning backup repository for namespace vault"
          BUCKET_ID=$(ensure_bucket "kubernetes-backups-vault")
          if [ -z "$BUCKET_ID" ] || [ "$BUCKET_ID" = "null" ]; then
            echo "ERROR: could not determine bucket ID for kubernetes-backups-vault" >&2
            exit 1
          fi

          set -- $(ensure_key "backup-vault")
          ACCESS_KEY_ID="$1"
          SECRET_ACCESS_KEY="$2"

          # Scoped to this one bucket: the namespace holding these credentials must not
          # be able to read or delete any other namespace's backups.
          GRANT="{\"bucketId\":\"${BUCKET_ID}\",\"accessKeyId\":\"${ACCESS_KEY_ID}\""
          GRANT="${GRANT},\"permissions\":{\"read\":true,\"write\":true,\"owner\":false}}"
          api POST v2/AllowBucketKey "$GRANT"

          write_secret "vault" "garage-backup-access-key-secret" \
            "{\"access-key-id\":\"$(b64 "$ACCESS_KEY_ID")\",\"secret-access-key\":\"$(b64 "$SECRET_ACCESS_KEY")\"}"


          # vault deliberately keeps a password the seed cannot produce,
          # so this job only checks that it has been provisioned out of band.
          if secret_exists "vault" "restic-repo-password-secret"; then
            echo "  vault uses its own repository password (not derived)"
          else
            echo "WARNING: vault has no restic-repo-password-secret." >&2
            echo "         Its backups cannot run until one is created. This password is" >&2
            echo "         deliberately not derived from the seed, because the seed lives" >&2
            echo "         inside Vault and would be unavailable when restoring it." >&2
            echo "         Create it, and keep a copy outside the cluster:" >&2
            echo "           kubectl -n vault create secret generic \\" >&2
            echo "             restic-repo-password-secret --from-literal=password=<password>" >&2
          fi

          echo "Provisioning backup repository for namespace mealie"
          BUCKET_ID=$(ensure_bucket "kubernetes-backups-mealie")
          if [ -z "$BUCKET_ID" ] || [ "$BUCKET_ID" = "null" ]; then
            echo "ERROR: could not determine bucket ID for kubernetes-backups-mealie" >&2
            exit 1
          fi

          set -- $(ensure_key "backup-mealie")
          ACCESS_KEY_ID="$1"
          SECRET_ACCESS_KEY="$2"

          # Scoped to this one bucket: the namespace holding these credentials must not
          # be able to read or delete any other namespace's backups.
          GRANT="{\"bucketId\":\"${BUCKET_ID}\",\"accessKeyId\":\"${ACCESS_KEY_ID}\""
          GRANT="${GRANT},\"permissions\":{\"read\":true,\"write\":true,\"owner\":false}}"
          api POST v2/AllowBucketKey "$GRANT"

          write_secret "mealie" "garage-backup-access-key-secret" \
            "{\"access-key-id\":\"$(b64 "$ACCESS_KEY_ID")\",\"secret-access-key\":\"$(b64 "$SECRET_ACCESS_KEY")\"}"


          REPO_PASSWORD=$(derive_password "mealie")
          write_secret "mealie" "restic-repo-password-secret" \
            "{\"password\":\"$(b64 "$REPO_PASSWORD")\"}"

          echo "Provisioning read-only dashboard key"
          set -- $(ensure_key "backup-dashboard-reader")
          READER_ACCESS_KEY_ID="$1"
          READER_SECRET_ACCESS_KEY="$2"

          READER_BUCKET_ID=$(ensure_bucket "kubernetes-backups")
          READER_GRANT="{\"bucketId\":\"${READER_BUCKET_ID}\""
          READER_GRANT="${READER_GRANT},\"accessKeyId\":\"${READER_ACCESS_KEY_ID}\""
          READER_GRANT="${READER_GRANT},\"permissions\":{\"read\":true,\"write\":false,\"owner\":false}}"
          api POST v2/AllowBucketKey "$READER_GRANT"

          READER_BUCKET_ID=$(ensure_bucket "kubernetes-backups-forgejo")
          READER_GRANT="{\"bucketId\":\"${READER_BUCKET_ID}\""
          READER_GRANT="${READER_GRANT},\"accessKeyId\":\"${READER_ACCESS_KEY_ID}\""
          READER_GRANT="${READER_GRANT},\"permissions\":{\"read\":true,\"write\":false,\"owner\":false}}"
          api POST v2/AllowBucketKey "$READER_GRANT"

          READER_BUCKET_ID=$(ensure_bucket "kubernetes-backups-vault")
          READER_GRANT="{\"bucketId\":\"${READER_BUCKET_ID}\""
          READER_GRANT="${READER_GRANT},\"accessKeyId\":\"${READER_ACCESS_KEY_ID}\""
          READER_GRANT="${READER_GRANT},\"permissions\":{\"read\":true,\"write\":false,\"owner\":false}}"
          api POST v2/AllowBucketKey "$READER_GRANT"

          READER_BUCKET_ID=$(ensure_bucket "kubernetes-backups-mealie")
          READER_GRANT="{\"bucketId\":\"${READER_BUCKET_ID}\""
          READER_GRANT="${READER_GRANT},\"accessKeyId\":\"${READER_ACCESS_KEY_ID}\""
          READER_GRANT="${READER_GRANT},\"permissions\":{\"read\":true,\"write\":false,\"owner\":false}}"
          api POST v2/AllowBucketKey "$READER_GRANT"

          write_secret "backup-dashboard" "garage-backup-access-key-secret" \
            "{\"access-key-id\":\"$(b64 "$READER_ACCESS_KEY_ID")\",\"secret-access-key\":\"$(b64 "$READER_SECRET_ACCESS_KEY")\"}"

          echo "Per-namespace backup repositories provisioned."
        image: alpine:3.20
        name: init
        volumeMounts:
        - mountPath: /secrets
          name: node-secrets
        - mountPath: /secrets/restic-seed
          name: restic-seed
      volumes:
      - name: node-secrets
        secret:
          secretName: garage-node-secrets
      - name: restic-seed
        secret:
          secretName: restic-seed-password-secret
      restartPolicy: OnFailure

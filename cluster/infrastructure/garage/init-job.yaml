---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: garage-init
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: garage-init-secret-writer
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - get
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: garage-init-secret-writer-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: garage-init-secret-writer
subjects:
- kind: ServiceAccount
  name: garage-init
---
apiVersion: batch/v1
kind: Job
metadata:
  name: garage-init
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 3600
  template:
    metadata: {}
    spec:
      serviceAccountName: garage-init
      containers:
      - command:
        - sh
        - -c
        - |
          set -e
          apk add --no-cache curl jq >/dev/null

          ADMIN_TOKEN=$(cat /secrets/admin_token)
          API="http://garage.garage.svc.cluster.local:3903"
          AUTH="Authorization: Bearer ${ADMIN_TOKEN}"

          for i in $(seq 1 30); do
            curl -sf -H "$AUTH" "$API/v2/GetClusterStatus" >/tmp/status.json && break
            echo "Waiting for garage admin API..."
            sleep 5
          done

          NODE_ID=$(jq -r '.node' /tmp/status.json)

          curl -sf -H "$AUTH" -H "Content-Type: application/json" \
            -X POST "$API/v2/UpdateClusterLayout" \
            -d "{\"roles\":[{\"id\":\"${NODE_ID}\",\"zone\":\"dc1\",\"capacity\":200000000000,\"tags\":[]}]}"

          LAYOUT_VERSION=$(curl -sf -H "$AUTH" "$API/v2/GetClusterLayout" | jq -r '.version')
          curl -sf -H "$AUTH" -H "Content-Type: application/json" \
            -X POST "$API/v2/ApplyClusterLayout" \
            -d "{\"version\": $((LAYOUT_VERSION + 1))}"

          curl -s -H "$AUTH" -H "Content-Type: application/json" \
            -X POST "$API/v2/CreateBucket" -d '{"globalAlias":"kubernetes-backups"}' > /tmp/bucket.json || true
          BUCKET_ID=$(jq -r '.id' /tmp/bucket.json)

          curl -s -H "$AUTH" -H "Content-Type: application/json" \
            -X POST "$API/v2/CreateKey" -d '{"name":"backup-key"}' > /tmp/key.json
          ACCESS_KEY_ID=$(jq -r '.accessKeyId' /tmp/key.json)
          SECRET_ACCESS_KEY=$(jq -r '.secretAccessKey' /tmp/key.json)

          curl -sf -H "$AUTH" -H "Content-Type: application/json" \
            -X POST "$API/v2/AllowBucketKey" \
            -d "{\"bucketId\":\"${BUCKET_ID}\",\"accessKeyId\":\"${ACCESS_KEY_ID}\",\"permissions\":{\"read\":true,\"write\":true,\"owner\":false}}"

          K8S_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          CACERT=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          ACCESS_KEY_ID_B64=$(printf '%s' "$ACCESS_KEY_ID" | base64 | tr -d '\n')
          SECRET_ACCESS_KEY_B64=$(printf '%s' "$SECRET_ACCESS_KEY" | base64 | tr -d '\n')

          curl -sf --cacert "$CACERT" -H "Authorization: Bearer ${K8S_TOKEN}" -H "Content-Type: application/json" \
            -X POST "https://kubernetes.default.svc/api/v1/namespaces/garage/secrets" \
            -d "{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"garage-backup-access-key-secret\",\"annotations\":{\"reflector.v1.k8s.emberstack.com/reflection-allowed\":\"true\",\"reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces\":\"forgejo,backup-dashboard\",\"reflector.v1.k8s.emberstack.com/reflection-auto-enabled\":\"true\",\"reflector.v1.k8s.emberstack.com/reflection-auto-namespaces\":\"forgejo,backup-dashboard\"}},\"data\":{\"access-key-id\":\"${ACCESS_KEY_ID_B64}\",\"secret-access-key\":\"${SECRET_ACCESS_KEY_B64}\"}}" \
            || echo "Secret may already exist - update it manually if the key was rotated"

          echo "Garage bucket + scoped backup key provisioned."
        image: alpine:3.20
        name: init
        volumeMounts:
        - mountPath: /secrets
          name: node-secrets
      volumes:
      - name: node-secrets
        secret:
          secretName: garage-node-secrets
      restartPolicy: OnFailure

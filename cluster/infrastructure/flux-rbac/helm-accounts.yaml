metadata:
  name: flux-helm-forgejo
  namespace: forgejo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-helm-forgejo-namespace-admin
  namespace: forgejo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flux-namespace-admin
subjects:
- kind: ServiceAccount
  name: flux-helm-forgejo
  namespace: forgejo

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netbird-operator
spec:
  interval: 24h
  chartRef:
    kind: OCIRepository
    name: netbird-operator-repo
  timeout: 10m
  releaseName: netbird-operator
  install:
    remediation:
      retries: 3
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    managementURL: https://netbird.nathalie-stiefsohn.eu
    netbirdAPI:
      keyFromSecret:
        key: NB_API_KEY
        name: netbird-mgmt-api-key
    operator:
      nodeSelector:
        kubernetes.io/hostname: debian
    routingClientImage: ghcr.io/netbirdio/netbird:0.72.4@sha256:6c6c20baffae4a3ec50f29ec9361608a420625185505e8cd6f0c44d71c5d4798
  driftDetection:
    mode: warn

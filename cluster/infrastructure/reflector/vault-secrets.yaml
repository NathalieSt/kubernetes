---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reflector-vault-serviceaccount
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: reflector-vault-token-reviewer
rules:
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - authorization.k8s.io
  resources:
  - subjectaccessreviews
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: reflector-vault-token-reviewer-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: reflector-vault-token-reviewer
subjects:
- kind: ServiceAccount
  name: reflector-vault-serviceaccount
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: reflector-vault-auth
spec:
  kubernetes:
    role: reflector
    serviceAccount: reflector-vault-serviceaccount
  vaultAuthGlobalRef:
    allowDefault: true
    namespace: vault-secrets-operator
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: reflector-forgejo-registry-static-secret
spec:
  vaultAuthRef: reflector-vault-auth
  mount: kvv2
  type: kv-v2
  path: forgejo-registry
  refreshAfter: 10s
  destination:
    create: true
    name: forgejo-registry-secret
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: jellyfin,backup-dashboard,vim-dojo,orrery,daybook,limes,mail,redlib,healthchecks,homelab-docs,zyme,tare,helium-services,neko,anki-sync,psono,fleet,pharos,fdroid
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: jellyfin,backup-dashboard,vim-dojo,orrery,daybook,limes,mail,redlib,healthchecks,homelab-docs,zyme,tare,helium-services,neko,anki-sync,psono,fleet,pharos,fdroid
    type: kubernetes.io/dockerconfigjson
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: reflector-postgres-static-secret
spec:
  vaultAuthRef: reflector-vault-auth
  mount: kvv2
  type: kv-v2
  path: postgres
  refreshAfter: 10s
  destination:
    create: true
    name: postgres-creds-secret
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: postgres
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: postgres
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: reflector-tandoor-static-secret
spec:
  vaultAuthRef: reflector-vault-auth
  mount: kvv2
  type: kv-v2
  path: tandoor
  refreshAfter: 10s
  destination:
    create: true
    name: tandoor-secret
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: tandoor
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: tandoor
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: reflector-forgejo-pg-static-secret
spec:
  vaultAuthRef: reflector-vault-auth
  mount: kvv2
  type: kv-v2
  path: postgres-clusters/forgejo
  refreshAfter: 10s
  destination:
    create: true
    name: forgejo-pg-creds-secret
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: forgejo-pg-cluster,forgejo
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: forgejo-pg-cluster,forgejo
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: reflector-restic-seed-static-secret
spec:
  vaultAuthRef: reflector-vault-auth
  mount: kvv2
  type: kv-v2
  path: restic-backup/repo
  refreshAfter: 10s
  destination:
    create: true
    name: restic-seed-password-secret
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: garage,backup-dashboard
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: garage,backup-dashboard
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: reflector-garage-metrics-token-static-secret
spec:
  vaultAuthRef: reflector-vault-auth
  mount: kvv2
  type: kv-v2
  path: garage/node-secrets
  refreshAfter: 10s
  destination:
    create: true
    name: garage-metrics-token-secret
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: victoria-metrics
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: victoria-metrics
    transformation:
      includes:
      - metrics_token
      excludeRaw: true

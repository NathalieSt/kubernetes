---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: forgejo-pg
spec:
  instances: 1
  storage:
    storageClass: nfs-local
    size: 15Gi
  inheritedMetadata:
    annotations:
      k8up.io/backup: "false"
      k8up.io/backupcommand: bash -c 'set -o pipefail; pg_dumpall --clean --if-exists | zstd -T0 -3 -q'
      k8up.io/file-extension: .sql.zst
  superuserSecret:
    name: forgejo-pg-creds-secret
  enableSuperuserAccess: true
  probes:
    readiness:
      initialDelaySeconds: 30
      periodSeconds: 30
      timeoutSeconds: 30
      failureThreshold: 10
  monitoring:
    customQueriesConfigMap:
    - name: forgejo-pg-monitoring
      key: queries

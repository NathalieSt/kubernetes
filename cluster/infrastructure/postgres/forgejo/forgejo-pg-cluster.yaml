---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: forgejo-pg
spec:
  instances: 1
  storage:
    storageClass: nfs-local
    size: 15Gi
  inheritedMetadata:
    annotations:
      k8up.io/backup: "false"
  superuserSecret:
    name: forgejo-pg-creds-secret
  enableSuperuserAccess: true
  probes:
    readiness:
      initialDelaySeconds: 30
      periodSeconds: 30
      timeoutSeconds: 30
      failureThreshold: 10
  monitoring:
    customQueriesConfigMap:
    - name: forgejo-pg-monitoring
      key: queries
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/hostname
            operator: NotIn
            values:
            - ai-node
  podSecurityContext:
    fsGroup: 26
    fsGroupChangePolicy: OnRootMismatch
    runAsUser: 26
    runAsGroup: 26
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

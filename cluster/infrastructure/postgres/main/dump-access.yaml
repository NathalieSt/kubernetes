---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: main-pg-dump
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: main-pg-dump
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
- apiGroups:
  - ""
  resources:
  - pods/exec
  verbs:
  - create
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: main-pg-dump
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: main-pg-dump
subjects:
- kind: ServiceAccount
  name: main-pg-dump

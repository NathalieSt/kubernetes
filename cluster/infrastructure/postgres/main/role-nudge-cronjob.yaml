---
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/name: main-pg-role-nudge
  name: main-pg-role-nudge
spec:
  schedule: "*/10 * * * *"
  timeZone: Europe/Vienna
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: main-pg-role-nudge
        spec:
          serviceAccountName: main-pg-role-nudge
          enableServiceLinks: false
          containers:
          - command:
            - sh
            - -c
            - |
              #!/bin/sh
              # CNPG re-checks managed roles only on a Cluster change, not a Secret's: annotate while one
              # waits. Why: kubernetes-generator MEMORY.md, "A Postgres database". Reads nothing secret.
              set -eu

              failed="$(kubectl -n "$NAMESPACE" get clusters.postgresql.cnpg.io "$CLUSTER" \
                -o jsonpath='{.status.managedRolesStatus.cannotReconcile}')"

              if [ -z "$failed" ]; then
                echo "every managed role is reconciled"
                exit 0
              fi

              echo "not reconciled: $failed"
              kubectl -n "$NAMESPACE" annotate --overwrite clusters.postgresql.cnpg.io "$CLUSTER" \
                "homelab.nathalie-stiefsohn.eu/roles-nudged=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            image: alpine/k8s:1.37.1@sha256:712dc5385d1c1a3f83b747fa9e40f64d433a97f72ff42f9755ff7dd1f62846e4
            name: main-pg-role-nudge
            volumeMounts:
            - mountPath: /tmp
              name: tmp
            env:
            - name: NAMESPACE
              value: postgres
            - name: CLUSTER
              value: postgres
            - name: HOME
              value: /tmp
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              capabilities:
                drop:
                - ALL
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
          volumes:
          - name: tmp
            emptyDir: {}
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          restartPolicy: Never
      activeDeadlineSeconds: 120

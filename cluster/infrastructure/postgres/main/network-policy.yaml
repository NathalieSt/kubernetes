---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: main-pg-networkpolicy
spec:
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
          - tandoor
          - password-manager
          - jellyfin
          - cnpg-system
          - authelia
          - healthchecks
          - ntfy
          - glitchtip
          - fermentation-tracker
          - device-configuration-manager
          - price-tracker
          - image-scanner
          - paperless
          - miniflux
      podSelector:
        matchExpressions:
        - key: app.kubernetes.io/name
          operator: In
          values:
          - tandoor
          - audiomuse-ai-worker
          - audiomuse-ai-nvidia-worker
          - audiomuse-ai-flask
          - cloudnative-pg
          - authelia
          - healthchecks
          - ntfy
          - glitchtip
          - fermentation-tracker
          - device-configuration-manager
          - password-server
          - price-tracker
          - price-tracker-crawl
          - image-scanner
          - paperless
          - miniflux
          - sonarr
          - radarr
          - lidarr
          - prowlarr
          - bazarr
          - seerr
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: victoria-metrics
    ports:
    - port: 9187
      protocol: TCP

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: main-pg-role-nudge
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: main-pg-role-nudge
rules:
- apiGroups:
  - postgresql.cnpg.io
  resources:
  - clusters
  resourceNames:
  - postgres
  verbs:
  - get
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: main-pg-role-nudge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: main-pg-role-nudge
subjects:
- kind: ServiceAccount
  name: main-pg-role-nudge

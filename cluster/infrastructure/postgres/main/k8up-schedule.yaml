---
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: main-pg-backup
  namespace: postgres
spec:
  backend:
    repoPasswordSecretRef:
      name: restic-repo-password-secret
      key: password
    s3:
      endpoint: http://garage.garage.svc.cluster.local:3900
      bucket: kubernetes-backups-postgres
      accessKeyIDSecretRef:
        name: garage-backup-access-key-secret
        key: access-key-id
      secretAccessKeySecretRef:
        name: garage-backup-access-key-secret
        key: secret-access-key
  backup:
    schedule: 0 1 * * *
    podSecurityContext:
      runAsUser: 0
      runAsGroup: 0
      seccompProfile:
        type: RuntimeDefault
    podConfigRef:
      name: main-pg-backup-pod
  prune:
    schedule: 0 4 * * 0
    retention:
      keepLast: 14
      keepWeekly: 8
      keepMonthly: 12
      keepYearly: 5
---
apiVersion: k8up.io/v1
kind: PodConfig
metadata:
  name: main-pg-backup-pod
  namespace: postgres
spec:
  template:
    spec:
      containers:
      - name: backup
        securityContext:
          capabilities:
            drop:
            - ALL
          allowPrivilegeEscalation: false

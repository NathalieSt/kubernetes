---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  instances: 1
  storage:
    storageClass: nfs-remote
    size: 15Gi
  inheritedMetadata:
    annotations:
      k8up.io/backup: "false"
      k8up.io/backupcommand: pg_dumpall --clean --if-exists
      k8up.io/file-extension: .sql
  superuserSecret:
    name: postgres-creds-secret
  enableSuperuserAccess: true
  probes:
    readiness:
      initialDelaySeconds: 30
      periodSeconds: 30
      timeoutSeconds: 30
      failureThreshold: 10

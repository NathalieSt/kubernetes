---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault
spec:
  interval: 24h
  chartRef:
    kind: HelmChart
    name: vault-chart
  timeout: 10m
  releaseName: vault
  install:
    remediation:
      retries: 3
  values:
    server:
      dataStorage:
        annotations:
          k8up.io/backup: "true"
        storageClass: nfs-local
      standalone:
        config: |
          ui = true

          listener "tcp" {
            tls_disable = 1
            address = "[::]:8200"
            cluster_address = "[::]:8201"
            telemetry {
              unauthenticated_metrics_access = "true"
            }
          }

          storage "file" {
            path = "/vault/data"
          }

          telemetry {
            prometheus_retention_time = "24h"
            disable_hostname = true
          }
    ui:
      enabled: true

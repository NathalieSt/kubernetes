---
apiVersion: v1
kind: ConfigMap
metadata:
  name: internal-gateway-dynamic
data:
  middlewares.yaml: |
    http:
      middlewares:
        authelia:
          forwardAuth:
            address: http://authelia.authelia.svc.cluster.local:9091/api/authz/forward-auth
            trustForwardHeader: true
            authResponseHeaders:
            - Remote-User
            - Remote-Groups
            - Remote-Email
            - Remote-Name
            authRequestHeaders:
            - Cookie
            - X-Forwarded-For
            - X-Forwarded-Host
            - X-Forwarded-Proto
            - X-Forwarded-Uri
            - X-Forwarded-Method
  routers.yaml: |
    http:
      routers:
        audiomuse-ai:
          rule: Host(`audiomuse.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: audiomuse-ai
          middlewares:
          - authelia
        authelia:
          rule: Host(`auth.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: authelia
        backup-dashboard:

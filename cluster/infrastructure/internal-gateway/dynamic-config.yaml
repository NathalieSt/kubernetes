---
apiVersion: v1
kind: ConfigMap
metadata:
  name: internal-gateway-dynamic
data:
  middlewares.yaml: |
    http:
      middlewares:
        authelia:
          forwardAuth:
            address: http://authelia.authelia.svc.cluster.local:9091/api/authz/forward-auth
            trustForwardHeader: true
            authResponseHeaders:
            - Remote-User
            - Remote-Groups
            - Remote-Email
            - Remote-Name
            authRequestHeaders:
            - Cookie
            - X-Forwarded-For
            - X-Forwarded-Host
            - X-Forwarded-Proto
            - X-Forwarded-Uri
            - X-Forwarded-Method
  routers.yaml: |
    http:
      routers:
        audiomuse-ai:
          rule: Host(`audiomuse.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: audiomuse-ai
          middlewares:
          - authelia
        authelia:
          rule: Host(`auth.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: authelia
        backup-dashboard:
          rule: Host(`backups.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: backup-dashboard
          middlewares:
          - authelia
        changedetection:
          rule: Host(`changedetection.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: changedetection
          middlewares:
          - authelia
        code-server:
          rule: Host(`vscode.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: code-server
          middlewares:
          - authelia
        daybook:
          rule: Host(`daybook.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: daybook
          middlewares:
          - authelia
        flood:
          rule: Host(`transmission.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: flood
          middlewares:
          - authelia
        forgejo:
          rule: Host(`code.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: forgejo
        fourget:
          rule: Host(`4get.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: fourget
          middlewares:
          - authelia
        glitchtip:
          rule: Host(`glitchtip.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: glitchtip
        headlamp:
          rule: Host(`headlamp.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: headlamp
          middlewares:
          - authelia
        healthchecks:
          rule: Host(`healthchecks.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: healthchecks
          middlewares:
          - authelia
        homelab-docs:
          rule: Host(`docs.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: homelab-docs
          middlewares:
          - authelia
        homepage:
          rule: Host(`home.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: homepage
          middlewares:
          - authelia
        it-tools:
          rule: Host(`it-tools.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: it-tools
          middlewares:
          - authelia
        jellyfin:
          rule: Host(`jellyfin.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: jellyfin
        kavita:
          rule: Host(`kavita.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: kavita
          middlewares:
          - authelia
        limes:
          rule: Host(`limes.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: limes
          middlewares:
          - authelia
        mail:
          rule: Host(`mail.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: mail
          middlewares:
          - authelia
        music-library-builder:
          rule: Host(`music.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: music-library-builder
          middlewares:
          - authelia
        neko:
          rule: Host(`neko.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: neko
          middlewares:
          - authelia
        ntfy:
          rule: Host(`ntfy.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: ntfy
        omni-tools:
          rule: Host(`omni-tools.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: omni-tools
          middlewares:
          - authelia
        orrery:
          rule: Host(`orrery.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: orrery
        psono-client:
          rule: Host(`psono.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: psono-client
        psono-server:
          rule: Host(`psono-api.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: psono-server
        redlib:
          rule: Host(`redlib.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: redlib
          middlewares:
          - authelia
        tandoor:
          rule: Host(`tandoor.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: tandoor
          middlewares:
          - authelia
        vault:
          rule: Host(`vault.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: vault
        vim-dojo:
          rule: Host(`dojo.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: vim-dojo
          middlewares:
          - authelia
        zyme:
          rule: Host(`zyme.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: zyme
          middlewares:
          - authelia
  services.yaml: |
    http:
      services:
        audiomuse-ai:
          loadBalancer:
            servers:
            - url: http://audiomuse-ai.jellyfin.svc.cluster.local:8000
        authelia:
          loadBalancer:
            servers:
            - url: http://authelia.authelia.svc.cluster.local:9091
        backup-dashboard:
          loadBalancer:
            servers:
            - url: http://backup-dashboard.backup-dashboard.svc.cluster.local:8080
        changedetection:
          loadBalancer:
            servers:
            - url: http://changedetection.changedetection.svc.cluster.local:5000
        code-server:
          loadBalancer:
            servers:
            - url: http://code-server.code-server.svc.cluster.local:8080
        daybook:
          loadBalancer:
            servers:
            - url: http://daybook.daybook.svc.cluster.local:8080
        flood:
          loadBalancer:
            servers:
            - url: http://flood.jellyfin.svc.cluster.local:3000
        forgejo:
          loadBalancer:
            servers:
            - url: http://forgejo-http.forgejo.svc.cluster.local:3000
        fourget:
          loadBalancer:
            servers:
            - url: http://fourget.fourget.svc.cluster.local:8080
        glitchtip:
          loadBalancer:
            servers:
            - url: http://glitchtip.glitchtip.svc.cluster.local:8000
        headlamp:
          loadBalancer:
            servers:
            - url: http://headlamp.headlamp.svc.cluster.local:80
        healthchecks:
          loadBalancer:
            servers:
            - url: http://healthchecks.healthchecks.svc.cluster.local:8000
        homelab-docs:
          loadBalancer:
            servers:
            - url: http://homelab-docs.homelab-docs.svc.cluster.local:8080
        homepage:
          loadBalancer:
            servers:
            - url: http://homepage.homepage.svc.cluster.local:3000
        it-tools:
          loadBalancer:
            servers:
            - url: http://it-tools.it-tools.svc.cluster.local:8080
        jellyfin:
          loadBalancer:
            servers:
            - url: http://jellyfin.jellyfin.svc.cluster.local:8096
        kavita:
          loadBalancer:
            servers:
            - url: http://kavita.kavita.svc.cluster.local:5000
        limes:
          loadBalancer:
            servers:
            - url: http://limes.limes.svc.cluster.local:8080
        mail:
          loadBalancer:
            servers:
            - url: http://roundcube.mail.svc.cluster.local:8000
        music-library-builder:
          loadBalancer:
            servers:
            - url: http://music-library-builder.jellyfin.svc.cluster.local:8140
        neko:
          loadBalancer:
            servers:
            - url: http://neko.neko.svc.cluster.local:8080
        ntfy:
          loadBalancer:
            servers:
            - url: http://ntfy.ntfy.svc.cluster.local:8080
        omni-tools:
          loadBalancer:
            servers:
            - url: http://omni-tools.omni-tools.svc.cluster.local:8080
        orrery:
          loadBalancer:
            servers:
            - url: http://orrery.orrery.svc.cluster.local:8080
        psono-client:
          loadBalancer:
            servers:
            - url: http://psono-client.psono.svc.cluster.local:80
        psono-server:
          loadBalancer:
            servers:
            - url: http://psono-server.psono.svc.cluster.local:80
        redlib:
          loadBalancer:
            servers:
            - url: http://redlib.redlib.svc.cluster.local:8080
        tandoor:
          loadBalancer:
            servers:
            - url: http://tandoor.tandoor.svc.cluster.local:8080
        vault:
          loadBalancer:
            servers:
            - url: http://vault-ui.vault.svc.cluster.local:8200
        vim-dojo:
          loadBalancer:
            servers:
            - url: http://vim-dojo.vim-dojo.svc.cluster.local:3000
        zyme:
          loadBalancer:
            servers:
            - url: http://zyme.zyme.svc.cluster.local:8080
  tcp.yaml: |
    tcp:
      routers:
        forgejo-ssh:
          rule: HostSNI(`*`)
          entryPoints:
          - forgejo-ssh
          service: forgejo-ssh
      services:
        forgejo-ssh:
          loadBalancer:
            servers:
            - address: forgejo-ssh.forgejo.svc.cluster.local:2222

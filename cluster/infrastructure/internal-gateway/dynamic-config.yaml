---
apiVersion: v1
kind: ConfigMap
metadata:
  name: internal-gateway-dynamic
data:
  middlewares.yaml: |
    http:
      middlewares:
        headlamp-basic-auth:
          basicAuth:
            usersFile: /auth/headlamp
            realm: headlamp.netbird.nathalie-stiefsohn.eu
            removeHeader: true
        security-dashboard-basic-auth:
          basicAuth:
            usersFile: /auth/security-dashboard
            realm: scans.netbird.nathalie-stiefsohn.eu
            removeHeader: true
        vim-dojo-basic-auth:
          basicAuth:
            usersFile: /auth/vim-dojo
            realm: dojo.netbird.nathalie-stiefsohn.eu
            removeHeader: true
  routers.yaml: |
    http:
      routers:
        affine:
          rule: Host(`affine.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: affine
        audiomuse-ai:
          rule: Host(`audiomuse.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: audiomuse-ai
        backup-dashboard:
          rule: Host(`backups.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: backup-dashboard
        daybook:
          rule: Host(`daybook.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: daybook
        flood:
          rule: Host(`transmission.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: flood
        forgejo:
          rule: Host(`code.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: forgejo
        headlamp:
          rule: Host(`headlamp.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: headlamp
          middlewares:
          - headlamp-basic-auth
        jellyfin:
          rule: Host(`jellyfin.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: jellyfin
        kavita:
          rule: Host(`kavita.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: kavita
        mail:
          rule: Host(`mail.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: mail
        music-library-builder:
          rule: Host(`music.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: music-library-builder
        network-topology-ui:
          rule: Host(`topology.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: network-topology-ui
        perses:
          rule: Host(`perses.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: perses
        psono-client:
          rule: Host(`psono.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: psono-client
        psono-server:
          rule: Host(`psono-api.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: psono-server
        redlib:
          rule: Host(`redlib.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: redlib
        searxng:
          rule: Host(`searxng.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: searxng
        security-dashboard:
          rule: Host(`scans.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: security-dashboard
          middlewares:
          - security-dashboard-basic-auth
        tandoor:
          rule: Host(`tandoor.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: tandoor
        vault:
          rule: Host(`vault.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: vault
        vim-dojo:
          rule: Host(`dojo.netbird.nathalie-stiefsohn.eu`)
          entryPoints:
          - websecure
          service: vim-dojo
          middlewares:
          - vim-dojo-basic-auth
  services.yaml: |
    http:
      services:
        affine:
          loadBalancer:
            servers:
            - url: http://affine.affine.svc.cluster.local:3010
        audiomuse-ai:
          loadBalancer:
            servers:
            - url: http://audiomuse-ai.jellyfin.svc.cluster.local:8000
        backup-dashboard:
          loadBalancer:
            servers:
            - url: http://backup-dashboard.backup-dashboard.svc.cluster.local:8080
        daybook:
          loadBalancer:
            servers:
            - url: http://daybook.daybook.svc.cluster.local:8080
        flood:
          loadBalancer:
            servers:
            - url: http://flood.jellyfin.svc.cluster.local:3000
        forgejo:
          loadBalancer:
            servers:
            - url: http://forgejo-http.forgejo.svc.cluster.local:3000
        headlamp:
          loadBalancer:
            servers:
            - url: http://headlamp.headlamp.svc.cluster.local:80
        jellyfin:
          loadBalancer:
            servers:
            - url: http://jellyfin.jellyfin.svc.cluster.local:8096
        kavita:
          loadBalancer:
            servers:
            - url: http://kavita.kavita.svc.cluster.local:5000
        mail:
          loadBalancer:
            servers:
            - url: http://mail.mail.svc.cluster.local:25
        music-library-builder:
          loadBalancer:
            servers:
            - url: http://music-library-builder.jellyfin.svc.cluster.local:8140
        network-topology-ui:
          loadBalancer:
            servers:
            - url: http://network-topology-ui.network-topology-ui.svc.cluster.local:8080
        perses:
          loadBalancer:
            servers:
            - url: http://perses.perses.svc.cluster.local:8080
        psono-client:
          loadBalancer:
            servers:
            - url: http://psono-client.psono.svc.cluster.local:80
        psono-server:
          loadBalancer:
            servers:
            - url: http://psono-server.psono.svc.cluster.local:80
        redlib:
          loadBalancer:
            servers:
            - url: http://redlib.redlib.svc.cluster.local:8080
        searxng:
          loadBalancer:
            servers:
            - url: http://searxng.searxng.svc.cluster.local:8080
        security-dashboard:
          loadBalancer:
            servers:
            - url: http://security-dashboard.security-dashboard.svc.cluster.local:8080
        tandoor:
          loadBalancer:
            servers:
            - url: http://tandoor.tandoor.svc.cluster.local:8080
        vault:
          loadBalancer:
            servers:
            - url: http://vault-ui.vault.svc.cluster.local:8200
        vim-dojo:
          loadBalancer:
            servers:
            - url: http://vim-dojo.vim-dojo.svc.cluster.local:3000
  tcp.yaml: |
    tcp:
      routers:
        forgejo-ssh:
          rule: HostSNI(`*`)
          entryPoints:
          - forgejo-ssh
          service: forgejo-ssh
      services:
        forgejo-ssh:
          loadBalancer:
            servers:
            - address: forgejo-ssh.forgejo.svc.cluster.local:2222

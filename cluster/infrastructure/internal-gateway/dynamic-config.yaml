---
apiVersion: v1
kind: ConfigMap
metadata:
  name: internal-gateway-dynamic
data:
  middlewares.yaml: |
    http:
      middlewares:
        authelia:
          forwardAuth:
            address: http://authelia.authelia.svc.cluster.local:9091/api/authz/forward-auth
            trustForwardHeader: true
            authResponseHeaders:
            - Remote-User
            - Remote-Groups
            - Remote-Email
            - Remote-Name
            authRequestHeaders:
            - Accept
            - X-Requested-With
            - Cookie
            - X-Forwarded-For
            - X-Forwarded-Host
            - X-Forwarded-Proto
            - X-Forwarded-Uri
            - X-Forwarded-Method
        waking:
          errors:
            status:
            - 502-504
            service: waking-page
            query: /
  routers.yaml: |
    http:
      routers:
        anki-sync:
          rule: Host(`anki.netbird.nathalie-stiefsohn.eu`)

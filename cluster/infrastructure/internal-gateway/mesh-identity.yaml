---
apiVersion: netbird.io/v1alpha1
kind: Group
metadata:
  name: internal-gateway
  namespace: internal-gateway
spec:
  name: internal-gateway
---
apiVersion: netbird.io/v1alpha1
kind: SetupKey
metadata:
  name: internal-gateway-setup-key
  namespace: internal-gateway
spec:
  name: internal-gateway
  ephemeral: true
  allowExtraDnsLabels: true
  autoGroups:
  - name: kubernetes
  - localRef:
      name: internal-gateway
---
apiVersion: netbird.io/v1alpha1
kind: SidecarProfile
metadata:
  name: internal-gateway
  namespace: internal-gateway
spec:
  setupKeyRef:
    name: internal-gateway-setup-key
  podSelector:
    matchLabels:
      app.kubernetes.io/name: internal-gateway
  extraDNSLabels:
  - audiomuse
  - auth
  - backups
  - changedetection
  - vscode
  - daybook
  - code
  - 4get
  - glitchtip
  - headlamp
  - healthchecks
  - helium
  - docs
  - home
  - it-tools
  - jellyfin
  - kavita
  - limes
  - mail
  - music
  - neko
  - ntfy
  - omni-tools
  - orrery
  - psono
  - psono-api
  - redlib
  - rimworld
  - tandoor
  - vault
  - dojo
  - zyme
  containerOverride:
    env:
    - name: NB_DISABLE_UPDATE_SETTINGS
      value: "false"
    livenessProbe:
      exec:
        command:
        - sh
        - -c
        - |-
          s=$(netbird status --json 2>/dev/null | tr -d ' \n\t') || exit 1
          total=$(printf '%s' "$s" | grep -o '"peers":{"total":[0-9]*' | grep -o '[0-9]*$')
          connected=$(printf '%s' "$s" | grep -o '"peers":{"total":[0-9]*,"connected":[0-9]*' | grep -o '[0-9]*$')
          [ -n "$total" ] || { echo "no peer count in netbird status"; exit 1; }
          [ "$total" -eq 0 ] || [ "${connected:-0}" -gt 0 ] || { echo "0/$total peers connected"; exit 1; }
      initialDelaySeconds: 120
      periodSeconds: 60
      timeoutSeconds: 15
      failureThreshold: 5

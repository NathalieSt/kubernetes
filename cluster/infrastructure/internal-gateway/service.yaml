---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: internal-gateway
  name: internal-gateway
spec:
  selector:
    app.kubernetes.io/name: internal-gateway
  ports:
  - name: http
    port: 80
    targetPort: 80
  - name: https
    port: 443
    targetPort: 443
  - name: forgejo-ssh
    port: 2222
    targetPort: 2222

---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    perses.dev/resource: "true"
  name: internal-gateway-dashboard
data:
  10-dashboard-internal-gateway.yaml: |
    kind: Dashboard
    metadata:
      name: internal-gateway
      project: homelab
    spec:
      display:
        name: Internal Gateway
      duration: 6h
      refreshInterval: 1m
      panels:
        certExpiry:
          kind: Panel
          spec:
            display:
              name: Days until the wildcard certificate expires
            plugin:
              kind: TimeSeriesChart
              spec:
                yAxis:
                  format:
                    unit: decimal
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: "(min(traefik_tls_certs_not_after) - time()) / 86400"
        errorRate:
          kind: Panel
          spec:
            display:
              name: 5xx per second, by app
            plugin:
              kind: TimeSeriesChart
              spec:
                yAxis:
                  format:
                    unit: decimal
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: sum by (service) (rate(traefik_service_requests_total{code=~"5.."}[5m]))
        latencyP50:
          kind: Panel
          spec:
            display:
              name: Median latency, by app
            plugin:
              kind: TimeSeriesChart
              spec:
                yAxis:
                  format:
                    unit: seconds
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: histogram_quantile(0.5, sum by (service, le) (rate(traefik_service_request_duration_seconds_bucket[5m])))
        latencyP95:
          kind: Panel
          spec:
            display:
              name: p95 latency, by app
            plugin:
              kind: TimeSeriesChart
              spec:
                yAxis:
                  format:
                    unit: seconds
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: histogram_quantile(0.95, sum by (service, le) (rate(traefik_service_request_duration_seconds_bucket[5m])))
        openConnections:
          kind: Panel
          spec:
            display:
              name: Open connections, by entrypoint
            plugin:
              kind: TimeSeriesChart
              spec:
                yAxis:
                  format:
                    unit: decimal
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: sum by (entrypoint) (traefik_entrypoint_open_connections)
        requestRate:
          kind: Panel
          spec:
            display:
              name: Requests per second, by app
            plugin:
              kind: TimeSeriesChart
              spec:
                yAxis:
                  format:
                    unit: decimal
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: sum by (service) (rate(traefik_service_requests_total[5m]))
      layouts:
      - kind: Grid
        spec:
          display:
            title: Traffic through the gateway
          items:
          - x: 0
            "y": 0
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/requestRate"
          - x: 12
            "y": 0
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/errorRate"
          - x: 0
            "y": 8
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/latencyP50"
          - x: 12
            "y": 8
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/latencyP95"
          - x: 0
            "y": 16
            width: 12
            height: 6
            content:
              $ref: "#/spec/panels/certExpiry"
          - x: 12
            "y": 16
            width: 12
            height: 6
            content:
              $ref: "#/spec/panels/openConnections"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: mariadb
    app.kubernetes.io/version: 11.4.5
  name: mariadb
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mariadb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mariadb
        app.kubernetes.io/version: 11.4.5
    spec:
      automountServiceAccountToken: false
      containers:
      - image: lscr.io/linuxserver/mariadb:11.4.5
        name: mariadb
        ports:
        - containerPort: 3306
          name: mariadb
        volumeMounts:
        - mountPath: /config
          name: pvc-volume
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: Europe/Vienna
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: mariadb-creds-secret
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              key: username
              name: mariadb-creds-secret
        - name: MYSQL_DATABASE
          value: booklore
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: mariadb-creds-secret
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 2Gi
      - args:
        - --mysqld.address=localhost:3306
        - --mysqld.username=root
        image: prom/mysqld-exporter:v0.20.0
        name: mysqld-exporter
        ports:
        - containerPort: 9104
          name: mysqld-exporter
        env:
        - name: MYSQLD_EXPORTER_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: mariadb-creds-secret
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
      volumes:
      - name: pvc-volume
        persistentVolumeClaim:
          claimName: mariadb-pvc

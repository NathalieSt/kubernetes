---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-apply-config
  namespace: vault-apply
data:
  placeholders.sh: |
    #!/bin/sh
    # Makes sure every declared KV path exists, without ever writing one that does.
    #
    #   placeholders.sh apply   create each missing path with placeholder values
    #   placeholders.sh check   create nothing; a missing path fails the run
    #
    # Reads one declaration per line from $PLACEHOLDERS (generated by vault-config):
    #
    #   <path> <owner> <key> [<key> ...]
    #
    # Why this is not OpenTofu: a KV entry that a human fills in is not
    # configuration, and managing it as a resource made every apply a negotiation
    # between state and Vault -- a path written by hand before it was declared was a
    # 403 from the create-only policy, and one declared `adopted` was an import that
    # failed whichever order the human did things in. Here the rule is one line:
    # a path that exists is never written. A path that does not exist gets
    # placeholders, with check-and-set 0 so that even a race with a human cannot
    # overwrite a value.
    #
    # What fails the run: Vault unreachable, permission refused, a declared path
    # still missing in `check` mode. What does not: a secret nobody has filled in
    # yet. That is a to-do for a human, not a broken apply, so it is listed on
    # stdout and the run stays green.
    #
    # Secret values are read only to compare them with the placeholder prefix. None
    # is ever printed.

    set -u

    mode="${1:?usage: placeholders.sh apply|check}"
    mount="${KV_MOUNT:-kvv2}"
    prefix="REPLACE ME"

    if [ -z "${VAULT_TOKEN:-}" ]; then
      # The pod's own ServiceAccount token, the same login OpenTofu uses. No
      # credential is stored anywhere.
      VAULT_TOKEN="$(vault write -field=token "auth/${VAULT_AUTH_PATH:-kubernetes}/login" \
        role="${VAULT_ROLE:?}" jwt=@/var/run/secrets/kubernetes.io/serviceaccount/token)" || {
        echo "ERROR: could not log in to Vault" >&2
        exit 1
      }
      export VAULT_TOKEN
    fi

    failed=0
    created=0
    missing=0
    todo=""

    # vault prints "No value found at ..." for a path that does not exist and a
    # "Code: 403" body for a refusal, both with exit status 2 -- so the status
    # alone cannot tell them apart and the message has to.
    exists() {
      out="$(vault kv metadata get -mount="$mount" "$1" 2>&1)"
      status=$?
      if [ "$status" -eq 0 ]; then
        return 0
      fi
      case "$out" in
        *"No value found"*) return 1 ;;
      esac
      echo "ERROR: $1: $out" >&2
      return 2
    }

    while read -r path owner keys; do
      case "$path" in "" | "#"*) continue ;; esac

      exists "$path"
      case $? in
        2)
          failed=1
          continue
          ;;
        1)
          if [ "$mode" = check ]; then
            echo "MISSING $path (owner $owner): the apply creates it"
            missing=$((missing + 1))
            continue
          fi
          # shellcheck disable=SC2086 -- keys is a word list by construction
          set -- $keys
          args=""
          for key in "$@"; do
            args="$args|$key=$prefix — vault kv patch $mount/$path $key=<value>"
          done
          # Word-split on | only, so the placeholder sentence stays one argument.
          old_ifs="$IFS"
          IFS='|'
          # shellcheck disable=SC2086
          set -- ${args#|}
          IFS="$old_ifs"
          if out="$(vault kv put -mount="$mount" -cas=0 "$path" "$@" 2>&1)"; then
            vault kv metadata put -mount="$mount" \
              -custom-metadata=managed-by=vault-apply \
              -custom-metadata=created-as=placeholder \
              -custom-metadata=owner="$owner" \
              "$path" >/dev/null 2>&1 ||
              echo "WARN: $path: created, but its custom metadata was not written" >&2
            echo "CREATED $path (owner $owner)"
            created=$((created + 1))
          else
            # Someone wrote it between the check and the put. The create-only
            # policy refuses a write to an existing path before check-and-set is
            # even evaluated, so this is a 403 -- and the right outcome.
            if exists "$path"; then
              echo "SKIPPED $path: written by someone else a moment ago"
            else
              echo "ERROR: $path: $out" >&2
              failed=1
            fi
          fi
          ;;
      esac

      # Exists, one way or another: list what is still a placeholder or absent.
      # shellcheck disable=SC2086
      set -- $keys
      for key in "$@"; do
        if value="$(vault kv get -mount="$mount" -field="$key" "$path" 2>/dev/null)"; then
          case "$value" in
            "$prefix"*) todo="$todo
      vault kv patch $mount/$path $key=<value>    # $owner: still a placeholder" ;;
          esac
        else
          todo="$todo
      vault kv patch $mount/$path $key=<value>    # $owner: key not present"
        fi
      done
    done < "${PLACEHOLDERS:?}"

    if [ -n "$todo" ]; then
      echo
      echo "Secrets waiting for a human (not an error):$todo"
    fi

    echo
    echo "placeholders: $created created, $missing missing, mode $mode"

    if [ "$failed" -ne 0 ]; then
      exit 1
    fi
    if [ "$mode" = check ] && [ "$missing" -gt 0 ]; then
      exit 2
    fi
    exit 0

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opnsense-backup-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opnsense-backup
  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        cidr: 192.168.1.1/32
    ports:
    - port: 443
      protocol: TCP

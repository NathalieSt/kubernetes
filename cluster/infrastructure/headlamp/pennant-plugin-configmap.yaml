---
apiVersion: v1
kind: ConfigMap
metadata:
  name: headlamp-pennant-plugin
  namespace: headlamp
data:
  main.js: |
    /* Pennant for Headlamp, generated by kubernetes-generator (src/generators/theme/HeadlampTheme.res). */
    (function () {
      var themes = [
      {
        "name": "Pennant",
        "base": "light",
        "primary": "#984a72",
        "secondary": "#f1f4f5",
        "text": {
          "primary": "#2e3436"
        },
        "link": {
          "color": "#984a72"
        },
        "background": {
          "default": "#f9fafb",
          "surface": "#ffffff",
          "muted": "#f1f4f5"
        },
        "sidebar": {
          "background": "#ffffff",
          "color": "#666d71",
          "selectedBackground": "#ffe4f0",
          "selectedColor": "#763757",
          "actionBackground": "#984a72"
        },
        "navbar": {
          "background": "#ffffff",
          "color": "#2e3436"
        },
        "radius": 4,
        "buttonTextTransform": "none"
      },
      {
        "name": "Pennant Dark",
        "base": "dark",
        "primary": "#f5adce",
        "secondary": "#1f2426",
        "text": {
          "primary": "#f1f4f5"
        },
        "link": {
          "color": "#f5adce"
        },
        "background": {
          "default": "#090c0d",
          "surface": "#141819",
          "muted": "#1f2426"
        },
        "sidebar": {
          "background": "#141819",
          "color": "#b8bfc2",
          "selectedBackground": "#371627",
          "selectedColor": "#ffcbe2",
          "actionBackground": "#e68eb8"
        },
        "navbar": {
          "background": "#141819",
          "color": "#f1f4f5"
        },
        "radius": 4,
        "buttonTextTransform": "none"
      }
    ];
      themes.forEach(function (theme) {
        pluginLib.registerAppTheme(theme);
      });
    })();
  package.json: |
    {
      "name": "pennant",
      "version": "1.0.0",
      "description": "Pennant, the homelab palette, as Headlamp app themes",
      "devDependencies": {
        "@kinvolk/headlamp-plugin": "^0.14.0"
      }
    }

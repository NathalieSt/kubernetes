---
apiVersion: v1
kind: ConfigMap
metadata:
  name: headlamp-pennant-plugin
  namespace: headlamp
data:
  main.js: |
    /* Pennant for Headlamp, generated by kubernetes-generator (src/generators/theme/HeadlampTheme.res). */
    (function () {
      var themes = [
      {
        "name": "Pennant",
        "base": "light",
        "primary": "#2c517f",
        "secondary": "#f2f4f6",
        "text": {
          "primary": "#2f3339"
        },
        "link": {
          "color": "#2c517f"
        },
        "background": {
          "default": "#f9fafc",
          "surface": "#ffffff",
          "muted": "#f2f4f6"
        },
        "sidebar": {
          "background": "#ffffff",
          "color": "#484e54",
          "selectedBackground": "#e1eeff",
          "selectedColor": "#1d395b",
          "actionBackground": "#2c517f"
        },
        "navbar": {
          "background": "#ffffff",
          "color": "#2f3339"
        },
        "radius": 6,
        "buttonTextTransform": "none"
      },
      {
        "name": "Pennant Dark",
        "base": "dark",
        "primary": "#a0c9fd",
        "secondary": "#2f3339",
        "text": {
          "primary": "#f2f4f6"
        },
        "link": {
          "color": "#a0c9fd"
        },
        "background": {
          "default": "#15171b",
          "surface": "#202327",
          "muted": "#2f3339"
        },
        "sidebar": {
          "background": "#202327",
          "color": "#d0d5da",
          "selectedBackground": "#10233c",
          "selectedColor": "#c6dfff",
          "actionBackground": "#a0c9fd"
        },
        "navbar": {
          "background": "#202327",
          "color": "#f2f4f6"
        },
        "radius": 6,
        "buttonTextTransform": "none"
      }
    ];
      themes.forEach(function (theme) {
        pluginLib.registerAppTheme(theme);
      });
    })();
  package.json: |
    {
      "name": "pennant",
      "version": "1.0.0",
      "description": "Pennant, the homelab palette, as Headlamp app themes",
      "devDependencies": {
        "@kinvolk/headlamp-plugin": "^0.14.0"
      }
    }

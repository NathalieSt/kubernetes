---
apiVersion: v1
kind: ConfigMap
metadata:
  name: headlamp-halcyon-plugin
  namespace: headlamp
data:
  main.js: |
    /* Pennant for Headlamp, generated by kubernetes-generator (src/generators/theme/HeadlampTheme.res). */
    (function () {
      var themes = [
      {
        "name": "Pennant",
        "base": "light",
        "primary": "#005a66",
        "secondary": "#eaf6fb",
        "text": {
          "primary": "#1a3742"
        },
        "link": {
          "color": "#005a66"
        },
        "background": {
          "default": "#eaf6fb",
          "surface": "#e8f8fb",
          "muted": "#eaf6fb"
        },
        "sidebar": {
          "background": "#e8f8fb",
          "color": "#305360",
          "selectedBackground": "#d5f3f9",
          "selectedColor": "#004049",
          "actionBackground": "#005a66"
        },
        "navbar": {
          "background": "#e8f8fb",
          "color": "#1a3742"
        },
        "radius": 12,
        "buttonTextTransform": "none"
      },
      {
        "name": "Pennant Dark",
        "base": "dark",
        "primary": "#86d4e2",
        "secondary": "#1a3742",
        "text": {
          "primary": "#eaf6fb"
        },
        "link": {
          "color": "#86d4e2"
        },
        "background": {
          "default": "#071a21",
          "surface": "#093842",
          "muted": "#1a3742"
        },
        "sidebar": {
          "background": "#093842",
          "color": "#c0d9e4",
          "selectedBackground": "#00282e",
          "selectedColor": "#b3e7f1",
          "actionBackground": "#b3e7f1"
        },
        "navbar": {
          "background": "#093842",
          "color": "#eaf6fb"
        },
        "radius": 12,
        "buttonTextTransform": "none"
      }
    ];
      themes.forEach(function (theme) {
        pluginLib.registerAppTheme(theme);
      });
    })();
  package.json: |
    {
      "name": "pennant",
      "version": "1.0.0",
      "description": "Pennant, the homelab palette, as Headlamp app themes",
      "devDependencies": {
        "@kinvolk/headlamp-plugin": "^0.14.0"
      }
    }

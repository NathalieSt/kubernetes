---
apiVersion: v1
kind: ConfigMap
metadata:
  name: headlamp-halcyon-plugin
  namespace: headlamp
data:
  main.js: |
    /* Pennant for Headlamp, generated by kubernetes-generator (src/generators/theme/HeadlampTheme.res). */
    (function () {
      var themes = [
      {
        "name": "Pennant",
        "base": "light",
        "primary": "#30323c",
        "secondary": "#f2f3f8",
        "text": {
          "primary": "#30323c"
        },
        "link": {
          "color": "#30323c"
        },
        "background": {
          "default": "#f2f3f8",
          "surface": "#ffffff",
          "muted": "#f2f3f8"
        },
        "sidebar": {
          "background": "#ffffff",
          "color": "#4a4c58",
          "selectedBackground": "#e4e6ed",
          "selectedColor": "#21222a",
          "actionBackground": "#21222a"
        },
        "navbar": {
          "background": "#ffffff",
          "color": "#30323c"
        },
        "radius": 2,
        "buttonTextTransform": "none"
      },
      {
        "name": "Pennant Dark",
        "base": "dark",
        "primary": "#f2f3f8",
        "secondary": "#30323c",
        "text": {
          "primary": "#f2f3f8"
        },
        "link": {
          "color": "#f2f3f8"
        },
        "background": {
          "default": "#15171d",
          "surface": "#21222a",
          "muted": "#30323c"
        },
        "sidebar": {
          "background": "#21222a",
          "color": "#d1d4dd",
          "selectedBackground": "#4a4c58",
          "selectedColor": "#f9fafd",
          "actionBackground": "#f9fafd"
        },
        "navbar": {
          "background": "#21222a",
          "color": "#f2f3f8"
        },
        "radius": 2,
        "buttonTextTransform": "none"
      }
    ];
      themes.forEach(function (theme) {
        pluginLib.registerAppTheme(theme);
      });
    })();
  package.json: |
    {
      "name": "pennant",
      "version": "1.0.0",
      "description": "Pennant, the homelab palette, as Headlamp app themes",
      "devDependencies": {
        "@kinvolk/headlamp-plugin": "^0.14.0"
      }
    }

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
spec:
  interval: 24h
  chartRef:
    kind: HelmChart
    name: headlamp-chart
  timeout: 10m
  releaseName: headlamp
  install:
    remediation:
      retries: 3
  values:
    clusterRoleBinding:
      clusterRoleName: cluster-admin
      create: true
    config:
      extraArgs:
      - -default-light-theme=Pennant
      - -default-dark-theme=Pennant Dark
      inCluster: true
      oidc:
        secret:
          create: false
      unsafeUseServiceAccountToken: true
    fullnameOverride: headlamp
    replicaCount: 1
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 50m
        memory: 128Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      privileged: false
      readOnlyRootFilesystem: true
      runAsGroup: 101
      runAsNonRoot: true
      runAsUser: 100
      seccompProfile:
        type: RuntimeDefault
    service:
      port: 80
      type: ClusterIP
    serviceAccount:
      create: true
      name: headlamp
    volumeMounts:
    - mountPath: /headlamp/plugins/pennant
      name: pennant-plugin
      readOnly: true
    volumes:
    - configMap:
        name: headlamp-pennant-plugin
      name: pennant-plugin
  driftDetection:
    mode: warn

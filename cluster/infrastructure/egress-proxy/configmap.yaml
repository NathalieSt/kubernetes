---
apiVersion: v1
kind: ConfigMap
metadata:
  name: egress-proxy-config
data:
  filter: |
    ^open-vsx\.org$
    ^[a-z0-9_-]+\.open-vsx\.org$
    ^[a-z0-9_-]+\.blob\.core\.windows\.net$
    ^code\.netbird\.nathalie-stiefsohn\.eu$
    ^github\.com$
    ^[a-z0-9_-]+\.github\.com$
    ^[a-z0-9_-]+\.githubusercontent\.com$
    ^codeberg\.org$
    ^[a-z0-9_-]+\.codeberg\.org$
    ^[a-z0-9_-]+\.npmjs\.org$
    ^pypi\.org$
    ^[a-z0-9_-]+\.pythonhosted\.org$
    ^crates\.io$
    ^[a-z0-9_-]+\.crates\.io$
    ^[a-z0-9_-]+\.golang\.org$
    ^[a-z0-9_-]+\.rubygems\.org$
    ^[a-z0-9_-]+\.debian\.org$
    ^[a-z0-9_-]+\.ubuntu\.com$
    ^[a-z0-9_-]+\.alpinelinux\.org$
  tinyproxy.conf: |
    # Generated by kubernetes-generator's egress-proxy. Edit the generator.
    Port 8888
    Timeout 600
    MaxClients 200

    # Logged at Connect level so every host a developer pod reached, and every host
    # it was refused, is in this pod's log — and from there in VictoriaLogs.
    LogLevel Connect

    # Only the pod network may use this at all. The NetworkPolicy narrows it to the
    # declared clients; this is the backstop if that policy is ever missing.
    Allow 10.42.0.0/16

    DisableViaHeader Yes

    Filter "/etc/tinyproxy/filter"
    FilterType ere
    FilterURLs Off
    FilterCaseSensitive No
    FilterDefaultDeny Yes

    # CONNECT tunnels only to HTTPS. Without any ConnectPort line tinyproxy tunnels
    # to every port, which would turn an allowed host into an allowed host on 22,
    # 25 or anything else it listens on.
    ConnectPort 443

---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: pharos
    app.kubernetes.io/version: 15b2ead
  name: pharos
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pharos
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pharos
        app.kubernetes.io/version: 15b2ead
    spec:
      imagePullSecrets:
      - name: forgejo-registry-secret
      serviceAccountName: pharos
      enableServiceLinks: false
      containers:
      - image: code.netbird.nathalie-stiefsohn.eu/my-homelab/pharos:15b2ead@sha256:6928317538197a50bf82829dfc02c5f8cb1bd09606bcd2d051d226ba53e3fa8b
        name: pharos
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: WEB_ADDR
          value: :8080
        - name: PHAROS_STATIC_ROOT
          value: /app/ui/dist
        - name: PHAROS_ADMIN_GROUP
          value: admins
        - name: PHAROS_VL_URL
          value: http://victoria-logs.victoria-logs.svc.cluster.local:9428
        - name: PHAROS_VM_URL
          value: http://vmsingle-victoria-metrics-vmks.victoria-metrics.svc.cluster.local:8428
        - name: PHAROS_DEBUG_IMAGE
          value: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
        - name: PHAROS_OIDC_AUTHORITY
          value: https://auth.netbird.nathalie-stiefsohn.eu
        - name: PHAROS_OIDC_CLIENT_ID
          value: pharos
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        securityContext:
          capabilities:
            drop:
            - ALL
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

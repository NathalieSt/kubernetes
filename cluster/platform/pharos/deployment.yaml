---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: pharos
    app.kubernetes.io/version: ad99e4f
  name: pharos
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pharos
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pharos
        app.kubernetes.io/version: ad99e4f
    spec:
      imagePullSecrets:
      - name: forgejo-registry-secret
      serviceAccountName: pharos
      enableServiceLinks: false
      containers:
      - image: code.netbird.nathalie-stiefsohn.eu/my-homelab/pharos:ad99e4f@sha256:9251131f3e1b24d6141044f6112908068304dfff9550c223eca189aa6c555c22
        name: pharos
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: WEB_ADDR
          value: :8080
        - name: PHAROS_STATIC_ROOT
          value: /app/ui/dist
        - name: PHAROS_ADMIN_GROUP
          value: admins
        - name: PHAROS_VL_URL
          value: http://victoria-logs.victoria-logs.svc.cluster.local:9428
        - name: PHAROS_OIDC_AUTHORITY
          value: https://auth.netbird.nathalie-stiefsohn.eu
        - name: PHAROS_OIDC_CLIENT_ID
          value: pharos
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        securityContext:
          capabilities:
            drop:
            - ALL
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

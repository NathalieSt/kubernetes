---
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/instance: anki-sync
    app.kubernetes.io/name: restore-drill
  name: restore-drill-anki-sync
spec:
  schedule: 30 10 1 * *
  timeZone: Europe/Vienna
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/instance: anki-sync
            app.kubernetes.io/name: restore-drill
        spec:
          imagePullSecrets:
          - name: forgejo-registry-secret
          initContainers:
          - command:
            - /backup-dashboard
            - drill
            - --namespace
            - anki-sync
            - --target
            - /scratch
            image: code.netbird.nathalie-stiefsohn.eu/my-homelab/backup-dashboard:538e8c7@sha256:5cf8fe6d1a0c2542bd9a244d4d6b99a8b7084d85f8ce2f1d565f8c5c6b4e2e03
            name: restore
            volumeMounts:
            - mountPath: /scratch
              name: scratch
            - mountPath: /secrets/restic-seed
              name: restic-seed
            - mountPath: /secrets/restic-overrides
              name: restic-overrides
            - mountPath: /secrets/garage-key
              name: garage-key
            resources:
              requests:
                cpu: 100m
                ephemeral-storage: 4Gi
                memory: 128Mi
              limits:
                memory: 1Gi
            securityContext:
              capabilities:
                drop:
                - ALL
              allowPrivilegeEscalation: false
          - command:
            - python3
            - /drill/drill-sqlite.py
            image: python:3.14-alpine@sha256:016508ba505da24f7139765bc4bb669df4e88eb2f12eeadd571bf2f88d7533df
            name: sqlite
            volumeMounts:
            - mountPath: /scratch
              name: scratch
            - mountPath: /drill
              name: scripts
            env:
            - name: SCRATCH
              value: /scratch
            - name: HOME
              value: /scratch
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              capabilities:
                drop:
                - ALL
              allowPrivilegeEscalation: false
          - command:
            - sh
            - /drill/drill-git.sh
            image: alpine/git:v2.52.0@sha256:4a0e72d49596a1f5d3701aeedafdadc5c0da4062be4657c7bdc4017387f591cc
            name: git
            volumeMounts:
            - mountPath: /scratch
              name: scratch
            - mountPath: /drill
              name: scripts
            env:
            - name: SCRATCH
              value: /scratch
            - name: HOME
              value: /scratch
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              capabilities:
                drop:
                - ALL
              allowPrivilegeEscalation: false
          - command:
            - sh
            - /drill/drill-postgres.sh
            image: ghcr.io/cloudnative-pg/postgresql:18.6@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533
            name: postgres
            volumeMounts:
            - mountPath: /scratch
              name: scratch
            - mountPath: /drill
              name: scripts
            env:
            - name: SCRATCH
              value: /scratch
            - name: HOME
              value: /scratch
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 2Gi
            securityContext:
              capabilities:
                drop:
                - ALL
              allowPrivilegeEscalation: false
          automountServiceAccountToken: false
          enableServiceLinks: false
          containers:
          - command:
            - cat
            - /scratch/drill.json
            image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
            name: report
            volumeMounts:
            - mountPath: /scratch
              name: scratch
            resources:
              limits:
                memory: 16Mi
            securityContext:
              capabilities:
                drop:
                - ALL
              allowPrivilegeEscalation: false
          volumes:
          - name: scratch
            emptyDir:
              sizeLimit: 30Gi
          - name: scripts
            configMap:
              name: backup-dashboard-drill-scripts
          - name: restic-seed
            secret:
              secretName: restic-seed-password-secret
          - name: restic-overrides
            secret:
              secretName: restic-override-passwords-secret
              optional: true
          - name: garage-key
            secret:
              secretName: garage-backup-access-key-secret
          securityContext:
            fsGroup: 26
            runAsUser: 26
            runAsGroup: 26
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          restartPolicy: Never
      activeDeadlineSeconds: 14400
---

---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: start-page
    app.kubernetes.io/version: 9ca912b
  name: start-page
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: start-page
  template:
    metadata:
      labels:
        app.kubernetes.io/name: start-page
        app.kubernetes.io/version: 9ca912b
    spec:
      imagePullSecrets:
      - name: forgejo-registry-secret
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
      - image: code.netbird.nathalie-stiefsohn.eu/my-homelab/start-page:9ca912b@sha256:cd1273bf0b4a764d6d7d3d5fbf1d9327ad2ef25f2883493f0d8a6981c19974fe
        name: start-page
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - mountPath: /etc/start-page/facts
          name: facts
          readOnly: true
        env:
        - name: START_PAGE_VM_URL
          value: http://vmsingle-victoria-metrics-vmks.victoria-metrics.svc.cluster.local:8428
        - name: WEB_ADDR
          value: :8080
        - name: START_PAGE_FACTS_FILE
          value: /etc/start-page/facts/facts.json
        resources:
          requests:
            cpu: 25m
            memory: 96Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          capabilities:
            drop:
            - ALL
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 10
      volumes:
      - name: facts
        configMap:
          name: start-page-facts
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: waking-page
  name: waking-page
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: waking-page
  template:
    metadata:
      labels:
        app.kubernetes.io/name: waking-page
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
      - command:
        - nginx
        - -c
        - /etc/nginx/nginx.conf
        - -g
        - daemon off;
        image: nginx@sha256:a5688ea5d06cccc298505dddac20e8e28bfe7de67b015a374006593bc23700b1
        name: waking-page
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          name: nginx-config-volume
          readOnly: true
        - mountPath: /tmp
          name: tmp-volume
        - mountPath: /usr/share/nginx/html
          name: page
          readOnly: true
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        securityContext:
          capabilities:
            drop:
            - ALL
          runAsUser: 101
          runAsGroup: 101
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
      volumes:
      - name: nginx-config-volume
        configMap:
          name: waking-page-nginx-config
      - name: tmp-volume
        emptyDir: {}
      - name: page
        configMap:
          name: waking-page-page
      securityContext:
        seccompProfile:
          type: RuntimeDefault

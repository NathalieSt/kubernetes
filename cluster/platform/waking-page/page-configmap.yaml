---
apiVersion: v1
kind: ConfigMap
metadata:
  name: waking-page-page
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Starting…</title>
    <style>
    :root {
      --bg: #eaf6fb; --surface: #e8f8fb; --border: #d8eaf1;
      --text: #1a3742; --muted: #305360; --primary: #005a66;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #071a21; --surface: #093842; --border: #305360;
        --text: #eaf6fb; --muted: #c0d9e4; --primary: #86d4e2;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; padding: 16px;
      background: var(--bg); color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main {
      width: 100%; max-width: 30rem; padding: 28px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    }
    h1 { margin: 0 0 8px; font-size: 1.25rem; overflow-wrap: anywhere; }
    p { margin: 0 0 12px; }
    .muted { color: var(--muted); font-size: 0.9rem; margin: 0; }
    .bar { height: 4px; margin: 20px 0; overflow: hidden; background: var(--border); border-radius: 999px; }
    .bar::after {
      content: ""; display: block; width: 40%; height: 100%;
      background: var(--primary); border-radius: 999px; animation: slide 1.4s ease-in-out infinite;
    }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { .bar::after { animation: none; width: 100%; } }
    </style>
    </head>
    <body>
    <main>
      <h1><span id="host">This app</span> is starting</h1>
      <p>It was asleep because nobody had used it for a while, and your request has woken it.
      This page reloads by itself and becomes the app once it answers, usually within two minutes.</p>
      <div class="bar" role="progressbar" aria-label="Starting"></div>
      <p class="muted" id="waited">Waiting…</p>
      <noscript><p class="muted">Reload the page in a minute.</p></noscript>
    </main>
    <script>
    (function () {
      var key = "waking-since";
      var since = Date.now();
      try {
        since = Number(sessionStorage.getItem(key)) || since;
        sessionStorage.setItem(key, String(since));
      } catch (e) {}
      document.getElementById("host").textContent = location.hostname.split(".")[0];
      var waited = document.getElementById("waited");
      function show() {
        var seconds = Math.round((Date.now() - since) / 1000);
        waited.textContent = seconds < 300
          ? "Waiting for " + seconds + " s."
          : "Waiting for " + Math.round(seconds / 60) + " minutes: it is not starting. The app answered with an error or not at all.";
      }
      show();
      setInterval(show, 1000);
      setTimeout(function () { location.reload(); }, 5000);
    })();
    </script>
    </body>
    </html>

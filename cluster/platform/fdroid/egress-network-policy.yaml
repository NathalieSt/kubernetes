---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fdroid-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fdroid
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: forgejo
      podSelector:
        matchLabels:
          app.kubernetes.io/name: forgejo
    ports:
    - port: 3000
      protocol: TCP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: fleet
    app.kubernetes.io/version: b82a152
  name: fleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fleet
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        checksum/config: 56937ba270d1a4a5
      labels:
        app.kubernetes.io/name: fleet
        app.kubernetes.io/version: b82a152
    spec:
      imagePullSecrets:
      - name: forgejo-registry-secret
      initContainers:
      - command:
        - sh
        - -c
        - mkdir -p /var/lib/fleet/salt-files/_modules && chown 1000:1000 /var/lib/fleet /var/lib/fleet/salt-files /var/lib/fleet/salt-files/_modules /run/salt && umask 077 && printf '%s:%s\n' "$SALT_USER" "$SALT_PASSWORD" > /run/salt-auth/users && chown 1000:1000 /run/salt-auth/users
        image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
        name: setup
        volumeMounts:
        - mountPath: /var/lib/fleet
          name: fleet-data-pvc
        - mountPath: /run/salt
          name: salt-run
        - mountPath: /run/salt-auth
          name: salt-auth
        env:
        - name: SALT_USER
          value: fleetui
        - name: SALT_PASSWORD
          valueFrom:
            secretKeyRef:
              key: salt-password
              name: fleet-secret
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
      - image: code.netbird.nathalie-stiefsohn.eu/my-homelab/fleet:b82a152@sha256:f645565c345f0ad338273fe4995ee64b5b92708b5f9000b8340ed512d47cd621
        name: fleet
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - mountPath: /var/lib/fleet
          name: fleet-data-pvc
        - mountPath: /tmp
          name: tmp
        env:
        - name: WEB_ADDR
          value: :8080
        - name: NODE_ENV
          value: production
        - name: SALT_API_URL
          value: http://127.0.0.1:8000
        - name: SALT_USERNAME
          value: fleetui
        - name: SALT_PASSWORD
          valueFrom:
            secretKeyRef:
              key: salt-password
              name: fleet-secret
        - name: SALT_EAUTH
          value: file
        - name: OIDC_AUTHORITY
          value: https://auth.netbird.nathalie-stiefsohn.eu
        - name: OIDC_CLIENT_ID
          value: fleet
        - name: FLEET_ADMIN_GROUP
          value: admins
        - name: FLEET_ALLOW_DESTRUCTIVE
          value: "1"
        - name: FLEET_ALLOW_MODULES
          value: "1"
        - name: FLEET_MODULES_DIR
          value: /var/lib/fleet/modules
        - name: FLEET_SALT_FILES_DIR
          value: /var/lib/fleet/salt-files
        - name: FLEET_MODULES_PASSWORD_HASH
          valueFrom:
            secretKeyRef:
              key: modules-password-hash
              name: fleet-secret
              optional: true
        - name: FLEET_MASTER_HOST
          value: fleet.netbird.nathalie-stiefsohn.eu
        - name: FLEET_SALT_VERSION
          value: "3008.3"
        - name: FLEET_DATA_DIR
          value: /var/lib/fleet/audit
        - name: FLEET_SCRIPTS_DIR
          value: /var/lib/fleet/scripts
        - name: TZ
          value: Europe/Vienna
        resources:
          requests:
            cpu: 25m
            memory: 96Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          capabilities:
            drop:
            - ALL
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
      - args:
        - -c
        - /etc/salt
        - -l
        - info
        image: code.netbird.nathalie-stiefsohn.eu/my-homelab/salt-master:1001d96@sha256:8b24f4146b6467f79048cf77dac39f0751156b377904ebb3e560f376bd037c1e
        name: salt-master
        ports:
        - containerPort: 4505
          name: salt-publish
        - containerPort: 4506
          name: salt-return
        volumeMounts:
        - mountPath: /etc/salt
          name: fleet-salt-config
          readOnly: true
        - mountPath: /var/lib/fleet
          name: fleet-data-pvc
        - mountPath: /run/salt
          name: salt-run
        - mountPath: /run/salt-auth
          name: salt-auth
          readOnly: true
        - mountPath: /tmp
          name: tmp
        - mountPath: /srv/salt/states
          name: fleet-salt-states
          readOnly: true
        - mountPath: /srv/salt/pillar
          name: fleet-salt-pillar
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 320Mi
          limits:
            cpu: 1000m
            memory: 768Mi
        securityContext:
          capabilities:
            drop:
            - ALL
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
      - args:
        - -c
        - /etc/salt
        - -l
        - info
        command:
        - salt-api
        image: code.netbird.nathalie-stiefsohn.eu/my-homelab/salt-master:1001d96@sha256:8b24f4146b6467f79048cf77dac39f0751156b377904ebb3e560f376bd037c1e
        name: salt-api
        volumeMounts:
        - mountPath: /etc/salt
          name: fleet-salt-config
          readOnly: true
        - mountPath: /var/lib/fleet
          name: fleet-data-pvc
        - mountPath: /run/salt
          name: salt-run
        - mountPath: /run/salt-auth
          name: salt-auth
          readOnly: true
        - mountPath: /tmp
          name: tmp
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          capabilities:
            drop:
            - ALL
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
      volumes:
      - name: fleet-data-pvc
        persistentVolumeClaim:
          claimName: fleet-data-pvc
      - name: fleet-salt-config
        configMap:
          name: fleet-salt-config
      - name: fleet-salt-states
        configMap:
          name: fleet-salt-states
          items:
          - key: inotify.sls
            path: inotify.sls
          - key: netbird.sls
            path: netbird.sls
          - key: rescue__earlyoom.sls
            path: rescue/earlyoom.sls
          - key: rescue__init.sls
            path: rescue/init.sls
          - key: rescue__mesh-watch.sh
            path: rescue/mesh-watch.sh
          - key: rescue__mesh.sls
            path: rescue/mesh.sls
          - key: rescue__reserve.sls
            path: rescue/reserve.sls
          - key: rescue__watchdog.sls
            path: rescue/watchdog.sls
      - name: fleet-salt-pillar
        configMap:
          name: fleet-salt-pillar
          items:
          - key: netbird.sls
            path: netbird.sls
          - key: rescue.sls
            path: rescue.sls
          - key: top.sls
            path: top.sls
      - name: salt-run
        emptyDir: {}
      - name: salt-auth
        emptyDir:
          medium: Memory
      - name: tmp
        emptyDir: {}
      securityContext:
        seccompProfile:
          type: RuntimeDefault

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fleet-salt-config
data:
  master: |
    # The Salt master and salt-api, beside Fleet in one pod. Paths are set explicitly: several
    # defaults sit under /var/cache and /var/log, which the non-root image cannot write.
    user: salt
    # Salt 3008 names the master key `<id>.pem`, and the id defaults to the pod name: without
    # this every rollout gave the master a new key, which every enrolled minion refuses.
    id: fleet
    interface: 0.0.0.0
    pki_dir: /var/lib/fleet/salt/pki
    cachedir: /var/lib/fleet/salt/cache
    sqlite_queue_dir: /var/lib/fleet/salt/cache/queues
    extension_modules: /var/lib/fleet/salt/cache/extmods
    sock_dir: /run/salt/master
    pidfile: /run/salt/salt-master.pid
    log_file: /dev/stdout
    key_logfile: /dev/stdout
    api_pidfile: /run/salt/salt-api.pid
    api_logfile: /dev/stdout

    # Five by default, ~440 MB idle; two serve a handful of hosts.
    worker_threads: 2

    # Keys are accepted one at a time, in Fleet's Keys tab.
    auto_accept: False
    open_mode: False

    # The second root is Fleet's: the execution modules it publishes, as `_modules/fleet_*.py`.
    file_roots:
      base: [/srv/salt/states, /var/lib/fleet/salt-files]
    pillar_roots:
      base: [/srv/salt/pillar]
    # The kubelet keeps a ConfigMap's files in `..data` and a dated `..<timestamp>` copy, which
    # would otherwise be listed as states of their own.
    file_ignore_regex:
      - '(^|/)\.\.'

    # On loopback only: the BFF is the one client, in the same pod. Salt 3006+ enables no
    # netapi client by default; `local`, the blocking one, stays off.
    netapi_enable_clients: [local_async, runner, wheel]
    rest_cherrypy:
      host: 127.0.0.1
      port: 8000
      disable_ssl: True

    # The account Fleet signs in as in OIDC mode; FleetMeta.saltUser. Keep the functions in
    # step with fleet-management-ui's bff/src/allowlist: where they disagree, this wins.
    external_auth:
      file:
        ^filename: /run/salt-auth/users
        fleetui:
          - "*":
              - test.ping
              - test.version
              - grains.items
              - grains.item
              - status.uptime
              - status.loadavg
              - status.meminfo
              - disk.usage
              - network.interfaces
              - pkg.list_upgrades
              - pkg.version
              - service.status
              - state.apply
              - service.restart
              - pkg.upgrade
              - system.reboot
              # Modules written in Fleet: syncing them, and calling theirs and nobody else's. Salt
              # matches a grant with re.match, so the `$` is what stops a longer name.
              - saltutil.sync_modules
              - 'fleet_[a-z][a-z0-9_]*\.[a-z_][a-z0-9_]*$'
              # One path only: Debian's "a reboot is waiting" flag, for the health sweep.
              - file.file_exists:
                  args:
                    - ^/var/run/reboot-required$
          - "@wheel":
              - key.list_all
              - key.accept
              - key.reject
              - key.delete
              # Public-key fingerprints, compared with the host's before a key is accepted.
              - key.finger
              - key.finger_master
          - "@runner":
              - jobs.list_jobs
              - jobs.list_job
              - cache.grains
              # The states Fleet offers: file names under file_roots, never their contents.
              - fileserver.file_list
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fleet-salt-states
data:
  inotify.sls: |
    {#- Debian allows root 128 inotify instances, and k3s takes about one per container: `debian`
        sat at 128 of 128 on 2026-10-18 and clavis' Tauri build died with "Too many open files". #}
    fs.inotify.max_user_instances:
      sysctl.present:
        - value: 1024
  netbird.sls: |
    {#- The NetBird client at the version pinned in pillar/netbird.sls. Run from Fleet as
        `state.apply netbird`: one canary first, the gateway's own NetBird never. #}
    {%- set version = salt['pillar.get']('netbird:version') %}
    {%- if grains['os_family'] == 'Debian' %}

    {#- The same file, keyring and line as NetBird's install.sh writes, so a host installed
        that way is adopted rather than given a second source apt refuses. #}
    netbird-repo:
      pkgrepo.managed:
        - name: deb [signed-by=/usr/share/keyrings/netbird-archive-keyring.gpg] https://pkgs.netbird.io/debian stable main
        - file: /etc/apt/sources.list.d/netbird.list
        - key_url: https://pkgs.netbird.io/debian/public.key
        - signedby: /usr/share/keyrings/netbird-archive-keyring.gpg
        - aptkey: False

    {#- The package's postinst stops and restarts the daemon itself, so the mesh drops for a
        moment here; the minion keeps running and reports once it is back. #}
    netbird:
      pkg.installed:
        - version: {{ version }}
        - hold: False
        - require:
          - pkgrepo: netbird-repo

    {%- else %}

    netbird-unmanaged:
      test.show_notification:
        - text: NetBird on {{ grains['os'] }} is not managed by Salt; install {{ version }} by hand.

    {%- endif %}
  rescue__earlyoom.sls: |
    {#- Kills the largest process before the machine thrashes; the kubelet's eviction comes
        first, this is for what grows faster than it looks. Locked in memory, so it still runs. #}
    {%- set percent = salt['pillar.get']('rescue:earlyoom:memory_percent') %}
    {%- if grains['os_family'] == 'Debian' %}

    {#- No quotes and no spaces in the pattern: systemd splits the value into arguments. It
        matches a process's `comm`, 15 characters at most. #}
    earlyoom:
      pkg.installed: []
      file.managed:
        - name: /etc/default/earlyoom
        - contents: |
            # Managed by Salt (rescue.earlyoom); edit the pillar in kubernetes-generator.
            EARLYOOM_ARGS="-m {{ percent }} -r 3600 --avoid ^(systemd|sshd|k3s-agent|k3s-server|containerd|containerd-shim|netbird|cilium-agent)$"
        - require:
          - pkg: earlyoom
      service.running:
        - enable: True
        - watch:
          - file: earlyoom

    {%- else %}

    earlyoom-unmanaged:
      test.show_notification:
        - text: earlyoom on {{ grains['os'] }} is not managed by Salt.

    {%- endif %}
  rescue__init.sls: |
    {#- Everything a host needs to get out of trouble by itself. Each part applies alone too:
        `state.apply rescue.earlyoom`. One canary first, as for `netbird`. #}
    include:
      - rescue.reserve
      - rescue.earlyoom
      - rescue.watchdog
      - rescue.mesh
  rescue__mesh-watch.sh: |
    #!/bin/sh
    # Restarts NetBird after $MESH_WATCH_FAILURES checks in a row with peers known and none
    # connected, or with no answer from the daemon. Run by mesh-watch.timer (Salt: rescue.mesh).
    set -u

    limit="${MESH_WATCH_FAILURES:-5}"
    count_file=/run/mesh-watch.failures

    # Stopped on purpose is not a fault.
    systemctl is-enabled --quiet netbird || exit 0

    status=$(netbird status --json 2>/dev/null | tr -d ' \n\t')
    total=$(printf '%s' "$status" | grep -o '"peers":{"total":[0-9]*' | grep -o '[0-9]*$')
    connected=$(printf '%s' "$status" | grep -o '"peers":{"total":[0-9]*,"connected":[0-9]*' | grep -o '[0-9]*$')

    # Management being down is not counted: a restart would drop the tunnels still standing.
    if [ -n "$total" ] && { [ "$total" -eq 0 ] || [ "${connected:-0}" -gt 0 ]; }; then
      rm -f "$count_file"
      exit 0
    fi

    seen="${connected:-0} of $total peers connected"
    [ -n "$total" ] || seen="no answer from the daemon"
    count=$(( $(cat "$count_file" 2>/dev/null || echo 0) + 1 ))
    if [ "$count" -lt "$limit" ]; then
      echo "$count" > "$count_file"
      echo "mesh-watch: $seen, check $count of $limit"
      exit 0
    fi

    rm -f "$count_file"
    echo "mesh-watch: $seen for $limit checks, restarting netbird"
    systemctl restart netbird
  rescue__mesh.sls: |
    {#- Restarts a NetBird client that knows peers and reaches none: the state the gateway's
        sidecar sat in for fifteen hours on 2026-09-15. The check is rescue/mesh-watch.sh. #}
    {%- set failures = salt['pillar.get']('rescue:mesh:failures') %}
    {%- if salt['service.available']('netbird') %}

    mesh-watch-script:
      file.managed:
        - name: /usr/local/sbin/mesh-watch
        - source: salt://rescue/mesh-watch.sh
        - mode: '0755'

    mesh-watch-service:
      file.managed:
        - name: /etc/systemd/system/mesh-watch.service
        - contents: |
            # Managed by Salt (rescue.mesh).
            [Unit]
            Description=Restart NetBird when it reaches no peer
            After=netbird.service

            [Service]
            Type=oneshot
            Environment=MESH_WATCH_FAILURES={{ failures }}
            ExecStart=/usr/local/sbin/mesh-watch

    mesh-watch-timer:
      file.managed:
        - name: /etc/systemd/system/mesh-watch.timer
        - contents: |
            # Managed by Salt (rescue.mesh).
            [Unit]
            Description=Check the NetBird mesh every two minutes

            [Timer]
            OnBootSec=5min
            OnUnitActiveSec=2min

            [Install]
            WantedBy=timers.target
      cmd.run:
        - name: systemctl daemon-reload
        - onchanges:
          - file: mesh-watch-service
          - file: mesh-watch-timer
      service.running:
        - name: mesh-watch.timer
        - enable: True
        - require:
          - file: mesh-watch-script
          - cmd: mesh-watch-timer

    {%- else %}

    mesh-watch-skipped:
      test.show_notification:
        - text: No netbird service on this host; nothing to watch.

    {%- endif %}
  rescue__reserve.sls: |
    {#- Memory the kubelet may not hand to pods. Without it allocatable is the whole machine
        and a pod that grows freezes the node (ai-node, 2026-10-11) instead of being evicted. #}
    {%- set reserve = salt['pillar.get']('rescue:reserve') %}
    {%- set unit = 'k3s' if salt['service.available']('k3s') else 'k3s-agent' %}
    {%- if salt['service.available'](unit) %}

    {#- `kubelet-arg+` appends to what config.yaml sets. eviction-hard replaces k3s's own, so
        its two disk thresholds are repeated here. #}
    k3s-memory-reserve:
      file.managed:
        - name: /etc/rancher/k3s/config.yaml.d/50-memory-reserve.yaml
        - makedirs: True
        - mode: '0600'
        - contents: |
            # Managed by Salt (rescue.reserve); edit the pillar in kubernetes-generator.
            kubelet-arg+:
              - "system-reserved=memory={{ reserve['system_memory'] }}"
              - "kube-reserved=memory={{ reserve['kube_memory'] }}"
              - "eviction-hard=memory.available<{{ reserve['evict_below'] }},imagefs.available<5%,nodefs.available<5%"

    {#- Not restarted here: three servers restarting at once is etcd without a quorum. #}
    k3s-memory-reserve-pending:
      test.show_notification:
        - text: Written. It applies once {{ unit }} restarts; run service.restart {{ unit }} from Fleet, one host at a time.
        - onchanges:
          - file: k3s-memory-reserve

    {%- else %}

    k3s-memory-reserve-skipped:
      test.show_notification:
        - text: No k3s service on this host; nothing to reserve.

    {%- endif %}
  rescue__watchdog.sls: |
    {#- systemd pings the hardware watchdog; a machine too far gone to do that is reset by it.
        `daemon-reexec` makes PID 1 read the setting without a reboot. #}
    {%- set watchdog = salt['pillar.get']('rescue:watchdog') %}
    {%- if salt['file.is_chrdev']('/dev/watchdog0') %}

    systemd-watchdog:
      file.managed:
        - name: /etc/systemd/system.conf.d/10-watchdog.conf
        - makedirs: True
        - contents: |
            # Managed by Salt (rescue.watchdog); edit the pillar in kubernetes-generator.
            [Manager]
            RuntimeWatchdogSec={{ watchdog['runtime'] }}
            RebootWatchdogSec={{ watchdog['reboot'] }}
      cmd.run:
        - name: systemctl daemon-reexec
        - onchanges:
          - file: systemd-watchdog

    {%- else %}

    systemd-watchdog-absent:
      test.show_notification:
        - text: No /dev/watchdog0 on this host. Load its watchdog driver first (iTCO_wdt on Intel; Debian does not load it by itself).

    {%- endif %}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fleet-salt-pillar
data:
  netbird.sls: |
    # The NetBird client every Debian host is brought to by `state.apply netbird`. Must exist
    # for amd64 and arm64 in pkgs.netbird.io, and not be newer than the coordination server.
    netbird:
      version: 0.79.0
  rescue.sls: |
    # What `state.apply rescue` sets on every host, so that a host in trouble recovers without
    # anyone reaching it. https://docs.netbird.nathalie-stiefsohn.eu/platform/hosts/#rescue
    rescue:
      # Memory the kubelet keeps away from pods, and the free memory under which it evicts one.
      reserve:
        system_memory: 400Mi
        kube_memory: 400Mi
        evict_below: 500Mi
      # Percent of memory left at which earlyoom kills the largest process: below the kubelet's.
      earlyoom:
        memory_percent: 4
      # A Pi 5's watchdog takes at most 15s; systemd pings it at half of this.
      watchdog:
        runtime: 15s
        reboot: 10min
      # Checks two minutes apart with peers known and none connected before NetBird restarts.
      mesh:
        failures: 5
  top.sls: |
    base:
      "*":
        - netbird
        - rescue

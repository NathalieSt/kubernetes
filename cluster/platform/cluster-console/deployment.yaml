---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: cluster-console
    app.kubernetes.io/version: ced5e5e
  name: cluster-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cluster-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cluster-console
        app.kubernetes.io/version: ced5e5e
    spec:
      imagePullSecrets:
      - name: forgejo-registry-secret
      serviceAccountName: cluster-console
      enableServiceLinks: false
      containers:
      - image: code.netbird.nathalie-stiefsohn.eu/my-homelab/cluster-console:ced5e5e@sha256:8da9d056cb8cebbc95fd51b84de956d7699a28265d974c5566dddf22da2efff5
        name: cluster-console
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: WEB_ADDR
          value: :8080
        - name: CLUSTER_CONSOLE_STATIC_ROOT
          value: /app/ui/dist
        - name: CLUSTER_CONSOLE_ADMIN_GROUP
          value: admins
        - name: CLUSTER_CONSOLE_VL_URL
          value: http://victoria-logs.victoria-logs.svc.cluster.local:9428
        - name: CLUSTER_CONSOLE_VM_URL
          value: http://vmsingle-victoria-metrics-vmks.victoria-metrics.svc.cluster.local:8428
        - name: CLUSTER_CONSOLE_DEBUG_IMAGE
          value: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
        - name: CLUSTER_CONSOLE_OIDC_AUTHORITY
          value: https://auth.netbird.nathalie-stiefsohn.eu
        - name: CLUSTER_CONSOLE_OIDC_CLIENT_ID
          value: cluster-console
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        securityContext:
          capabilities:
            drop:
            - ALL
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

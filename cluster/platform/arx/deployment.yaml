---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: arx
    app.kubernetes.io/version: f379b63
  name: arx
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: arx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arx
        app.kubernetes.io/version: f379b63
    spec:
      imagePullSecrets:
      - name: forgejo-registry-secret
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
      - image: code.netbird.nathalie-stiefsohn.eu/my-homelab/arx:f379b63@sha256:f841c793fb523eab305afe8d2cb4b1329a08493c0d82c008342313842e0f202a
        name: arx
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - mountPath: /etc/arx/facts
          name: facts
          readOnly: true
        env:
        - name: ARX_VM_URL
          value: http://vmsingle-victoria-metrics-vmks.victoria-metrics.svc.cluster.local:8428
        - name: WEB_ADDR
          value: :8080
        - name: ARX_FACTS_FILE
          value: /etc/arx/facts/facts.json
        resources:
          requests:
            cpu: 25m
            memory: 96Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          capabilities:
            drop:
            - ALL
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 10
      volumes:
      - name: facts
        configMap:
          name: arx-facts
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      --color-background-gradient-third: #656874;
      --color-background: #ffffff;
      --color-text: #30323c;
      --color-link: #30323c;
      --color-menu-accent: #30323c;
      --color-background-code: #f2f3f8;
      --color-error: #783d28;
      --color-error-input: #ffe7df;
      --color-error-list: #783d28;
      --color-table-background: #ffffff;

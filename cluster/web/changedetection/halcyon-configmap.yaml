      --color-background-button-green: #1d5d40;
      --color-background-button-red: #783d28;
      --color-background-button-success: #1d5d40;
      --color-background-button-error: #783d28;
      --color-background-button-warning: #624d0e;
      --color-background-button-secondary: #2c517f;
      --color-background-button-cancel: #4c7281;
      --color-background-button-tag: #4c7281;
      --color-background-button-tag-active: #305360;
      --color-background-snapshot-age: #d8eaf1;
      --color-error-background-snapshot-age: #783d28;
      --color-border-notification: #d8eaf1;
      --color-warning: #624d0e;
      --color-link-new-version: #005a66;
      --color-last-checked: #4c7281;
      --color-text-footer: #305360;
      --color-border-watch-table-cell: #d8eaf1;
      --color-text-watch-tag-list: #005a6666;
      --color-border-input: #4c7281;
      --color-shadow-input: #d8eaf1;
      --color-background-input: #e8f8fb;
      --color-text-input-description: #305360;
      --color-text-input-placeholder: #4c7281;
      --color-background-table-thead: #eaf6fb;
      --color-border-table-cell: #d8eaf1;
      --color-text-menu-link: #305360;
      --color-background-menu-link-hover: #eaf6fb;
      --color-text-menu-link-hover: #1a3742;
      --color-watch-table-error: #783d28;
      --color-watch-table-row-text: #1a3742;
      --color-table-line: #d8eaf1;
      --color-sidebar-text: #1a3742;
    }

    html[data-darkmode=true] {
      --color-background-page: #071a21;
      --color-background-gradient-first: #004049;
      --color-background-gradient-second: #3d3054;
      --color-background-gradient-third: #1d395b;
      --color-background: #093842;
      --color-text: #eaf6fb;
      --color-link: #86d4e2;
      --color-menu-accent: #86d4e2;
      --color-background-code: #1a3742;
      --color-error: #f7b39b;
      --color-error-input: #38190e;
      --color-error-list: #f7b39b;
      --color-table-background: #093842;
      --color-table-stripe: #1a3742;
      --watchlist-row-selected: #00282e;
      --watchlist-row-hover: #1a3742;

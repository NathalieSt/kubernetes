      --color-api-key: #30323c;
      --color-background-button-primary: #21222a;
      --color-background-button-green: #1d5d40;
      --color-background-button-red: #783d28;
      --color-background-button-success: #1d5d40;
      --color-background-button-error: #783d28;
      --color-background-button-warning: #624d0e;
      --color-background-button-secondary: #21222a;
      --color-background-button-cancel: #686b79;
      --color-background-button-tag: #686b79;
      --color-background-button-tag-active: #4a4c58;
      --color-background-snapshot-age: #e4e6ed;
      --color-error-background-snapshot-age: #783d28;
      --color-border-notification: #d1d4dd;
      --color-warning: #624d0e;
      --color-link-new-version: #30323c;
      --color-last-checked: #686b79;
      --color-text-footer: #4a4c58;
      --color-border-watch-table-cell: #d1d4dd;
      --color-text-watch-tag-list: #30323c66;
      --color-border-input: #686b79;
      --color-shadow-input: #d1d4dd;
      --color-background-input: #ffffff;
      --color-text-input-description: #4a4c58;
      --color-text-input-placeholder: #686b79;
      --color-background-table-thead: #f2f3f8;
      --color-border-table-cell: #d1d4dd;
      --color-text-menu-link: #4a4c58;
      --color-background-menu-link-hover: #f2f3f8;
      --color-text-menu-link-hover: #30323c;
      --color-watch-table-error: #783d28;
      --color-watch-table-row-text: #30323c;
      --color-table-line: #d1d4dd;
      --color-sidebar-text: #30323c;
    }

    html[data-darkmode=true] {
      --color-background-page: #15171d;
      --color-background-gradient-first: #36383f;
      --color-background-gradient-second: #36383f;
      --color-background-gradient-third: #36383f;
      --color-background: #21222a;
      --color-text: #f2f3f8;
      --color-link: #f2f3f8;
      --color-menu-accent: #f2f3f8;
      --color-background-code: #30323c;
      --color-error: #f7b39b;
      --color-error-input: #38190e;
      --color-error-list: #f7b39b;
      --color-table-background: #21222a;
      --color-table-stripe: #30323c;
      --watchlist-row-selected: #4a4c58;
      --watchlist-row-hover: #30323c;

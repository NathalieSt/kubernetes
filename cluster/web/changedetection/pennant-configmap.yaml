      --color-background-button-green: #2b5c37;
      --color-background-button-red: #7c3739;
      --color-background-button-success: #2b5c37;
      --color-background-button-error: #7c3739;
      --color-background-button-warning: #674a0f;
      --color-background-button-secondary: #005c60;
      --color-background-button-cancel: #676c74;
      --color-background-button-tag: #676c74;
      --color-background-button-tag-active: #484e54;
      --color-background-snapshot-age: #e3e6ea;
      --color-error-background-snapshot-age: #7c3739;
      --color-border-notification: #e3e6ea;
      --color-warning: #674a0f;
      --color-link-new-version: #2c517f;
      --color-last-checked: #676c74;
      --color-text-footer: #484e54;
      --color-border-watch-table-cell: #e3e6ea;
      --color-text-watch-tag-list: #2c517f66;
      --color-border-input: #676c74;
      --color-shadow-input: #e3e6ea;
      --color-background-input: #ffffff;
      --color-text-input-description: #484e54;
      --color-text-input-placeholder: #676c74;
      --color-background-table-thead: #f2f4f6;
      --color-border-table-cell: #e3e6ea;
      --color-text-menu-link: #484e54;
      --color-background-menu-link-hover: #f2f4f6;
      --color-text-menu-link-hover: #2f3339;
      --color-watch-table-error: #7c3739;
      --color-watch-table-row-text: #2f3339;
      --color-table-line: #e3e6ea;
      --color-sidebar-text: #2f3339;
    }

    html[data-darkmode=true] {
      --color-background-page: #15171b;
      --color-background-gradient-first: #004144;
      --color-background-gradient-second: #3d3054;
      --color-background-gradient-third: #1d395b;
      --color-background: #202327;
      --color-text: #f2f4f6;
      --color-link: #a0c9fd;
      --color-menu-accent: #a0c9fd;
      --color-background-code: #2f3339;
      --color-error: #fdadad;
      --color-error-input: #3a1617;
      --color-error-list: #fdadad;
      --color-table-background: #202327;

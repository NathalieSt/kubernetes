---
apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
    app.kubernetes.io/name: fourget
  name: fourget-config
data:
  Pennant.css: |
    /* Pennant for 4get, written by kubernetes-generator (src/generators/theme). */

    :root {
      color-scheme: light dark;
      --1d2021: #eaf6fb;
      --282828: #e8f8fb;
      --3c3836: #eaf6fb;
      --504945: #d8eaf1;
      --928374: #4c7281;
      --a89984: #305360;
      --bdae93: #1a3742;
      --8ec07c: #1d5d40;
      --ebdbb2: #1a3742;
      --comment: #4c7281;
      --default: #1a3742;
      --keyword: #005a66;
      --string: #1d5d40;
    }

    .web .text-result .title {
      color: #005a66;
    }

    .tabs .tab.selected {
      border-bottom-color: #005a66;
    }

    .searchbox:focus-within {
      border-color: #007785;
    }

    .quote {
      border-left-color: #d8eaf1;
    }

    #images .duration {
      border-color: #d8eaf1;

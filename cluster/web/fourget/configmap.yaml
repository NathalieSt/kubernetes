---
apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
    app.kubernetes.io/name: fourget
  name: fourget-config
data:
  Pennant.css: |
    /* Pennant for 4get, written by kubernetes-generator (src/generators/theme). */

    :root {
      color-scheme: light dark;
      --1d2021: #f9fafc;
      --282828: #ffffff;
      --3c3836: #f2f4f6;
      --504945: #e3e6ea;
      --928374: #676c74;
      --a89984: #484e54;
      --bdae93: #2f3339;
      --8ec07c: #2b5c37;
      --ebdbb2: #2f3339;
      --comment: #676c74;
      --default: #2f3339;
      --keyword: #2c517f;
      --string: #2b5c37;
    }

    .web .text-result .title {
      color: #2c517f;
    }

    .tabs .tab.selected {
      border-bottom-color: #2c517f;
    }

    .searchbox:focus-within {
      border-color: #3c6aa4;
    }

    .quote {
      border-left-color: #e3e6ea;
    }

    #images .duration {
      border-color: #e3e6ea;

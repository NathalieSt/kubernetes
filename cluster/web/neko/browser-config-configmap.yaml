---
apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
    app.kubernetes.io/name: neko
  name: neko-browser-config
data:
  initial_preferences: |
    {
      "helium": {
        "completed_onboarding": true,
        "services": {
          "enabled": true,
          "bangs": true,
          "ext_proxy": true,
          "spellcheck_files": true,
          "browser_updates": false,
          "origin_override": "https://helium.netbird.nathalie-stiefsohn.eu"
        }
      },

      "browser": {
        "custom_chrome_frame": false,
        "show_home_button": false,
        "theme": {
          "color_scheme2": 2
        },
        "window_placement": {
          "maximized": true
        }
      },

      "bookmark_bar": {
        "show_on_all_tabs": false
      },

      "distribution": {
        "do_not_create_desktop_shortcut": true,
        "do_not_create_quick_launch_shortcut": true,
        "do_not_create_taskbar_shortcut": true,
        "do_not_launch_chrome": true,
        "do_not_register_for_update_launch": true,
        "import_bookmarks": false,
        "import_history": false,
        "import_home_page": false,
        "import_search_engine": false,
        "make_chrome_default": false,
        "make_chrome_default_for_user": false,
        "suppress_first_run_bubble": true,
        "system_level": false,
        "verbose_logging": false
      }
    }
  policies.json: |
    {
      "ProxyMode": "fixed_servers",
      "ProxyServer": "gluetun-proxy.gluetun-proxy.svc.cluster.local:8888",
      "ProxyBypassList": "helium.netbird.nathalie-stiefsohn.eu",

      "DnsOverHttpsMode": "off",
      "WebRtcIPHandling": "disable_non_proxied_udp",

      "IncognitoModeAvailability": 1,
      "BrowserSignin": 0,
      "SyncDisabled": true,
      "BrowserAddPersonEnabled": false,
      "BrowserGuestModeEnabled": false,
      "PasswordManagerEnabled": false,
      "AutofillAddressEnabled": false,
      "AutofillCreditCardEnabled": false,

      "DefaultGeolocationSetting": 2,
      "DefaultNotificationsSetting": 2,
      "AudioCaptureAllowed": false,
      "VideoCaptureAllowed": false,

      "PromptForDownloadLocation": false,
      "BookmarkBarEnabled": false,
      "EditBookmarksEnabled": false,
      "HardwareAccelerationModeEnabled": false,
      "DeveloperToolsAvailability": 1,

      "URLBlocklist": ["file://*"],
      "URLAllowlist": ["file:///home/neko/Downloads"],

      "ClearBrowsingDataOnExitList": [
        "browsing_history",
        "download_history",
        "cookies_and_other_site_data",
        "cached_images_and_files",
        "password_signin",
        "autofill",
        "site_settings",
        "hosted_app_data"
      ],

      "ManagedBookmarks": [
        {"toplevel_name": "Pages"},
        {"name": "IPLeak", "url": "https://ipleak.net/"},
        {"name": "YouTube", "url": "https://www.youtube.com/"},
        {"name": "Google", "url": "https://www.google.com/"}
      ]
    }
  theme-manifest.json: |
    {
      "manifest_version": 3,
      "name": "Fjord",
      "version": "1.0",
      "description": "Fjord dark, from @my-homelab/styles. GENERATED FILE — edit tokens/tokens.json and run `yarn build`.",
      "theme": {

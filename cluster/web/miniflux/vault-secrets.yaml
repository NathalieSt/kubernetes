---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: miniflux-vault-serviceaccount
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: miniflux-vault-token-reviewer
rules:
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - authorization.k8s.io
  resources:
  - subjectaccessreviews
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: miniflux-vault-token-reviewer-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: miniflux-vault-token-reviewer
subjects:
- kind: ServiceAccount
  name: miniflux-vault-serviceaccount
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: miniflux-vault-auth
spec:
  kubernetes:
    role: miniflux
    serviceAccount: miniflux-vault-serviceaccount
  vaultAuthGlobalRef:
    allowDefault: true
    namespace: vault-secrets-operator
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: miniflux-miniflux-db-static-secret
spec:
  vaultAuthRef: miniflux-vault-auth
  mount: kvv2
  type: kv-v2
  path: miniflux/db
  refreshAfter: 10s
  destination:
    create: true
    name: miniflux-db-secret
  rolloutRestartTargets:
  - kind: Deployment
    name: miniflux
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: miniflux-miniflux-oidc-static-secret
spec:
  vaultAuthRef: miniflux-vault-auth
  mount: kvv2
  type: kv-v2
  path: miniflux/oidc
  refreshAfter: 10s
  destination:
    create: true
    name: miniflux-oidc-secret
  rolloutRestartTargets:
  - kind: Deployment
    name: miniflux

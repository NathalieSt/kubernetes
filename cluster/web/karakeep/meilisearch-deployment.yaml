---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: karakeep-meilisearch
    app.kubernetes.io/version: v1.41.0
  name: karakeep-meilisearch
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: karakeep-meilisearch
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: karakeep-meilisearch
        app.kubernetes.io/version: v1.41.0
    spec:
      initContainers:
      - command:
        - sh
        - -c
        - chown 1000:1000 /meili_data
        image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
        name: permission-fix
        volumeMounts:
        - mountPath: /meili_data
          name: data
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
      - image: getmeili/meilisearch:v1.41.0@sha256:860fa4baed04ae1c235de870edab0c8006227546dea1bbb6411fbfc5e27cf1db
        name: karakeep-meilisearch
        ports:
        - containerPort: 7700
          name: http
        volumeMounts:
        - mountPath: /meili_data
          name: data
        - mountPath: /tmp
          name: tmp
        env:
        - name: MEILI_ENV
          value: production
        - name: MEILI_NO_ANALYTICS
          value: "true"
        - name: MEILI_DB_PATH
          value: /meili_data/data.ms
        - name: MEILI_MASTER_KEY
          valueFrom:
            secretKeyRef:
              key: meili-master-key
              name: karakeep-secret
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            memory: 1Gi
        securityContext:
          capabilities:
            drop:
            - ALL
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        readinessProbe:
          httpGet:
            path: /health
            port: 7700
          periodSeconds: 30
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: karakeep-meilisearch-pvc
      - name: tmp
        emptyDir: {}
      securityContext:
        seccompProfile:
          type: RuntimeDefault

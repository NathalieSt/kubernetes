---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: karakeep-chrome
    app.kubernetes.io/version: 157.0.8103.38-r1
  name: karakeep-chrome
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: karakeep-chrome
  template:
    metadata:
      labels:
        app.kubernetes.io/name: karakeep-chrome
        app.kubernetes.io/version: 157.0.8103.38-r1
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - 10.43.0.54
        searches:
        - karakeep.svc.cluster.local
        - svc.cluster.local
        - cluster.local
      containers:
      - args:
        - --disable-gpu
        - --disable-dev-shm-usage
        - --hide-scrollbars
        - --disable-blink-features=AutomationControlled
        - --window-size=1440,900
        image: ghcr.io/karakeep-app/karakeep-chrome:157.0.8103.38-r1@sha256:6c80ed470871bb8c129dc58692ca1714cddbc1392faad3ebf59aecd2e6e58eac
        name: karakeep-chrome
        ports:
        - containerPort: 9222
          name: devtools
        volumeMounts:
        - mountPath: /tmp
          name: tmp
        env:
        - name: HOME
          value: /tmp
        - name: TZ
          value: Europe/Vienna
        resources:
          requests:
            cpu: 100m
            memory: 384Mi
          limits:
            memory: 1536Mi
        securityContext:
          capabilities:
            drop:
            - ALL
          runAsUser: 65534
          runAsGroup: 65534
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
      volumes:
      - name: tmp
        emptyDir: {}
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: karakeep
    app.kubernetes.io/version: 0.34.1
  name: karakeep
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: karakeep
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: karakeep
        app.kubernetes.io/version: 0.34.1
    spec:
      initContainers:
      - command:
        - sh
        - -c
        - chown 1000:1000 /data
        image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
        name: permission-fix
        volumeMounts:
        - mountPath: /data
          name: data
      automountServiceAccountToken: false
      enableServiceLinks: false
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - 10.43.0.54
        searches:
        - karakeep.svc.cluster.local
        - svc.cluster.local
        - cluster.local
      containers:
      - image: ghcr.io/karakeep-app/karakeep:0.34.1@sha256:69ae5315c618b7c14c1af3e34c6e211acdb231793af424ecd1cab0b70691d987
        name: karakeep
        ports:
        - containerPort: 3000
          name: http
        volumeMounts:
        - mountPath: /data
          name: data
        - mountPath: /run
          name: run
        - mountPath: /tmp
          name: tmp
        env:
        - name: DATA_DIR
          value: /data
        - name: MEILI_ADDR
          value: http://karakeep-meilisearch.karakeep.svc.cluster.local:7700
        - name: MEILI_MASTER_KEY
          valueFrom:
            secretKeyRef:
              key: meili-master-key
              name: karakeep-secret
        - name: OCR_LANGS
          value: eng,deu
        - name: TZ
          value: Europe/Vienna
        - name: NEXTAUTH_URL
          value: https://karakeep.netbird.nathalie-stiefsohn.eu
        - name: NEXTAUTH_SECRET
          valueFrom:
            secretKeyRef:
              key: nextauth-secret
              name: karakeep-secret
        - name: OAUTH_WELLKNOWN_URL
          value: https://auth.netbird.nathalie-stiefsohn.eu/.well-known/openid-configuration
        - name: OAUTH_CLIENT_ID
          value: karakeep
        - name: OAUTH_PROVIDER_NAME
          value: Authelia
        - name: DISABLE_PASSWORD_AUTH
          value: "true"
        - name: OAUTH_AUTO_REDIRECT
          value: "true"
        - name: BROWSER_WEB_URL
          value: http://karakeep-chrome.karakeep.svc.cluster.local:9222
        - name: CRAWLER_HTTP_PROXY
          value: http://gluetun-proxy.gluetun-proxy.svc.cluster.local:8888
        - name: CRAWLER_HTTPS_PROXY
          value: http://gluetun-proxy.gluetun-proxy.svc.cluster.local:8888
        - name: CRAWLER_NO_PROXY
          value: .svc.cluster.local
        - name: CRAWLER_BROWSER_TIMEZONE
          value: Europe/Vienna
        - name: CRAWLER_STORE_SCREENSHOT
          value: "true"
        - name: CRAWLER_FULL_PAGE_ARCHIVE
          value: "false"
        - name: CRAWLER_VIDEO_DOWNLOAD
          value: "false"
        - name: CRAWLER_NAVIGATE_TIMEOUT_SEC
          value: "60"
        - name: CRAWLER_JOB_TIMEOUT_SEC
          value: "120"
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 1536Mi
        securityContext:
          capabilities:
            drop:
            - ALL
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          periodSeconds: 30
        startupProbe:
          httpGet:
            path: /api/health
            port: 3000
          periodSeconds: 10
          failureThreshold: 30
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: karakeep-data-pvc
      - name: run
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
